# The EHR capability's create and read cases, as Arazzo 1.1.0 workflows over
# the released ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: EHR create and read
  version: 0.1.0
  description: >-
    Creating an EHR with a server-assigned or a client-supplied ehr_id,
    reading it back by id and by subject, and the refusals the released
    ITS-REST operations declare for those calls.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: create_ehr-server_assigned
    summary: An EHR is created with an identifier the server assigns
    description: >-
      Creates an EHR without naming an ehr_id, asking for the full resource
      back, then reads the EHR back by the identifier the server assigned.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_create.yaml
      section: description
      quote: "Create a new `EHR` with an auto-generated identifier."
    steps:
      - stepId: create
        description: Create an EHR and ask for the full resource in the response.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: read-back
        description: Read the created EHR back by the identifier the server assigned.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $steps.create.outputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$steps.create.outputs.ehr_id}$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/ehr_get_by_id.yaml
              section: description
              quote: "Retrieve the EHR with the specified `ehr_id`."

  - workflowId: create_ehr-with_id
    summary: An EHR is created under the ehr_id the client supplies
    description: >-
      Creates an EHR with a client-supplied ehr_id, asking for the full
      resource back, and checks the created EHR carries that ehr_id.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_create_with_id.yaml
      section: description
      quote: "Create a new EHR with the specified `ehr_id` identifier."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$inputs.ehr_id}$'

  - workflowId: create_ehr-same_ehr_twice-with_id
    summary: An ehr_id already in use is refused on create
    description: >-
      Creates an EHR with a client-supplied ehr_id, then creates one with the
      same ehr_id again. The second create is refused with 409 Conflict, and
      the first EHR is still retrievable.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_EHR_with_id.yaml
      section: description
      quote: "Can happen when the supplied `ehr_id` is already used by an existing EHR."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create-again
        description: Create an EHR with the same ehr_id again.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 409
      - stepId: read-back
        description: The first EHR is still retrievable by its ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$inputs.ehr_id}$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/parameters/path/ehr_id.yaml
              section: description
              quote: "EHR identifier taken from EHR.ehr_id.value."

  - workflowId: create_ehr-same_ehr_twice-server_assigned
    summary: The ehr_id a server assigned is refused when a client supplies it on create
    description: >-
      Creates an EHR with a server-assigned ehr_id, then creates one naming
      that ehr_id. The second create is refused with 409 Conflict, and the
      first EHR is still retrievable.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_EHR_with_id.yaml
      section: description
      quote: "Can happen when the supplied `ehr_id` is already used by an existing EHR."
    steps:
      - stepId: create
        description: Create an EHR and ask for the full resource in the response.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: create-again
        description: Create an EHR naming the ehr_id the server assigned.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $steps.create.outputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 409
      - stepId: read-back
        description: The first EHR is still retrievable by its ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $steps.create.outputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."

  - workflowId: create_ehr-invalid_ehr_id
    summary: An ehr_id that is not a HIER_OBJECT_ID is refused on create
    description: >-
      Creates an EHR naming an ehr_id that matches none of the UID string
      forms (UUID, ISO OID, Internet id), so it is not a HIER_OBJECT_ID. The
      create is refused with 400 Bad Request.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_create_with_id.yaml
      section: description
      quote: "The value of the `ehr_id` unique identifier MUST be valid [HIER_OBJECT_ID](https://specifications.openehr.org/releases/BASE/latest/base_types.html#_hier_object_id_class) value."
    steps:
      - stepId: create
        description: Create an EHR whose ehr_id path segment is not a HIER_OBJECT_ID.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: "not!a-hier-object-id" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400.yaml
              section: description
              quote: "`400 Bad Request` is returned when the request could not be parsed or is invalid (e.g. malformed request URL syntax, missing required header or parameter, or syntactically invalid header, parameter or content)."

  - workflowId: get_ehr-by_id
    summary: An existing EHR is retrieved by its ehr_id
    description: >-
      Creates an EHR with a client-supplied ehr_id, then retrieves it by that
      ehr_id and checks the retrieved EHR is the one asked for.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_get_by_id.yaml
      section: description
      quote: "Retrieve the EHR with the specified `ehr_id`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: setup
        description: Create the EHR the read addresses.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: get
        description: Retrieve the EHR by its ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$inputs.ehr_id}$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/parameters/path/ehr_id.yaml
              section: description
              quote: "EHR identifier taken from EHR.ehr_id.value."

  - workflowId: get_ehr-unknown_ehr_id
    summary: A read of an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves an EHR by a freshly generated ehr_id that no EHR carries. The
      read is answered with 404 Not Found.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: get
        description: Retrieve an EHR by an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_ehr-by_subject
    summary: An existing EHR is retrieved by its subject
    description: >-
      Creates an EHR whose EHR_STATUS names a subject, then retrieves the EHR
      by that subject's id and namespace and checks it is the one created.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_get_by_subject.yaml
      section: description
      quote: "These subject parameters will be matched against EHR's EHR_STATUS.subject.external_ref.id.value and EHR_STATUS.subject.external_ref.namespace values."
    inputs:
      type: object
      properties:
        subject_id: { type: string, format: uuid }
    steps:
      - stepId: create
        description: Create an EHR whose EHR_STATUS names the subject.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &subject_status
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            subject:
              _type: PARTY_SELF
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: replaced-by-subject_id }
                namespace: veredictum
                type: PERSON
            is_queryable: true
            is_modifiable: true
          replacements: &subject_replacements
            - target: /subject/external_ref/id/value
              value: $inputs.subject_id
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: get
        description: Retrieve the EHR by the subject's id and namespace.
        operationId: $sourceDescriptions.ehr.ehr_get_by_subject
        parameters:
          - { name: subject_id, in: query, value: $inputs.subject_id }
          - { name: subject_namespace, in: query, value: veredictum }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$steps.create.outputs.ehr_id}$'

  - workflowId: get_ehr-unknown_subject
    summary: A read by a subject no EHR names is answered 404
    description: >-
      Retrieves an EHR by a freshly generated subject id that no EHR_STATUS
      names. The read is answered with 404 Not Found.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_EHR_subject.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with supplied subject parameters does not exist."
    inputs:
      type: object
      properties:
        subject_id: { type: string, format: uuid }
    steps:
      - stepId: get
        description: Retrieve an EHR by a subject no EHR_STATUS names.
        operationId: $sourceDescriptions.ehr.ehr_get_by_subject
        parameters:
          - { name: subject_id, in: query, value: $inputs.subject_id }
          - { name: subject_namespace, in: query, value: veredictum }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: create_ehr-same_subject_twice
    summary: A second EHR for a subject that already has one is refused
    description: >-
      Creates an EHR whose EHR_STATUS names a subject, then creates another
      EHR whose EHR_STATUS names the same subject. The second create is
      refused with 409 Conflict.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_EHR.yaml
      section: description
      quote: "`409 Conflict` Unable to create a new EHR due to a conflict with an already existing EHR with the same subject id, namespace pair, whenever EHR_STATUS is supplied."
    inputs:
      type: object
      properties:
        subject_id: { type: string, format: uuid }
    steps:
      - stepId: create
        description: Create an EHR whose EHR_STATUS names the subject.
        operationId: $sourceDescriptions.ehr.ehr_create
        requestBody:
          contentType: application/json
          payload: *subject_status
          replacements: *subject_replacements
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create-again
        description: Create another EHR whose EHR_STATUS names the same subject.
        operationId: $sourceDescriptions.ehr.ehr_create
        requestBody:
          contentType: application/json
          payload: *subject_status
          replacements: *subject_replacements
        successCriteria:
          - condition: $statusCode == 409
