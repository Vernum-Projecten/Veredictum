# .github/workflows/ci.yml
#
# Two tiers, one required check.
#
# The GUARD tier reads prose, licensing metadata, commit messages and the
# workflows themselves. It is ungated: every one of those inputs exists on every
# pull request, so gating them on changed paths would only buy seconds and could
# let an edit through unchecked.
#
# The RUST tier builds, lints, tests and audits the instrument. It is gated on
# the `changes` job, because a pull request touching only prose has nothing for
# it to judge and a skipped job counts as satisfied at `conclusion`. Every gate
# runs `--locked`: CI must fail on new commits, never on registry drift
# (https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control).
#
# Branch protection points at `conclusion` alone, so a job absent from its
# `needs` list runs, goes red, and gates nothing —
# `scripts/checks/ci-conclusion-complete.sh` compares the two lists in both
# directions and is itself one of the jobs.
name: CI

on:
  # The types are spelled out rather than left to the default
  # `[opened, synchronize, reopened]`: a guard that reads an escape-hatch label
  # from `github.event.pull_request.labels` only sees the label if a run is
  # raised after it is applied. Adding `labeled`/`unlabeled` makes applying a
  # label produce a fresh event carrying the current label set
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
  # `no-changelog` is the label this is for, and the guard that reads it is the
  # changelog-entry step in the guards job below — so applying the label raises a
  # fresh run whose payload carries it. Re-running the failed job instead re-uses
  # the stale payload and fails again.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Declared before any merge queue exists, because a queue reports its required
  # checks on this event alone: "you need to update the workflows to include the
  # merge_group event as an additional trigger. Otherwise, status checks will not
  # be triggered when you add a pull request to a merge queue"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group).
  # Turning a queue on is then a repository-settings change, not a workflow one.
  merge_group:

concurrency:
  # Pull-request runs supersede within their own pull request; every other event
  # gets a group keyed by its own COMMIT.
  #
  # The per-commit key is not cosmetic. Pending cancellation is not governed by
  # `cancel-in-progress`: "By default, any existing pending job or workflow in
  # the same concurrency group will be canceled and the new queued job or
  # workflow will take its place"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
  # With one group per branch, a push that queued behind a running one is
  # cancelled by the next push and never reports at all — so a commit can land
  # with no guard having run. A per-SHA group makes that unrepresentable.
  #
  # `case(pred, value, default)` is the documented conditional-value function —
  # "Evaluates predicates in order and returns the value corresponding to the
  # first predicate that evaluates to true. If no predicate matches, it returns
  # the last argument as the default value"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions).
  group: ci-${{ case(github.event_name == 'pull_request', github.ref, github.sha) }}
  # Cancel a superseded pull-request run, never a run on `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job grants itself the minimum it needs
# (job-level permissions override workflow-level ones —
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions).
# A job added without a `permissions:` block therefore gets a token that can do
# nothing, and fails loudly at its checkout instead of running over-privileged.
permissions: {}

jobs:
  # ── Which tiers have anything to judge ──────────────────────────────────────
  # One output, `code`, covering everything the Rust tier compiles or reads: the
  # sources, the manifests and lockfile, the toolchain and lint configuration,
  # the catalogue artifacts, the published schemas, the party declarations, the
  # vendored spec oracle, and this file (whose `run:` lines ARE the recipe those
  # jobs execute, so editing them must re-run them).
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      image: ${{ steps.filter.outputs.image }}
      action: ${{ steps.filter.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        # Context reaches the shell through `env:`, never `${{ }}` inline —
        # zizmor's template-injection rule is the machine check for it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # `github.event.before` does not exist on this event; falling through
            # to the push branch would build the range `..<sha>`, which git reads
            # as nothing, and every filter would report `false` — turning "run
            # everything" into "run nothing" on exactly the event a merge queue
            # reports its required checks on.
            base="$QUEUE_BASE"; head="$PUSH_SHA"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push to a branch, or a base that no longer resolves: run
          # everything. The failure direction matters — an unset output reads as
          # `false` downstream and a skipped job counts as satisfied at
          # `conclusion`, so an unknown base must open the gates, never close
          # them.
          if ! git rev-parse "${base:-}" >/dev/null 2>&1; then
            echo "base unresolvable — running every gate"
            {
              echo "code=true"
              echo "docker=true"
              echo "image=true"
              echo "action=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "changed paths:"
          echo "$changed"
          # website/ is in the CODE tier deliberately (#35): the test job holds
          # the site's hand-typed catalogue counts to the catalogue, so a
          # website-only PR must run it too. fuzz/ is in it for the mirror
          # reason (#11): the fuzz-build job compiles the harnesses, and the
          # harnesses read the instrument crate, so either side changing must
          # compile the other. app/ carries both crates since the restructure
          # (#55); no code lives at the root any more. The legend generator is
          # named individually (#189) because the test job runs its --check and
          # the rest of scripts/render/ has nothing to do with that job.
          if echo "$changed" | grep -qE '^(app/|catalogue/|perf/|schemas/|fixtures/|specs/|verification-pack/|website/|fuzz/|scripts/vendor/|scripts/checks/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$|\.config/nextest\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The image tier: the one Dockerfile, the build-context ignore file
          # that decides what it can see, the hosted posture that runs it, the
          # lint configuration, the GitHub Action's test Dockerfile, and this
          # file.
          if echo "$changed" | grep -qE '^(deploy/docker/|deploy/hosted/|\.dockerignore$|scripts/action/test/engine\.Dockerfile$|\.github/workflows/ci\.yml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          # The image build tier (#776): every path the build context admits
          # and the image compiles or bakes, since its last step runs the
          # engine's `test` over the shipped catalogue. perf/, schemas/ and
          # app/veredictum/tests/ are left out because `.dockerignore` keeps
          # them out of the context, so no change there can alter the image.
          # `grep -v` exits 1 when nothing survives, which pipefail reads false.
          if echo "$changed" | grep -vE '^app/veredictum/tests/' \
            | grep -qE '^(app/|catalogue/|specs/|assets/brand/|deploy/docker/|deploy/hosted/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.dockerignore$|\.github/workflows/ci\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi
          # The GitHub Action tier (#770): the action, its script and its test
          # material, the fake server, the engine's command line the action
          # calls, and this file.
          if echo "$changed" | grep -qE '^(action\.yml$|scripts/action/|app/veredictum/examples/stub_sut\.rs$|app/veredictum/src/bin/veredictum\.rs$|\.github/workflows/ci\.yml$)'; then
            echo "action=true" >> "$GITHUB_OUTPUT"
          else
            echo "action=false" >> "$GITHUB_OUTPUT"
          fi

  # ── The guard tier: prose, licensing, commit messages, changelog structure ──
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: read is for the report-number guard, which asks the tracker
    # whether each citation's `report:` names an upstream-report issue.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The attribution scan below walks a commit range.
          fetch-depth: 0

      # `.claude/rules/comments.md` (RFC 505 / RFC 1574): line comments only,
      # `TODO(#NNNN):` form, the sanctioned marker vocabulary, the NOTE and
      # comment-run budgets, and no internal-document citation — neither a
      # `.claude/` path anywhere in the file nor an in-repo markdown document
      # in a comment (root CLAUDE.md rule 11, adjudicated in #125).
      - name: Comment style
        run: bash scripts/checks/comment-style.sh --all

      # The seeded-violation proof for that last check: three citations that
      # MUST be reported and three legitimate lines that must not. A guard
      # nobody has watched fire is a guard nobody knows the shape of.
      - name: Comment style — seeded-violation proof
        run: bash scripts/checks/comment-style.sh --self-test

      # The TODO(#NNNN) rule outside the Rust tree (#264): YAML, shell and
      # TOML comments carry the same form, over every hand-written file —
      # a bare `# TODO:` sat in an operation binding with nothing to catch it.
      - name: TODOs name their issue outside .rs too
        run: bash scripts/checks/todo-issue-refs.sh

      - name: TODOs name their issue — seeded-violation proof
        run: bash scripts/checks/todo-issue-refs.sh --self-test

      - name: Every citation's report number names an upstream report
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checks/report-refs.sh

      - name: Report numbers — stub-tracker proof
        run: bash scripts/checks/report-refs.sh --self-test

      - name: Every pending control names an open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checks/pending-refs.sh

      - name: Pending numbers — stub-tracker proof
        run: bash scripts/checks/pending-refs.sh --self-test

      # Every vendored tree is refreshed by a script under `scripts/vendor/`
      # and carries the upstream LICENSE that script fetches (#855).
      - name: Every vendored tree has its vendor script and its LICENSE
        run: bash scripts/checks/vendored-trees.sh

      - name: Vendored trees — seeded-violation proof
        run: bash scripts/checks/vendored-trees.sh --self-test

      # Cargo compiles only the modules an integration-test binary's main.rs
      # declares, so a topic file without its `mod` line never runs and every
      # gate stays green (#907).
      - name: Every integration-test file is a declared module
        run: bash scripts/checks/test-modules-declared.sh

      - name: Integration-test modules — seeded-violation proof
        run: bash scripts/checks/test-modules-declared.sh --self-test

      # The release tags an image, `:latest` among them, and deploys the hosted
      # console only after every image smoke passed (#896). `needs` is the only
      # ordering a workflow guarantees, so the edge itself is what is checked.
      # `yq` and `jq` ship on the GitHub Ubuntu runner images.
      - name: The release tags no image before its smoke passed
        run: bash scripts/checks/release-tags-after-smoke.sh

      - name: Release tags after the smoke — seeded-violation proof
        run: bash scripts/checks/release-tags-after-smoke.sh --self-test

      # Every proposed fix under `upstream/` is written against the pinned
      # `master` snapshot of its openEHR repository and must apply there (#906).
      - name: Every upstream patch applies to its master snapshot
        run: bash scripts/checks/upstream-patches-apply.sh

      - name: Upstream patches — seeded-case proof
        run: bash scripts/checks/upstream-patches-apply.sh --self-test

      # JUnit XML has no single owner, so the export is held to the schemas
      # the tools that read it publish: Jenkins xUnit junit-10 for the
      # document and Apache Maven Surefire for each testsuite. xmllint
      # validates them; libxml2-utils carries it.
      - name: Install xmllint
        run: sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: The pinned JUnit views hold to the published JUnit XML schemas
        run: bash scripts/checks/junit-schema.sh

      - name: JUnit schemas — seeded-violation proof
        run: bash scripts/checks/junit-schema.sh --self-test

      # Every canonical-XML body an accepting XML-write arm sends validates
      # against the vendored ITS-XML schemas (Resources.md, XML Format).
      # xmllint validates; yq ships on the GitHub Ubuntu runner images.
      - name: The XML bodies of the accepting XML-write arms hold to ITS-XML
        run: bash scripts/checks/xml-write-bodies.sh

      - name: XML write bodies — seeded-violation proof
        run: bash scripts/checks/xml-write-bodies.sh --self-test

      # console.veredictum.eu is the official conformance instrument (#388), so
      # no reader-facing surface may call it a demo or a sandbox. The words are
      # refused as whole words, which leaves `demonstration` and the CSP
      # directive name alone.
      - name: No surface calls the instrument a demo
        run: bash scripts/checks/hosted-instrument-language.sh

      - name: No surface calls the instrument a demo — seeded-violation proof
        run: bash scripts/checks/hosted-instrument-language.sh --self-test

      # The hosted box's deploy script lives inside `cloud-init.yaml`, where no
      # other gate reads it as shell — and it is the ONE command the deploy key
      # may run, so a defect in it is a box that stops taking deploys (#423).
      # Guard-tier by the same rule as the rest of this job: a text input that
      # exists on every pull request, and seconds to check. shellcheck ships on
      # the GitHub Ubuntu runner images.
      - name: The hosted deploy script is shellcheck-clean
        run: bash scripts/checks/hosted-deploy-script.sh

      - name: The hosted deploy script — seeded-violation proof
        run: bash scripts/checks/hosted-deploy-script.sh --self-test

      # `scripts/gh/fields.sh` is the one write path for an issue's type and its
      # Priority and Effort fields (#588). The self-test drives it against a stub
      # gh, so it needs no token: an organisation that answers, the empty answer
      # a workflow token gets, a refused create, and every usage error.
      - name: The issue-fields helper — stub-driven self-test
        run: bash scripts/gh/fields.sh --self-test

      # The GitHub Action's script decides what reaches the container (#770):
      # credentials by name and never by value, an empty one not at all, a
      # `_FILE` one mounted, and the run's exit status passed through. The
      # self-test drives it against a stub `docker`, so it needs no runtime.
      - name: The GitHub Action's script — stub-driven self-test
        run: bash scripts/action/run.sh --self-test

      # The console's engine pin is ONE value, the workspace engine version
      # (#179). The root manifest's `[patch.crates-io]` only redirects the
      # console's exact crates.io pin to `app/veredictum` while the two agree,
      # and cargo falls back to the registry copy SILENTLY when they do not —
      # so the console would link one engine while every gate spawns another.
      # Here rather than at tag time alone: a divergence is refused on the pull
      # request that introduces it, which is the only place it is cheap to fix.
      - name: The console's engine pin names this tree's engine
        run: bash scripts/release/check-console-pin.sh
      # The same check holds fuzz/Cargo.lock to the engine version (#611);
      # its seeded trees prove each disagreement is refused.
      - name: The console's engine pin — seeded self-test
        run: bash scripts/release/check-console-pin.sh --self-test

      # CITATION.cff and the generated .zenodo.json carry the workspace engine
      # version (#812). The release `plan` compares CITATION.cff with the tag,
      # but a tag is never re-pointed, so the pull request that moves the
      # version is where a drift is cheap to fix. jq ships on the GitHub
      # Ubuntu runner images.
      - name: CITATION.cff and .zenodo.json carry the engine version
        run: bash scripts/checks/citation-version.sh

      - name: CITATION.cff and .zenodo.json — seeded self-test
        run: bash scripts/checks/citation-version.sh --self-test

      - name: .zenodo.json is in sync with CITATION.cff
        run: bash scripts/render/zenodo-json.sh --check

      # Keep a Changelog 1.1.0 structure: no duplicated `### <Type>` inside one
      # release section, no subsection header outside the canonical type set.
      # A duplicated header ships the same release notes twice.
      #
      # UNCONDITIONAL, and it stays that way: the `no-changelog` label waives the
      # ENTRY requirement in the next step, never the file's validity. A
      # malformed changelog also fails the release pipeline's `plan`, so this is
      # the cheap place to catch it.
      - name: Changelog structure
        run: bash scripts/checks/changelog-structure.sh

      # Entries are fragments under `changelog.d/` (#766), folded into
      # CHANGELOG.md only at the release cut. Like the structure check these
      # are unconditional: the label waives the requirement to add a fragment,
      # never the fragments' form, and the preview is the next release section
      # as the cut will write it.
      - name: Every changelog fragment is well formed
        run: bash scripts/release/changelog.sh --check

      - name: The next release section, fragments folded in, keeps its structure
        run: bash scripts/release/changelog.sh --check-preview

      - name: Changelog fragments — seeded self-test
        run: bash scripts/release/changelog.sh --self-test

      - name: The changelog guard — seeded self-test
        run: bash scripts/checks/changelog-entry.sh --self-test

      # The fragment half: a change to a user-visible surface must add a
      # fragment under `changelog.d/`, and no change may add a line under the
      # Unreleased heading of CHANGELOG.md (#766). The path set that decides
      # "user-visible" is declared inside `scripts/checks/changelog-entry.sh`,
      # beside the reasoning for each path, rather than as a regular expression
      # in this file — the list is meant to be read against `CHANGELOG.md`'s own
      # definition of the term.
      #
      # PULL-REQUEST ONLY, deliberately: both halves of the decision — the
      # base..head diff and the label — are pull-request payload, and a
      # merge_group event carries neither. It has already gated the pull request
      # by the time a queue entry exists. The `labeled`/`unlabeled` triggers on
      # this workflow are what make applying the label raise a fresh run whose
      # payload carries it; re-running the failed job re-uses the stale payload
      # and would still fail.
      - name: Require a changelog fragment for user-visible changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          # The label waives the fragment requirement and nothing else, so the
          # script still runs: the Unreleased refusal holds either way. The
          # waiver is REPORTED by the script as a notice, never silent: a guard
          # that can be waived invisibly is a guard nobody can audit afterwards.
          args=("$BASE" "$HEAD")
          if [ "$HAS_LABEL" = "true" ]; then
            args+=(--no-changelog-label)
          fi
          bash scripts/checks/changelog-entry.sh "${args[@]}"

      # The no-attribution hard rule, enforced on what was actually committed.
      # The local `.githooks/commit-msg` hook strips attribution before a commit
      # is recorded, but a hook is opt-in per clone (`scripts/install-hooks.sh`),
      # so this is the check that cannot be skipped.
      - name: No AI or tool attribution in commit messages
        shell: bash
        # Context reaches the shell through `env:`, never `${{ }}` inline: an
        # inline expression is substituted into the script BEFORE bash parses
        # it, which makes a branch or title into executable text. zizmor's
        # template-injection rule is the machine check for this.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # `github.event.before` does not exist on this event. Falling
            # through to the push branch would build the range `..<sha>`, which
            # git reads as `HEAD..<sha>` — nothing — and the guard would pass
            # vacuously on every queued pull request.
            range="$QUEUE_BASE..$PUSH_SHA"
            base="$QUEUE_BASE"
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
            base="$PUSH_BEFORE"
          fi
          # First push to a branch, or a shallow clone: fall back to the tip.
          git rev-parse "${base:-HEAD~1}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          # GitHub writes `Co-authored-by: dependabot[bot]` into the squash of
          # a Dependabot pull request a maintainer has committed to. That line
          # names the dependency bot, not an AI author, so its exact form (the
          # bot's fixed noreply address) is dropped before the scan; every
          # other `[bot]` co-author is still refused.
          if git log --format='%B' "$range" 2>/dev/null \
             | grep -viE '^co-authored-by:[[:space:]]*dependabot\[bot\][[:space:]]+<49699333\+dependabot\[bot\]@users\.noreply\.github\.com>[[:space:]]*$' \
             | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|assisted-by:.*claude|🤖'; then
            echo "::error::A commit message carries AI or tool attribution. Remove it (CLAUDE.md hard rule 8)."
            exit 1
          fi
          echo "OK: no attribution found."

      # REUSE 3.3: every file in the tree has machine-readable licensing that
      # SURVIVES the file being copied out of it. That is the expected case for
      # an instrument built to be forked and re-run, and `REUSE.toml` is the
      # declaration that makes it true without touching a vendored file.
      - name: reuse lint
        # The OFFICIAL image, digest-pinned: `reuse` is distributed as a Python
        # package, this repository installs no Python toolchain
        # (.claude/rules/ forbids Python as a tooling language), and the
        # published container is the one distribution that needs neither that
        # nor an unpinned installer script.
        run: |
          docker run --rm \
            -v "$PWD:/data" --workdir /data \
            fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e \
            lint

  # ── The workflows audit themselves ──────────────────────────────────────────
  # Two tools, two questions. zizmor asks whether the workflow is SAFE: every
  # `uses:` pinned to a commit, no checkout persisting credentials, no context
  # value spliced into a shell. actionlint asks whether it is CORRECT at all:
  # expressions that cannot evaluate, `needs:` naming a job that does not exist,
  # unknown runner labels, and shellcheck over every embedded `run:` block.
  #
  # This tier is the one guard family that has full-weight material to judge in
  # this repository today, which is why the CI arrives with it rather than after
  # the code.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.31.0

      - name: zizmor
        # GH_TOKEN enables the ONLINE audits, which is the point of running this
        # beside SHA pinning: impostor-commit verifies that a pinned commit
        # really belongs to the repository named in front of it, and it cannot
        # do that offline. `--min-severity=low` gates every actionable tier
        # (artipacked is Low) and leaves the informational tier advisory.
        #
        # Both directories are passed. `.github/actions/` joined the invocation
        # with the first composite action (`release-kind`), because naming a path
        # that does not exist is an error rather than a no-op — so it could not
        # be listed before there was something in it, and an action added without
        # extending this line would be audited by nothing. The root `action.yml`
        # is the published GitHub Action (#770), named for the same reason.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low action.yml .github/workflows/ .github/actions/

      - name: actionlint
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary, so
        # `taiki-e/install-action` does not carry it, and the upstream
        # alternative is a `curl | bash` off `main` — the unpinned fetch the
        # pinning rule exists to forbid. The image is also the only
        # distribution that BUNDLES shellcheck, which half of actionlint's
        # value depends on: "The image contains actionlint executable and all
        # dependencies (shellcheck and pyflakes)"
        # (https://github.com/rhysd/actionlint/blob/main/docs/usage.md).
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence here is a `git log --format='%B'` or a `jq`
        # filter, where single quotes are the correct idiom precisely because
        # the shell must not expand the format directive.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # actionlint validates each job in isolation and cannot know that branch
      # protection here routes through a single `conclusion` check, which makes
      # a job missing from its `needs` list run without gating anything.
      - name: Every CI job gates the merge
        run: bash scripts/checks/ci-conclusion-complete.sh

      # The other direction of the same property: a command this workflow runs
      # that the local battery does not is a command whose first failure is a
      # red pull request. On 2026-08-31 that gap was 15 commands wide.
      - name: The local battery covers this workflow
        run: bash scripts/checks/gates-cover-ci.sh

      # Every gate that runs an external tool names it, so a machine without
      # the tool reads SKIPPED and never FAILED (#606).
      - name: The local battery declares every tool it runs — seeded self-test
        run: bash scripts/checks/gates.sh --self-test

      # The image's OCI metadata is declared in two places and must agree. It
      # lives in THIS job rather than the image tier because it reads
      # `release.yml` and `build-image.yml` as well as the Dockerfile — the
      # `docker` change filter does not cover those, so gating it there would
      # let a label edited in the workflow alone through unchecked. Guard-tier
      # material by the same rule as the rest of this job: its inputs exist on
      # every pull request, and it is a text check that costs seconds.
      - name: The image's OCI metadata agrees with itself
        run: bash scripts/checks/image-labels.sh

      # The published VEX record cannot drift from the advisory gate: the
      # generator's two-way agreement between deny.toml's ignore set and the
      # published justifications, plus well-formedness of every hand-authored
      # OpenVEX document (security/vex/README.md). Guard-tier by the same
      # rule: text inputs that exist on every pull request, seconds to check.
      # `yq` and `jq` ship on the GitHub Ubuntu runner images.
      - name: Every accepted advisory has a published VEX justification
        run: bash scripts/checks/vex-advisories.sh

      # The root action.yml meets the Marketplace's listing requirements, read
      # from the tagged commit at publication, so a defect costs a release.
      # `yq` ships on the GitHub Ubuntu runner images.
      - name: The action's metadata can be listed on the Marketplace
        run: bash scripts/checks/action-metadata.sh
      - name: The action metadata check refuses seeded defects
        run: bash scripts/checks/action-metadata.sh --self-test

  # ── The image tier ──────────────────────────────────────────────────────────
  # hadolint over the Dockerfile — the ONE image, the web console (#6) — and
  # over the GitHub Action's test Dockerfile (#770), whose images the action's
  # CI job runs.
  # Configuration lives in `deploy/docker/hadolint.yaml`, where a rule this repository
  # deliberately violates is named with its reason — never a blanket disable
  # (OWASP Docker Security Cheat Sheet rule 9).
  #
  # Gated on the `docker` filter rather than ungated, because there is exactly
  # one Dockerfile and a prose-only change has nothing here to judge. The
  # threshold is passed explicitly as well as set in the config file: the action
  # has its own default, and a lane whose severity floor came from whichever of
  # the two happened to win is a gate with no stated meaning.
  dockerfile-lint:
    name: Dockerfile lint
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/docker/Dockerfile
          config: deploy/docker/hadolint.yaml
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: scripts/action/test/engine.Dockerfile
          config: deploy/docker/hadolint.yaml
          failure-threshold: warning

  # The image is BUILT, not merely linted. Until now nothing below the release
  # lane built it, and the measured consequence is on record: `.dockerignore`
  # excluded `assets/` while `export.rs` `include_str!`s the seal card, so the
  # from-source target could not compile at all on main and nobody knew for four
  # months (#379, found in #378 only because a criterion happened to depend on
  # it). Since #420 the stakes are higher — the image now CARRIES the catalogue,
  # the vendored oracle and the party declarations, and the hosted instrument
  # mounts nothing — so "it builds" and "it contains what it must" are the same
  # gate.
  #
  # It runs the engine inside the freshly built image, over the data that image
  # baked. That is a stronger claim than poking at paths: validate reads the
  # catalogue and the oracle and reports zero findings, which no missing or
  # truncated tree can survive.
  #
  # NO build cache, deliberately. `load` needs a single platform, because
  # "loading the build result for multi-platform images is not supported"
  # (https://docs.docker.com/build/builders/drivers/) — and a GitHub Actions
  # cache is writable by any pull request run, including a fork's. This lane
  # publishes nothing, so a poisoned cache could not ship a bad image; what it
  # could do is hand this guard a false green, and no other lane builds this
  # target from cold to catch that. A guard that can be talked into passing is
  # the failure class the lane exists to remove, so it pays the full build.
  #
  # The `image` path filter is every path the build context admits (#776): an
  # engine, console or catalogue change can break `docker run <image> test`
  # while the Dockerfile is untouched. Measured on the #775 runs, this job takes
  # 14m43s to 15m37s cold against 7m20s to 15m38s for `build & test` beside it,
  # so the cost is at most about eight minutes on `conclusion`; skipping it let
  # a break first surface in the release smoke, after the tag.
  image-build:
    name: the image builds and carries its data
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the from-source target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime-from-source
          push: false
          # `load` exports type=docker, which is what makes the image reachable
          # by the assertions below (docker/build-push-action inputs reference).
          load: true
          tags: veredictum-ci-image-build:${{ github.sha }}
      - name: The engine in the image validates the catalogue in the image
        env:
          IMAGE: veredictum-ci-image-build:${{ github.sha }}
        run: |
          set -euo pipefail
          # The paths are the image's own VEREDICTUM_ROOT and VEREDICTUM_SPECS.
          # Named explicitly because validate takes them as flags, so a lane
          # that relied on the environment would pass while proving less.
          docker run --rm --entrypoint /usr/local/bin/veredictum "$IMAGE" \
            validate --root /work/catalogue --specs /work/specs/openehr --profile released
      - name: The image declares that it carries the catalogue
        env:
          IMAGE: veredictum-ci-image-build:${{ github.sha }}
        run: |
          set -euo pipefail
          carries=$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "eu.veredictum.image.carries-catalogue"}}')
          if [ "$carries" != "true" ]; then
            echo "::error::the image does not declare eu.veredictum.image.carries-catalogue=true, which the hosted deploy requires before it will deploy anything (#420)." >&2
            exit 1
          fi
          # `validate` takes --root and --specs, so the run above proves
          # nothing about the second citation root: a citation that resolves
          # against an XSD, a JSON Schema or an OAS document reads a tree the
          # run never touches. The image is exported and read instead, because
          # distroless carries no shell and there is nothing to exec that could
          # list a directory from inside.
          cid=$(docker create "$IMAGE")
          present=$(docker export "$cid" | tar -tf - \
            | grep -cE '^work/(catalogue|specs/(openehr|openehr-development|its-xml-schemas|its-json-schemas|rest-oas))/$' || true)
          docker rm -f "$cid" >/dev/null
          if [ "$present" -ne 6 ]; then
            echo "::error::the image does not carry all six of /work/catalogue, /work/specs/openehr, /work/specs/openehr-development, /work/specs/its-xml-schemas, /work/specs/its-json-schemas and /work/specs/rest-oas (found ${present} of 6). The hosted instrument mounts nothing, so a missing tree there is an instrument with no catalogue or no oracle to cite against (#420), and a run under the default development profile needs the snapshot (#875)." >&2
            exit 1
          fi
          echo "the image declares it carries the catalogue, and all six trees are present"
      - name: The image carries the hosted posture, and it comes out by docker cp
        env:
          IMAGE: veredictum-ci-image-build:${{ github.sha }}
        run: |
          set -euo pipefail
          # The hosted box receives its compose file and its Caddyfile by
          # extracting them from the image it pulled (#423), so the claim that
          # matters is that a built image carries them and that the extraction
          # mechanism returns the committed bytes. This runs the SAME mechanism
          # deploy.sh runs: create a container, never start it, copy out.
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/app/posture/docker-compose.yml" ./image-compose.yml
          docker cp "$cid:/app/posture/Caddyfile" ./image-Caddyfile
          docker rm -f "$cid" >/dev/null
          diff -u deploy/hosted/docker-compose.yml ./image-compose.yml
          diff -u deploy/hosted/Caddyfile ./image-Caddyfile
          # And the extracted compose file must parse, because deploy.sh refuses
          # to install one that does not: the box would otherwise be left unable
          # to run its next deploy at all. `.env` and the secret file are the
          # operator's, so they are staged here to make the validation the same
          # one the box performs.
          mkdir -p ./posture-check
          mv ./image-compose.yml ./posture-check/docker-compose.yml
          mv ./image-Caddyfile ./posture-check/Caddyfile
          cp deploy/hosted/env.example ./posture-check/.env
          : > ./posture-check/github-app.pem
          docker compose -f ./posture-check/docker-compose.yml config --quiet
          rm -rf ./posture-check
          echo "the image carries the committed hosted posture at /app/posture, and it parses"
      # The same check the release smoke runs on the pushed digest (#768): the
      # image's own entry point drives the shipped Arazzo catalogue at a port
      # nothing listens on, inside no network, so every driven row is errored
      # and inconclusive, none is failed, the exit status is 3, and the
      # offline re-judgement of the recording writes the same bytes.
      - name: The image runs the Arazzo catalogue it ships
        env:
          IMAGE: veredictum-ci-image-build:${{ github.sha }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          chmod 0777 "$out"
          code=0
          docker run --rm --network none -v "${out}:/work/out" "$IMAGE" \
            test --base-url http://127.0.0.1:9/ --out /work/out > "${out}/run.log" || code=$?
          tail -n 4 "${out}/run.log"
          if [[ "$code" != "3" ]]; then
            echo "::error::a run against no server exited ${code}, not 3 (every red row inconclusive)" >&2; exit 1
          fi
          jq -e '[.rows[] | select(.explanation != null and .explanation.whose != "instrument")] | length == 0' "${out}/results.json" >/dev/null \
            || { echo "::error::a refused connection was attributed to the server; it is inconclusive" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "errored")] | length > 0' "${out}/results.json" >/dev/null \
            || { echo "::error::the run recorded no errored row" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "failed")] | length == 0' "${out}/results.json" >/dev/null \
            || { echo "::error::a refused connection was judged failed; it is errored, never failed" >&2; exit 1; }
          test -s "${out}/recording.har" || { echo "::error::the run wrote no recording" >&2; exit 1; }
          code=0
          docker run --rm --network none -v "${out}:/work/out" "$IMAGE" \
            test --rejudge /work/out/recording.har --out /work/out/rejudged > /dev/null || code=$?
          if [[ "$code" != "3" ]]; then
            echo "::error::the re-judgement exited ${code}, not the recorded run's 3" >&2; exit 1
          fi
          cmp "${out}/results.json" "${out}/rejudged/results.json" \
            || { echo "::error::the re-judgement did not write the recorded run's bytes" >&2; exit 1; }

  # ── The Rust tier ───────────────────────────────────────────────────────────
  # rustfmt compiles nothing, so a restored target or registry cache here is
  # pure download time — `cache: false` is deliberate, not an oversight.
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  # Every deny-tier lint in `Cargo.toml`'s `[lints]` tables, plus the warn tier,
  # which `-D warnings` promotes. `--all-targets` reaches the tests: the
  # `clippy.toml` in-tests scoping relaxes the panic family inside `#[test]`
  # functions and nothing else, so test-support helpers are linted like any code.
  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The restored target directory is the only compile cache clippy gets:
      # sccache cannot cache clippy-driver invocations (mozilla/sccache#539).
      # Saved only from `main`, so a pull request never writes a cache key a
      # later run would restore.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The console's two SHIPPING shapes (.claude/rules/leptos-ui.md §10):
      # the featureless pass above compiles neither, so without these a
      # server-only dependency leaking past the `ssr` feature gate, or an
      # ssr-shape lint finding, reaches main unseen.
      - run: cargo clippy --locked -p veredictum-console --all-targets --features ssr -- -D warnings
      - run: cargo clippy --locked -p veredictum-console --lib --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings

  # Build, test, and then the instrument's own self-check. `validate` is the gate
  # the catalogue lives or dies by: it is every machine check over the artifact
  # tree — id uniqueness, citation resolution against the vendored specs,
  # binding completeness, coverage of the enumerated wire surface, claim
  # completeness against the committed party statements — and zero findings is
  # the only passing result. It runs LAST because a failure here is a catalogue
  # defect, which reads differently from a compile or test failure.
  #
  # No service container: the instrument drives a SUT over HTTP and owns no
  # database, so its suite needs none.
  test:
    name: build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      # A gate that skips when another program is absent is refused a runner
      # without that program, because a skip must never be the outcome that
      # gates a merge. The container-runtime-coupled paths (#192): the
      # resource sampler's Engine API reads, the disk anchor and the
      # maintenance settling, and the server-side readings' sizes, settings
      # and `pg_stat_statements` table are all another program's reply, so
      # `env_coupled.rs`
      # drives a real engine and skips with a printed reason when none
      # answers. This step refuses a runner without one, and pre-pulls the
      # image so three parallel tests do not race the same pull. The pin is
      # read from the test's own constant, so there is no second copy to
      # drift. It rides THIS job rather than a lane of its own, because a
      # separate job would rebuild the whole workspace to run three tests.
      - name: A container runtime and the pinned image are present, so the environment-coupled gates cannot skip
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          image="$(grep -E '^const DB_IMAGE' app/veredictum/tests/it/env_coupled.rs | cut -d'"' -f2)"
          echo "pinned database image: ${image}"
          docker pull "$image"
          docker image inspect "$image" >/dev/null
      - run: cargo build --locked --workspace --all-targets
      # The `ci` profile: never stop at the first failure, so one run reports the
      # whole failure surface.
      - run: cargo nextest run --locked --workspace --profile ci
      # The console's ssr shape: the featureless pass above compiles out
      # every ssr-gated test, the engine byte-identity gate (#54) among
      # them. The engine binary the gate spawns is target/debug/veredictum,
      # built by the workspace build step above.
      - run: cargo nextest run --locked -p veredictum-console --features ssr --profile ci
      - name: The Arazzo catalogue passes every machine gate
        run: cargo run --locked -- validate --root catalogue --specs specs/openehr --profile released
      # The development snapshot (#875): its absences are information that
      # never fails the step; a citation it refuses for another reason does.
      - name: The development snapshot's absences are reported
        run: cargo run --locked -- validate --root catalogue --specs specs/openehr --profile development
      # The website's hand-typed catalogue counts cannot drift from the
      # catalogue (#35): the guard reruns validate for its summary line and
      # holds every count-bearing phrase on both site surfaces to it.
      - name: The site's counts match the catalogue
        run: bash scripts/checks/site-counts.sh
      # The CLI surface has one truth (clap's `--help`), and the book's command
      # reference is now rendered from it rather than written beside it (#466).
      # This step re-renders the page and byte-compares the committed copy. It
      # needs the built binary, which is why it rides this job rather than the
      # cargo-free guards tier.
      - name: The documented CLI surface matches the binary
        run: bash scripts/checks/cli-surface.sh
      # The committed example results document is generated too (#466), and
      # carried a version two releases old before this step existed. A cargo
      # example is a binary no integration test can import, so the drift gate
      # the schema set has as a Rust test is a script here.
      - name: The example results document matches its generator
        run: bash scripts/checks/example-results-drift.sh

  # The `[lints.rustdoc]` table is inert without a doc run — this is the run.
  # `-D warnings` promotes the warn-tier entries (unescaped backticks, a missing
  # crate-level `//!`) to failures, and doctests compile here too.
  doc:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items
      # The console's default feature set is EMPTY, so the workspace pass above
      # documents only its featureless slice — every #[cfg(feature = "ssr")]
      # item (the server APIs, the engine seam) was ungated until this second
      # invocation. A [lints.rustdoc] table only bites where cargo doc runs.
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p veredictum-console --no-deps --document-private-items --features ssr

  # The declared MSRV is a possibly-breaking semver datum
  # (https://doc.rust-lang.org/cargo/reference/semver.html#env-new-rust), and
  # `cargo hack check --rust-version` is the tool the Cargo book names for
  # verifying it. Without this job `rust-version = "1.98"` is a claim nothing
  # tests, because the pinned toolchain is 1.98.1 and compiles it either way.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack
      # --workspace: without it cargo-hack checks the root package alone, and
      # the console's declared MSRV would be a claim nothing tests (#53).
      - run: cargo hack check --locked --rust-version --all-targets --workspace

  # RustSec advisories, yanked crates, the license allowlist, the bans list and
  # the registry allowlist, in one pass. This is the ONLY advisory gate: it reads
  # the same database `cargo audit` does, so no second job and no second ignore
  # list exists.
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Do the libFuzzer harnesses still COMPILE? That is the whole question on a
  # pull request, and it is the one the weekly campaign in `fuzz.yml` cannot
  # answer in time to be useful: a scheduled-only lane stops running silently
  # the moment a renamed function breaks a harness, and nobody learns until the
  # next campaign. This job is the guard, and it lives HERE rather than beside
  # the campaign because branch protection requires only `conclusion` — a job in
  # another workflow would go red without gating the merge.
  #
  # `fuzz/` is its own Cargo workspace (cargo-fuzz needs nightly; this
  # repository is pinned to stable), so nothing above compiles it.
  fuzz-build:
    name: fuzz harnesses build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          cache-workspaces: fuzz
          cache-key: fuzz-build
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@0.13.2
      # The seeder is part of the lane and breaks the same way a harness does:
      # a renamed catalogue directory or a harvest that stops matching makes it
      # exit non-zero, which is the whole point of its loud failures.
      - run: bash fuzz/seeds.sh
      # `--target` is mandatory. cargo-fuzz otherwise builds for the triple IT
      # was built for rather than the runner's, and install-action resolves it
      # through a binstall fallback to the musl asset — whose static libc cannot
      # carry a sanitizer.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  # A dependency nothing imports is attack surface and audit weight carried for
  # free. cargo-machete reads the sources rather than the manifest, so it catches
  # the entry that stopped being used without being removed.
  unused-deps:
    name: unused dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete
      - run: cargo machete

  # The console's browser journeys (#69): the one gate that proves the shipped
  # UI actually renders, hydrates and navigates, and the only one that reads the
  # browser console — where a hydration mismatch and a client panic surface and
  # nowhere else. `scripts/ui-e2e.sh` owns the whole composition (build, serve
  # over the repository's own mounts, start the pinned browser container, run
  # the journeys, tear down), so this job installs tools and calls it.
  #
  # The capture pass is deliberately NOT run here: committed screenshots are
  # reviewed as a diff on the pull request, and a CI job regenerating them would
  # produce bytes nobody looked at. `ui-screenshot-guard` below is what makes an
  # author refresh them.
  ui-e2e:
    name: console journeys
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest

      # The SAME pinned, checksum-verified prebuilt binaries the image's
      # from-source stage and release.yml's `console site bundle` job fetch,
      # with the versions single-sourced from the Dockerfile's ARGs so the
      # three lanes cannot drift. Never `cargo install cargo-leptos`: it
      # compiles a vendored OpenSSL tree.
      - name: Fetch cargo-leptos and Tailwind (pinned, checksum-verified)
        env:
          DOCKERFILE: deploy/docker/Dockerfile
        run: |
          set -euo pipefail
          clv="$(grep -E '^ARG CARGO_LEPTOS_VERSION=' "$DOCKERFILE" | head -1 | cut -d= -f2)"
          twv="$(grep -E '^ARG TAILWIND_VERSION=' "$DOCKERFILE" | head -1 | cut -d= -f2)"
          echo "cargo-leptos ${clv}, tailwindcss ${twv}"
          triple=x86_64-unknown-linux-gnu
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/leptos-rs/cargo-leptos/releases/download/${clv}/cargo-leptos-${triple}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/leptos-rs/cargo-leptos/releases/download/${clv}/cargo-leptos-${triple}.tar.gz.sha256"
          sha256sum -c "cargo-leptos-${triple}.tar.gz.sha256"
          tar -xzf "cargo-leptos-${triple}.tar.gz"
          sudo install -m 0755 "$(find . -type f -name cargo-leptos | head -1)" /usr/local/bin/cargo-leptos
          curl --proto '=https' --tlsv1.2 -fsSLo tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${twv}/tailwindcss-linux-x64"
          sudo install -m 0755 tailwindcss /usr/local/bin/tailwindcss
          rm -rf cargo-leptos* tailwindcss

      - run: bash scripts/ui-e2e.sh

      # A journey failure is a screenshot plus a browser-console dump, and the
      # screenshot is the half the log cannot carry.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-evidence
          path: target/ui-e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # The visual feedback loop's other half: a pull request that changes how the
  # console LOOKS must refresh the committed captures, so every UI change lands
  # as a reviewable image diff instead of a description of one. The escape is the
  # `no-ui-visual-change` label, which exists in the repository — a guard reading
  # a label that does not exist can never fire, and would fail silently.
  #
  # PULL-REQUEST ONLY, deliberately: it compares the pull request's base and head
  # trees and reads a pull-request label, neither of which a `merge_group` event
  # carries. It has already gated this pull request by then. Applying the label
  # raises a fresh run because the `pull_request` trigger above lists `labeled`.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require refreshed captures for console UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-ui-visual-change') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^app/veredictum-console/(src|style)/'; then
            echo "No console UI paths touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qE '^website/book/src/console/img/'; then
            echo "Captures refreshed — OK."; exit 0
          fi
          echo "::error::This pull request changes the console UI but does not refresh website/book/src/console/img/ (run UI_E2E_DOCS_SHOTS=1 scripts/ui-e2e.sh and commit the captures), and does not carry the 'no-ui-visual-change' label." >&2
          exit 1

  # ── The GitHub Action drives a server ───────────────────────────────────────
  # The action at the repository root (#770) runs against a fake server five
  # times, and each outcome is asserted: a run whose rows all pass exits 0, a
  # run with failed rows fails the step with exit status 1, a run whose
  # credential is an empty secret cannot start and fails it with 2, and a run
  # against no server, whose rows are all inconclusive, exits 3: it fails the
  # step by default and passes it with `fail-on-inconclusive: false`. The image
  # is a stand-in built from this tree, because a pull request has no release
  # image: the engine, the catalogue and the specification trees at the release
  # image's paths (scripts/action/test/engine.Dockerfile, which also builds the
  # fake server). The release smoke run covers the release image's own entry
  # point.
  action:
    name: the GitHub Action drives a server
    needs: changes
    if: needs.changes.outputs.action == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the stand-in for the release image and the fake server
        run: bash scripts/action/stand-in-image.sh

      # The fake server is the crate's `stub_sut` example: OPTIONS is answered
      # 200 and every other request 404. Its container outlives this step and
      # is removed with the job.
      - name: Start the fake server under test
        run: |
          set -euo pipefail
          docker run -d --rm --name stub-sut --network host veredictum-action-stub-sut:local 18089
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null -X OPTIONS http://127.0.0.1:18089/openehr/v1; then exit 0; fi
            sleep 0.2
          done
          docker logs stub-sut
          echo "::error::the fake server did not start" >&2
          exit 1

      - name: Write the statements
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/statements"
          printf '{"claims":{"capabilities":["system"]}}\n' > "$RUNNER_TEMP/statements/system.json"
          printf '{"claims":{"capabilities":["ehr"]}}\n' > "$RUNNER_TEMP/statements/ehr.json"

      - id: passing
        name: The System API workflows pass
        uses: ./
        with:
          base-url: http://127.0.0.1:18089/openehr/v1
          statement: ${{ runner.temp }}/statements/system.json
          out-dir: ${{ runner.temp }}/passing
          image: veredictum-action-stand-in:local
          pull: "false"

      - name: The passing run exited 0 and wrote every view
        env:
          EXIT_CODE: ${{ steps.passing.outputs.exit-code }}
          RESULTS: ${{ steps.passing.outputs.results }}
          JUNIT: ${{ steps.passing.outputs.junit }}
          CTRF: ${{ steps.passing.outputs.ctrf }}
          SUMMARY: ${{ steps.passing.outputs.summary }}
        run: |
          set -euo pipefail
          [[ "$EXIT_CODE" == "0" ]] || { echo "::error::exit-code is '${EXIT_CODE}', not 0" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "passed")] | length > 0' "$RESULTS" >/dev/null \
            || { echo "::error::no row passed" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "failed" or .status == "errored")] | length == 0' "$RESULTS" >/dev/null \
            || { echo "::error::a row failed or errored" >&2; exit 1; }
          grep -q '<testsuites' "$JUNIT" || { echo "::error::no JUnit document" >&2; exit 1; }
          jq -e '.results.summary' "$CTRF" >/dev/null || { echo "::error::no CTRF document" >&2; exit 1; }
          grep -q '^# Veredictum results' "$SUMMARY" || { echo "::error::no Markdown summary" >&2; exit 1; }

      - id: failing
        name: The EHR workflows fail against a server that has no EHR
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:18089/openehr/v1
          statement: ${{ runner.temp }}/statements/ehr.json
          out-dir: ${{ runner.temp }}/failing
          image: veredictum-action-stand-in:local
          pull: "false"

      - name: The failing run failed the step with exit status 1
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          RESULTS: ${{ steps.failing.outputs.results }}
          JUNIT: ${{ steps.failing.outputs.junit }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == "failure" ]] || { echo "::error::the step's outcome is '${OUTCOME}', not failure" >&2; exit 1; }
          [[ "$EXIT_CODE" == "1" ]] || { echo "::error::exit-code is '${EXIT_CODE}', not 1" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "failed")] | length > 0' "$RESULTS" >/dev/null \
            || { echo "::error::no row failed" >&2; exit 1; }
          grep -q '<failure' "$JUNIT" || { echo "::error::the JUnit view carries no failure" >&2; exit 1; }

      # An unset repository secret expands to an empty string. The action treats
      # it as missing, so the engine stops on the missing credential.
      - id: unstartable
        name: A run whose token is an empty secret cannot start
        continue-on-error: true
        uses: ./
        env:
          VEREDICTUM_CDR_TOKEN: ""
        with:
          base-url: http://127.0.0.1:18089/openehr/v1
          statement: ${{ runner.temp }}/statements/system.json
          auth: bearer
          out-dir: ${{ runner.temp }}/unstartable
          image: veredictum-action-stand-in:local
          pull: "false"

      - name: The run that could not start failed the step with exit status 2
        env:
          OUTCOME: ${{ steps.unstartable.outcome }}
          EXIT_CODE: ${{ steps.unstartable.outputs.exit-code }}
          OUT_DIR: ${{ runner.temp }}/unstartable
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == "failure" ]] || { echo "::error::the step's outcome is '${OUTCOME}', not failure" >&2; exit 1; }
          [[ "$EXIT_CODE" == "2" ]] || { echo "::error::exit-code is '${EXIT_CODE}', not 2" >&2; exit 1; }
          [[ ! -e "${OUT_DIR}/results.json" ]] || { echo "::error::a run that could not start wrote results" >&2; exit 1; }

      # Nothing listens on port 9, so every row the System API workflows drive
      # is errored with the instrument named: inconclusive, exit status 3.
      - id: inconclusive
        name: A run whose only red rows are inconclusive fails the step by default
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:9/openehr/v1
          statement: ${{ runner.temp }}/statements/system.json
          out-dir: ${{ runner.temp }}/inconclusive
          image: veredictum-action-stand-in:local
          pull: "false"

      - name: The inconclusive run failed the step with exit status 3
        env:
          OUTCOME: ${{ steps.inconclusive.outcome }}
          EXIT_CODE: ${{ steps.inconclusive.outputs.exit-code }}
          RESULTS: ${{ steps.inconclusive.outputs.results }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == "failure" ]] || { echo "::error::the step's outcome is '${OUTCOME}', not failure" >&2; exit 1; }
          [[ "$EXIT_CODE" == "3" ]] || { echo "::error::exit-code is '${EXIT_CODE}', not 3" >&2; exit 1; }
          jq -e '[.rows[] | select(.status == "errored" and .explanation.whose == "instrument")] | length > 0' "$RESULTS" >/dev/null \
            || { echo "::error::no inconclusive row" >&2; exit 1; }

      - id: tolerated
        name: With fail-on-inconclusive false the same run passes the step
        uses: ./
        with:
          base-url: http://127.0.0.1:9/openehr/v1
          statement: ${{ runner.temp }}/statements/system.json
          out-dir: ${{ runner.temp }}/tolerated
          image: veredictum-action-stand-in:local
          pull: "false"
          fail-on-inconclusive: "false"

      - name: The tolerated run passed the step and still reports exit status 3
        env:
          OUTCOME: ${{ steps.tolerated.outcome }}
          EXIT_CODE: ${{ steps.tolerated.outputs.exit-code }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == "success" ]] || { echo "::error::the step's outcome is '${OUTCOME}', not success" >&2; exit 1; }
          [[ "$EXIT_CODE" == "3" ]] || { echo "::error::exit-code is '${EXIT_CODE}', not 3" >&2; exit 1; }

  # ── The single required check ───────────────────────────────────────────────
  # Branch protection points at `conclusion` alone, which is what lets jobs be
  # added, renamed or path-gated without editing repository settings. The cost
  # of that design is that a job absent from `needs` still runs, still goes red,
  # and stops gating anything — so `ci-conclusion-complete.sh` above compares
  # this list against the jobs that exist, in both directions.
  conclusion:
    name: conclusion
    if: always()
    needs:
      - changes
      - guards
      - workflow-audit
      - dockerfile-lint
      - image-build
      - fmt
      - clippy
      - test
      - doc
      - msrv
      - deny
      - fuzz-build
      - unused-deps
      - ui-e2e
      - ui-screenshot-guard
      - action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[] | .result; . == "success" or . == "skipped")' >/dev/null
