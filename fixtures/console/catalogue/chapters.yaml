      title: Committal headers
    - section: bulk-load
      title: Bulk load
  - folder: ehr_status
    title: EHR_STATUS
    sections:
    - section: read
      title: Read
    - section: update
      title: Update
    - section: versioning-and-history
      title: Versioning and history
    - section: flags
      title: Flags
- chapter: query
  title: Query
  folders:
  - folder: query
    title: AQL and stored queries
    sections:
    - section: ad-hoc-aql-execution
      title: Ad-hoc AQL execution
    - section: stored-queries
      title: Stored queries
    - section: refusals
      title: Refusals
- chapter: system
  title: System
  folders:
  - folder: system
    title: System
    sections:
    - section: options
      title: OPTIONS
