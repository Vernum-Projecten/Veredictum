# The console capture fixture's copy of the catalogue file of this name,
# narrowed to the documents this fixture carries. Frozen on purpose: the
# capture pass renders over this tree so a catalogue change moves no capture.
# No openEHR spec governs this — our own design.
chapters:
- chapter: ehr
  title: EHR
