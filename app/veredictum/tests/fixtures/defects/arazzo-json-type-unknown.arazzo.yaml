# Seeded defect: a `json_type` judge names `integer`, which is not one of
# the six JSON types of RFC 8259 §3, so the judge is refused rather than
# read as some default type. The source url passes through the pristine
# `ehr` directory the overlay links.
arazzo: 1.1.0
info: { title: seeded defect, version: 0.1.0 }
sourceDescriptions:
  - name: ehr
    url: ../ehr/../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: get_ehr-id_as_integer
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_get_by_id.yaml
      section: description
      quote: "Retrieve the EHR with the specified `ehr_id`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: get
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: json_type
              context: $response.body#/ehr_id
              type: integer
