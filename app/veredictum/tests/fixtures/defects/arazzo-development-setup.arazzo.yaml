# Seeded defect: a workflow that rests on released text names, in
# `dependsOn`, a setup that cites development text alone. The setup would run
# under the released profile, so the released verdict would rest on
# development text; the development-setup gate refuses the pairing.
arazzo: 1.1.0
info: { title: seeded defect, version: 0.1.0 }
sourceDescriptions:
  - name: system
    url: ../../../specs/rest-oas/system-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: development_setup
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "When `lifecycle_state` is not provided by the client, the server MUST set it to `complete` (code `532`)."
    steps:
      - stepId: options
        operationId: $sourceDescriptions.system.options
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: released_case
    dependsOn: [development_setup]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/options.yaml
      section: description
      quote: "Services SHOULD respond to this method with the appropriate HTTP codes, headers and potentially with a payload revealing more details about themselves."
      level: should
    steps:
      - stepId: options
        operationId: $sourceDescriptions.system.options
        successCriteria:
          - condition: $statusCode == 200
