package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

write_files:
  # A box nobody logs into still takes security updates.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Docker's packages come from Docker's origin, which unattended-upgrades does
  # not patch by default. A patched kernel only runs after a reboot, so the box
  # reboots at a fixed quiet hour when an upgrade needs it; `restart:
  # unless-stopped` brings the console back. A run in flight at 04:00 UTC is
  # lost, and its submitter starts it again.
  - path: /etc/apt/apt.conf.d/52veredictum-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Docker,label=Docker CE";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  # The SSH policy stated by this file rather than inherited from the image's
  # defaults: keys only, no root, and the deploy user is the only login.
  - path: /etc/ssh/sshd_config.d/10-veredictum.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers deploy

  # Container logs are the likeliest thing to fill a small disk, and a full disk
  # fails in a way that looks like nothing at all.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }

  # The journal holds the console's output, the per-run record lines among
  # them (#489), past a container recreate and a reboot. Persistent, and capped
  # so it cannot fill the disk the run artifacts also live on
  # (https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html).
  - path: /etc/systemd/journald.conf.d/50-veredictum.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
      MaxRetentionSec=1year

  # The ONE command the CI key may run. The deploy is a pull, an extraction of
  # the posture out of the pulled image, and a recreate: nothing is built here,
  # and nothing is fetched from this repository over the network.
  - path: /opt/veredictum-console/deploy.sh
    permissions: "0755"
    owner: deploy:deploy
    # Deferred to the final stage: `write-files` runs BEFORE `users-groups` in
    # the default module order, so an owner naming this user cannot be applied
    # any earlier.
    defer: true
    content: |
      #!/usr/bin/env bash
      # SSH runs this whatever the client asked for, which is the point of the
      # command= restriction on the key.
      #
      # The posture this box runs — docker-compose.yml and Caddyfile — travels
      # INSIDE the published image at /app/posture (deploy/docker/Dockerfile, #423), so
      # a committed posture change arrives with the release that carries it and
      # inherits that artifact's provenance. This script extracts it from the
      # image it just pulled and installs it only after the compose file parses.
      #
      # It does NOT rewrite itself: a script that overwrites itself mid-run is
      # a footgun, so installing a new version of THIS file stays a manual step
      # on the box.
      set -euo pipefail
      cd /opt/veredictum-console

      # `.env` is the operator's file and no automation writes it, so it is what
      # names the image to interrogate. No fallback: an unnamed image is a stop,
      # never a guess at which artifact the posture should come from.
      image="$(sed -n 's/^[[:space:]]*CONSOLE_IMAGE=//p' .env | tail -n 1)"
      image="${image%\"}"
      image="${image#\"}"
      if [[ -z "$image" ]]; then
        echo "deploy: .env names no CONSOLE_IMAGE, so no image can be read" >&2
        exit 1
      fi

      docker pull -q "$image"

      # The created container and the candidate files go away on every exit
      # path, including a refusal below.
      cleanup() {
        if [[ -n "$cid" ]]; then
          docker rm -f "$cid" >/dev/null 2>&1 || true
        fi
        rm -f docker-compose.yml.candidate Caddyfile.candidate
      }
      cid=""
      trap cleanup EXIT

      # The base is distroless and carries no shell, so `docker run … cat` can
      # never work: a container is CREATED and never started, and the files are
      # copied out of it
      # (https://docs.docker.com/reference/cli/docker/container/cp/).
      cid="$(docker create "$image")"
      docker cp "$cid:/app/posture/docker-compose.yml" docker-compose.yml.candidate
      docker cp "$cid:/app/posture/Caddyfile" Caddyfile.candidate

      # `set -e` fails a failed copy; an EMPTY file it cannot see. A truncated
      # posture stops the deploy here rather than recreating with the old files
      # and reporting success.
      for candidate in docker-compose.yml.candidate Caddyfile.candidate; do
        if [[ ! -s "$candidate" ]]; then
          echo "deploy: $candidate came out of $image empty" >&2
          exit 1
        fi
      done

      # A compose file that does not parse must never be installed: the next
      # deploy could not run at all, and the box would be reachable only by hand.
      docker compose -f docker-compose.yml.candidate config --quiet

      compose_changed=0
      caddy_changed=0
      cmp -s docker-compose.yml.candidate docker-compose.yml || compose_changed=1
      cmp -s Caddyfile.candidate Caddyfile || caddy_changed=1

      # The replaced copy stays on the box, so a bad posture is recoverable
      # without anyone editing YAML over SSH.
      if [[ "$compose_changed" -eq 1 ]]; then
        if [[ -f docker-compose.yml ]]; then
          cp -p docker-compose.yml docker-compose.yml.prev
        fi
        mv docker-compose.yml.candidate docker-compose.yml
        echo "deploy: docker-compose.yml installed from $image (previous: docker-compose.yml.prev)"
      fi
      if [[ "$caddy_changed" -eq 1 ]]; then
        if [[ -f Caddyfile ]]; then
          cp -p Caddyfile Caddyfile.prev
        fi
        mv Caddyfile.candidate Caddyfile
        echo "deploy: Caddyfile installed from $image (previous: Caddyfile.prev)"
      fi

      docker compose pull -q
      docker compose up -d --remove-orphans

      # A bind-mounted file's CONTENTS changing is not a configuration change,
      # so compose does not recreate the container that mounts it
      # (https://docs.docker.com/reference/cli/docker/compose/up/) and Caddy
      # keeps serving the old configuration until it is restarted. An
      # unapplied proxy change is the failure this whole extraction exists to
      # remove, so the restart is explicit.
      if [[ "$caddy_changed" -eq 1 ]]; then
        docker compose restart caddy
      fi

      # Images the instrument no longer runs. A running container's image is
      # never pruned, so this cannot take the release out from under itself.
      docker image prune -f --filter "until=168h"

runcmd:
  # Two firewalls that agree. The Hetzner Cloud Firewall keeps traffic off the
  # NIC; this is what the box itself says, and a disagreement between them is a
  # question worth answering.
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]
  - [systemctl, restart, systemd-journald]
  - [systemctl, enable, --now, docker]
  # Validated before it applies, so a bad drop-in cannot lock the box out.
  - [sh, -c, "sshd -t && systemctl reload-or-restart ssh"]
  - [install, -d, -o, deploy, -g, deploy, /opt/veredictum-console]
  # The group exists now, so the deploy user can join it. A group change takes
  # effect at the next login, and every deploy is its own SSH session.
  - [usermod, -aG, docker, deploy]
  - [systemctl, enable, --now, unattended-upgrades]

final_message: >-
  the box is up after $UPTIME seconds. Put .env in
  /opt/veredictum-console, then run the deploy lane: it installs
  docker-compose.yml and the Caddyfile out of the image it pulls.
