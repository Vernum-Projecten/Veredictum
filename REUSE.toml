# REUSE Specification 3.3 — https://reuse.software/spec-3.3/
#
# WHAT THIS ADDS. Licensing is also recorded per file where a header fits, and
# per vendored tree by a `PROVENANCE.md` naming the upstream source, the pinned
# revision and the licence. What neither of those does is SURVIVE A FILE LEAVING
# THIS REPOSITORY — the property REUSE exists for, that licensing "is preserved
# when the file is copied and reused by third parties". Someone who lifts one
# case out of the catalogue, or one archetype out of a corpus, takes a file whose
# terms are otherwise stated only in a manifest they did not copy. This
# instrument is built to be forked and re-run by other people, so downstream
# file-level reuse is the expected case.
#
# HOW THE TABLES COMPOSE, because ordering is load-bearing: "If a Covered File
# is covered by multiple [[annotations]] tables in the same REUSE.toml file,
# then exclusively the LAST matching table in the file is used" (spec 3.3). So
# the catch-all comes first and every later table narrows it.
#
# PRECEDENCE, likewise from the spec: `closest` associates licensing found
# INSIDE the file (a comment header or a `.license` sidecar) and falls back to
# the table only when the file carries none; `override` ignores anything closer.
# First-party globs use `closest`, so adding a real SPDX header to a source file
# is an improvement that takes effect immediately and never contradicts this
# file. Vendored globs use `override`, where the upstream tree's terms are
# settled by its `PROVENANCE.md` rather than by any per-file marking.

version = 1

# ── Catch-all: everything in this repository is Veredictum's own, Apache-2.0 ──
# `closest` means a file carrying its own SPDX header wins over this
# declaration. `LICENSES/Apache-2.0.txt` is the licence text REUSE requires,
# and it is byte-identical to the root `LICENSE`.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Veredictum contributors"
SPDX-License-Identifier = "Apache-2.0"

# ── The vendored openEHR specification text: the oracle ─────────────────────
# CC-BY-SA-3.0, the terms the specification documents themselves carry.
[[annotations]]
path = "specs/openehr/**"
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# ── The vendored machine-readable openEHR artifacts ─────────────────────────
# The XSD bundles, the ITS-JSON schemas and the ITS-REST OpenAPI documents come
# from the specification repositories, which carry Apache-2.0 at their root.
# (Each OAS bundle declares CC-BY-ND-3.0 in its own `info.license` stanza,
# contradicting that grant; the files are taken under the repository LICENSE,
# which is vendored beside them — see `specs/rest-oas/PROVENANCE.md`.)
[[annotations]]
path = [
  "specs/its-xml-schemas/**",
  "specs/its-json-schemas/**",
  "specs/rest-oas/**",
]
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "Apache-2.0"

# ── The performance schedule's payloads ─────────────────────────────────────
# The request bodies and operational templates the measured instruments send:
# CKM exports and archetype-built templates, so they carry the CKM archetype
# licences. Both CC-BY-SA versions occur, so `AND` is the only true statement
# about the tree as a whole; each archetype's own `licence` metadata remains
# the authority for that individual file.
[[annotations]]
path = "perf/payloads/**"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "the respective archetype authors"]
SPDX-License-Identifier = "CC-BY-SA-3.0 AND CC-BY-SA-4.0"

# ── The embedded bench fixtures: third-party bytes inside our own tree ──────
# A bench pack is compiled into the binary, so the bytes it offers a system
# live under `app/` where the catch-all above would claim them for Veredictum.
# They are not ours. The operational template is byte-identical to the vendored
# CKM export under `perf/payloads/ckm/`, so it carries that tree's
# declaration.
[[annotations]]
path = "app/veredictum/src/bench/fixtures/vital_signs.opt"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "the respective archetype authors"]
SPDX-License-Identifier = "CC-BY-SA-3.0 AND CC-BY-SA-4.0"

# The composition instance comes from a public attachment on the openEHR
# Discourse forum, where the publisher declared no licence. Nothing here
# asserts a grant on the publisher's behalf; the LicenseRef text records what
# is known and what is not. Its invalid twin, which the commit-validation
# canary offers, is those same bytes with one member deleted, so it is a
# derivative and carries the same declaration.
[[annotations]]
path = [
  "app/veredictum/src/bench/fixtures/vital_signs_composition.json",
  "app/veredictum/src/bench/fixtures/vital_signs_composition.missing_composer.json",
]
precedence = "override"
SPDX-FileCopyrightText = "the publisher of the openEHR Discourse benchmark harness attachment"
SPDX-License-Identifier = "LicenseRef-openEHR-forum-attachment"

# ── The embedded Arazzo 1.1 JSON Schema ─────────────────────────────────────
# Compiled into the engine, so it lives under `app/` where the catch-all would
# claim it. The OpenAPI Initiative publishes it from the Arazzo Specification
# repository, which carries Apache-2.0 at its root.
[[annotations]]
path = "app/veredictum/src/arazzo/vendor/arazzo-1.1-schema-2026-04-15.json"
precedence = "override"
SPDX-FileCopyrightText = "OpenAPI Initiative, a Linux Foundation Collaborative Project"
SPDX-License-Identifier = "Apache-2.0"

# ── The vendored CTRF 0.2.0 JSON Schema ─────────────────────────────────────
# The schema the CTRF export is tested against, beside the Arazzo schema under
# `app/`. The Common Test Report Format repository carries MIT at its root.
[[annotations]]
path = "app/veredictum/src/arazzo/vendor/ctrf-0.2.0.schema.json"
precedence = "override"
SPDX-FileCopyrightText = "2024 Matthew Poulton-White"
SPDX-License-Identifier = "MIT"

# ── One vendored file whose NAME contains a newline character ───────────────
# A file in the vendored CNF suite is tracked with a literal U+000A inside its
# filename — an upstream defect, and not something this repository may rename,
# because hand-editing a vendored tree is forbidden and the fix belongs
# upstream. Glob matching over a newline-bearing path does not reach it, so it
# is named explicitly.
[[annotations]]
path = "specs/openehr/CNF/tests/platform/robot/I_EHR_COMPOSITION/get_composition/I_EHR_COMPOSITION.get_composition_version-bad_ehr\n.robot"
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# ── The content templates, moved from the corpus ────────────────────────────
# The set-up document carries the operational templates the content cases
# commit against, inline. They were generated from the openEHR CNF Robot
# `minimal_observation.opt` skeleton, each with one constraint of our own, so
# they keep the declaration the corpus tree gives them beside our own text.
[[annotations]]
path = "catalogue/cases/_setup/content_templates.arazzo.yaml"
precedence = "override"
SPDX-FileCopyrightText = ["Veredictum contributors", "openEHR Foundation"]
SPDX-License-Identifier = "Apache-2.0 AND CC-BY-SA-3.0"

# ── Changelog fragments ─────────────────────────────────────────────────────
# A fragment under `changelog.d/` is the literal text the release cut moves
# into `CHANGELOG.md`, so it carries no header of its own. It is first-party
# prose and the catch-all already covers it; this table names the directory so
# the declaration sits where the convention is (#766). `closest` lets the
# README beside the fragments keep its own header.
[[annotations]]
path = "changelog.d/*.md"
precedence = "closest"
SPDX-FileCopyrightText = "Veredictum contributors"
SPDX-License-Identifier = "Apache-2.0"

# ── Our own provenance records inside the vendored trees ────────────────────
# The PROVENANCE.md files are FIRST-PARTY prose about the upstream material:
# what was fetched, from which commit, under which terms, and what exercises it.
# They are ours, Apache-2.0, and they sit inside directories the tables above
# claim for the openEHR Foundation. Placed LAST, because a later matching
# annotation wins.
[[annotations]]
path = [
  "specs/its-xml-schemas/PROVENANCE.md",
  "specs/its-json-schemas/PROVENANCE.md",
  "specs/rest-oas/PROVENANCE.md",
  "perf/payloads/ckm/PROVENANCE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Veredictum contributors"
SPDX-License-Identifier = "Apache-2.0"

# ── The AQL conformance corpus (github.com/Cadasto/aql-conformance) ─────────
# The set-up document carries the corpus's fixtures inline: compositions and
# EHR_STATUS bodies under the corpus's MIT licence, the EHRbase-derived
# templates and compositions under Apache-2.0, and two operational templates
# built from CKM archetypes, whose own licence metadata is empty, declared
# here with the CKM archetype licences. The query documents carry the
# corpus's queries and expectations beside our own text: MIT for its own
# cases, Apache-2.0 for the cases it generated from the EHRbase AQL suites.
# `catalogue/aql-conformance.PROVENANCE.md` is the per-file record.
[[annotations]]
path = "catalogue/cases/_setup/aql_conformance.arazzo.yaml"
precedence = "override"
SPDX-FileCopyrightText = [
  "Veredictum contributors",
  "2026 Cadasto B.V.",
  "2019 Vitasystems GmbH and Hannover Medical School",
  "openEHR Foundation",
  "the respective archetype authors",
]
SPDX-License-Identifier = "Apache-2.0 AND MIT AND CC-BY-SA-3.0 AND CC-BY-SA-4.0"

[[annotations]]
path = [
  "catalogue/cases/query/aqlc_aggregation.arazzo.yaml",
  "catalogue/cases/query/aqlc_from.arazzo.yaml",
  "catalogue/cases/query/aqlc_order_by.arazzo.yaml",
  "catalogue/cases/query/aqlc_paging.arazzo.yaml",
  "catalogue/cases/query/aqlc_refused.arazzo.yaml",
  "catalogue/cases/query/aqlc_select.arazzo.yaml",
  "catalogue/cases/query/aqlc_terminology.arazzo.yaml",
  "catalogue/cases/query/aqlc_top.arazzo.yaml",
  "catalogue/cases/query/aqlc_where.arazzo.yaml",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "Veredictum contributors",
  "2026 Cadasto B.V.",
  "2019 Vitasystems GmbH and Hannover Medical School",
]
SPDX-License-Identifier = "Apache-2.0 AND MIT"

# ── The Simplified Formats templates and flat documents ─────────────────────
# The set-up document carries four operational templates inline: two from the
# openEHR CNF Robot corpus (test_all_types.en.v1 and minimal_action.en.v1)
# and two of our own built on openEHR archetypes (cnf.vitals and
# cnf.tpl.sf_interval_event). The flat documents of `flat_context` and
# `flat_mapping` are adapted from the CNF Robot corpus's flat compositions.
# They carry the CKM archetype licences beside our own text.
[[annotations]]
path = [
  "catalogue/cases/_setup/simplified_formats.arazzo.yaml",
  "catalogue/cases/simplified_formats/flat_context.arazzo.yaml",
  "catalogue/cases/simplified_formats/flat_mapping.arazzo.yaml",
]
precedence = "override"
SPDX-FileCopyrightText = ["Veredictum contributors", "openEHR Foundation", "the respective archetype authors"]
SPDX-License-Identifier = "Apache-2.0 AND CC-BY-SA-3.0 AND CC-BY-SA-4.0"
