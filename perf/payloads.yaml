# The payload manifest of the performance schedule: every request body and
# operational template the measured instruments send, keyed by the name a
# journey stage or the seeder uses. `source` resolves under payloads/,
# `template_id` is the OPT's wire identifier where the payload has one, and
# `provenance` records where the bytes come from.
#
# No openEHR spec governs measured performance (CNF guide
# master03-overview.adoc §Product Scope excludes it); this tree is our own
# design. These files are the only copy: the case-core corpus they were
# mirrored from was deleted at the cut-over (#604).
#
# A journey stage that commits names a template key here; the instrument
# reads that key's OPT and its `.example` skeleton. The other keys are the
# scale corpus OPT (cnf.opt.blood_pressure), the Simplified-FLAT pair and
# the demographic bodies. An entry nothing reads is a load error.
