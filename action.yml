# The Veredictum GitHub Action (#770): one `uses:` step runs the conformance
# instrument against a vendor's server in CI.
#
# It runs the instrument's container image: `test` drives the Arazzo catalogue
# the image ships, `export` writes JUnit XML, CTRF and a Markdown summary into
# the output directory, `badge` writes the badges into its `badges/`
# directory, the summary is appended to the job summary, and each failed,
# errored or warning row is annotated on the run. The step fails when a row
# counts against the server (exit status 1), when the run could not start (2),
# and, unless `fail-on-inconclusive` is false, when the only red rows are
# inconclusive ones the instrument could not judge (3). The work is
# `scripts/action/run.sh`, whose header lists every input it reads.
#
# A composite action rather than a Docker container action. A container action
# fixes its image in this file, and this file at tag vX.Y.Z cannot name the
# digest that tag's release builds afterwards; it also could not run an image
# the caller chose or built. The composite step pulls the image, resolves it to
# its image ID and runs both subcommands by that ID, so the two runs read the
# same bytes.
#
# THE IMAGE. Left empty, the image is the release image of the version this
# action's own tree carries, `ghcr.io/vernum-projecten/veredictum:<X.Y.Z>` for
# the action at `vX.Y.Z`, and the step refuses an image whose engine reports any
# other version. A tag can move, a digest cannot, so a caller who wants the
# bytes fixed passes `image: ghcr.io/vernum-projecten/veredictum@sha256:…`.
# The release run's summary names the digest of each release, and
# `docker buildx imagetools inspect <image>:<X.Y.Z>` prints it. The step writes
# the image ID it ran to its `image-id` output and to the job summary.
#
# CREDENTIALS are never inputs. The caller sets them as `env:` on the step,
# under the names the engine reads, so they reach the container by name and
# never appear in a command line or in this action's inputs:
#
#   nothing                                                    with auth: none
#   VEREDICTUM_CDR_USER, VEREDICTUM_CDR_PASSWORD               with auth: basic
#   VEREDICTUM_CDR_TOKEN                                       with auth: bearer
#   VEREDICTUM_CDR_ADMIN_USER, VEREDICTUM_CDR_ADMIN_PASSWORD   with admin-auth: basic
#   VEREDICTUM_CDR_ADMIN_TOKEN                                 with admin-auth: bearer
#
# or each with `_FILE` appended, naming a file that holds the value. An empty
# variable counts as unset, so a missing repository secret stops the run.
#
# The SMART on openEHR documents need the `platform-url` input and the scoped
# tokens the IXIT's `scoped_tokens` member declares. Those secrets travel the
# same way, by name from the step's `env:`: the test issuer's key as
# VEREDICTUM_SCOPED_TOKEN_KEY, and every token the IXIT names under
# VEREDICTUM_SCOPED_TOKEN_<NAME>, each also with `_FILE`.
#
# PERMISSIONS. Without `badge-branch` the action calls no GitHub API and needs
# no token scope: a caller's job needs `contents: read` for its own checkout.
# With `badge-branch`, a run on the default branch that is not a pull request
# pushes the badges to that branch with GITHUB_TOKEN, which the caller sets as
# `env:` on the step like a credential, and the job then needs
# `contents: write`.
#
# No openEHR specification governs this. It is our own design.
name: Veredictum openEHR conformance
description: >-
  Run Veredictum against an openEHR server and fail the job when a
  conformance row counts against the server.
author: Veredictum contributors
branding:
  icon: check-square
  color: blue

inputs:
  base-url:
    description: >-
      The server's base URL, up to and including the openEHR REST base, for
      example https://cdr.example/openehr/v1. The run joins the `network`
      below, so with the default `host` a server on the runner is reachable at
      http://127.0.0.1:<port>.
    required: true
  statement:
    description: >-
      Path to the party's statement (JSON), which names the capabilities it
      claims and the option arms it selects. Empty runs every capability.
    required: false
    default: ""
  ixit:
    description: >-
      Path to the party's IXIT (JSON), which answers the declared inputs a
      rows file reads. Empty skips those rows as not-declared.
    required: false
    default: ""
  auth:
    description: >-
      How the CDR wants the client to log in: none (no login), basic
      (VEREDICTUM_CDR_USER and VEREDICTUM_CDR_PASSWORD) or bearer
      (VEREDICTUM_CDR_TOKEN). The credentials come from the step's env, never
      from an input.
    required: false
    default: none
  admin-auth:
    description: >-
      How the CDR wants the administrative principal to log in: none, basic
      (VEREDICTUM_CDR_ADMIN_USER and VEREDICTUM_CDR_ADMIN_PASSWORD) or bearer
      (VEREDICTUM_CDR_ADMIN_TOKEN). With none, every workflow with an
      administrative step is skipped.
    required: false
    default: none
  documents:
    description: >-
      Run only these documents, by id, separated by white space. A narrowed run
      is a working tool, never the record a party submits. Empty runs every
      document.
    required: false
    default: ""
  platform-url:
    description: >-
      The SMART Platform base URL, for example https://platform.example, which
      SMART on openEHR serves its discovery document relative to. Empty skips
      every workflow with a step sent to it as not-declared.
    required: false
    default: ""
  profile:
    description: >-
      The specification text the citations are read against: development (the
      pinned master of each openEHR repository, the newest text) or
      released (the frozen release). Only a released run backs a released
      claim or a certificate.
    required: false
    default: development
  out-dir:
    description: >-
      Where results.json, recording.har, junit.xml, ctrf.json, summary.md and
      the badges/ directory are written. The recording holds the server's response bodies verbatim,
      so it belongs where the operator keeps the run, never in a public
      artifact.
    required: false
    default: veredictum-results
  image:
    description: >-
      The image to run. Empty means the release image of this action's version.
      A reference by digest (…@sha256:…) fixes the bytes.
    required: false
    default: ""
  pull:
    description: >-
      true or false. With false the image must already be present on the
      runner, which is how a locally built image is run.
    required: false
    default: "true"
  network:
    description: >-
      The container network the run joins. host reaches a server on the runner
      itself, including a job's service containers through their published
      ports.
    required: false
    default: host
  badge-branch:
    description: >-
      A branch of this repository to push the badges to, as one commit that
      holds only the badges. Pushed only from a run on the default branch that
      is not a pull request, with GITHUB_TOKEN from the step's env; the job
      then needs contents write. Empty pushes nothing.
    required: false
    default: ""
  fail-on-inconclusive:
    description: >-
      true or false. With false, a run whose only red rows are inconclusive
      (exit status 3: the instrument could not judge them, so they do not
      count against the server) passes the step, and the job summary lists
      those rows. Exit status 1 and 2 always fail the step.
    required: false
    default: "true"
  annotations:
    description: >-
      true or false. With true, each failed or errored row is annotated as an
      error and each warning row as a warning, at most 10 of each per step as
      GitHub shows them; the job summary lists every row.
    required: false
    default: "true"

outputs:
  exit-code:
    description: >-
      The run's exit status: 0 when no row counts against the server and
      none is inconclusive, 1 when a row counts against the server, 2 when
      the run could not start or finish, 3 when the only red rows are
      inconclusive. It reads 3 even when fail-on-inconclusive passed the
      step.
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: The path of results.json.
    value: ${{ steps.run.outputs.results }}
  junit:
    description: The path of the JUnit XML view, set when the export succeeded.
    value: ${{ steps.run.outputs.junit }}
  ctrf:
    description: The path of the CTRF JSON view, set when the export succeeded.
    value: ${{ steps.run.outputs.ctrf }}
  summary:
    description: The path of the Markdown summary, set when the export succeeded.
    value: ${{ steps.run.outputs.summary }}
  badges:
    description: The directory holding the badges, set when they were drawn.
    value: ${{ steps.run.outputs.badges }}
  image-id:
    description: The ID of the image the run used.
    value: ${{ steps.run.outputs.image-id }}
  image-digests:
    description: The repository digests of that image, separated by spaces.
    value: ${{ steps.run.outputs.image-digests }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      # Every input reaches the shell through `env:`, never spliced into the
      # script, so no input value is ever read as shell source.
      env:
        IN_BASE_URL: ${{ inputs.base-url }}
        IN_STATEMENT: ${{ inputs.statement }}
        IN_IXIT: ${{ inputs.ixit }}
        IN_AUTH: ${{ inputs.auth }}
        IN_ADMIN_AUTH: ${{ inputs.admin-auth }}
        IN_DOCUMENTS: ${{ inputs.documents }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_PLATFORM_URL: ${{ inputs.platform-url }}
        IN_OUT_DIR: ${{ inputs.out-dir }}
        IN_IMAGE: ${{ inputs.image }}
        IN_PULL: ${{ inputs.pull }}
        IN_NETWORK: ${{ inputs.network }}
        IN_BADGE_BRANCH: ${{ inputs.badge-branch }}
        IN_FAIL_ON_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
        IN_ANNOTATIONS: ${{ inputs.annotations }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action/run.sh"
