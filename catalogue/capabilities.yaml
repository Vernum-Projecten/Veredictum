# The options a statement answers: behaviour the released text leaves to the
# implementation. Each arm names the documents that test it, by document id;
# a statement selects one arm per option through its `options` list, and the
# documents of every other arm are skipped with `option-not-selected`.
options:
  ehr-xml-read:
    description: >-
      Whether the service serves the EHR resource in canonical XML, on a read
      and as the representation of a create, when a client asks for it with
      Accept application/xml.
    arms:
      ehr-xml-supported:
        documents: [ehr_xml]
      ehr-xml-unsupported:
        documents: [ehr_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  ehr-xml-write:
    description: >-
      Whether the service processes an EHR_STATUS sent as canonical XML on
      the EHR creates. The global `items` element (LOCATABLE) of
      documents/Structure.xsd gives an EHR_STATUS a conforming root, but no
      released sentence requires a service to accept that root (upstream
      report #759), so the accepting arm has no document yet.
    arms:
      ehr-xml-write-accepted:
        documents: []
      ehr-xml-write-refused:
        documents: [ehr_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  ehr-status-xml-read:
    description: >-
      Whether the service serves the EHR_STATUS resource family (the
      EHR_STATUS, its VERSIONED_EHR_STATUS, their versions and the revision
      history) in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      ehr-status-xml-supported:
        documents: [ehr_status_xml]
      ehr-status-xml-unsupported:
        documents: [ehr_status_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  ehr-status-xml-write:
    description: >-
      Whether the service processes an EHR_STATUS sent as canonical XML on
      the EHR_STATUS update. The global `items` element (LOCATABLE) of
      documents/Structure.xsd gives an EHR_STATUS a conforming root, but no
      released sentence requires a service to accept that root (upstream
      report #759), so the accepting arm has no document yet.
    arms:
      ehr-status-xml-write-accepted:
        documents: []
      ehr-status-xml-write-refused:
        documents: [ehr_status_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  ehr-status-flat-write:
    description: >-
      Whether the service processes an EHR_STATUS sent with Content-Type
      application/openehr.wt.flat+json on the EHR creates and the EHR_STATUS
      update. The release defines no EHR_STATUS form in the Simplified Flat
      JSON format (upstream report #352), so the accepting arm has no
      document.
    arms:
      ehr-status-flat-write-accepted:
        documents: []
      ehr-status-flat-write-refused:
        documents: [ehr_write_flat_unsupported, ehr_status_write_flat_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
      report: 352
  ehr-status-structured-write:
    description: >-
      Whether the service processes an EHR_STATUS sent with Content-Type
      application/openehr.wt.structured+json on the EHR creates and the
      EHR_STATUS update. The release defines no EHR_STATUS form in the
      Simplified Structured JSON format (upstream report #352), so the
      accepting arm has no document.
    arms:
      ehr-status-structured-write-accepted:
        documents: []
      ehr-status-structured-write-refused:
        documents: [ehr_write_structured_unsupported, ehr_status_write_structured_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
      report: 352
  ehr-status-flat-read:
    description: >-
      Whether the service serves an EHR_STATUS, on a read and as the
      representation of an update, when a client asks for it with Accept
      application/openehr.wt.flat+json. The release defines no EHR_STATUS
      form in the Simplified Flat JSON format (upstream report #352), so the
      serving arm has no document.
    arms:
      ehr-status-flat-supported:
        documents: []
      ehr-status-flat-unsupported:
        documents: [ehr_status_read_flat_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
      report: 352
  ehr-status-structured-read:
    description: >-
      Whether the service serves an EHR_STATUS, on a read and as the
      representation of an update, when a client asks for it with Accept
      application/openehr.wt.structured+json. The release defines no
      EHR_STATUS form in the Simplified Structured JSON format (upstream
      report #352), so the serving arm has no document.
    arms:
      ehr-status-structured-supported:
        documents: []
      ehr-status-structured-unsupported:
        documents: [ehr_status_read_structured_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
      report: 352
  composition-xml-read:
    description: >-
      Whether the service serves the COMPOSITION resource family (the
      COMPOSITION, its VERSIONED_COMPOSITION, their versions and the revision
      history) in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      composition-xml-supported:
        documents: [composition_read_xml, composition_versioned_read_xml, composition_write_xml_accept]
      composition-xml-unsupported:
        documents: [composition_read_xml_not_acceptable, composition_versioned_read_xml_not_acceptable, composition_write_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  composition-flat-read:
    description: >-
      Whether the service serves a COMPOSITION in the Simplified Flat JSON
      format when a client asks for it with Accept. The release recommends
      the Simplified Formats, so a service that does not serve this one
      answers 406.
    arms:
      composition-flat-supported:
        documents: [composition_read_flat, composition_write_flat_accept, flat_read]
      composition-flat-unsupported:
        documents: [composition_read_flat_not_acceptable, composition_write_flat_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  composition-structured-read:
    description: >-
      Whether the service serves a COMPOSITION in the Simplified Structured
      JSON format when a client asks for it with Accept. The release
      recommends the Simplified Formats, so a service that does not serve
      this one answers 406.
    arms:
      composition-structured-supported:
        documents: [composition_read_structured, composition_write_structured_accept, structured_read]
      composition-structured-unsupported:
        documents: [composition_read_structured_not_acceptable, composition_write_structured_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  composition-xml-write:
    description: >-
      Whether the service processes a COMPOSITION sent as canonical XML on the
      COMPOSITION create and update, an instance of the composition element
      the published ITS-XML schema declares.
    arms:
      composition-xml-write-accepted:
        documents: [composition_xml, composition_update_xml]
      composition-xml-write-refused:
        documents: [composition_xml_write_refused, composition_update_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  query-ehr-scope:
    description: >-
      Whether the service restricts an ad-hoc query to the EHR the ehr_id
      query parameter names. The release lets the backend use the parameter
      for routing and optimisation, so a service that treats it as a hint
      declares the other arm, which has no document.
    arms:
      query-ehr-scope-filters:
        documents: [aql_ehr_scope]
      query-ehr-scope-hint:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/query/Request.md
      section: About the ehr_id parameter
      quote: "The `ehr_id` parameter SHOULD be supplied by clients when executing single EHR queries and MAY be used by the underlying backend to perform routing, optimizations or similar."
      level: should
  aql-top:
    description: >-
      Whether the service executes the deprecated TOP modifier. Release 1.1.0
      deprecates TOP and announces its removal in a future major release, so a
      service that declines it declares the other arm, which has no document.
    arms:
      aql-top-supported:
        documents: [aqlc_top]
      aql-top-declined:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TOP
      quote: "The `TOP` will be removed in a future major release of AQL specification."
  aql-terminology:
    description: >-
      Whether the service resolves a TERMINOLOGY() call against an external
      terminology server. Which servers a service reaches is its own
      configuration, so a service that reaches none declares the other arm,
      which has no document.
    arms:
      aql-terminology-supported:
        documents: [aqlc_terminology]
      aql-terminology-declined:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TERMINOLOGY
      quote: "The `TERMINOLOGY` function is used to invoke operations of an external terminology server and return the results for further processing by AQL."
  composition-flat-write:
    description: >-
      Whether the service processes a COMPOSITION sent in the Simplified Flat
      JSON format on the COMPOSITION create and update. The release
      recommends the Simplified Formats, so a service that does not process
      this one answers 415.
    arms:
      composition-flat-write-accepted:
        documents: [composition_write_flat, flat_context, flat_mapping, flat_structure, flat_commit_refused, flat_ranges, flat_context_values, flat_rm_attributes, flat_entries, flat_rm_refused, flat_read]
      composition-flat-write-refused:
        documents: [composition_write_flat_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  composition-structured-write:
    description: >-
      Whether the service processes a COMPOSITION sent in the Simplified
      Structured JSON format on the COMPOSITION create and update. The
      release recommends the Simplified Formats, so a service that does not
      process this one answers 415.
    arms:
      composition-structured-write-accepted:
        documents: [composition_write_structured, structured_commit, structured_read]
      composition-structured-write-refused:
        documents: [composition_write_structured_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  content-unmatched-member:
    description: >-
      Whether the service refuses a committed member of a container attribute
      that matches none of the attribute's object constraints. The released AM
      states the alternative-matching rule for single-valued attributes only,
      so both postures stay open until upstream report #307 is settled.
    arms:
      content-unmatched-member-refused:
        documents: [content_item_unmatched_refused]
      content-unmatched-member-accepted:
        documents: [content_item_unmatched_accepted]
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: Single-valued Attributes
      quote: "Two or more object blocks introduced by type names appearing after an attribute which is not a container (i.e. for which there is no cardinality constraint) are taken to be *alternative constraints*, only one of which needs to be matched by the data."
      report: 307
  template-web-template:
    description: >-
      Whether the service serves an ADL 1.4 operational template in the Web
      Template format when a client asks for it with Accept, on the template
      read and as the representation of an upload. The release recommends
      the Simplified Formats, so a service that does not serve this one
      answers 406.
    arms:
      template-web-template-supported:
        documents: [template_adl14_web_template]
      template-web-template-unsupported:
        documents: [template_adl14_web_template_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  contribution-xml-read:
    description: >-
      Whether the service serves a CONTRIBUTION in canonical XML when a client
      asks for it with Accept application/xml, on a read and in the answer of
      a create.
    arms:
      contribution-xml-supported:
        documents: [contribution_read_xml, contribution_write_xml_accept]
      contribution-xml-unsupported:
        documents: [contribution_read_xml_not_acceptable, contribution_write_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  contribution-xml-write:
    description: >-
      Whether the service processes a CONTRIBUTION sent as canonical XML on
      the CONTRIBUTION create. No published XSD declares an element
      or a type for the commit envelope (upstream report #759), so the
      accepting arm has no document yet.
    arms:
      contribution-xml-write-accepted:
        documents: []
      contribution-xml-write-refused:
        documents: [contribution_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  directory-xml-read:
    description: >-
      Whether the service serves the directory FOLDER in canonical XML when a
      client asks for it with Accept application/xml: on a read, latest and by
      version_uid, and in the answer of a create and of an update.
    arms:
      directory-xml-supported:
        documents: [directory_read_xml, directory_write_xml_accept]
      directory-xml-unsupported:
        documents: [directory_read_xml_not_acceptable, directory_write_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  directory-xml-write:
    description: >-
      Whether the service processes a directory FOLDER sent as canonical XML
      on the directory create and update. The global `items` element
      (LOCATABLE) of documents/Structure.xsd gives a FOLDER a conforming
      root, but no released sentence requires a service to accept that root
      (upstream report #759), so the accepting arm has no document yet.
    arms:
      directory-xml-write-accepted:
        documents: []
      directory-xml-write-refused:
        documents: [directory_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  party-xml-read:
    description: >-
      Whether the service serves each of the five PARTY kinds of the
      Demographic API (PERSON, AGENT, GROUP, ORGANISATION and ROLE) in
      canonical XML when a client asks for it with Accept application/xml, on
      a read and as the answer of a create or update.
    arms:
      party-xml-supported:
        documents: [party_read_xml, party_write_xml_accept]
      party-xml-unsupported:
        documents: [party_read_xml_not_acceptable, party_write_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  versioned-party-xml-read:
    description: >-
      Whether the service serves the VERSIONED_PARTY family of the
      Demographic API (the VERSIONED_PARTY, its versions and its revision
      history) in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      versioned-party-xml-supported:
        documents: [versioned_party_read_xml]
      versioned-party-xml-unsupported:
        documents: [versioned_party_read_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  party-xml-write:
    description: >-
      Whether the service processes a PARTY sent as canonical XML on the
      create and update of each PARTY kind. The one published global element
      of a type a PARTY extends is `items` (LOCATABLE) in documents/Structure.xsd,
      and that schema does not include Demographic.xsd, where the PARTY types
      are defined, so no published document schema reaches the PARTY types
      (upstream report #759) and the accepting arm has no document yet.
    arms:
      party-xml-write-accepted:
        documents: []
      party-xml-write-refused:
        documents: [party_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  demographic-contribution-xml-read:
    description: >-
      Whether the service serves a CONTRIBUTION of the Demographic API in
      canonical XML when a client asks for it with Accept application/xml, on
      the read and as the answer of the commit.
    arms:
      demographic-contribution-xml-supported:
        documents: [demographic_contribution_read_xml]
      demographic-contribution-xml-unsupported:
        documents: [demographic_contribution_read_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  demographic-contribution-xml-write:
    description: >-
      Whether the service processes a CONTRIBUTION sent as canonical XML on
      the commit of the Demographic API. No published XSD declares a document
      element or a type for the commit envelope (upstream report #759), so
      the accepting arm has no document yet.
    arms:
      demographic-contribution-xml-write-accepted:
        documents: []
      demographic-contribution-xml-write-refused:
        documents: [demographic_contribution_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  contribution-flat-write:
    description: >-
      Whether the service processes a CONTRIBUTION sent with Content-Type
      application/openehr.wt.flat+json, whose canonical envelope carries its
      members' data in the Simplified Flat JSON format. The release
      recommends the Simplified Formats, so a service that does not process
      this one answers 415.
    arms:
      contribution-flat-write-accepted:
        documents: [contribution_write_flat]
      contribution-flat-write-refused:
        documents: [contribution_write_flat_unsupported]
    x-veredictum-cite: &simplified_unsupported
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  contribution-structured-write:
    description: >-
      Whether the service processes a CONTRIBUTION sent with Content-Type
      application/openehr.wt.structured+json, whose canonical envelope
      carries its members' data in the Simplified Structured JSON format. The
      release recommends the Simplified Formats, so a service that does not
      process this one answers 415.
    arms:
      contribution-structured-write-accepted:
        documents: [contribution_write_structured]
      contribution-structured-write-refused:
        documents: [contribution_write_structured_unsupported]
    x-veredictum-cite: *simplified_unsupported
  contribution-flat-read:
    description: >-
      Whether the service serves a CONTRIBUTION when a client asks for it with
      Accept application/openehr.wt.flat+json, on a read and in the answer of
      a create. The release recommends the Simplified Formats, so a service
      that does not serve this one answers 406.
    arms:
      contribution-flat-supported:
        documents: [contribution_read_flat, contribution_write_flat_accept]
      contribution-flat-unsupported:
        documents: [contribution_read_flat_not_acceptable, contribution_write_flat_not_acceptable]
    x-veredictum-cite: &simplified_should
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  contribution-structured-read:
    description: >-
      Whether the service serves a CONTRIBUTION when a client asks for it with
      Accept application/openehr.wt.structured+json, on a read and in the
      answer of a create. The release recommends the Simplified Formats, so a
      service that does not serve this one answers 406.
    arms:
      contribution-structured-supported:
        documents: [contribution_read_structured, contribution_write_structured_accept]
      contribution-structured-unsupported:
        documents: [contribution_read_structured_not_acceptable, contribution_write_structured_not_acceptable]
    x-veredictum-cite: *simplified_should
  simplified-deprecated-write:
    description: >-
      Whether the service still processes a COMPOSITION sent with the
      deprecated media types application/openehr.wt.flat.schema+json and
      application/openehr.wt.structured.schema+json. The release deprecates
      them in favour of their current equivalents, so a service may have
      dropped them and then answers 415.
    arms:
      simplified-deprecated-write-accepted:
        documents: [deprecated_write]
      simplified-deprecated-write-refused:
        documents: [deprecated_write_refused]
    x-veredictum-cite: &deprecated
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "> NOTE: The `application/openehr.wt.flat.schema+json` and `application/openehr.wt.structured.schema+json` which were historically available in earlier versions of this specification, are now deprecated and will be removed in a future version of the specification. The equivalent formats `application/openehr.wt.flat+json` and `application/openehr.wt.structured+json` SHOULD be used instead."
      level: should
  simplified-deprecated-read:
    description: >-
      Whether the service still serves a template example when a client asks
      for it with the deprecated media types
      application/openehr.wt.flat.schema+json and
      application/openehr.wt.structured.schema+json. A service that has
      dropped them answers 406.
    arms:
      simplified-deprecated-supported:
        documents: [deprecated_example]
      simplified-deprecated-unsupported:
        documents: [deprecated_example_not_acceptable]
    x-veredictum-cite: *deprecated
  simplified-legacy-write:
    description: >-
      Whether the service processes a COMPOSITION sent with the legacy
      ECISFLAT media type application/openehr.nc.flat+json. The release names
      the format and does not define it, so the accepting arm has no
      document; a service that does not process it answers 415.
    arms:
      simplified-legacy-write-accepted:
        documents: []
      simplified-legacy-write-refused:
        documents: [legacy_write_refused]
    x-veredictum-cite: *simplified_should
  simplified-legacy-read:
    description: >-
      Whether the service serves a template example when a client asks for it
      with the legacy ECISFLAT media type application/openehr.nc.flat+json.
      The release names the format and does not define it, so the serving
      arm has no document; a service that does not serve it answers 406.
    arms:
      simplified-legacy-supported:
        documents: []
      simplified-legacy-unsupported:
        documents: [legacy_example_not_acceptable]
    x-veredictum-cite: *simplified_should
  authentication:
    description: >-
      Whether the service requires authentication. The release recommends an
      HTTP authentication framework and mandates no scheme, so a service that
      requires none has no refusal to test.
    arms:
      authentication-required:
        documents: [authentication_required]
      authentication-not-required:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Authentication and authorization
      quote: "Services SHOULD implement and support an HTTP Authentication and Authorization framework, though this specification does not mandate a specific authentication scheme."
      level: should
  version-signing:
    description: >-
      Whether the service makes a digital signature of each VERSION at
      committal and stores it in ORIGINAL_VERSION.signature. RM common makes
      the signature optional and leaves its serialisation to be determined,
      so the signing arm judges the presence of the signature only, and a
      service that signs nothing has no document.
    arms:
      version-signed:
        documents: [version_signature]
      version-unsigned:
        documents: []
    # TODO(#749): the quote permits ("can be made"), and the level vocabulary has no `may` to record it.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Digital Signature
      quote: "At the time of committal of a Version, a digital signature of the object can be made."
  admin-ehr-delete-processing:
    description: >-
      Whether the service processes an EHR delete of the Admin API
      synchronously, answering 204 once the EHR is physically deleted, or
      asynchronously, answering 202 once the delete is accepted. The Admin
      API is in the DEVELOPMENT state in Release-1.1.0; a service that does
      not serve it selects neither arm.
    arms:
      admin-delete-synchronous:
        documents: [admin_ehr_delete, admin_ehr_delete_all, admin_ehr_delete_all_unfiltered]
      admin-delete-asynchronous:
        documents: [admin_ehr_delete_async, admin_ehr_delete_all_async, admin_ehr_delete_all_unfiltered_async]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete.yaml
      section: description
      quote: "The server may execute this operation asynchronously (e.g. in batches), in which case returns status `202 Accepted`."
  admin-ehr-delete-all:
    description: >-
      Whether the service serves the bulk EHR delete of the Admin API or has
      it disabled and answers 405.
    arms:
      admin-delete-all-enabled:
        documents: [admin_ehr_delete_all, admin_ehr_delete_all_async, admin_ehr_delete_all_refused, admin_ehr_delete_all_unfiltered, admin_ehr_delete_all_unfiltered_async]
      admin-delete-all-disabled:
        documents: [admin_ehr_delete_all_disabled]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete_all.yaml
      section: description
      quote: "This functionality is intended primarily for **development** or **testing** purposes and may be disabled in **production** environments, in which case server may respond with `405 Method Not Allowed`."
  aql-undefined-containment:
    description: >-
      Whether the service refuses a query whose CONTAINS names a pair of
      classes the RM defines no containment for, or executes it to an empty
      result. AQL assigns neither, so both arms are open until upstream
      report #161 is settled, and neither arm has a document yet.
    arms:
      aql-undefined-containment-refused:
        documents: []
      aql-undefined-containment-empty:
        documents: []
