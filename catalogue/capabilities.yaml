# The options a statement answers: behaviour the released text leaves to the
# implementation. Each arm names the documents that test it, by document id;
# a statement selects one arm per option through its `options` list, and the
# documents of every other arm are skipped with `option-not-selected`.
options:
  ehr-xml-read:
    description: >-
      Whether the service serves the EHR resource in canonical XML when a
      client asks for it with Accept application/xml.
    arms:
      ehr-xml-supported:
        documents: [ehr_xml]
      ehr-xml-unsupported:
        documents: [ehr_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  ehr-xml-write:
    description: >-
      Whether the service processes an EHR_STATUS sent as canonical XML on
      the EHR creates. No published XSD declares a document element for
      EHR_STATUS, so the accepting arm has no document yet.
    arms:
      ehr-xml-write-accepted:
        documents: []
      ehr-xml-write-refused:
        documents: [ehr_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  ehr-status-xml-read:
    description: >-
      Whether the service serves the EHR_STATUS resource family (the
      EHR_STATUS, its VERSIONED_EHR_STATUS, their versions and the revision
      history) in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      ehr-status-xml-supported:
        documents: [ehr_status_xml]
      ehr-status-xml-unsupported:
        documents: [ehr_status_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  ehr-status-xml-write:
    description: >-
      Whether the service processes an EHR_STATUS sent as canonical XML on
      the EHR_STATUS update. No published XSD declares a document element for
      EHR_STATUS, so the accepting arm has no document yet.
    arms:
      ehr-status-xml-write-accepted:
        documents: []
      ehr-status-xml-write-refused:
        documents: [ehr_status_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  composition-xml-read:
    description: >-
      Whether the service serves the COMPOSITION resource family (the
      COMPOSITION, its VERSIONED_COMPOSITION, their versions and the revision
      history) in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      composition-xml-supported:
        documents: [composition_read_xml, composition_versioned_read_xml, composition_write_xml_accept]
      composition-xml-unsupported:
        documents: [composition_read_xml_not_acceptable, composition_versioned_read_xml_not_acceptable, composition_write_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  composition-flat-read:
    description: >-
      Whether the service serves a COMPOSITION in the Simplified Flat JSON
      format when a client asks for it with Accept. The release recommends
      the Simplified Formats, so a service that does not serve this one
      answers 406.
    arms:
      composition-flat-supported:
        documents: [composition_read_flat, composition_write_flat_accept]
      composition-flat-unsupported:
        documents: [composition_read_flat_not_acceptable, composition_write_flat_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  composition-structured-read:
    description: >-
      Whether the service serves a COMPOSITION in the Simplified Structured
      JSON format when a client asks for it with Accept. The release
      recommends the Simplified Formats, so a service that does not serve
      this one answers 406.
    arms:
      composition-structured-supported:
        documents: [composition_read_structured, composition_write_structured_accept]
      composition-structured-unsupported:
        documents: [composition_read_structured_not_acceptable, composition_write_structured_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  composition-xml-write:
    description: >-
      Whether the service processes a COMPOSITION sent as canonical XML on the
      COMPOSITION create and update, an instance of the composition element
      the published ITS-XML schema declares.
    arms:
      composition-xml-write-accepted:
        documents: [composition_xml, composition_update_xml]
      composition-xml-write-refused:
        documents: [composition_xml_write_refused, composition_update_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  query-ehr-scope:
    description: >-
      Whether the service restricts an ad-hoc query to the EHR the ehr_id
      query parameter names. The release lets the backend use the parameter
      for routing and optimisation, so a service that treats it as a hint
      declares the other arm, which has no document.
    arms:
      query-ehr-scope-filters:
        documents: [aql_ehr_scope]
      query-ehr-scope-hint:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/query/Request.md
      section: About the ehr_id parameter
      quote: "The `ehr_id` parameter SHOULD be supplied by clients when executing single EHR queries and MAY be used by the underlying backend to perform routing, optimizations or similar."
      level: should
  aql-top:
    description: >-
      Whether the service executes the deprecated TOP modifier. Release 1.1.0
      deprecates TOP and announces its removal in a future major release, so a
      service that declines it declares the other arm, which has no document.
    arms:
      aql-top-supported:
        documents: [aqlc_top]
      aql-top-declined:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TOP
      quote: "The `TOP` will be removed in a future major release of AQL specification."
  aql-terminology:
    description: >-
      Whether the service resolves a TERMINOLOGY() call against an external
      terminology server. Which servers a service reaches is its own
      configuration, so a service that reaches none declares the other arm,
      which has no document.
    arms:
      aql-terminology-supported:
        documents: [aqlc_terminology]
      aql-terminology-declined:
        documents: []
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TERMINOLOGY
      quote: "The `TERMINOLOGY` function is used to invoke operations of an external terminology server and return the results for further processing by AQL."
  composition-flat-write:
    description: >-
      Whether the service processes a COMPOSITION sent in the Simplified Flat
      JSON format on the COMPOSITION create and update. The release
      recommends the Simplified Formats, so a service that does not process
      this one answers 415.
    arms:
      composition-flat-write-accepted:
        documents: [composition_write_flat]
      composition-flat-write-refused:
        documents: [composition_write_flat_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  composition-structured-write:
    description: >-
      Whether the service processes a COMPOSITION sent in the Simplified
      Structured JSON format on the COMPOSITION create and update. The
      release recommends the Simplified Formats, so a service that does not
      process this one answers 415.
    arms:
      composition-structured-write-accepted:
        documents: [composition_write_structured]
      composition-structured-write-refused:
        documents: [composition_write_structured_unsupported]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot process the request payload as the simplified format is not supported, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  template-web-template:
    description: >-
      Whether the service serves an ADL 1.4 operational template in the Web
      Template format when a client asks for it with Accept, on the template
      read and as the representation of an upload. The release recommends
      the Simplified Formats, so a service that does not serve this one
      answers 406.
    arms:
      template-web-template-supported:
        documents: [template_adl14_web_template]
      template-web-template-unsupported:
        documents: [template_adl14_web_template_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported, while other alternative formats MAY be supported as well, depending on the use case."
      level: should
  contribution-xml-read:
    description: >-
      Whether the service serves a CONTRIBUTION in canonical XML when a client
      asks for it with Accept application/xml.
    arms:
      contribution-xml-supported:
        documents: [contribution_read_xml]
      contribution-xml-unsupported:
        documents: [contribution_read_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  contribution-xml-write:
    description: >-
      Whether the service processes a CONTRIBUTION sent as canonical XML on
      the CONTRIBUTION create. No published XSD declares a document element
      for CONTRIBUTION, so the accepting arm has no document yet.
    arms:
      contribution-xml-write-accepted:
        documents: []
      contribution-xml-write-refused:
        documents: [contribution_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  directory-xml-read:
    description: >-
      Whether the service serves the directory FOLDER, latest and by
      version_uid, in canonical XML when a client asks for it with Accept
      application/xml.
    arms:
      directory-xml-supported:
        documents: [directory_read_xml]
      directory-xml-unsupported:
        documents: [directory_read_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  directory-xml-write:
    description: >-
      Whether the service processes a directory FOLDER sent as canonical XML
      on the directory create and update. No published XSD declares a
      document element for FOLDER, so the accepting arm has no document yet.
    arms:
      directory-xml-write-accepted:
        documents: []
      directory-xml-write-refused:
        documents: [directory_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
  party-xml-read:
    description: >-
      Whether the service serves the PARTY resources of the Demographic API
      (each of the five PARTY kinds, its VERSIONED_PARTY, their versions and
      the revision history) in canonical XML when a client asks for it with
      Accept application/xml.
    arms:
      party-xml-supported:
        documents: [party_read_xml]
      party-xml-unsupported:
        documents: [party_read_xml_not_acceptable]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Services MUST support at least one of the openEHR **XML** or **JSON** canonical formats for resource representation."
  party-xml-write:
    description: >-
      Whether the service processes a PARTY sent as canonical XML on the
      create and update of each PARTY kind. No published XSD declares a
      document element for a PARTY, so the accepting arm has no document yet.
    arms:
      party-xml-write-accepted:
        documents: []
      party-xml-write-refused:
        documents: [party_xml_write_refused]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
