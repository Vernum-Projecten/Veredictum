# The workflow count each capability folder keeps. `validate` refuses a folder
# below its floor, and a test re-derives every floor from the catalogue, so a
# change that adds workflows raises the floor in the same change.
floors:
  admin: 17
  composition: 207
  content: 361
  contribution: 69
  definition: 33
  demographic: 359
  directory: 85
  ehr: 48
  ehr_status: 76
  item_tags: 71
  query: 194
  security: 11
  simplified_formats: 137
  smart: 3
  system: 3
# The capability folders verified only over the routes of the sources under
# `sources/` whose `info` carries `x-veredictum-non-openehr: true`, which no
# openEHR OAS describes. No folder is: every capability folder calls a
# released operation.
extension-only: []
