      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: SUM
      quote: "Input values type should be either Integer or Real, and it will also determine the return type."
      report: 229
  xml-namespace:
    description: >-
      Which published canonical XML lineage the service serves: the
      Release-1.0.2 schemas in namespace http://schemas.openehr.org/v1, or the
      Release-2.0.0 schemas in http://schemas.openehr.org/v2. The release
      requires conformance to "the published XSDs" and names neither, so
