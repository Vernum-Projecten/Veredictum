      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: Containment
      quote: "Left-hand operand class expression is the parent object of the right-hand operand class expression"
      report: 161
  aql-nonnumeric-aggregate:
    description: >-
      Whether the service refuses a SUM or AVG over an input type outside the
      function's declared types, or executes it. AQL names the types and
      assigns no outcome to another, so both arms are open until upstream
      report #229 is settled, and neither arm has a document yet.
    arms:
      aql-nonnumeric-aggregate-refused:
        documents: []
      aql-nonnumeric-aggregate-executed:
        documents: []
