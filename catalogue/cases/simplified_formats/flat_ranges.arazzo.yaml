          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0004' && @.value.upper_unbounded == true]"
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0004' && @.value.upper_included == false]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: DV_INTERVAL
              quote: '| `\|upper_included` | BOOLEAN | upper_included | no | defaults to true. only in output if false'
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0004' && @.value.lower.magnitude == 65.42]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: DV_INTERVAL
              quote: '| `/lower` | T | lower | no |'

  - workflowId: create_composition-flat-dv_interval_lower_unbounded
    summary: The flat |lower_unbounded and |lower_included of a DV_INTERVAL set its flags
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document whose interval_datetime gives
      an upper with |lower_unbounded true and |lower_included false, and
      reads the COMPOSITION back in canonical JSON. That DV_INTERVAL is lower
      unbounded and does not include its lower limit. The lower_unbounded
      row of master05 repeats the suffix as its RM path, so the attribute is
      judged by its BASE name.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: DV_INTERVAL
      quote: '| `\|lower_included` | BOOLEAN | lower_included | no | defaults to true. only in output if false'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_interval_lower
        stepId: commit
        description: Create the COMPOSITION from the flat document whose DV_INTERVAL is lower unbounded and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types_1:0/interval_datetime/upper: "2019-03-22T22:36:25.232+01:00"
            test_all_types/test_all_types_1:0/interval_datetime|lower_unbounded: true
            test_all_types/test_all_types_1:0/interval_datetime|lower_included: false
        successCriteria:
          - *composition_created
