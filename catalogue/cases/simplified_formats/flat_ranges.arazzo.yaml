    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: REFERENCE_RANGE
      quote: '| `\|lower_unbounded` | Boolean | range.lower_unbounded | no | defaults to false'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_range_lower
        stepId: commit
        description: Create the COMPOSITION from the flat document whose reference range is lower unbounded and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types:0/quantity|magnitude: 68.07
            test_all_types/test_all_types:0/quantity|unit: mg
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0|lower_unbounded: true
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0|lower_included: false
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/upper|magnitude: 50.0
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/upper|unit: mg
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/meaning|value: low
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters: *read_canonical
        successCriteria:
          - *composition_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0007'].value.other_reference_ranges[?@.meaning.value == 'low' && @.range.lower_unbounded == true]"
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0007'].value.other_reference_ranges[?@.meaning.value == 'low' && @.range.lower_included == false]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: REFERENCE_RANGE
              quote: '| `\|lower_included` | Boolean | range.lower_included | no | defaults to true'

  - workflowId: create_composition-flat-dv_interval_flag_defaults
    summary: A flat DV_INTERVAL that sets no boundary flag is bounded and includes both limits
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document whose interval_count gives a
      lower of 5 and an upper of 8 and no boundary flag, and reads the
      COMPOSITION back in canonical JSON. That DV_INTERVAL is neither lower
      nor upper unbounded, and it includes both limits.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: DV_INTERVAL
      quote: '| `\|lower_included` | BOOLEAN | lower_included | no | defaults to true. only in output if false'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_interval
        stepId: commit
        description: Create the COMPOSITION from the flat document whose DV_INTERVAL sets no flag and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types_1:0/interval_count/lower: 5
            test_all_types/test_all_types_1:0/interval_count/upper: 8
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters: *read_canonical
        successCriteria:
          - *composition_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0003' && @.value.lower_included == true]"
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0003' && @.value.upper_included == true]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: DV_INTERVAL
              quote: '| `\|upper_included` | BOOLEAN | upper_included | no | defaults to true. only in output if false'
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0003' && @.value.lower_unbounded == false]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: DV_INTERVAL
              quote: '| `\|lower_unbounded` | BOOLEAN | `\|lower_unbounded` | no | defaults to false. only in output if true'
              report: 721
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-EVALUATION.test_all_types.v1'].data.items[?@.archetype_node_id == 'at0003' && @.value.upper_unbounded == false]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: DV_INTERVAL
              quote: '| `\|upper_unbounded` | BOOLEAN | upper_unbounded | no | defaults to false, only in output if true'

  - workflowId: create_composition-flat-dv_interval_upper_unbounded
    summary: The flat |upper_unbounded and |upper_included of a DV_INTERVAL set its flags
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document whose interval_quantity gives
      a lower of 65.42 mg with |upper_unbounded true and |upper_included
      false, and reads the COMPOSITION back in canonical JSON. That
      DV_INTERVAL is upper unbounded and does not include its upper limit.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: DV_INTERVAL
      quote: '| `\|upper_unbounded` | BOOLEAN | upper_unbounded | no | defaults to false, only in output if true'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_interval_upper
        stepId: commit
        description: Create the COMPOSITION from the flat document whose DV_INTERVAL is upper unbounded and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters: *commit_parameters
