      |upper_included false, and reads the COMPOSITION back in canonical
      JSON. That range is upper unbounded and does not include its upper
      limit.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: REFERENCE_RANGE
      quote: '| `\|upper_unbounded` | Boolean | range.upper_unbounded | no | defaults to false'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_range_upper
        stepId: commit
        description: Create the COMPOSITION from the flat document whose reference range is upper unbounded and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types:0/quantity|magnitude: 68.07
            test_all_types/test_all_types:0/quantity|unit: mg
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/lower|magnitude: 90.0
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/lower|unit: mg
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0|upper_unbounded: true
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0|upper_included: false
            test_all_types/test_all_types:0/quantity/_other_reference_ranges:0/meaning|value: high
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters: *read_canonical
        successCriteria:
          - *composition_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0007'].value.other_reference_ranges[?@.meaning.value == 'high' && @.range.upper_unbounded == true]"
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0007'].value.other_reference_ranges[?@.meaning.value == 'high' && @.range.upper_included == false]"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
              section: REFERENCE_RANGE
              quote: '| `\|upper_included` | Boolean | range.upper_included | no | defaults to true'

  - workflowId: create_composition-flat-reference_range_lower_unbounded
    summary: The flat |lower_unbounded and |lower_included of a reference range set its range flags
