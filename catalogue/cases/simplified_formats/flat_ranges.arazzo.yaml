            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types_1:0/interval_quantity/lower|magnitude: 65.42
            test_all_types/test_all_types_1:0/interval_quantity/lower|unit: mg
            test_all_types/test_all_types_1:0/interval_quantity|upper_unbounded: true
            test_all_types/test_all_types_1:0/interval_quantity|upper_included: false
