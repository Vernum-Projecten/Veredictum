# COMPOSITIONs created from the Simplified Flat JSON format of the template
# test_all_types.en.v1, whose leaves cover the data value types, for a service
# that processes the format: part of the accepting arm of the
# `composition-flat-write` option, as Arazzo 1.1.0 workflows over the released
# ITS-REST `-validation` OAS. Each workflow commits the same flat document and
# reads the COMPOSITION back in canonical JSON, and judges one mapping of
# master05-rm_mapping.adoc or one path rule of master04-basic_concepts.adoc.
# Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: Data value mappings from the Simplified Flat JSON format
  version: 0.1.0
  description: >-
    The RM mappings of the Simplified Formats specification, one data value
    type or one path rule per workflow, judged on the canonical JSON of the
    COMPOSITION a flat document of the template test_all_types.en.v1
    created.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: sf
    url: ../_setup/simplified_formats.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-flat-element_value
    summary: A flat leaf names an ELEMENT, and its value is the ELEMENT value
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document whose leaf
      test_all_types:0/text holds a text, and reads the COMPOSITION back
      in canonical JSON. The OBSERVATION carries the ELEMENT at0004
      whose DV_TEXT value is that text.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master04-basic_concepts.adoc
      section: Flat format
      quote: 'There is no distinction between ELEMENT and its value - elements ARE their values'
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Create the COMPOSITION from the flat document and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: openehr-template-id, in: header, value: test_all_types.en.v1 }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types:0/text: text value
            test_all_types/test_all_types:0/coded_text|code: N.84
            test_all_types/test_all_types:0/coded_text|value: N.84 label
            test_all_types/test_all_types:0/coded_text_terminology|code: D.13
            test_all_types/test_all_types:0/coded_text_terminology|value: D.13 description
            test_all_types/test_all_types:0/quantity|magnitude: 68.07
            test_all_types/test_all_types:0/quantity|unit: mg
            test_all_types/test_all_types:0/quantity/_normal_range/lower|magnitude: 60.0
            test_all_types/test_all_types:0/quantity/_normal_range/lower|unit: mg
            test_all_types/test_all_types:0/quantity/_normal_range/upper|magnitude: 80.0
            test_all_types/test_all_types:0/quantity/_normal_range/upper|unit: mg
            test_all_types/test_all_types:0/count: 6
            test_all_types/test_all_types:0/date: "2019-03-22"
            test_all_types/test_all_types:0/datetime: "2019-03-22T22:36:25.23+01:00"
            test_all_types/test_all_types:0/datetime_any: "2019-03-22T22:36:25.23+01:00"
            test_all_types/test_all_types:0/time: "22:36:25.23"
            test_all_types/test_all_types:0/ordinal|code: at0014
            test_all_types/test_all_types:0/ordinal|value: ord1
            test_all_types/test_all_types:0/ordinal|ordinal: 0
            test_all_types/test_all_types:0/boolean: true
            test_all_types/test_all_types:0/duration_any: P2DT7H16M
            test_all_types/test_all_types:0/multimedia_any: http://med.tube.com/sample
            test_all_types/test_all_types:0/multimedia_any|mediatype: video/mp4
            test_all_types/test_all_types:0/multimedia_any|size: 1024
            test_all_types/test_all_types:0/parsable_any: instructions
            test_all_types/test_all_types:0/parsable_any|formalism: GLIF 1.0
            test_all_types/test_all_types:0/identifier: 35e4059a-e6f4-4ba1-befe-e2493bce3991
            test_all_types/test_all_types:0/proportion_any|numerator: 90.07
            test_all_types/test_all_types:0/proportion_any|denominator: 50.85
            test_all_types/test_all_types:0/proportion_any|type: 0
            test_all_types/test_all_types_1:0/uri: http://example.com/path/resource
            test_all_types/test_all_types_1:0/interval_count/upper: 8
            test_all_types/test_all_types_1:0/interval_count/lower: 5
            test_all_types/test_all_types_1:0/interval_quantity/upper|magnitude: 93.14
            test_all_types/test_all_types_1:0/interval_quantity/upper|unit: mg
            test_all_types/test_all_types_1:0/interval_quantity/lower|magnitude: 65.42
            test_all_types/test_all_types_1:0/interval_quantity/lower|unit: mg
            test_all_types/test_all_types_1:0/interval_datetime/upper: "2019-03-22T22:36:25.232+01:00"
            test_all_types/test_all_types_1:0/interval_datetime/lower: "2019-03-22T22:36:25.232+01:00"
            test_all_types/test_all_types_1:0/choice/quantity_value|magnitude: 60.91
            test_all_types/test_all_types_1:0/choice/quantity_value|unit: mm[Hg]
            test_all_types/test_all_types_1:0/cluster_1/cluster_2/cluster_3/text_2: text 2 3
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &composition_retrieved
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0004' && @.value.value == 'text value']"

  - workflowId: create_composition-flat-dv_text
    summary: A flat DV_TEXT leaf maps its value to the DV_TEXT value
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document, and reads the
      COMPOSITION back in canonical JSON. The DV_TEXT of the ELEMENT
      text carries the value the flat leaf gave.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master05-rm_mapping.adoc
      section: DV_TEXT
      quote: '| `\|value` | String | value | yes |'
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *composition_retrieved
          - context: $response.body
