          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.test_all_types.v1'].data.events[*].data.items[?@.archetype_node_id == 'at0007' && @.value.units == 'mg']"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master04-basic_concepts.adoc
              section: Attribute Suffixes
              quote: '|<<DV_QUANTITY,DV_QUANTITY>> |`\|unit` |Unit of measure'

