# Template examples asked for with the deprecated Simplified Formats media
# types, for a service that does not serve them: the refusing arm of the
# `simplified-deprecated-read` option, whose other arm is
# `deprecated_example.arazzo.yaml`, as Arazzo 1.1.0 workflows over the
# released ITS-REST `-validation` OAS.
# Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: Template examples in the deprecated Simplified Formats media types, not acceptable
  version: 0.1.0
  description: >-
    An example of the template minimal_evaluation.en.v1 asked for with
    each deprecated media type from a service that does not serve them.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_template_example-flat_deprecated_media_not_acceptable
    summary: A template example asked for as application/openehr.wt.flat.schema+json is refused with 406
    description: >-
      Retrieves an example of the template minimal_evaluation.en.v1 with
      Accept application/openehr.wt.flat.schema+json from a service that
      does not serve the deprecated media type. The read is answered 406
      Not Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &not_acceptable
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The target resource does not have a current representation that would be acceptable to the user"
    steps:
      - stepId: example
        description: Retrieve an example of the template minimal_evaluation.en.v1 with Accept application/openehr.wt.flat.schema+json.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_example_get
        parameters:
          - { name: template_id, in: path, value: minimal_evaluation.en.v1 }
          - { name: Accept, in: header, value: application/openehr.wt.flat.schema+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_template_example-structured_deprecated_media_not_acceptable
    summary: A template example asked for as application/openehr.wt.structured.schema+json is refused with 406
    description: >-
      Retrieves an example of the template minimal_evaluation.en.v1 with
      Accept application/openehr.wt.structured.schema+json from a
      service that does not serve the deprecated media type. The read is
      answered 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *not_acceptable
    steps:
      - stepId: example
        description: Retrieve an example of the template minimal_evaluation.en.v1 with Accept application/openehr.wt.structured.schema+json.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_example_get
        parameters:
          - { name: template_id, in: path, value: minimal_evaluation.en.v1 }
          - { name: Accept, in: header, value: application/openehr.wt.structured.schema+json }
        successCriteria:
          - condition: $statusCode == 406
