# A CONTRIBUTION read with Accept application/openehr.wt.flat+json, for a service that
# does not serve the Simplified Flat JSON format: the refusing arm of the
# `contribution-flat-read` option, whose other arm is
# `contribution_read_flat.arazzo.yaml`, as an Arazzo 1.1.0 workflow over the
# released ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: CONTRIBUTION read in the Simplified Flat JSON format, not acceptable
  version: 0.1.0
  description: >-
    A CONTRIBUTION committed in canonical JSON and read back with Accept
    application/openehr.wt.flat+json from a service that does not serve the format.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_contribution-flat_not_acceptable
    summary: A CONTRIBUTION read with Accept Simplified Flat JSON is refused with 406 by a service that does not serve it
    description: >-
      Creates an EHR and commits a CONTRIBUTION in canonical JSON, then
      retrieves it with Accept application/openehr.wt.flat+json from a service that does
      not serve the format. The read is answered 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: commit
        description: Commit a CONTRIBUTION whose one member creates a COMPOSITION, keeping its uid and the version_uid it references.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data:
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: Minimal }
                  archetype_details:
                    archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { value: minimal_evaluation.en.v1 }
                    rm_version: "1.0.2"
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                  territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
                  category:
                    value: event
                    defining_code: { terminology_id: { value: openehr }, code_string: "433" }
                  composer: { _type: PARTY_IDENTIFIED, name: Dr. Canonical }
                  context:
                    start_time: { value: "2021-09-21T21:52:31.927-03:00" }
                    setting:
                      value: other care
                      defining_code: { terminology_id: { value: openehr }, code_string: "238" }
                  content:
                    - _type: EVALUATION
                      name: { _type: DV_TEXT, value: Minimal }
                      archetype_details:
                        archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                        template_id: { value: minimal_evaluation.en.v1 }
                        rm_version: "1.0.2"
                      archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                      language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                      encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: Arbol }
                        archetype_node_id: at0001
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: quantity }
                            archetype_node_id: at0002
                            value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs:
          contribution_uid: $response.body#/uid/value
          version_uid: $response.body#/versions/0/id/value
      - stepId: read
        description: Retrieve the CONTRIBUTION by its uid with Accept application/openehr.wt.flat+json.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/openehr.wt.flat+json }
        successCriteria:
          - condition: $statusCode == 406
