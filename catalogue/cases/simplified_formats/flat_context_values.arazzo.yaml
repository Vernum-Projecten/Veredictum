            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-ACTION.minimal.v1' && @.workflow_id.id.value == '567']"
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-ACTION.minimal.v1' && @.workflow_id.namespace == 'HOSPITAL-NS']"
