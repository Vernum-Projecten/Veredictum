# A template example asked for with the legacy ECISFLAT media type, for a
# service that does not serve it: the refusing arm of the
# `simplified-legacy-read` option, whose serving arm has no document because
# the release does not define the format, as an Arazzo 1.1.0 workflow over
# the released ITS-REST `-validation` OAS.
# Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: Template examples in the legacy ECISFLAT media type, not acceptable
  version: 0.1.0
  description: >-
    An example of the template minimal_evaluation.en.v1 asked for as
    application/openehr.nc.flat+json from a service that does not serve
    that format.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_template_example-nc_flat_not_acceptable
    summary: A template example asked for as application/openehr.nc.flat+json is refused with 406
    description: >-
      Retrieves an example of the template minimal_evaluation.en.v1 with
      Accept application/openehr.nc.flat+json from a service that does
      not serve the legacy ECISFLAT format. The read is answered 406 Not
      Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &not_acceptable
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The target resource does not have a current representation that would be acceptable to the user"
    steps:
      - stepId: example
        description: Retrieve an example of the template minimal_evaluation.en.v1 with Accept application/openehr.nc.flat+json.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_example_get
        parameters:
          - { name: template_id, in: path, value: minimal_evaluation.en.v1 }
          - { name: Accept, in: header, value: application/openehr.nc.flat+json }
        successCriteria:
          - condition: $statusCode == 406
