# COMPOSITIONs created from the Simplified Flat JSON format whose content is
# a SECTION nesting SECTIONs, an ADMIN_ENTRY and an INSTRUCTION with an
# ACTIVITY, for a service that processes the format: part of the accepting arm
# of the `composition-flat-write` option, as Arazzo 1.1.0 workflows over the
# released ITS-REST `-validation` OAS. Each workflow commits a flat document of
# the template test_all_types.en.v1 and reads the COMPOSITION back in canonical
# JSON. Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: SECTION, ADMIN_ENTRY and INSTRUCTION content from the Simplified Flat JSON format
  version: 0.1.0
  description: >-
    The SECTION, ADMIN_ENTRY, INSTRUCTION and ACTIVITY mappings of the
    Simplified Formats specification (master04-basic_concepts.adoc and
    master05-rm_mapping.adoc), one row or one path rule per workflow, judged
    on the canonical JSON of the COMPOSITION a flat document of the template
    test_all_types.en.v1 created.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: sf
    url: ../_setup/simplified_formats.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-flat-sections
    summary: A flat path through nested SECTIONs reaches the entry inside them
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      test_all_types.en.v1 from a flat document whose INSTRUCTION is
      addressed as test_all_types_2:0/section_2/section_3/test_all_types:0,
      and reads the COMPOSITION back in canonical JSON. Its content holds
      the SECTION openEHR-EHR-SECTION.test_all_types.v1, holding the SECTION
      at0001, holding the SECTION at0002, holding the INSTRUCTION.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master04-basic_concepts.adoc
      section: Path Construction
      quote: 'Full paths are constructed by concatenating parent node IDs with forward slashes:'
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: '`201 Created` is returned when the EHR has been successfully created,'
      - stepId: commit
        description: Create the COMPOSITION from the flat document whose INSTRUCTION sits in nested SECTIONs and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: openehr-template-id, in: header, value: test_all_types.en.v1 }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload:
            ctx/language: en
            ctx/territory: US
            ctx/composer_name: CNF Composer
            test_all_types/test_all_types_2:0/section_2/section_3/test_all_types:0/narrative: Human readable instruction narrative
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: '`201 Created` is returned when the COMPOSITION is successfully created.'
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the COMPOSITION by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: '`200 OK` is returned when the requested COMPOSITION is successfully retrieved.'
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@._type == 'SECTION' && @.archetype_node_id == 'openEHR-EHR-SECTION.test_all_types.v1'].items[?@._type == 'SECTION' && @.archetype_node_id == 'at0001'].items[?@._type == 'SECTION' && @.archetype_node_id == 'at0002'].items[?@._type == 'INSTRUCTION' && @.archetype_node_id == 'openEHR-EHR-INSTRUCTION.test_all_types.v1']"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/docs/simplified_formats/master04-basic_concepts.adoc
              section: Container Attributes Elided from Paths
              quote: '`SECTION.items`'

  - workflowId: create_composition-flat-admin_entry
    summary: A flat ADMIN_ENTRY leaf sets the ELEMENT of its data
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
