      section_2/test_all_types:0/count_3 holds 3, and reads the COMPOSITION
      back in canonical JSON. The ADMIN_ENTRY data is the ITEM_SINGLE at0001
      whose ELEMENT at0002 carries the DV_COUNT 3.
    dependsOn: [$sourceDescriptions.sf.upload_template-test_all_types]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/docs/simplified_formats/master04-basic_concepts.adoc
