# The directory FOLDER read in canonical XML, for a service that does not
# serve it in XML: the refused arm of the `directory-xml-read` option, whose
# served arm is `directory_read_xml.arazzo.yaml`. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Directory reads in canonical XML refused
  version: 0.1.0
  description: >-
    Reading the directory FOLDER, latest and by version_uid, with Accept
    application/xml from a service that does not serve it in canonical XML.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: get_directory-xml_not_acceptable
    summary: A directory read with Accept application/xml is refused with 406
    description: >-
      Creates an EHR and its directory FOLDER, then retrieves the latest
      directory asking for canonical XML from a service that does not serve
      XML. The read is answered 406 Not Acceptable.
    x-veredictum-cite: &not_acceptable
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &create
        stepId: create
        description: Create the directory FOLDER and keep the version_uid of the representation.
        operationId: $sourceDescriptions.ehr.directory_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: FOLDER
            name: { _type: DV_TEXT, value: root }
            archetype_node_id: openEHR-EHR-FOLDER.generic.v1
            folders:
              - _type: FOLDER
                name: { _type: DV_TEXT, value: episodes }
                archetype_node_id: openEHR-EHR-FOLDER.generic.v1
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_directory.yaml
              section: description
              quote: "`201 Created` is returned when the FOLDER is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the latest directory FOLDER in canonical XML.
        operationId: $sourceDescriptions.ehr.directory_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - &refused
            condition: $statusCode == 406

  - workflowId: get_directory_version-xml_not_acceptable
    summary: A directory version read with Accept application/xml is refused with 406
    description: >-
      Creates an EHR and its directory FOLDER, then retrieves the version of
      the create asking for canonical XML from a service that does not serve
      XML. The read is answered 406 Not Acceptable.
    x-veredictum-cite: *not_acceptable
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *create
      - stepId: get
        description: Retrieve the directory by the version_uid of the create in canonical XML.
        operationId: $sourceDescriptions.ehr.directory_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.create.outputs.version_uid }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - *refused
