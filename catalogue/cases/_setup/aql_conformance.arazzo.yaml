# The fixtures of the AQL conformance corpus (github.com/Cadasto/aql-conformance at
# d5b8c554fecef73fbeab0620dfd28d4a1149bd63): its operational templates, and one set-up per arrangement
# a carried case makes, each an EHR with the case's COMPOSITIONs committed in
# order. Third-party bytes; aql_conformance.PROVENANCE.md beside this file and
# REUSE.toml name their source and licences. Every quote is copied verbatim from
# the named vendored file.
arazzo: 1.1.0
info:
  title: AQL conformance corpus fixtures
  version: 0.1.0
  description: The templates and the per-case EHRs the carried aql-conformance cases query.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: upload_template-aqlc_vital_signs
    summary: The template aql_conformance.vital_signs.v1 is on the server
    description: Uploads the operational template aql_conformance.vital_signs.v1 from the aql-conformance
      fixture templates/vital_signs.opt. A server that already holds a template with that template_id
      refuses the upload with 409, which leaves the same precondition in place.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/definition_template_adl1.4_upload.yaml
      section: description
      quote: Upload a new ADL 1.4 operational template (OPT).
    steps:
      - stepId: upload
        description: Upload the template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
