# Setups several documents share, written once. A document that needs one
# lists this document as a `type: arazzo` source and names the workflow in
# `dependsOn` as `$sourceDescriptions.<name>.<workflowId>` (Arazzo 1.1.0
# §Workflow Object). Every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: Shared setups
  version: 0.1.0
  description: >-
    The templates the content, the bulk-load, the COMPOSITION and the
    DEFINITION cases commit against or read, and the dataset the AQL cases
    query.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
