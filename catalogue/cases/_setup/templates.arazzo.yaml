# `dependsOn` as `$sourceDescriptions.<name>.<workflowId>` (Arazzo 1.1.0
# §Workflow Object). Every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: Shared setups
  version: 0.1.0
  description: >-
    The templates the content, the bulk-load and the COMPOSITION cases
    commit against.
