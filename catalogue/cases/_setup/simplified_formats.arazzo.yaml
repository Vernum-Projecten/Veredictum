      holding a repeatable body_temperature OBSERVATION whose repeatable
      EVENT carries a DV_QUANTITY Temperature, an open coded Symptom and a
      closed coded Body exposure. A server that already holds a template
      with that template_id refuses the upload with 409, which leaves the
      same precondition in place.
