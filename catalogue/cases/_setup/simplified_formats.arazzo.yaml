# The templates the Simplified Formats cases commit against, written once.
# A document that needs one lists this document as a `type: arazzo` source
# and names the workflow in `dependsOn` as
# `$sourceDescriptions.<name>.<workflowId>` (Arazzo 1.1.0 §Workflow Object).
# Every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Simplified Formats setups
  version: 0.1.0
  description: >-
    The operational templates the Simplified Formats cases commit against.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: upload_template-vitals
