# The operational templates the content workflows commit against, each
# uploaded once by its own workflow. A content workflow names the one it needs
# in `dependsOn` (Arazzo 1.1.0 Workflow Object). The templates are built on
# the openEHR CNF minimal OBSERVATION skeleton, each with one constraint on
# the ELEMENT.value the content workflows vary. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content templates
  version: 0.1.0
  description: >-
    The templates whose constraint every row of a content workflow shares.
    A template whose constraint varies row by row is built and uploaded by
    the row's own workflow instead.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: upload_template-dv_boolean_open
    summary: The template cnf.tpl.dv_boolean_open is on the server
    description: >-
      Uploads the operational template cnf.tpl.dv_boolean_open. A server that already holds a
      template with that template_id refuses the upload with 409, which
      leaves the same precondition in place.
