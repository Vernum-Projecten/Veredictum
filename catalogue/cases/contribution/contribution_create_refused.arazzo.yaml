# The CONTRIBUTION commits a service refuses: an unknown EHR, an envelope or
# member the commit DTO refuses, a member whose change type does not match
# the version it would add, content that breaks a schema or an RM invariant,
# an unknown template, a uid already in use, an unsupported media type and an
# EHR that is not modifiable, as Arazzo 1.1.0 workflows over the released
# ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: CONTRIBUTION create refusals
  version: 0.1.0
  description: >-
    The CONTRIBUTION commits that are refused. A body the released commit DTO
    (schemas/ehr/NewContribution.yaml and the schemas it names) or the
    published ITS-JSON schema refuses is syntactically invalid content and is
    answered 400; a schema-valid body that breaks an RM invariant or names a
    template the server does not hold is answered 422. Each defective body is
    the valid CONTRIBUTION of the create document with one defect.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: commit_contribution-unknown_ehr
    summary: A CONTRIBUTION commit to an EHR that does not exist is answered 404
    description: >-
      Commits a valid CONTRIBUTION under a freshly generated ehr_id that no
      EHR carries. The commit is answered 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: commit
        description: Commit the CONTRIBUTION under the ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &contribution
            versions:
              - &creation_member
                lifecycle_state: &complete
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: &composition
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: commit_contribution-empty_versions
    summary: A CONTRIBUTION with no versions is refused with 422
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose versions list is
      empty. The commit DTO accepts the shape (NewContribution.yaml sets no
      minimum on versions), but a CONTRIBUTION is a change set of one or more
      versions, so the request cannot be followed and is answered 422.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/contribution.adoc
      section: CONTRIBUTION Class
      quote: "Documents a Contribution (change set) of one or more versions added to a change-controlled repository."
    inputs: *ehr_input
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: commit
        description: Commit the CONTRIBUTION whose versions list is empty.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            versions: []
            audit: *creation_audit
        successCriteria:
          - &semantic_error
            condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The request was well-formed but was unable to be followed due to semantic errors"

  - workflowId: commit_contribution-invalid_composition
    summary: A CONTRIBUTION whose COMPOSITION the ITS-JSON schema refuses is answered 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose member COMPOSITION
      carries its language as a bare string. The published ITS-JSON schema
      (openehr_rm_1.1.0_all.json, COMPOSITION.language, a CODE_PHRASE object)
      refuses the body, so it is syntactically invalid content and the commit
      is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &invalid_content
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose COMPOSITION language is a bare string.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /versions/0/data/language, value: en }
        successCriteria:
          - &bad_request
            condition: $statusCode == 400

  - workflowId: commit_contribution-unknown_template
    summary: A CONTRIBUTION whose COMPOSITION names a template the server does not hold is answered 422
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose member COMPOSITION
      names the template cnf.absent_template.v99, which no setup uploads. The
      commit is answered 422.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/422.yaml
      section: description
      quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose COMPOSITION names an unknown template.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /versions/0/data/archetype_details/template_id/value, value: cnf.absent_template.v99 }
        successCriteria:
          - condition: $statusCode == 422

  - workflowId: commit_contribution-wrong_media
    summary: A CONTRIBUTION commit labelled text/plain is answered 415
    description: >-
      Creates an EHR, then sends a CONTRIBUTION labelled Content-Type
      text/plain. The operation takes a CONTRIBUTION in the formats its
      Content-Type parameter lists, and text/plain is none of them, so the
      commit is answered 415 Unsupported Media Type.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service is refusing the request because the payload is in a format not supported by this method on the target resource"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION with the body labelled text/plain.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: text/plain
          payload: '{"versions":[]}'
        successCriteria:
          - condition: $statusCode == 415

  - workflowId: commit_contribution-audit_change_type_missing
    summary: A CONTRIBUTION whose audit has no change_type is refused with 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose envelope audit carries
      no change_type. The commit DTO requires it, so the body is
      syntactically invalid content and the commit is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *invalid_content
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose envelope audit has no change_type.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            versions: [*creation_member]
            audit:
              _type: UPDATE_AUDIT
              committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/schemas/common/UpdateAudit.yaml
              section: required
              quote: "change_type committer"

  - workflowId: commit_contribution-audit_change_type_out_of_group
    summary: A CONTRIBUTION whose audit change_type is outside the audit change type group is refused with 422
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose envelope audit carries
      the change_type code 532, a code of the version lifecycle state group
      and not of the audit change type group. The body is schema-valid but
      breaks the AUDIT_DETAILS invariant, so the commit is answered 422.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/audit_details.adoc
      section: AUDIT_DETAILS Class
      quote: "__Change_type_valid__: `terminology (Terminology_id_openehr).has_code_for_group_id (Group_id_audit_change_type, change_type.defining_code)`"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose envelope audit change_type is the code 532.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /audit/change_type/defining_code/code_string, value: "532" }
        successCriteria:
          - *semantic_error

  - workflowId: commit_contribution-lifecycle_state_missing
    summary: A member with no lifecycle_state is refused with 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose member carries no
      lifecycle_state. The commit DTO requires it on every member, so the body
      is syntactically invalid content and the commit is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *invalid_content
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose member has no lifecycle_state.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - commit_audit: *creation_audit
                data: *composition
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/schemas/ehr/UpdateVersion.yaml
              section: required
              quote: "lifecycle_state data commit_audit"

  - workflowId: commit_contribution-lifecycle_state_out_of_group
    summary: A member whose lifecycle_state is outside the version lifecycle state group is refused with 422
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose member carries the
      lifecycle_state code 249, a code of the audit change type group and not
      of the version lifecycle state group. The body is schema-valid but
      breaks the VERSION invariant, so the commit is answered 422.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/version.adoc
      section: VERSION Class
      quote: "__Lifecycle_state_ valid__: `lifecycle_state /= Void and then terminology (Term_id_openehr).has_code_for_group_id (Group_id_version_lifecycle_state, lifecycle_state.defining_code)`"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose member lifecycle_state is the code 249.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /versions/0/lifecycle_state/defining_code/code_string, value: "249" }
        successCriteria:
          - *semantic_error

  - workflowId: commit_contribution-first_version_modification
    summary: A member that modifies a COMPOSITION no version precedes is refused with 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose one member carries the
      change_type 251 modification and no preceding_version_uid, so the
      version it would add is the first version of a modification. The commit
      is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &mismatch
      source: specs/openehr/ITS-REST/specifications/responses/400_CONTRIBUTION.yaml
      section: description
      quote: "or the modification type does not match the operation - i.e. first version of a MODIFICATION)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose member modifies with no preceding version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /versions/0/commit_audit/change_type/value, value: modification }
            - { target: /versions/0/commit_audit/change_type/defining_code/code_string, value: "251" }
        successCriteria:
          - *bad_request

  - workflowId: commit_contribution-first_version_amendment
    summary: A member that amends a COMPOSITION no version precedes is refused with 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose one member carries the
      change_type 250 amendment and no preceding_version_uid. An amendment is
      a modification of an existing item, so the version it would add is the
      first version of a modification and the commit is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *mismatch
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose member amends with no preceding version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *contribution
          replacements:
            - { target: /versions/0/commit_audit/change_type/value, value: amendment }
            - { target: /versions/0/commit_audit/change_type/defining_code/code_string, value: "250" }
        successCriteria:
          - *bad_request

  - workflowId: commit_contribution-first_version_modification_persistent
    summary: A member that modifies a persistent COMPOSITION no version precedes is refused with 400
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose one member carries a
      persistent COMPOSITION with the change_type 251 modification and no
      preceding_version_uid. The commit is answered 400.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *mismatch
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose persistent member modifies with no preceding version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state: *complete
                commit_audit: &modification_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: modification
                    defining_code: { terminology_id: { value: openehr }, code_string: "251" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data:
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: Persistent minimal }
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.persistent_minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: persistent_minimal.en.v1 }
                    rm_version: "1.0.2"
                  archetype_node_id: openEHR-EHR-COMPOSITION.persistent_minimal.v1
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: UY
                  category:
                    _type: DV_CODED_TEXT
                    value: persistent
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "431"
                  composer:
                    _type: PARTY_IDENTIFIED
                    external_ref:
                      _type: PARTY_REF
                      id: { _type: HIER_OBJECT_ID, value: a3dce0d4-fa51-4ff2-9cce-93dd60437842 }
                      namespace: DEMOGRAPHIC
                      type: PERSON
                    name: Dr. Yamamoto
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: Minimal }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: Event Series }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,380+00:00" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: Cualquier evento }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,384+00:00" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: Arbol }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: text }
                                  archetype_node_id: at0004
                                  value: { _type: DV_TEXT, value: original value }
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: "1.0.2"
            audit: *modification_audit
        successCriteria:
          - *bad_request

  - workflowId: commit_contribution-folder_modification_without_directory
    summary: A member that modifies a directory the EHR does not have is refused with 400
    description: >-
      Creates an EHR with no directory, then commits a CONTRIBUTION whose
      member modifies a FOLDER with no preceding_version_uid. The version it
      would add is the first version of a modification, so the commit is
      answered 400.
    x-veredictum-cite: *mismatch
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION whose FOLDER member modifies with no preceding version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state: *complete
                commit_audit: *modification_audit
                data:
                  _type: FOLDER
                  name: { _type: DV_TEXT, value: root }
                  archetype_node_id: openEHR-EHR-FOLDER.generic.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-FOLDER.generic.v1 }
                    rm_version: 1.1.0
            audit: *modification_audit
        successCriteria:
          - *bad_request

  - workflowId: commit_contribution-creation_with_preceding_version
    summary: A creating member that names a preceding version is refused
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating a COMPOSITION, then
      commits a second CONTRIBUTION whose member carries the change_type 249
      creation together with the first version as preceding_version_uid. A
      creation adds the first version of a new versioned object, and a first
      version has no preceding version, so the member contradicts itself. The
      release names it both a change type that does not match the operation
      (400) and a semantic error (422), so either holds.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/version.adoc
      section: VERSION Class
      quote: "__Preceding_version_uid_validity__: `uid.version_tree_id.is_first xor preceding_version_uid /= Void`"
    inputs: *ehr_input
    steps:
