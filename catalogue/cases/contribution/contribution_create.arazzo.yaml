  - workflowId: commit_contribution-return_identifier
    summary: A CONTRIBUTION commit with Prefer return=identifier is answered with the identifier
    description: >-
      Creates an EHR, then commits a CONTRIBUTION with Prefer
      return=identifier. The commit succeeds with a 2xx status, and the body
      should carry only the uid of the CONTRIBUTION; the body is a
      recommendation, so a row lacking it is a warning.
