# Committing CONTRIBUTIONs a service accepts: the creation of a COMPOSITION,
# change-sets of several members, a modification of an existing COMPOSITION,
# EHR_STATUS and directory FOLDER members, the response preferences, the
# headers of the answer and a time_committed the client sends, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. Every criterion resolves to an `x-veredictum-cite` (its
# own, else its step's, else its workflow's), and every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: CONTRIBUTION create
  version: 0.1.0
  x-veredictum-section: create
  description: >-
    Committing a CONTRIBUTION in canonical JSON. Every member and every
    envelope audit is the commit DTO the released OAS declares
    (schemas/ehr/NewContribution.yaml, UpdateVersion.yaml and
    UpdateAudit.yaml): the audit carries `_type` UPDATE_AUDIT, and a member
    carries lifecycle_state, data and commit_audit.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: commit_contribution-composition
    summary: A CONTRIBUTION creating one COMPOSITION is answered 201 with the CONTRIBUTION
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose one member creates an
      event COMPOSITION, asking for the full representation. The commit is
      answered 201 Created, and the body is the CONTRIBUTION with its uid and
      the reference to the version it created.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &contribution_created
      source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
      section: description
      quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: >-
          Commit a CONTRIBUTION whose one member creates an event COMPOSITION,
          keep the contribution uid and the version_uid the representation
          reports, and derive the versioned_object_uid from the version_uid.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &contribution
            versions:
              - &creation_member
                lifecycle_state: &complete
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: &composition
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - &created
            condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
        outputs:
          contribution_uid: $response.body#/uid/value
          version_uid: $response.body#/versions/0/id/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: commit-again
        description: Commit a second CONTRIBUTION of the same shape and keep the representation.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *contribution
        successCriteria:
          - *created
          - &representation_uid
            condition: $response.body#/uid/value != null
            x-veredictum-cite: &representation
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "If `Prefer` header is `return=representation`, the full resource is included in the response body;"
          - &representation_version
            condition: $response.body#/versions/0/id/value != null
            x-veredictum-cite: *representation

  - workflowId: commit_contribution-composition_read_back
    summary: The COMPOSITION a CONTRIBUTION created is retrievable by the version_uid it reports
    description: >-
      Creates an EHR, commits a CONTRIBUTION whose one member creates an event
      COMPOSITION, then retrieves the COMPOSITION by the version_uid the
      CONTRIBUTION references. The read is answered 200 with the committed
      COMPOSITION.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &addition
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "a new `VERSIONED_OBJECT` is created with a first `ORIGINAL_VERSION` whose data is the new item;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the COMPOSITION by the version_uid the CONTRIBUTION references.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &composition_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - context: $response.body#/content/0/data/events/0/data/items/0/value/magnitude
            type: regex
            condition: '^15$'

  - workflowId: commit_contribution-version_change_type_creation
    summary: The version a creating member adds records the change_type 249 creation
    description: >-
      Creates an EHR, commits a CONTRIBUTION whose one member creates an event
      COMPOSITION, then retrieves the VERSION by its version_uid under the
      derived versioned_object_uid. Its commit_audit carries the change_type
      code 249.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "the `ORIGINAL_VERSION._commit_audit_._change_type_` is set to the code `249|creation|`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - &get_version
        stepId: get-version
        description: Retrieve the VERSION by its version_uid under the derived versioned_object_uid.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &version_retrieved
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSION_of_COMPOSITION_by_id.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSION is successfully retrieved."
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^249$'

  - workflowId: commit_contribution-version_names_contribution
    summary: The version a member adds names the CONTRIBUTION that added it
    description: >-
      Creates an EHR, commits a CONTRIBUTION whose one member creates an event
      COMPOSITION, then retrieves the VERSION by its version_uid. Its
      contribution reference carries the uid of the committed CONTRIBUTION.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/version.adoc
      section: VERSION Class
      quote: "Contribution in which this version was added."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get-version
        description: Retrieve the VERSION by its version_uid under the derived versioned_object_uid.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *version_retrieved
          - context: $response.body#/contribution/id/value
            type: regex
            condition: '^{$steps.commit.outputs.contribution_uid}$'

  - workflowId: commit_contribution-audit_time_committed
    summary: The committed CONTRIBUTION carries a server-set audit time_committed
    description: >-
      Creates an EHR, then commits a CONTRIBUTION whose envelope audit carries
      no time_committed, asking for the full representation. The CONTRIBUTION
      in the answer carries an audit time_committed, which the server sets.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/contribution_create.yaml
      section: description
      quote: "`audit.time_committed`: server will always set it"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit the CONTRIBUTION and ask for the full representation.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *contribution
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
          - condition: $response.body#/audit/time_committed/value != null

  - workflowId: commit_contribution-two_compositions
    summary: A CONTRIBUTION creating two COMPOSITIONs lists both versions
    description: >-
      Creates an EHR, then commits one CONTRIBUTION whose two members each
      create an event COMPOSITION. The commit is answered 201, and the
      CONTRIBUTION lists a version for each member.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &change_set
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "In every case, regardless of the combination, a `CONTRIBUTION` object will be created, listing the affected `VERSION` objects, and including its own audit object,"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit one CONTRIBUTION whose two members each create an event COMPOSITION.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions: [*creation_member, *creation_member]
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
          - context: $response.body
            type: jsonpath
            condition: '$.versions[1].id.value'

  - workflowId: commit_contribution-event_and_persistent
    summary: A CONTRIBUTION creating an event and a persistent COMPOSITION lists both versions
    description: >-
      Creates an EHR, then commits one CONTRIBUTION whose members create an
      event COMPOSITION and a persistent COMPOSITION. The commit is answered
      201, and the CONTRIBUTION lists a version for each member.
    dependsOn:
      - $sourceDescriptions.setup.upload_template-count_range
      - $sourceDescriptions.setup.upload_template-persistent_minimal
    x-veredictum-cite: *change_set
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit one CONTRIBUTION creating an event and a persistent COMPOSITION.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - *creation_member
              - &persistent_member
                lifecycle_state: *complete
                commit_audit: *creation_audit
                data: &persistent
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: Persistent minimal }
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.persistent_minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: persistent_minimal.en.v1 }
                    rm_version: "1.0.2"
                  archetype_node_id: openEHR-EHR-COMPOSITION.persistent_minimal.v1
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: UY
                  category:
                    _type: DV_CODED_TEXT
                    value: persistent
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "431"
                  composer:
                    _type: PARTY_IDENTIFIED
                    external_ref:
                      _type: PARTY_REF
                      id: { _type: HIER_OBJECT_ID, value: a3dce0d4-fa51-4ff2-9cce-93dd60437842 }
                      namespace: DEMOGRAPHIC
                      type: PERSON
                    name: Dr. Yamamoto
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: Minimal }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: Event Series }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,380+00:00" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: Cualquier evento }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,384+00:00" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: Arbol }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: text }
                                  archetype_node_id: at0004
                                  value: { _type: DV_TEXT, value: original value }
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: "1.0.2"
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
          - context: $response.body
            type: jsonpath
            condition: '$.versions[1].id.value'

  - workflowId: commit_contribution-two_persistent_compositions
    summary: A CONTRIBUTION creating two persistent COMPOSITIONs lists both versions
    description: >-
      Creates an EHR, then commits one CONTRIBUTION whose two members each
      create a persistent COMPOSITION. The commit is answered 201, and the
      CONTRIBUTION lists a version for each member.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *change_set
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit one CONTRIBUTION whose two members each create a persistent COMPOSITION.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions: [*persistent_member, *persistent_member]
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
          - context: $response.body
            type: jsonpath
            condition: '$.versions[1].id.value'

  - workflowId: commit_contribution-modification
    summary: A modifying member adds a version whose preceding version is the one it names
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating an event COMPOSITION,
      then commits a second CONTRIBUTION whose member modifies that
      COMPOSITION, naming the first version as preceding_version_uid. The
      second commit is answered 201, and the latest VERSION of the
      COMPOSITION's container names the first version as its preceding
      version and carries the change_type 251 modification.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &modification
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "_modification of existing item_: a new `ORIGINAL_VERSION` whose data contains the updated form of the item content is added to an existing `VERSIONED_OBJECT`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - &modify
        stepId: modify
        description: Commit a CONTRIBUTION whose member modifies the COMPOSITION, preceded by its first version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          replacements:
            - { target: /versions/0/preceding_version_uid/value, value: $steps.commit.outputs.version_uid }
          payload:
            versions:
              - lifecycle_state: *complete
                preceding_version_uid: { value: "" }
                commit_audit: &modification_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: modification
                    defining_code: { terminology_id: { value: openehr }, code_string: "251" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: *composition
            audit: *modification_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *contribution_created
      - &latest
        stepId: latest
        description: Retrieve the latest VERSION of the COMPOSITION's container.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^251$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Contributions
              quote: "if the change is logically a change, addition etc to the content, the `ORIGINAL_VERSION._commit_audit_._change_type_` is set to the code `251|modification|`;"

  - workflowId: commit_contribution-modification_persistent
    summary: A modifying member adds a version to a persistent COMPOSITION
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating a persistent
      COMPOSITION, then commits a second CONTRIBUTION whose member modifies
      it, naming the first version as preceding_version_uid. The second
      commit is answered 201, and the latest VERSION of the container names
      the first version as its preceding version.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *modification
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit a CONTRIBUTION creating a persistent COMPOSITION and keep its version_uid.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions: [*persistent_member]
