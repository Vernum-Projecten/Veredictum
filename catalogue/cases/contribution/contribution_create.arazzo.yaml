        outputs:
          version_uid: $response.body#/uid/value
      - stepId: commit
        description: Commit a CONTRIBUTION whose member modifies the FOLDER to the name archive.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          replacements:
