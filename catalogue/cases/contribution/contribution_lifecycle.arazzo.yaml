# The inactive and abandoned lifecycle states the development RM adds,
# committed as a CONTRIBUTION member that modifies a COMPOSITION, as Arazzo
# 1.1.0 workflows over the released ITS-REST `-validation` OAS. Every
# workflow rests on the pinned development snapshot of the RM, so the
# released profile skips it as development-only. Every criterion resolves to
# an `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: CONTRIBUTION lifecycle transitions
  version: 0.1.0
  x-veredictum-section: create
  description: >-
    A CONTRIBUTION member that moves a COMPOSITION into the inactive (800)
    or abandoned (801) lifecycle state of the development RM. The member is
    accepted, and the version it adds carries the state it was committed in
    and names the version before it as its preceding version.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: commit_contribution-lifecycle_deactivate
    summary: A member modifying a complete COMPOSITION into lifecycle_state 800 adds an inactive version
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating a complete event
      COMPOSITION, then commits a second CONTRIBUTION whose member modifies
      it with lifecycle_state 800 (inactive). The second commit is answered
      201, and the latest VERSION carries 800 and names the first version as
      its preceding version.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr-development/specifications-RM/docs/common/master06-change_control_package.adoc
      section: Abandoned and Inactive States
      quote: "An Original version may also be marked as being in the `inactive` state."
      level: may
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: commit
        description: Commit a CONTRIBUTION whose member creates a complete event COMPOSITION, keep its version_uid and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters: &commit_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state: &complete
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: &composition
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - &created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs: &commit_outputs
          version_uid: $response.body#/versions/0/id/value
        x-veredictum-derive: &commit_derive
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: deactivate
        description: Commit a CONTRIBUTION whose member modifies the COMPOSITION with lifecycle_state 800, preceded by its first version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/json
          replacements:
            - { target: /versions/0/preceding_version_uid/value, value: $steps.commit.outputs.version_uid }
          payload:
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: inactive
                  defining_code: { terminology_id: { value: openehr }, code_string: "800" }
                preceding_version_uid: { value: "" }
                commit_audit: &modification_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: modification
                    defining_code: { terminology_id: { value: openehr }, code_string: "251" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: *composition
            audit: *modification_audit
        successCriteria:
          - *created
      - stepId: latest
        description: Retrieve the latest VERSION of the COMPOSITION's container, its lifecycle_state and its preceding version.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: &latest_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &latest_version
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^800$'
          - &preceded_by_commit
            context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
            x-veredictum-cite:
              source: specs/openehr-development/specifications-RM/docs/common/master06-change_control_package.adoc
              section: Version Lifecycle
              quote: "One basic rule that must be observed with the use of states is that any transition requires the commit of a _new version_, even if the content is otherwise unchanged."

  - workflowId: commit_contribution-lifecycle_abandon
    summary: A member modifying an incomplete COMPOSITION into lifecycle_state 801 adds an abandoned version
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating an event
      COMPOSITION in the incomplete state (553), then commits a second
      CONTRIBUTION whose member modifies it with lifecycle_state 801
      (abandoned). The second commit is answered 201, and the latest VERSION
      carries 801 and names the first version as its preceding version.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr-development/specifications-RM/docs/common/master06-change_control_package.adoc
      section: Abandoned and Inactive States
      quote: "The version containing such an item may be transitioned to the `abandoned` state to represent this state of affairs."
      level: may
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Commit a CONTRIBUTION whose member creates an incomplete event COMPOSITION, keep its version_uid and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: incomplete
                  defining_code: { terminology_id: { value: openehr }, code_string: "553" }
                commit_audit: *creation_audit
                data: *composition
            audit: *creation_audit
        successCriteria:
          - *created
        outputs: *commit_outputs
        x-veredictum-derive: *commit_derive
      - stepId: abandon
        description: Commit a CONTRIBUTION whose member modifies the COMPOSITION with lifecycle_state 801, preceded by its first version.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters: *commit_parameters
        requestBody:
          contentType: application/json
          replacements:
            - { target: /versions/0/preceding_version_uid/value, value: $steps.commit.outputs.version_uid }
          payload:
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: abandoned
                  defining_code: { terminology_id: { value: openehr }, code_string: "801" }
                preceding_version_uid: { value: "" }
                commit_audit: *modification_audit
                data: *composition
            audit: *modification_audit
        successCriteria:
          - *created
      - stepId: latest
        description: Retrieve the latest VERSION of the COMPOSITION's container, its lifecycle_state and its preceding version.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^801$'
          - *preceded_by_commit
