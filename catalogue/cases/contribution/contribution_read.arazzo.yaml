# Reading a CONTRIBUTION by its uid: the committed CONTRIBUTION, the misses
# a read answers with 404, a malformed uid, and the headers of the answer,
# as Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS.
# Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: CONTRIBUTION read
  version: 0.1.0
  x-veredictum-section: read
  description: >-
    Reading a committed CONTRIBUTION in canonical JSON by the EHR's ehr_id
    and the contribution uid, with the misses of an unknown EHR or
    CONTRIBUTION and the headers the answer carries.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_contribution
    summary: A committed CONTRIBUTION is retrieved by its uid
    description: >-
      Creates an EHR and commits a CONTRIBUTION creating a COMPOSITION, then
      retrieves the CONTRIBUTION by the uid the commit answered with. The read
      is answered 200 with that CONTRIBUTION, which references the version
      the commit created.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &retrieved
      source: specs/openehr/ITS-REST/specifications/responses/200_CONTRIBUTION.yaml
      section: description
      quote: "`200 OK` is returned when the CONTRIBUTION is successfully retrieved."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Commit a CONTRIBUTION creating a COMPOSITION, and keep its uid and the version_uid it references.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data:
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs:
          contribution_uid: $response.body#/uid/value
          version_uid: $response.body#/versions/0/id/value
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &ok
            condition: $statusCode == 200
            x-veredictum-cite: *retrieved
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.commit.outputs.contribution_uid}$'
          - context: $response.body
            type: jsonpath
            condition: "$.versions[?@.id.value == '{$steps.commit.outputs.version_uid}']"
            x-veredictum-cite:
              source: specs/openehr/RM/docs/UML/classes/contribution.adoc
              section: CONTRIBUTION Class
              quote: "Set of references to Versions causing changes to this EHR."

  - workflowId: get_contribution-audit
    summary: A retrieved CONTRIBUTION carries the audit of its committal
    description: >-
      Creates an EHR and commits a CONTRIBUTION, then retrieves it by its uid.
      The CONTRIBUTION carries an audit with the change_type it was committed
      with and a time_committed.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/contribution.adoc
      section: CONTRIBUTION Class
      quote: "Audit trail corresponding to the committal of this Contribution."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *ok
          - context: $response.body#/audit/change_type/defining_code/code_string
            type: regex
            condition: '^249$'
          - condition: $response.body#/audit/time_committed/value != null

  - workflowId: get_contribution-unknown_contribution
    summary: A read of a contribution uid no CONTRIBUTION carries is answered 404
    description: >-
      Creates an EHR and commits a CONTRIBUTION, then retrieves a CONTRIBUTION
      by a freshly generated uid that no CONTRIBUTION carries. The read is
      answered 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &not_found
      source: specs/openehr/ITS-REST/specifications/responses/404_CONTRIBUTION.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a CONTRIBUTION with `contribution_uid` does not exist."
    inputs: &ehr_contribution_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        contribution_uid: { type: string, format: uuid }
    steps:
      - *create_ehr
      - *commit
      - &get_unknown
        stepId: get
        description: Retrieve a CONTRIBUTION by a uid no CONTRIBUTION carries.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $inputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_contribution-empty_ehr
    summary: A CONTRIBUTION read in an EHR with no CONTRIBUTION is answered 404
    description: >-
      Creates an EHR and commits nothing to it, then retrieves a CONTRIBUTION
      by a freshly generated uid. The read is answered 404 Not Found.
    x-veredictum-cite: *not_found
    inputs: *ehr_contribution_input
    steps:
      - *create_ehr
      - *get_unknown

  - workflowId: get_contribution-unknown_ehr
    summary: A CONTRIBUTION read under an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves a CONTRIBUTION by a freshly generated uid under a freshly
      generated ehr_id that no EHR carries. The read is answered 404 Not
      Found.
    x-veredictum-cite: *not_found
    inputs: *ehr_contribution_input
    steps:
      - *get_unknown

  - workflowId: get_contribution-other_ehr
    summary: A CONTRIBUTION read under another EHR is answered 404
    description: >-
      Creates an EHR and commits a CONTRIBUTION to it, creates a second EHR,
      then retrieves the CONTRIBUTION by its uid under the second EHR. The
      read addresses a CONTRIBUTION associated with the EHR the ehr_id
      names, and the second EHR has none with that uid, so the read is
      answered 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/contribution_get.yaml
      section: description
      quote: "Retrieves a CONTRIBUTION identified by `contribution_uid` and associated with the EHR identified by `ehr_id`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        other_ehr_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - *commit
      - stepId: create-other-ehr
        description: Create a second EHR.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.other_ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid under the second EHR.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.other_ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite: *not_found

  - workflowId: get_contribution-malformed_uid
    x-veredictum-control: get_contribution
    summary: A CONTRIBUTION read whose uid is not a well-formed identifier is refused with 400
    description: >-
      Creates an EHR, then retrieves a CONTRIBUTION by the path segment
      not-a-uid, which is not the uuid the contribution_uid parameter
      declares. The request URL is malformed, so the read is answered 400.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: get
        description: Retrieve a CONTRIBUTION by the malformed uid not-a-uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: not-a-uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: get_contribution-content_type
    summary: A CONTRIBUTION read carries Content-Type application/json
    description: >-
      Creates an EHR, commits a CONTRIBUTION and retrieves it in canonical
      JSON. The answer carries a body, so it carries Content-Type
      application/json.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *ok
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'

  - workflowId: get_contribution-no_location
    summary: A CONTRIBUTION read carries no Location header
    description: >-
      Creates an EHR, commits a CONTRIBUTION and retrieves it. A read is not
      a creation, so the answer carries no Location header.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Location
      quote: "It MUST NOT be used to indicate an alternate representation of an existing resource (e.g. via `GET` method)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *ok
          - condition: $response.header.Location == null

  - workflowId: get_contribution-etag_weak
    summary: An ETag sent on a CONTRIBUTION read carries the weakness indicator
    description: >-
      Creates an EHR, commits a CONTRIBUTION and retrieves it. If the answer
      sends an ETag, it is a weak entity tag.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Deprecated headers
      quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *ok
          - context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'

  - workflowId: get_contribution-etag_last_modified
    summary: A CONTRIBUTION read is answered with ETag and Last-Modified
    description: >-
      Creates an EHR, commits a CONTRIBUTION and retrieves it. A CONTRIBUTION
      has a unique state identifier, so the answer carries an ETag and a
      Last-Modified header. The headers are recommended, so a row that lacks
      them is a warning.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: ETag and Last-Modified
      quote: "Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers."
      level: should
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: get
        description: Retrieve the CONTRIBUTION by its uid.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *ok
          - condition: $response.header.ETag != null
          - condition: $response.header.Last-Modified != null
