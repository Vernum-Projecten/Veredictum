# The EHR-wide ITEM_TAG listing, unfiltered and filtered, as Arazzo 1.1.0
# workflows over the released ITS-REST `-validation` OAS. Every criterion
# resolves to an `x-veredictum-cite` (its own, else its step's, else its
# workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: EHR tags
  version: 0.1.0
  description: >-
    The listing of every ITEM_TAG whose target is within one EHR: the tags of
    COMPOSITION and EHR_STATUS versions, the listing's reach limited to its
    EHR, its three filters, and its refusals.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: ehr_tags_get-empty
    summary: An EHR no tag was written to has an empty tag listing
    description: >-
      Creates an EHR, then retrieves its tag listing. No tag is associated
      with any target within it, so the answer is 200 with an empty list.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_tags_get.yaml
      section: description
      quote: "This will return an empty list when there is no matching ITEM_TAG associated with any target within given EHR."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id and the default EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &ehr_created
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: list
        description: Retrieve the EHR's tag listing.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &list_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_ItemTagList_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested ITEM_TAG list is successfully retrieved."
          - condition: $response.body#/0 == null

  - workflowId: ehr_tags_get-content_type
    summary: An EHR tag listing is answered as JSON
    description: >-
      Creates an EHR and retrieves its tag listing with Accept
      application/json. The answer carries Content-Type application/json.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: *ehr_input
    steps:
      - *create
      - stepId: list
        description: Retrieve the EHR's tag listing as JSON.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'

  - workflowId: ehr_tags_get-ehr_wide_listing
    summary: The EHR tag listing holds the tags of every target within the EHR
    description: >-
      Commits a COMPOSITION to an EHR, tags the COMPOSITION version with
      ward=a3 and the EHR_STATUS version with status=reviewed, then
      retrieves the EHR's tag listing without a filter. It holds both tags
      and nothing else.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &listing
      source: specs/openehr/ITS-REST/specifications/operations/ehr_tags_get.yaml
      section: description
      quote: "Retrieves the list of ITEM_TAG resources associated with any target VERSION or VERSIONED_OBJECT within the EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - stepId: commit
        description: Commit a COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: content observation }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: 1.0.2
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: history }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: any event }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: tree }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: value }
                            archetype_node_id: at0004
                            value: { _type: DV_COUNT, magnitude: 15 }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^2[0-9][0-9]$'
            x-veredictum-cite: &success_status
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: tag-composition
        description: Tag the COMPOSITION version with ward=a3.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: ward, value: a3 }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: &updated_minimal
              source: specs/openehr/ITS-REST/specifications/responses/204_updated.yaml
              section: description
              quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
      - &current
        stepId: current
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: tag-status
        description: Tag the EHR_STATUS version with status=reviewed.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: status, value: reviewed }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: list
        description: Retrieve the EHR's tag listing without a filter.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'ward' && @.value == 'a3' ]"
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'status' && @.value == 'reviewed' ]"
          - condition: $response.body#/2 == null

  - workflowId: ehr_tags_get-other_ehr
    summary: The EHR tag listing leaves out the tags of another EHR
    description: >-
      Tags the EHR_STATUS version of one EHR, then retrieves the tag listing
      of a second EHR. The listing reaches only targets within the EHR it
      names, so the second EHR's listing is empty.
    x-veredictum-cite: *listing
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        other_ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - stepId: tag-status
        description: Tag the first EHR's EHR_STATUS version with status=reviewed.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: status, value: reviewed }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: create-other
        description: Create a second EHR.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.other_ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *ehr_created
      - stepId: list
        description: Retrieve the second EHR's tag listing.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.other_ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - condition: $response.body#/0 == null

  - workflowId: ehr_tags_get-filter_key
    summary: The EHR tag listing filtered by tag_key leaves out a tag of another key
    description: >-
      Tags the EHR_STATUS version of an EHR with ward=a3 and bed=b7 on
      different target_paths, then retrieves the listing filtered by
      tag_key=ward. It holds the ward tag and not the bed tag.
    x-veredictum-cite: &filtered
      source: specs/openehr/ITS-REST/specifications/operations/ehr_tags_get.yaml
      section: description
      quote: "This list can be filtered by the given one or more `tag_key`, `tag_value`, `tag_target_path` query parameters."
      level: may
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - &tag_ward_bed
        stepId: tag-status
        description: Tag the EHR_STATUS version with ward=a3 on /subject and bed=b7 on /is_queryable.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: ward, value: a3, target_path: /subject }
            - { key: bed, value: b7, target_path: /is_queryable }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: list
        description: Retrieve the EHR's tag listing filtered by tag_key=ward.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: tag_key, in: query, value: ward }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - &ward_alone
            context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'ward']"
          - &one_tag
            condition: $response.body#/1 == null

  - workflowId: ehr_tags_get-filter_value
    summary: The EHR tag listing filtered by tag_value leaves out a tag of another value
    description: >-
      Tags the EHR_STATUS version of an EHR with ward=a3 and bed=b7 on
      different target_paths, then retrieves the listing filtered by
      tag_value=a3. It holds the ward tag and not the bed tag.
    x-veredictum-cite: *filtered
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - *tag_ward_bed
      - stepId: list
        description: Retrieve the EHR's tag listing filtered by tag_value=a3.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: tag_value, in: query, value: a3 }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - *ward_alone
          - *one_tag

  - workflowId: ehr_tags_get-filter_target_path
    summary: The EHR tag listing filtered by tag_target_path leaves out a tag on another path
    description: >-
      Tags the EHR_STATUS version of an EHR with ward=a3 and bed=b7 on
      different target_paths, then retrieves the listing filtered by
      tag_target_path=/subject. It holds the ward tag and not the bed tag.
    x-veredictum-cite: *filtered
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - *tag_ward_bed
      - stepId: list
        description: Retrieve the EHR's tag listing filtered by tag_target_path=/subject.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: tag_target_path, in: query, value: /subject }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - *ward_alone
          - *one_tag

  - workflowId: ehr_tags_get-unknown_ehr
    summary: The tag listing of an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves the tag listing of a freshly generated ehr_id that no EHR
      carries. The read is answered with 404 Not Found.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
    inputs: *ehr_input
    steps:
      - stepId: list
        description: Retrieve the tag listing of an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: ehr_tags_get-malformed_ehr_id
    x-veredictum-control: ehr_tags_get-empty
    summary: A tag listing whose ehr_id segment is not a well-formed identifier is refused as a client error
    description: >-
      Retrieves the tag listing of an ehr_id path segment that is no
      identifier of any UID form. The released parameter is a UUID, so the
      request is a client error and is answered 400 Bad Request, never as a
      miss.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/parameters/path/ehr_id.yaml
      section: /schema/format
      quote: "uuid"
    steps:
      - stepId: list
        description: Retrieve the tag listing of a malformed ehr_id path segment.
        operationId: $sourceDescriptions.ehr.ehr_tags_get
        parameters:
          - { name: ehr_id, in: path, value: "not!a-hier-object-id" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
