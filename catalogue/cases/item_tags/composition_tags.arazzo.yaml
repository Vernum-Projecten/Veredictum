# The ITEM_TAG list of a COMPOSITION version, read, replaced and deleted by
# key, and of its VERSIONED_COMPOSITION container, as Arazzo 1.1.0 workflows
# over the released ITS-REST `-validation` OAS. A step derives the
# container's versioned_object_uid from the version_uid a create answers
# with. Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION tags
  version: 0.1.0
  description: >-
    The ITEM_TAG list associated with a COMPOSITION version, addressed by its
    version_uid: reading it, replacing it, deleting by key, the identity of a
    tag, the representation preferences of the update, and the misses those
    calls answer with 404. And the list of the VERSIONED_COMPOSITION
    container, addressed by its versioned_object_uid: the target a container
    tag names, the version and container lists kept apart, and a new version
    that moves no tag.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: composition_tags_get-empty
    summary: A COMPOSITION version no tag was written to has an empty tag list
    description: >-
      Creates an EHR and commits a COMPOSITION, then retrieves the tags of
      the version the commit created. Nothing has been associated with it,
      so the answer is 200 with an empty list.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &empty_list
      source: specs/openehr/ITS-REST/specifications/operations/composition_tags_get.yaml
      section: description
      quote: "This will return an empty list when there is no ITEM_TAG associated with the given target."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Commit a COMPOSITION and keep the version_uid the identifier preference answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &composition
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: content observation }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: 1.0.2
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: history }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: any event }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: tree }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: value }
                            archetype_node_id: at0004
                            value: { _type: DV_COUNT, magnitude: 15 }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^2[0-9][0-9]$'
            x-veredictum-cite: &success_status
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
          - condition: $statusCode == 201
            x-veredictum-cite: &identifier_should
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: Prefer only identifier
              quote: "The response body SHOULD contain only the identifier of the affected resource formatted according to the `Accept` request header."
              level: should
              report: 673
          - condition: $response.body#/uid != null
            x-veredictum-cite: *identifier_should
        outputs:
          version_uid: $response.body#/uid
      - &get_tags
        stepId: get
        description: Retrieve the tags of the committed version.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &list_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_ItemTagList_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested ITEM_TAG list is successfully retrieved."
          - &list_empty
            condition: $response.body#/0 == null

  - workflowId: composition_tags_get-content_type
    summary: A COMPOSITION tag list is answered as JSON
    description: >-
      Creates an EHR, commits a COMPOSITION and retrieves the tags of its
      version with Accept application/json. The answer carries Content-Type
      application/json.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &json_content_type
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the tags of the committed version as JSON.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'

  - workflowId: composition_tags_update-stores_tags
    summary: The tags a COMPOSITION version's tag list is updated with are read back
    description: >-
      Creates an EHR, commits a COMPOSITION, then updates the tag list of the
      version with two tags and no Prefer header. The update answers 204, and
      the list read back holds exactly the two tags, each with its value.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &update_list
      source: specs/openehr/ITS-REST/specifications/operations/composition_tags_update.yaml
      section: description
      quote: "Updates the list of all ITEM_TAG resources associated with a given target COMPOSITION version or VERSIONED_COMPOSITION identified by `uid_based_id` and owned by EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - &tag_alpha_beta
        stepId: tag
        description: Update the version's tag list with the tags alpha and beta, sending no Prefer header.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
            - { key: beta, value: b }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: &updated_minimal
              source: specs/openehr/ITS-REST/specifications/responses/204_updated.yaml
              section: description
              quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'beta' && @.value == 'b']"
          - condition: $response.body#/2 == null

  - workflowId: composition_tags_update-replaces_list
    summary: An update replaces the whole tag list of a COMPOSITION version
    description: >-
      Tags a COMPOSITION version with alpha and beta, then updates its tag
      list with gamma alone. The list read back holds gamma only: the update
      replaced the list, it did not add to it.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP Methods
      quote: "Replace all current representations of the target resource with the request payload."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *tag_alpha_beta
      - stepId: replace
        description: Update the version's tag list with the tag gamma alone.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: gamma, value: c }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'gamma']"
          - condition: $response.body#/1 == null

  - workflowId: composition_tags_update-empty_list
    summary: An update with an empty list removes every tag of a COMPOSITION version
    description: >-
      Tags a COMPOSITION version with alpha and beta, then updates its tag
      list with an empty list. The list read back is empty.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/composition_tags_update.yaml
      section: description
      quote: "Providing an empty list will effectively remove all ITEM_TAG associated with the given target."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *tag_alpha_beta
      - stepId: clear
        description: Update the version's tag list with an empty list.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload: []
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - *list_empty

  - workflowId: composition_tags_update-key_target_path_identity
    summary: Two tags with one key and different target_paths are two tags
    description: >-
      Updates the tag list of a COMPOSITION version with two tags that share
      the key flag and differ in target_path. A tag is identified by its key
      and target_path together, so both are stored and both are read back.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &identity
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-item-tag and openehr-version-item-tag
      quote: "More than one ITEM_TAG may be associated with a single target, in which case they are uniquely identified by their `key` and `target_path` pair attributes."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: tag
        description: Update the version's tag list with two flag tags on different target_paths.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: flag, value: start, target_path: /context/start_time/value }
            - { key: flag, value: setting, target_path: /context/setting/value }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'flag' && @.target_path == '/context/start_time/value']"
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'flag' && @.target_path == '/context/setting/value']"
          - condition: $response.body#/2 == null

  - workflowId: composition_tags_update-duplicate_identity
    summary: A tag list that names one key and target_path twice stores one tag at most
    description: >-
      Updates the tag list of a COMPOSITION version with two tags that share
      both the key alpha and the absent target_path. A key and target_path
      pair identifies one tag, so whatever the update answers, the list read
      back holds at most one tag. Which of the two values is kept is not
      judged: no released sentence assigns it.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *identity
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: tag
        description: Update the version's tag list with the tag alpha twice.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: first }
            - { key: alpha, value: last }
        successCriteria:
          - condition: $statusCode != null
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - condition: $response.body#/1 == null

  - workflowId: composition_tags_update-return_minimal
    summary: An update with Prefer return=minimal answers 204
    description: >-
      Updates the tag list of a COMPOSITION version with Prefer
      return=minimal. The update answers 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *updated_minimal
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: tag
        description: Update the version's tag list with Prefer return=minimal.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - condition: $statusCode == 204

  - workflowId: composition_tags_update-return_representation
    summary: An update with Prefer return=representation answers with the stored tag list
    description: >-
      Updates the tag list of a COMPOSITION version with Prefer
      return=representation. The answer is 200 in JSON with the list the
      update stored. The released text recommends the representation, so the
      row is advisory.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &representation
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer minimal, identifier or full representation response
      quote: "The response MAY include a `Location` header, and the response body SHOULD contain the full representation of the resource."
      level: should
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: tag
        description: Update the version's tag list with Prefer return=representation.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"

  - workflowId: composition_tags_update-return_identifier
    summary: An update with Prefer return=identifier is not answered 204
    description: >-
      Updates the tag list of a COMPOSITION version with Prefer
      return=identifier. The identifier preference implies a non-empty body,
      so the answer is 200 or 201 rather than 204, and the tag is stored. The
      released text recommends the identifier body only, so the status
      criterion is advisory.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *identifier_should
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: tag
        description: Update the version's tag list with Prefer return=identifier.
        operationId: $sourceDescriptions.ehr.composition_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^2[0-9][0-9]$'
            x-veredictum-cite: *success_status
          - context: $statusCode
            type: regex
            condition: '^(200|201)$'
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"
            x-veredictum-cite: *update_list

  - workflowId: composition_tags_get-version_target_shape
    summary: A tag of a COMPOSITION version names the version as its target and the EHR as its owner
    description: >-
      Tags a COMPOSITION version, then reads the tags back. The released
      ITEM_TAG schema types target as an OBJECT_REF whose id is a
      UID_BASED_ID, so the target's id carries the version_uid the version
      was addressed by. Its owner_id names the EHR the route addresses.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &tag_target
      source: specs/openehr/ITS-REST/specifications/schemas/common/ItemTag.yaml
      section: /properties/target/$ref
      quote: "../base_types/UObjectRefOfUidBasedId.yaml"
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *tag_alpha_beta
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body#/0/target/id/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
          - context: $response.body#/0/owner_id/id/value
            type: regex
            condition: '^{$inputs.ehr_id}$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/composition_tags_get.yaml
              section: description
              quote: "Retrieves the list of all ITEM_TAG resources associated with a given target COMPOSITION version or VERSIONED_COMPOSITION identified by `uid_based_id` and owned by EHR identified by `ehr_id`."

  - workflowId: composition_tags_get-unknown_uid
    summary: A tag read of a uid_based_id nothing carries is answered 404
    description: >-
      Creates an EHR, then retrieves the COMPOSITION tags of a freshly
      generated uid_based_id inside it. That uid_based_id does not exist, so
      the read is answered with 404 Not Found.
    x-veredictum-cite: &unknown_uid
