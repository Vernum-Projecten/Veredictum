  - workflowId: composition_tags_get-container_target_shape
    summary: A tag of the VERSIONED_COMPOSITION names the container as its target and the EHR as its owner
    description: >-
      Commits a COMPOSITION, derives the versioned_object_uid of its
      container from the version_uid the commit answers with, tags the
      container by that uid, then reads the container's tags back. The tag's
      target is an OBJECT_REF whose id carries the container's uid, and its
