  - workflowId: composition_tags_delete-key_scoped
    summary: A tag delete removes the tags of the addressed key only
    description: >-
      Tags a COMPOSITION version with alpha and beta, then deletes the key
      alpha. The delete answers 204, and the list read back holds beta only.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &delete_by_key
      source: specs/openehr/ITS-REST/specifications/operations/composition_tags_delete.yaml
      section: description
      quote: "Deletes the ITEM_TAG resource(s) identified by `tag_key`, associated with a given target COMPOSITION version or VERSIONED_COMPOSITION identified by `uid_based_id` and owned by EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *tag_alpha_beta
      - &delete_alpha
        stepId: delete
        description: Delete the key alpha from the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: key, in: path, value: alpha }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_deleted.yaml
              section: description
              quote: "`204 No Content` is returned when the resource identified by the request parameters has been (logically) deleted."
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.composition_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'beta']"
          - condition: $response.body#/1 == null

