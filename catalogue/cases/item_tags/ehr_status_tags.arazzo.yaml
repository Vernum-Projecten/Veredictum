# The ITEM_TAG lists of an EHR_STATUS version and of its VERSIONED_EHR_STATUS
# container, read, replaced and deleted by key, as Arazzo 1.1.0 workflows
# over the released ITS-REST `-validation` OAS. Every criterion resolves to
# an `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: EHR_STATUS tags
  version: 0.1.0
  x-veredictum-section: ehr-status-tags
  description: >-
    The ITEM_TAG lists of an EHR_STATUS version, addressed by its
    version_uid, and of the VERSIONED_EHR_STATUS container, addressed by its
    uid: reading, replacing and deleting them, the target each tag names,
    the two lists kept apart, a new EHR_STATUS version that carries none of
    them, and the refusals of those calls.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: ehr_status_tags_get-empty
    summary: An EHR_STATUS version no tag was written to has an empty tag list
    description: >-
      Creates an EHR, learns the version_uid of its EHR_STATUS, then
      retrieves the tags of that version. Nothing has been associated with
      it, so the answer is 200 with an empty list.
    x-veredictum-cite: &empty_list
      source: specs/openehr/ITS-REST/specifications/operations/ehr_status_tags_get.yaml
      section: description
      quote: "This will return an empty list when there is no ITEM_TAG associated with the given target."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id and the default EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &current
        stepId: current
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &latest_version
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the tags of the EHR_STATUS version.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &list_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR_STATUS_ItemTagList_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested ITEM_TAG list is successfully retrieved."
          - &list_empty
            condition: $response.body#/0 == null

  - workflowId: ehr_status_tags_get-content_type
    summary: An EHR_STATUS tag list is answered as JSON
    description: >-
      Creates an EHR and retrieves the tags of its EHR_STATUS version with
      Accept application/json. The answer carries Content-Type
      application/json.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: get
        description: Retrieve the tags of the EHR_STATUS version as JSON.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'

  - workflowId: ehr_status_tags_update-stores_tags
    summary: The tags an EHR_STATUS version's tag list is updated with are read back
    description: >-
      Creates an EHR, then updates the tag list of its EHR_STATUS version
      with two tags and no Prefer header. The update answers 204, and the
      list read back holds exactly the two tags.
    x-veredictum-cite: &update_list
      source: specs/openehr/ITS-REST/specifications/operations/ehr_status_tags_update.yaml
      section: description
      quote: "Updates the list of all ITEM_TAG resources associated with a given target EHR_STATUS version or VERSIONED_EHR_STATUS identified by `uid_based_id` and owned by EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - &tag_alpha_beta
        stepId: tag
        description: Update the version's tag list with the tags alpha and beta, sending no Prefer header.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
            - { key: beta, value: b }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: &updated_minimal
              source: specs/openehr/ITS-REST/specifications/responses/204_updated.yaml
              section: description
              quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'beta' && @.value == 'b']"
          - condition: $response.body#/2 == null

  - workflowId: ehr_status_tags_update-key_target_path_identity
    summary: Two EHR_STATUS tags with one key and different target_paths are two tags
    description: >-
      Updates the tag list of an EHR_STATUS version with two tags that share
      the key flag and differ in target_path. A tag is identified by its key
      and target_path together, so both are stored and both are read back.
    x-veredictum-cite: &identity
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-item-tag and openehr-version-item-tag
      quote: "More than one ITEM_TAG may be associated with a single target, in which case they are uniquely identified by their `key` and `target_path` pair attributes."
      level: may
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag
        description: Update the version's tag list with two flag tags on different target_paths.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload:
            - { key: flag, value: on-subject, target_path: /subject }
            - { key: flag, value: on-queryable, target_path: /is_queryable }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: *updated_minimal
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'flag' && @.target_path == '/subject']"
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'flag' && @.target_path == '/is_queryable']"
          - condition: $response.body#/2 == null

  - workflowId: ehr_status_tags_update-return_minimal
    summary: An EHR_STATUS tag update with Prefer return=minimal answers 204
    description: >-
      Updates the tag list of an EHR_STATUS version with Prefer
      return=minimal. The update answers 204 No Content.
    x-veredictum-cite: *updated_minimal
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag
        description: Update the version's tag list with Prefer return=minimal.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - condition: $statusCode == 204

  - workflowId: ehr_status_tags_update-return_representation
    summary: An EHR_STATUS tag update with Prefer return=representation answers with the stored list
    description: >-
      Updates the tag list of an EHR_STATUS version with Prefer
      return=representation. The answer is 200 in JSON with the list the
      update stored. The released text recommends the representation, so the
      row is a warning.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer minimal, identifier or full representation response
      quote: "The response MAY include a `Location` header, and the response body SHOULD contain the full representation of the resource."
      level: should
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag
        description: Update the version's tag list with Prefer return=representation.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"

  - workflowId: ehr_status_tags_update-return_identifier
    summary: An EHR_STATUS tag update with Prefer return=identifier is not answered 204
    description: >-
      Updates the tag list of an EHR_STATUS version with Prefer
      return=identifier. The identifier preference implies a non-empty body,
      so the answer is 200 or 201 rather than 204, and the tag is stored. The
      released text recommends the identifier body only, so the status
      criterion yields a warning.
    x-veredictum-cite: &identifier_should
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer only identifier
      quote: "The response body SHOULD contain only the identifier of the affected resource formatted according to the `Accept` request header."
      level: should
      report: 673
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag
        description: Update the version's tag list with Prefer return=identifier.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^2[0-9][0-9]$'
            x-veredictum-cite: &success_status
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
          - context: $statusCode
            type: regex
            condition: '^(200|201)$'
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'alpha' && @.value == 'a']"
            x-veredictum-cite: *update_list

  - workflowId: ehr_status_tags_update-non_array_body
    x-veredictum-control: ehr_status_tags_update-stores_tags
    summary: An EHR_STATUS tag update whose body is not an array is answered 400
    description: >-
      Updates the tag list of an EHR_STATUS version with a JSON object where
      the operation's request body is an array of UPDATE_ITEM_TAG. The
      content is syntactically invalid, so the update is answered 400 Bad
      Request, and the list read back is still empty.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag-invalid
        description: Update the version's tag list with an object instead of an array.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/json
          payload: { key: not-an-array }
        successCriteria:
          - condition: $statusCode == 400
      - stepId: get
        description: Retrieve the version's tags; the refused update stored nothing.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - *list_empty

  - workflowId: ehr_status_tags_get-xml_not_acceptable
    summary: An EHR_STATUS tag list asked for as XML is answered 406
    description: >-
      Retrieves the tags of an EHR_STATUS version with Accept application/xml.
      Canonical XML responses must conform to the published XSDs, and no
      published XSD declares ITEM_TAG, so no conformant XML tag list exists
      and the service cannot fulfill the request and answers 406 Not
      Acceptable.
    x-veredictum-cite: &not_acceptable
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: get
        description: Retrieve the version's tags as XML.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: ehr_status_tags_update-xml_not_acceptable
    summary: An EHR_STATUS tag update asking for its representation as XML is answered 406
    description: >-
      Updates the tag list of an EHR_STATUS version with Prefer
      return=representation and Accept application/xml. No published XSD
      declares ITEM_TAG, so no conformant XML tag list exists and the service
      cannot answer with the representation in XML and answers 406 Not
      Acceptable.
    x-veredictum-cite: *not_acceptable
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag
        description: Update the version's tag list asking for the representation as XML.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/xml }
        requestBody:
          contentType: application/json
          payload:
            - { key: alpha, value: a }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: ehr_status_tags_update-xml_unsupported_media
    summary: An EHR_STATUS tag list sent as XML is answered 415 and stores nothing
    description: >-
      Updates the tag list of an EHR_STATUS version with a body sent as
      application/xml. Canonical XML payloads must conform to the published
      XSDs, and no published XSD declares ITEM_TAG, so no conformant XML tag
      list exists and the service cannot process the payload as XML: it
      answers 415 Unsupported Media Type, and the list read back is still
      empty.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: tag-xml
        description: Update the version's tag list with an XML body.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="utf-8"?>
            <items><item><key>alpha</key><value>a</value></item></items>
        successCriteria:
          - condition: $statusCode == 415
      - stepId: get
        description: Retrieve the version's tags; the refused update stored nothing.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - *list_empty

  - workflowId: ehr_status_tags_delete-key_scoped
    summary: An EHR_STATUS tag delete removes the tags of the addressed key only
    description: >-
      Tags an EHR_STATUS version with alpha and beta, then deletes the key
      alpha. The delete answers 204, and the list read back holds beta only.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_status_tags_delete.yaml
      section: description
      quote: "Deletes the ITEM_TAG resource(s) identified by `tag_key`, associated with a given target EHR_STATUS version or VERSIONED_EHR_STATUS identified by `uid_based_id` and owned by EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - *tag_alpha_beta
      - stepId: delete
        description: Delete the key alpha from the version's tags.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: key, in: path, value: alpha }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: &deleted
              source: specs/openehr/ITS-REST/specifications/responses/204_deleted.yaml
              section: description
              quote: "`204 No Content` is returned when the resource identified by the request parameters has been (logically) deleted."
      - stepId: get
        description: Retrieve the version's tags.
        operationId: $sourceDescriptions.ehr.ehr_status_tags_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *list_retrieved
          - context: $response.body
            type: jsonpath
            condition: "$[?@.key == 'beta']"
          - condition: $response.body#/1 == null

  - workflowId: ehr_status_tags_get-composition_uid
    summary: A COMPOSITION version_uid on the EHR_STATUS tag read is answered 404
    description: >-
      Commits a COMPOSITION to an EHR, then retrieves EHR_STATUS tags by the
      COMPOSITION's version_uid. That uid names no EHR_STATUS version or
      VERSIONED_EHR_STATUS, so the read is answered with 404 Not Found, and
      the COMPOSITION's own tag read still answers with its empty list.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &unknown_uid
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_uid_based_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `uid_based_id` does not exist."
    inputs: *ehr_input
    steps:
      - *create
      - &commit
        stepId: commit
        description: Commit a COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
