# The demographic CONTRIBUTION commit and read asked for with Accept
# application/xml: the refused arm of the `demographic-contribution-xml-read`
# option, whose served arm is
# `demographic_contribution_read_xml.arazzo.yaml`. The commit body is canonical
# JSON, so each workflow judges the Accept negotiation alone. Every criterion
# resolves to an `x-veredictum-cite` (its own, else its step's, else its
# workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: Demographic CONTRIBUTION in canonical XML, refused
  version: 0.1.0
  description: >-
    A demographic CONTRIBUTION commit that asks for the full representation,
    and a read of the CONTRIBUTION, both with Accept application/xml, from a
    service that does not serve canonical XML.
sourceDescriptions:
  - name: demographic
    url: ../../../specs/rest-oas/demographic-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: commit_demographic_contribution-accept_xml
    summary: A demographic CONTRIBUTION commit that asks for canonical XML is refused with 406
    description: >-
      Commits a demographic CONTRIBUTION whose one member creates a PERSON,
      sent as canonical JSON with Prefer return=representation and Accept
      application/xml. A service that does not serve the format answers 406
      Not Acceptable.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    steps:
      - stepId: commit
        description: Commit the CONTRIBUTION and ask for its full representation in canonical XML.
        operationId: $sourceDescriptions.demographic.contribution_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/xml }
        requestBody:
          contentType: application/json
          payload: &contribution
            versions:
              - lifecycle_state:
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit:
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data:
                  _type: PERSON
                  name: { _type: DV_TEXT, value: person v1 }
                  archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.person.v1
                  archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-PERSON.person.v1 }, rm_version: "1.1.0" }
                  identities:
                    - _type: PARTY_IDENTITY
                      name: { _type: DV_TEXT, value: legal identity }
                      archetype_node_id: at0001
                      details:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: identity }
                        archetype_node_id: at0002
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: name }
                            archetype_node_id: at0003
                            value: { _type: DV_TEXT, value: Person Contributed }
            audit:
              _type: UPDATE_AUDIT
              change_type:
                _type: DV_CODED_TEXT
                value: creation
                defining_code: { terminology_id: { value: openehr }, code_string: "249" }
              committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_demographic_contribution-accept_xml
    summary: A demographic CONTRIBUTION read that asks for canonical XML is refused with 406
    description: >-
      Commits a demographic CONTRIBUTION in canonical JSON, then retrieves it
      by its uid with Accept application/xml. A service that does not serve
      the format answers 406 Not Acceptable.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    steps:
      - stepId: commit
        description: Commit the CONTRIBUTION in canonical JSON and keep its uid.
        operationId: $sourceDescriptions.demographic.contribution_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *contribution
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_demographic_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs:
          contribution_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the CONTRIBUTION in canonical XML.
        operationId: $sourceDescriptions.demographic.contribution_get
        parameters:
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - condition: $statusCode == 406
