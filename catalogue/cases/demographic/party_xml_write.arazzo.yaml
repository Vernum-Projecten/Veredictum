# Each PARTY kind written in canonical XML, for a service that processes XML
# request payloads on them: the accepting arm of the `party-xml-write` option,
# whose refused arm is `party_xml_write_refused` and `party_xml_create_refused`.
# Every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Party writes in canonical XML
  version: 0.1.0
  description: >-
    Creating and updating each PARTY kind with a body sent as canonical XML,
    then reading the PARTY back as JSON. No published document schema reaches
    the PARTY types (upstream report #759): the one global element of a type a
    PARTY extends is `items` (LOCATABLE) in the ITS-XML documents/Structure.xsd,
    and the PARTY types are in Demographic.xsd, which only the 2.0.0 lineage
    publishes. Each body is therefore an `items` element typed with xsi:type
    in the namespace of that lineage, and each workflow rests on report #759.
sourceDescriptions:
  - name: demographic
    url: ../../../specs/rest-oas/demographic-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: create_person-xml
    summary: A PERSON sent as canonical XML is created and reads back as sent
    description: >-
      Creates a PERSON from a canonical XML body, asking for the
      full representation as JSON, then reads the PERSON back as JSON. It
      holds the name and the identity value the XML body carried.
    x-veredictum-cite: &xml_conforms
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "When resources are serialized in **canonical XML** format, both request payloads and responses MUST conform to the [published XSDs](https://specifications.openehr.org/releases/ITS-XML/latest)."
      report: 759
    steps:
      - stepId: create
        description: Create the PERSON from canonical XML and keep the version_uid of the representation.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <items xmlns="http://schemas.openehr.org/v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="PERSON" archetype_node_id="openEHR-DEMOGRAPHIC-PERSON.person.v1"><name><value>person v1</value></name><archetype_details><archetype_id><value>openEHR-DEMOGRAPHIC-PERSON.person.v1</value></archetype_id><rm_version>1.1.0</rm_version></archetype_details><identities archetype_node_id="at0001"><name><value>legal identity</value></name><details xsi:type="ITEM_TREE" archetype_node_id="at0002"><name><value>identity</value></name><items xsi:type="ELEMENT" archetype_node_id="at0003"><name><value>name</value></name><value xsi:type="DV_TEXT"><value>Person One</value></value></items></details></identities></items>
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_PERSON.yaml
              section: description
              quote: "`201 Created` is returned when the PERSON is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: get
        description: Retrieve the PERSON as JSON.
        operationId: $sourceDescriptions.demographic.person_get
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_PERSON_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested PERSON is successfully retrieved."
          - context: $response.body#/name/value
            type: regex
            condition: '^person v1$'
          - context: $response.body#/identities/0/details/items/0/value/value
            type: regex
            condition: '^Person One$'

  - workflowId: update_person-xml
    summary: A PERSON updated from canonical XML reads back as sent
    description: >-
      Creates a PERSON in canonical JSON, then updates it with a
      canonical XML body that renames it, and reads the PERSON back as JSON.
      The latest version carries the name the XML body carried.
    x-veredictum-cite: *xml_conforms
    steps:
      - stepId: create
        description: Create the PERSON in canonical JSON and keep its version_uid.
