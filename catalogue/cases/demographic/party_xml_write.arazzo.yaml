          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update the PERSON from canonical XML and ask for the minimal response.
        operationId: $sourceDescriptions.demographic.person_update
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.create.outputs.version_uid}"' }
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <items xmlns="http://schemas.openehr.org/v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="PERSON" archetype_node_id="openEHR-DEMOGRAPHIC-PERSON.person.v1"><name><value>person v2</value></name><archetype_details><archetype_id><value>openEHR-DEMOGRAPHIC-PERSON.person.v1</value></archetype_id><rm_version>1.1.0</rm_version></archetype_details><identities archetype_node_id="at0001"><name><value>legal identity</value></name><details xsi:type="ITEM_TREE" archetype_node_id="at0002"><name><value>identity</value></name><items xsi:type="ELEMENT" archetype_node_id="at0003"><name><value>name</value></name><value xsi:type="DV_TEXT"><value>Person One</value></value></items></details></identities></items>
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite: &minimal_updated
              source: specs/openehr/ITS-REST/specifications/responses/204_version_updated.yaml
              section: description
              quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
      - stepId: get
        description: Retrieve the latest PERSON as JSON.
        operationId: $sourceDescriptions.demographic.person_get
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_PERSON_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested PERSON is successfully retrieved."
          - context: $response.body#/name/value
            type: regex
            condition: '^person v2$'

