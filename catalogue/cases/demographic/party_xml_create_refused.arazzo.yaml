# The PARTY creates written in canonical XML, for a service that does not
# process XML request payloads on them: the workflows of the refused arm of
# the `party-xml-write` option that send no canonical JSON. Every quote is
# copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Party creates in canonical XML refused
  version: 0.1.0
  description: >-
    Creating each PARTY kind that needs no other party with a body labelled
    Content-Type application/xml at a service that cannot process the
    payload as XML. No published XSD declares a document element for a
    PARTY, so the payload names its root element after the RM class.
sourceDescriptions:
  - name: demographic
    url: ../../../specs/rest-oas/demographic-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: create_person-xml_refused
    summary: A PERSON create in XML is refused with 415
    description: >-
      Creates a PERSON with a body labelled Content-Type application/xml
      at a service that cannot process the payload as XML. The create is
      answered 415 Unsupported Media Type.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
    steps:
      - stepId: create
        description: Create the PERSON labelled Content-Type application/xml.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <person xmlns="http://schemas.openehr.org/v1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" archetype_node_id="openEHR-DEMOGRAPHIC-PERSON.person.v1"><name><value>person v1</value></name><archetype_details><archetype_id><value>openEHR-DEMOGRAPHIC-PERSON.person.v1</value></archetype_id><rm_version>1.1.0</rm_version></archetype_details><identities archetype_node_id="at0001"><name><value>legal identity</value></name><details xsi:type="ITEM_TREE" archetype_node_id="at0002"><name><value>identity</value></name><items xsi:type="ELEMENT" archetype_node_id="at0003"><name><value>name</value></name><value xsi:type="DV_TEXT"><value>Person One</value></value></items></details></identities></person>
        successCriteria:
          - condition: $statusCode == 415

