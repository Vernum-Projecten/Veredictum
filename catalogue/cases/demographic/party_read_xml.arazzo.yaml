# Each PARTY kind read in canonical XML: the served arm of the `party-xml-
# read` option, whose refused arm is
# `party_read_xml_not_acceptable.arazzo.yaml`. Every quote is copied verbatim
# from the named vendored file.
arazzo: 1.1.0
info:
  title: Party reads in canonical XML
  version: 0.1.0
  description: >-
    Reading each of the five PARTY kinds with Accept application/xml from a
    service that serves canonical XML. The resources are created in canonical
    JSON.
sourceDescriptions:
  - name: demographic
    url: ../../../specs/rest-oas/demographic-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: get_person-xml
    summary: A PERSON read with Accept application/xml is served in XML
    description: >-
      Creates a PERSON, then retrieves it by the version_uid of the create
      asking for canonical XML. A service that serves XML answers 200 with
      Content-Type application/xml.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "Proper header `Content-Type: application/xml` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    steps:
      - &create
        stepId: create
        description: Create the PERSON in canonical JSON and keep the version_uid of its representation.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &person_v1
            _type: PERSON
            name: { _type: DV_TEXT, value: person v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.person.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-PERSON.person.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Person One }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &person_created
              source: specs/openehr/ITS-REST/specifications/responses/201_PERSON.yaml
              section: description
              quote: "`201 Created` is returned when the PERSON is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: get
        description: Retrieve the PERSON in canonical XML.
        operationId: $sourceDescriptions.demographic.person_get
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.version_uid }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/xml'

