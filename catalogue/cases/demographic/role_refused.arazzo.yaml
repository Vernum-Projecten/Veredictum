            x-veredictum-cite: *bad_request
      - *still_created

  - workflowId: update_role-cluster_no_items
    summary: A ROLE update holding a CLUSTER with no items is refused with 400
    description: >-
      Creates a ROLE, then updates it with content whose identity details hold
      a CLUSTER with an empty items list. The published ITS-JSON schema
      (openehr_rm_1.1.0_all.json, CLUSTER.items, minItems 1) refuses the body,
      so it is syntactically invalid content, so the update is answered 400
      Bad Request and the latest version is still the created one.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    steps:
      - *performer
      - *create
      - stepId: update
        description: Update the ROLE with the refused content under the version_uid of the create.
        operationId: $sourceDescriptions.demographic.role_update
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.create.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload: &cluster_no_items
            _type: ROLE
            name: { _type: DV_TEXT, value: role v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-ROLE.role.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-ROLE.role.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Role One }
                    - _type: CLUSTER
                      name: { _type: DV_TEXT, value: extra }
                      archetype_node_id: at0004
                      items: []
            performer:
              _type: PARTY_REF
              namespace: demographic
              type: PERSON
              id: { _type: HIER_OBJECT_ID, value: "" }
          replacements:
            - { target: /performer/id/value, value: $steps.performer.outputs.versioned_object_uid }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *bad_request
      - *still_created

  - workflowId: update_role-archetype_details_missing
    summary: A ROLE update whose archetype root has no archetype_details is refused with 422
    description: >-
      Creates a ROLE, then updates it with content whose archetype_node_id is
      an archetype id and which carries no archetype_details. The schema-valid
      body breaks an RM invariant, so the update is answered 422 and the
      latest version is still the created one.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/party.adoc
      section: PARTY Class
      quote: "__Is_archetype_root__: `is_archetype_root`"
    steps:
      - *performer
      - *create
      - stepId: update
        description: Update the ROLE with the refused content under the version_uid of the create.
        operationId: $sourceDescriptions.demographic.role_update
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.create.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload: *no_archetype_details
          replacements:
            - { target: /performer/id/value, value: $steps.performer.outputs.versioned_object_uid }
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite: *archetyped_valid
      - *still_created

  - workflowId: create_role-archetype_node_id_mismatch
    summary: A ROLE whose root archetype_node_id differs from its archetype_id is refused with 422
    description: >-
      Creates a ROLE whose archetype_details names
      openEHR-DEMOGRAPHIC-ROLE.role.v1 while its archetype_node_id is
      openEHR-DEMOGRAPHIC-ROLE.other.v1. At an archetype root the node id is
      the archetype_id, so the schema-valid body breaks an RM rule and the
      create is answered 422.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/locatable.adoc
      section: LOCATABLE Class
      quote: "At an archetype root point, the value of this attribute is always the stringified form of the `_archetype_id_` found in the `_archetype_details_` object."
    steps:
      - *performer
      - stepId: create
        description: Create the refused ROLE.
        operationId: $sourceDescriptions.demographic.role_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &node_id_mismatch
            _type: ROLE
            name: { _type: DV_TEXT, value: role v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-ROLE.other.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-ROLE.role.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Role One }
            performer:
              _type: PARTY_REF
              namespace: demographic
              type: PERSON
              id: { _type: HIER_OBJECT_ID, value: "" }
          replacements:
            - { target: /performer/id/value, value: $steps.performer.outputs.versioned_object_uid }
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite: &semantic_error
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The request was well-formed but was unable to be followed due to semantic errors"

  - workflowId: create_role-capabilities_empty
    summary: A ROLE whose capabilities list is empty is refused with 400
    description: >-
      Creates a ROLE whose capabilities list is present and empty, which the
      ROLE invariant forbids. The published ITS-JSON schema
      (openehr_rm_1.1.0_all.json, ROLE.capabilities, minItems 1) refuses the
      body, so it is syntactically invalid content, and the create is answered
      400 Bad Request.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/role.adoc
      section: ROLE Class
      quote: "__Capabilities_valid__: `capabilities /= Void implies not capabilities.empty`"
    steps:
      - *performer
      - stepId: create
        description: Create the refused ROLE.
        operationId: $sourceDescriptions.demographic.role_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &capabilities_empty
            _type: ROLE
            name: { _type: DV_TEXT, value: role v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-ROLE.role.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-ROLE.role.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Role One }
            capabilities: []
            performer:
              _type: PARTY_REF
              namespace: demographic
              type: PERSON
