      Creates a PERSON whose archetype_details names
      openEHR-DEMOGRAPHIC-PERSON.person.v1 while its archetype_node_id is
      openEHR-DEMOGRAPHIC-PERSON.other.v1. At an archetype root the node id is
      the archetype_id, so the schema-valid body breaks an RM rule and the
      create is answered 422.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/locatable.adoc
      section: LOCATABLE Class
      quote: "At an archetype root point, the value of this attribute is always the stringified form of the `_archetype_id_` found in the `_archetype_details_` object."
    steps:
      - stepId: create
        description: Create the refused PERSON.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &node_id_mismatch
            _type: PERSON
            name: { _type: DV_TEXT, value: person v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.other.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-PERSON.person.v1 }, rm_version: "1.1.0" }
            identities:
