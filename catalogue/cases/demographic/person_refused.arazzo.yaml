  - workflowId: create_person-archetype_details_missing
    x-veredictum-control: $sourceDescriptions.person.create_person
    summary: A PERSON archetype root without archetype_details is refused with 422
    description: >-
      Creates a PERSON whose archetype_node_id is the archetype id
      openEHR-DEMOGRAPHIC-PERSON.person.v1 and which carries no
      archetype_details. Every PARTY is an archetype root, and an archetype
      root carries archetype_details, so the schema-valid body breaks an RM
      invariant and the create is answered 422. The valid PERSON of the
      lifecycle document, which carries archetype_details, is its accepted
      twin.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/party.adoc
      section: PARTY Class
      quote: "__Is_archetype_root__: `is_archetype_root`"
    steps:
      - stepId: create
        description: Create the refused PERSON.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &no_archetype_details
            _type: PERSON
            name: { _type: DV_TEXT, value: person v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.person.v1
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Person One }
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite: &archetyped_valid
              source: specs/openehr/RM/docs/UML/classes/locatable.adoc
              section: LOCATABLE Class
              quote: "is_archetype_root xor archetype_details = Void"

  - workflowId: update_person-identities_empty
    x-veredictum-control: $sourceDescriptions.person.update_person
    summary: A PERSON update whose identities list is empty is refused with 400
    description: >-
      Creates a PERSON, then updates it with content whose identities list is
      present and empty. The published ITS-JSON schema
      (openehr_rm_1.1.0_all.json, PERSON.identities, minItems 1) refuses the
      body, so it is syntactically invalid content, so the update is answered
      400 Bad Request and the latest version is still the created one.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    steps:
      - &create
        stepId: create
        description: "Create the PERSON asking for the full representation, keep its version_uid and derive the versioned_object_uid of its container."
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody: &v1_body
          contentType: application/json
          payload: &party_v1
            _type: PERSON
            name: { _type: DV_TEXT, value: person v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.person.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-PERSON.person.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Person One }
        successCriteria:
          - &created_status
            condition: $statusCode == 201
            x-veredictum-cite: &created
              source: specs/openehr/ITS-REST/specifications/responses/201_PERSON.yaml
              section: description
              quote: "`201 Created` is returned when the PERSON is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update the PERSON with the refused content under the version_uid of the create.
        operationId: $sourceDescriptions.demographic.person_update
        parameters:
          - { name: uid_based_id, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.create.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload: *identities_empty
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *bad_request
      - &still_created
        stepId: latest
        description: Read the latest VERSION of the container.
        operationId: $sourceDescriptions.demographic.versioned_party_version_get_at_time
        parameters:
          - { name: versioned_object_uid, in: path, value: $steps.create.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &version_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSION_of_PARTY_at_time.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSION is successfully retrieved."
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.create.outputs.version_uid}$'
            x-veredictum-cite: &stale_refused
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: If-Match and accidental overwrites
              quote: "If a service receives this header, and the condition evaluates to `false`, it MUST NOT perform the requested method."

