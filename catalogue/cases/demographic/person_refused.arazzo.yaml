# The refused PERSON writes of the Demographic API: bodies the published schemas
# refuse (400) and schema-valid bodies that break an RM invariant (422), on
# the create and on the update, as Arazzo 1.1.0 workflows over the released
# ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Person writes refused
  version: 0.1.0
  x-veredictum-section: refusals
  description: >-
    Creating and updating a PERSON with content the service refuses. Each
    refused body differs from the valid PERSON of the lifecycle document in
    one defect, and each refused update leaves the latest version as the
    create committed it. A 400 rests on the published ITS-JSON schema below
    the root; its requirement of a uid on PERSON is not applied to a body
    whose uid the service assigns (upstream report #741).
sourceDescriptions:
  - name: demographic
    url: ../../../specs/rest-oas/demographic-validation.openapi.yaml
    type: openapi
  - name: person
    url: person.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_person-wrong_type
    x-veredictum-control: $sourceDescriptions.person.create_person
    summary: An AGENT body on the PERSON create is refused with 400
    description: >-
      Creates a PERSON with a body whose _type is AGENT. The operation's
      request schema admits _type PERSON only, so the content is syntactically
      invalid and the create is answered 400 Bad Request.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/schemas/demographic/Person.yaml
      section: /properties/_type/enum
      quote: "PERSON"
    steps:
      - stepId: create
        description: Create the refused PERSON.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &other_kind
            _type: AGENT
            name: { _type: DV_TEXT, value: agent v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-AGENT.agent.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-AGENT.agent.v1 }, rm_version: "1.1.0" }
            identities:
              - _type: PARTY_IDENTITY
                name: { _type: DV_TEXT, value: legal identity }
                archetype_node_id: at0001
                details:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: identity }
                  archetype_node_id: at0002
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: name }
                      archetype_node_id: at0003
                      value: { _type: DV_TEXT, value: Agent One }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: &bad_request
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"

  - workflowId: create_person-identities_empty
    x-veredictum-control: $sourceDescriptions.person.create_person
    summary: A PERSON whose identities list is empty is refused with 400
    description: >-
      Creates a PERSON whose identities list is present and empty. The
      published ITS-JSON schema (openehr_rm_1.1.0_all.json, PERSON.identities,
      minItems 1) refuses the body, so it is syntactically invalid content,
      and the create is answered 400 Bad Request.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    steps:
      - stepId: create
        description: Create the refused PERSON.
        operationId: $sourceDescriptions.demographic.person_create
        parameters:
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: &identities_empty
            _type: PERSON
            name: { _type: DV_TEXT, value: person v1 }
            archetype_node_id: openEHR-DEMOGRAPHIC-PERSON.person.v1
            archetype_details: { _type: ARCHETYPED, archetype_id: { _type: ARCHETYPE_ID, value: openEHR-DEMOGRAPHIC-PERSON.person.v1 }, rm_version: "1.1.0" }
            identities: []
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *bad_request

