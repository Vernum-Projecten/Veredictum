# The ADL 1.4 template in the Web Template format, for a service that does
# not serve it: the refused arm of the `template-web-template` option, whose
# served arm is `template_adl14_web_template.arazzo.yaml`. Every quote is
# copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: ADL 1.4 template in the Web Template format, refused
  version: 0.1.0
  description: >-
    Uploading an ADL 1.4 operational template and reading it with Accept
    application/openehr.wt+json from a service that does not serve the Web
    Template format.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
