# ADL 1.4 operational templates sent in the TRIAL Release-2.0.0 XML lineage,
# namespace http://schemas.openehr.org/v2: the documents of the
# `xml-namespace-v2` arm, for a service that also accepts that lineage. Each
# body is valid, or invalid in one place, against the development AM 1.4
# `Template.xsd`, so every workflow here is development-only. Every quote is
# copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: ADL 1.4 templates, XML namespace v2
  version: 0.1.0
  description: >-
    Uploading an ADL 1.4 operational template in the v2 XML namespace with
    the AM 1.4 ordinal shape, and refusing one whose ordinal list still
    carries xsi:type DV_ORDINAL, through the DEFINITION API.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: upload_template-v2_ordinal
    summary: A v2-namespace OPT whose ordinal list entries are ORDINAL objects is accepted
    description: >-
      Uploads an ADL 1.4 operational template in the namespace
      http://schemas.openehr.org/v2 under a fresh template_id: a COMPOSITION
      holding one OBSERVATION down to an ELEMENT whose value is constrained
      by a C_DV_ORDINAL with two list entries, each a value and a symbol
      with no xsi:type. The body is valid against the development AM 1.4
      Template.xsd, so the upload answers 201. It is the accepted twin of the
      old-shape refusal below.
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-XML/components/AM/Release-1.4/OpenehrProfile.xsd
      section: complexType C_DV_ORDINAL
      quote: '<xs:element name="list" type="ORDINAL" minOccurs="0" maxOccurs="unbounded"/>'
    inputs: &run_inputs
      type: object
      properties:
        run: { type: string, format: uuid }
        uid: { type: string, format: uuid }
    steps:
      - stepId: upload
        description: Upload the v2-namespace template under a fresh template_id.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="utf-8"?>
            <template xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns="http://schemas.openehr.org/v2">
              <language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language>
              <description><original_author id="Original Author">Veredictum contributors</original_author><lifecycle_state>Initial</lifecycle_state><details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><purpose>An ordinal constraint template for conformance testing</purpose></details></description>
              <uid><value>{$inputs.uid}</value></uid>
              <template_id><value>vdef-{$inputs.run}</value></template_id>
              <concept>Ordinal list</concept>
              <definition>
                <rm_type_name>COMPOSITION</rm_type_name>
                <occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences>
                <node_id>at0000</node_id>
                <attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>category</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>DV_CODED_TEXT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>defining_code</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_CODE_PHRASE"><rm_type_name>CODE_PHRASE</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><terminology_id><value>openehr</value></terminology_id><code_list>433</code_list></children></attributes></children></attributes>

                <attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>content</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_ARCHETYPE_ROOT"><rm_type_name>OBSERVATION</rm_type_name><occurrences><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></occurrences><node_id>at0000</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>data</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>HISTORY</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id>at0001</node_id><attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>events</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>EVENT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></occurrences><node_id>at0002</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>data</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>ITEM_TREE</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id>at0003</node_id><attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>items</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>ELEMENT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></occurrences><node_id>at0004</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>value</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_DV_ORDINAL"><rm_type_name>DV_ORDINAL</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><list><value>1</value><symbol><value>mild</value><defining_code><terminology_id><value>local</value></terminology_id><code_string>at0005</code_string></defining_code></symbol></list><list><value>2</value><symbol><value>severe</value><defining_code><terminology_id><value>local</value></terminology_id><code_string>at0006</code_string></defining_code></symbol></list></children></attributes></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></interval></cardinality></attributes></children></attributes></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>1</lower></interval></cardinality></attributes></children></attributes><archetype_id><value>openEHR-EHR-OBSERVATION.minimal.v1</value></archetype_id><term_definitions code="at0000"><items id="description">unknown</items><items id="text">Minimal</items></term_definitions><term_definitions code="at0001"><items id="description">@ internal @</items><items id="text">Event Series</items></term_definitions><term_definitions code="at0002"><items id="description">*</items><items id="text">Any event</items></term_definitions><term_definitions code="at0003"><items id="description">@ internal @</items><items id="text">Tree</items></term_definitions><term_definitions code="at0004"><items id="description">*</items><items id="text">value</items></term_definitions><term_definitions code="at0005"><items id="description">mild</items><items id="text">mild</items></term_definitions><term_definitions code="at0006"><items id="description">severe</items><items id="text">severe</items></term_definitions></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></interval></cardinality></attributes>
                <archetype_id><value>openEHR-EHR-COMPOSITION.minimal.v1</value></archetype_id>
                <template_id><value>vdef-{$inputs.run}</value></template_id>
                <term_definitions code="at0000"><items id="description">unknown</items><items id="text">Minimal</items></term_definitions>
              </definition>
            </template>
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl1_4_upload.yaml
              section: description
              quote: "`201 Created` is returned when the template has been successfully uploaded."

  - workflowId: upload_template-v2_ordinal_old_shape
    x-veredictum-control: upload_template-v2_ordinal
    summary: A v2-namespace OPT whose ordinal list entries carry xsi:type DV_ORDINAL is refused with 400
    description: >-
      Uploads the v2-namespace operational template of the accepted twin
      with one defect: each list entry of the C_DV_ORDINAL carries
      xsi:type="DV_ORDINAL", the shape the Release-1.0.2 schemas required.
      The development AM 1.4 schemas type a list entry as ORDINAL and no
      longer accept that xsi:type, so the body is not valid against the
      schema, it is syntactically invalid content, and the upload is refused
      with 400.
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-XML/components/AM/Release-1.4/README.adoc
      section: Ordinal and scale constraints
      quote: 'Breaking change: `xsi:type="DV_ORDINAL"` or `xsi:type="DV_SCALE"` on a `list` or `assumed_value` element, and `xsi:type="DV_CODED_TEXT"` on a `symbol`, are no longer accepted, because these elements are no longer of those RM types.'
    inputs: *run_inputs
    steps:
      - stepId: upload
        description: Upload the template whose ordinal list entries carry xsi:type DV_ORDINAL.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        x-veredictum-cite:
          source: specs/openehr-development/specifications-ITS-XML/components/AM/Release-1.4/OpenehrProfile.xsd
          section: complexType C_DV_ORDINAL
          quote: '<xs:element name="list" type="ORDINAL" minOccurs="0" maxOccurs="unbounded"/>'
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="utf-8"?>
            <template xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns="http://schemas.openehr.org/v2">
              <language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language>
              <description><original_author id="Original Author">Veredictum contributors</original_author><lifecycle_state>Initial</lifecycle_state><details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><purpose>An ordinal constraint template for conformance testing</purpose></details></description>
              <uid><value>{$inputs.uid}</value></uid>
              <template_id><value>vdef-{$inputs.run}</value></template_id>
              <concept>Ordinal list</concept>
              <definition>
                <rm_type_name>COMPOSITION</rm_type_name>
                <occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences>
                <node_id>at0000</node_id>
                <attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>category</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>DV_CODED_TEXT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>defining_code</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_CODE_PHRASE"><rm_type_name>CODE_PHRASE</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><terminology_id><value>openehr</value></terminology_id><code_list>433</code_list></children></attributes></children></attributes>

                <attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>content</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_ARCHETYPE_ROOT"><rm_type_name>OBSERVATION</rm_type_name><occurrences><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></occurrences><node_id>at0000</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>data</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>HISTORY</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id>at0001</node_id><attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>events</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>EVENT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></occurrences><node_id>at0002</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>data</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>ITEM_TREE</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id>at0003</node_id><attributes xsi:type="C_MULTIPLE_ATTRIBUTE"><rm_attribute_name>items</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_COMPLEX_OBJECT"><rm_type_name>ELEMENT</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></occurrences><node_id>at0004</node_id><attributes xsi:type="C_SINGLE_ATTRIBUTE"><rm_attribute_name>value</rm_attribute_name><existence><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>0</lower><upper>1</upper></existence><children xsi:type="C_DV_ORDINAL"><rm_type_name>DV_ORDINAL</rm_type_name><occurrences><lower_included>true</lower_included><upper_included>true</upper_included><lower_unbounded>false</lower_unbounded><upper_unbounded>false</upper_unbounded><lower>1</lower><upper>1</upper></occurrences><node_id /><list xsi:type="DV_ORDINAL"><value>1</value><symbol><value>mild</value><defining_code><terminology_id><value>local</value></terminology_id><code_string>at0005</code_string></defining_code></symbol></list><list xsi:type="DV_ORDINAL"><value>2</value><symbol><value>severe</value><defining_code><terminology_id><value>local</value></terminology_id><code_string>at0006</code_string></defining_code></symbol></list></children></attributes></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></interval></cardinality></attributes></children></attributes></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>1</lower></interval></cardinality></attributes></children></attributes><archetype_id><value>openEHR-EHR-OBSERVATION.minimal.v1</value></archetype_id><term_definitions code="at0000"><items id="description">unknown</items><items id="text">Minimal</items></term_definitions><term_definitions code="at0001"><items id="description">@ internal @</items><items id="text">Event Series</items></term_definitions><term_definitions code="at0002"><items id="description">*</items><items id="text">Any event</items></term_definitions><term_definitions code="at0003"><items id="description">@ internal @</items><items id="text">Tree</items></term_definitions><term_definitions code="at0004"><items id="description">*</items><items id="text">value</items></term_definitions><term_definitions code="at0005"><items id="description">mild</items><items id="text">mild</items></term_definitions><term_definitions code="at0006"><items id="description">severe</items><items id="text">severe</items></term_definitions></children><cardinality><is_ordered>false</is_ordered><is_unique>false</is_unique><interval><lower_included>true</lower_included><lower_unbounded>false</lower_unbounded><upper_unbounded>true</upper_unbounded><lower>0</lower></interval></cardinality></attributes>
                <archetype_id><value>openEHR-EHR-COMPOSITION.minimal.v1</value></archetype_id>
                <template_id><value>vdef-{$inputs.run}</value></template_id>
                <term_definitions code="at0000"><items id="description">unknown</items><items id="text">Minimal</items></term_definitions>
              </definition>
            </template>
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400.yaml
              section: description
              quote: "`400 Bad Request` is returned when the request could not be parsed or is invalid (e.g. malformed request URL syntax, missing required header or parameter, or syntactically invalid header, parameter or content)."
