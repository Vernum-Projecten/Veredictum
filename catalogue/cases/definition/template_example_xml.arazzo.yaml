# Template examples read in canonical XML, for a service that serves it:
# the served arm of the `template-example-xml-read` option, whose refused arm is
# `template_example_xml_not_acceptable.arazzo.yaml`. Every quote is copied verbatim from
# the named vendored file.
# Its ADL 2 twin is `template_example_xml_adl2.arazzo.yaml`.
arazzo: 1.1.0
info:
  title: Template examples in canonical XML
  version: 0.1.0
  description: >-
    An example data instance of a stored ADL 1.4 template, read in
    canonical XML from a service that serves it.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: templates
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_template_adl14_example-xml
    summary: An example of a stored ADL 1.4 template asked for in canonical XML is served in it
    description: >-
      Reads an example data instance of the ADL 1.4 template
      cnf.tpl.count_range with Accept application/xml. The
      answer is 200 with Content-Type application/xml.
    dependsOn: [$sourceDescriptions.templates.upload_template-count_range]
    x-veredictum-cite: &cite
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "Proper header `Content-Type: application/xml` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    steps:
      - stepId: example
        description: Read an example of the template with Accept application/xml.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_example_get
        parameters:
          - { name: template_id, in: path, value: cnf.tpl.count_range }
          - { name: Accept, in: header, value: application/xml }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &example_read
              source: specs/openehr/ITS-REST/specifications/responses/200_Template_example_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the template is successfully retrieved."
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/xml'
