# The ADL 1.4 operational templates of the DEFINITION API: uploading a valid
# OPT and finding it in the listing, the three Prefer answers of an upload,
# a second upload under the same template_id, bodies that do not parse or
# are declared as JSON, the read in XML, the generated example and the
# refusals of a read. Every upload names a fresh template_id built from the
# `run` input, so a workflow needs no empty server. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: ADL 1.4 templates
  version: 0.1.0
  x-veredictum-section: adl-1-4-templates
  description: >-
    Uploading, listing and reading ADL 1.4 operational templates, and
    generating example data from one, through the DEFINITION API.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
