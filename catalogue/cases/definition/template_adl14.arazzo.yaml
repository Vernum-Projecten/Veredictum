          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *listed
          - context: $response.body
            type: jsonpath
            condition: "$[?@.template_id == 'vdef-{$inputs.run}']"
            x-veredictum-cite: *filtered

  - workflowId: upload_template-time_series
    summary: The valid OPT time_series is accepted and listed under its template_id
    description: >-
      Uploads the valid ADL 1.4 operational template time_series under a fresh
      template_id, then lists the templates matching that template_id.
      The upload answers 201 and the listing holds the template.
    x-veredictum-cite: *upload_op
    inputs: *run_inputs
    steps:
      - stepId: upload
        description: Upload the template under a fresh template_id.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/xml
          payload: |-
            <?xml version="1.0" encoding="utf-8"?>
            <!--Operational template XML automatically generated by Ocean Template Designer Version 2.8.94Beta-->
            <template xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns="http://schemas.openehr.org/v1">
