# Template examples asked for in the Simplified Structured JSON format from a service that does
# not serve it: the refused arm of the `template-example-structured-read` option, whose
# served arm is `template_example_structured.arazzo.yaml`. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Template examples refused in the Simplified Structured format
  version: 0.1.0
  description: >-
    An example data instance of a stored ADL 1.4 and a stored ADL 2
    template, asked for in the Simplified Structured JSON format from a service that does not
    serve it, is refused with 406.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: templates
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
  - name: setup_adl2
    url: ../_setup/content_templates_adl2.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_template_adl14_example-structured_not_acceptable
    summary: An example of a stored ADL 1.4 template asked for in the Simplified Structured format is refused with 406
    description: >-
      Reads an example data instance of the ADL 1.4 template
      cnf.tpl.count_range with Accept application/openehr.wt.structured+json from a
      service that does not serve that format. The read is refused
      with 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.templates.upload_template-count_range]
    x-veredictum-cite: &cite
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    steps:
      - stepId: example
        description: Read an example of the template with Accept application/openehr.wt.structured+json.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_example_get
        parameters:
          - { name: template_id, in: path, value: cnf.tpl.count_range }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_template_adl2_example-structured_not_acceptable
    summary: An example of a stored ADL 2 template asked for in the Simplified Structured format is refused with 406
    description: >-
      Reads an example data instance of the ADL 2 template
      openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 with Accept application/openehr.wt.structured+json from a
      service that does not serve that format. The read is refused
      with 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.setup_adl2.upload_template-adl2_dv_count_range]
    x-veredictum-cite: *cite
    steps:
      - stepId: example
        description: Read an example of the template with Accept application/openehr.wt.structured+json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_example_get
        parameters:
          - { name: template_id, in: path, value: openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 406
