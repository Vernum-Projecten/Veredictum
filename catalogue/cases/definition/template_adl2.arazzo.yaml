  - workflowId: get_template_adl2_version-older_of_two
    summary: Of two stored versions of an ADL 2 template, the read at the older exact version answers that version
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id at version 1.0.0 and again at version 1.1.0, then reads it
      through the deprecated read at a version, naming the template by its
      major version and the exact version 1.0.0, with Accept
      application/json. The read answers 200 with the template whose
      release_version is 1.0.0.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/definition_template_adl2_version_get.yaml
      section: description
      quote: "Retrieves the ADL2 operational template identified by `template_id` identifier, at specified `version`."
    inputs: *run_input
    steps:
      - *upload_minimal
      - &upload_newer
        stepId: upload-newer
        description: Upload the same template at version 1.1.0.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          # NOTE: AM Identification master04-versioning.adoc; the minimal template
          # above with the release version 1.1.0 in its identifier.
          payload: |-
            operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)
                openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.1.0

            language
                original_language = <[ISO_639-1::en]>

            description
                original_author = <
                    ["name"] = <"Veredictum contributors">
                >
                lifecycle_state = <"unmanaged">
                details = <
                    ["en"] = <
                        language = <[ISO_639-1::en]>
                        purpose = <"A minimal operational template for conformance testing">
                    >
                >

            definition
                COMPOSITION[id1] matches {
                    category matches {
                        DV_CODED_TEXT[id2] matches {
                            defining_code matches {[at1]}
                        }
                    }
                    content cardinality matches {0..*; unordered} matches {
                        OBSERVATION[id3, openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0] occurrences matches {0..*} matches {
                            data matches {
                                HISTORY[id2] matches {
                                    events cardinality matches {1..*; unordered} matches {
                                        EVENT[id3] occurrences matches {0..*} matches {
                                            data matches {
                                                ITEM_TREE[id4] matches {
                                                    items cardinality matches {0..*; unordered} matches {
                                                        ELEMENT[id5] occurrences matches {0..*} matches {
                                                            value matches {
                                                                DV_TEXT[id6]
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

            terminology
                term_definitions = <
                    ["en"] = <
                        ["id1"] = <
                            text = <"Minimal">
                            description = <"A minimal event composition">
                        >
                        ["id3"] = <
                            text = <"Minimal observation">
                            description = <"The observation the composition holds">
                        >
                        ["at1"] = <
                            text = <"event">
                            description = <"The openEHR composition category event">
                        >
                    >
                >
                term_bindings = <
                    ["openehr"] = <
                        ["at1"] = <http://openehr.org/id/433>
                    >
                >

            component_terminologies
                ["openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"] = <
                    term_definitions = <
                        ["en"] = <
                            ["id1"] = <
                                text = <"Minimal observation">
                                description = <"An observation with one text element">
                            >
                            ["id3"] = <
                                text = <"Any event">
                                description = <"Any event">
                            >
                            ["id5"] = <
                                text = <"Value">
                                description = <"A text value">
                            >
                        >
                    >
                >
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
      - stepId: read
        description: Read the template at version 1.0.0 with Accept application/json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_version_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1" }
          - { name: version, in: path, value: "1.0.0" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *template_read
          - context: $response.body#/archetype_id/release_version
            type: regex
            condition: '^1\.0\.0$'
            x-veredictum-cite: &release_version
              source: specs/its-json-schemas/AM/Release-2.2.0/Aom2/all.json
              section: /definitions/ARCHETYPE_HRID/properties/release_version/description
              quote: "The full numeric version of this archetype consisting of 3 parts"

