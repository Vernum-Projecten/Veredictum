      Uploads the minimal ADL 2 operational template under a fresh
      template_id with one defect: the DV_TEXT leaf of the minimal template renamed to DV_NO_SUCH_TYPE, a type no openEHR RM defines. The template breaks an AOM2
      validity rule, so the request is invalid and the upload is refused
      with 400, the refusal the operation declares.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/AOM2/master04.5-constraint_model-class_definitions.adoc
      section: "Validity Rules: C_OBJECT"
      quote: "*VCORM* object constraint type name existence: a type name introducing an object constraint block must be defined in the underlying information model."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template that names an object type the RM does not define.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: |-
            operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)
                openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0

            language
                original_language = <[ISO_639-1::en]>

            description
                original_author = <
                    ["name"] = <"Veredictum contributors">
                >
                lifecycle_state = <"unmanaged">
                details = <
                    ["en"] = <
                        language = <[ISO_639-1::en]>
                        purpose = <"A minimal operational template for conformance testing">
                    >
                >

            definition
                COMPOSITION[id1] matches {
                    category matches {
                        DV_CODED_TEXT[id2] matches {
                            defining_code matches {[at1]}
                        }
                    }
                    content cardinality matches {0..*; unordered} matches {
                        OBSERVATION[id3, openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0] occurrences matches {0..*} matches {
                            data matches {
                                HISTORY[id2] matches {
                                    events cardinality matches {1..*; unordered} matches {
                                        EVENT[id3] occurrences matches {0..*} matches {
                                            data matches {
                                                ITEM_TREE[id4] matches {
                                                    items cardinality matches {0..*; unordered} matches {
                                                        ELEMENT[id5] occurrences matches {0..*} matches {
                                                            value matches {
                                                                DV_NO_SUCH_TYPE[id6]
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

            terminology
                term_definitions = <
                    ["en"] = <
                        ["id1"] = <
                            text = <"Minimal">
                            description = <"A minimal event composition">
                        >
                        ["id3"] = <
                            text = <"Minimal observation">
                            description = <"The observation the composition holds">
                        >
                        ["at1"] = <
                            text = <"event">
                            description = <"The openEHR composition category event">
                        >
                    >
                >
                term_bindings = <
                    ["openehr"] = <
                        ["at1"] = <http://openehr.org/id/433>
                    >
                >

            component_terminologies
                ["openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"] = <
                    term_definitions = <
                        ["en"] = <
                            ["id1"] = <
                                text = <"Minimal observation">
                                description = <"An observation with one text element">
                            >
                            ["id3"] = <
                                text = <"Any event">
                                description = <"Any event">
                            >
                            ["id5"] = <
                                text = <"Value">
                                description = <"A text value">
                            >
                        >
                    >
                >
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *bad_request

  - workflowId: upload_template_adl2-invalid-unknown_rm_attribute
    x-veredictum-control: upload_template_adl2-minimal
    summary: An ADL 2 template that constrains an attribute the RM type does not have is refused with 400
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with one defect: the DV_TEXT leaf of the minimal template constraining no_such_attribute, which RM DV_TEXT does not define. The template breaks an AOM2
      validity rule, so the request is invalid and the upload is refused
      with 400, the refusal the operation declares.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/AOM2/master04.5-constraint_model-class_definitions.adoc
      section: "Validity Rules: C_ATTRIBUTE"
      quote: "*VCARM*: attribute name reference model validity: an attribute name introducing an attribute constraint block must be defined in the underlying information model as an attribute (stored or computed) of the type which introduces the enclosing object block."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template that constrains an attribute the RM type does not have.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: |-
            operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)
                openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0

            language
                original_language = <[ISO_639-1::en]>

            description
                original_author = <
                    ["name"] = <"Veredictum contributors">
                >
                lifecycle_state = <"unmanaged">
                details = <
                    ["en"] = <
                        language = <[ISO_639-1::en]>
                        purpose = <"A minimal operational template for conformance testing">
                    >
                >

            definition
                COMPOSITION[id1] matches {
                    category matches {
                        DV_CODED_TEXT[id2] matches {
                            defining_code matches {[at1]}
                        }
                    }
                    content cardinality matches {0..*; unordered} matches {
                        OBSERVATION[id3, openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0] occurrences matches {0..*} matches {
                            data matches {
                                HISTORY[id2] matches {
                                    events cardinality matches {1..*; unordered} matches {
                                        EVENT[id3] occurrences matches {0..*} matches {
                                            data matches {
                                                ITEM_TREE[id4] matches {
                                                    items cardinality matches {0..*; unordered} matches {
                                                        ELEMENT[id5] occurrences matches {0..*} matches {
                                                            value matches {
                                                                DV_TEXT[id6] matches {
                                                                    no_such_attribute matches {"x"}
                                                                }
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

            terminology
                term_definitions = <
                    ["en"] = <
                        ["id1"] = <
                            text = <"Minimal">
                            description = <"A minimal event composition">
                        >
                        ["id3"] = <
                            text = <"Minimal observation">
                            description = <"The observation the composition holds">
                        >
                        ["at1"] = <
                            text = <"event">
                            description = <"The openEHR composition category event">
                        >
                    >
                >
                term_bindings = <
                    ["openehr"] = <
                        ["at1"] = <http://openehr.org/id/433>
                    >
                >

            component_terminologies
                ["openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"] = <
                    term_definitions = <
                        ["en"] = <
                            ["id1"] = <
                                text = <"Minimal observation">
                                description = <"An observation with one text element">
                            >
                            ["id3"] = <
                                text = <"Any event">
                                description = <"Any event">
                            >
                            ["id5"] = <
                                text = <"Value">
                                description = <"A text value">
                            >
                        >
                    >
                >
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *bad_request

  - workflowId: upload_template_adl2-xml_content_type
    summary: An ADL 2 upload declared as XML is refused with 415
    description: >-
      Uploads ADL text with Content-Type application/xml. The operation takes
      a template as text/plain only and the body is not XML, so the service
      cannot process it as XML and refuses the upload with 415.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
    steps:
      - stepId: upload
        description: Upload ADL text declared as application/xml.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: "operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)"
        successCriteria:
          - condition: $statusCode == 415

  - workflowId: upload_template_adl2-return_minimal
    summary: An ADL 2 upload with Prefer return=minimal answers 201 with no body
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=minimal. The answer is 201 with an
      empty body.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl2_upload.yaml
      section: description
      quote: "If the `Prefer` header is missing or set to `return=minimal`, the body is empty."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=minimal.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - condition: $response.body == null

  - workflowId: upload_template_adl2-return_identifier
    summary: An ADL 2 upload with Prefer return=identifier answers the template_id
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=identifier and Accept application/json.
      The answer is 201 and its body carries the template_id.
    x-veredictum-cite: &identifier_or_representation
      source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl2_upload.yaml
      section: description
      quote: "If `Prefer` header is `return=representation`, the full resource is included in the response body; if is `return=identifier`, only its unique identifier is included."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=identifier.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - context: $response.body#/template_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.vdef-{$inputs.run}\.v1\.0\.0$'

  - workflowId: upload_template_adl2-return_representation
    summary: An ADL 2 upload with Prefer return=representation answers the template in its body
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=representation and Accept text/plain.
      The answer is 201 and carries the template in its body, which names the
      uploaded template_id.
    x-veredictum-cite: *identifier_or_representation
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=representation.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - context: $response.body
            type: regex
            condition: 'openEHR-EHR-COMPOSITION\.vdef-{$inputs.run}\.v1\.0\.0'

  - workflowId: upload_template_adl2-same_template_id_twice
    summary: A second ADL 2 upload under a stored template_id is refused with 409
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id, then uploads it again. The second upload is refused with
      409.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
      section: description
      quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
    inputs: *run_input
    steps:
      - *upload_minimal
      - stepId: upload-again
        description: Upload the same template a second time.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 409

  - workflowId: get_template_adl2-text
