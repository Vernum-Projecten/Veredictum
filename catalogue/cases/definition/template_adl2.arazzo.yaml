# The ADL 2 operational templates of the DEFINITION API: the listing, the
# upload of a valid raw operational template written here for the purpose,
# the reads of a template_id that names nothing, and an upload whose body
# does not parse or is declared as XML. Every quote is copied verbatim from
# the named vendored file.
arazzo: 1.1.0
info:
  title: ADL 2 templates
  version: 0.1.0
  x-veredictum-section: adl-2-templates
  description: >-
    Listing ADL 2 operational templates, uploading a valid one, reading one
    that does not exist and refusing an upload that does not parse, through
    the DEFINITION API.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/content_templates_adl2.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: list_templates_adl2
    summary: The ADL 2 template list answers 200 in JSON
    description: >-
      Lists the ADL 2 operational templates with Accept application/json.
      The listing answers 200 with Content-Type application/json.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/200_TemplateList_adl2.yaml
      section: description
      quote: "`200 OK` is returned when the template list is successfully retrieved."
    steps:
      - stepId: list
        description: List the ADL 2 templates.
        operationId: $sourceDescriptions.definition.definition_template_adl2_list
        parameters:
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
              section: JSON Format
              quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."

  - workflowId: get_template_adl2-unknown
    summary: Reading an ADL 2 template_id that names no template answers 404
    description: >-
      Reads a fresh ADL 2 template_id that was never uploaded, with Accept
      text/plain. The read answers 404.
    x-veredictum-cite: &unknown
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_template_id.yaml
      section: description
      quote: "`404 Not Found` is returned when a template with the specified `template_id` does not exist."
    inputs: &run_input
      type: object
      properties:
        run: { type: string, format: uuid }
    steps:
      - stepId: read
        description: Read an ADL 2 template_id that was never uploaded.
        operationId: $sourceDescriptions.definition.definition_template_adl2_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0" }
          - { name: Accept, in: header, value: text/plain }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_template_adl2_version-unknown
    summary: Reading an ADL 2 template_id at a version that names no template answers 404
    description: >-
      Reads a fresh ADL 2 template_id that was never uploaded at version
      1.0.0, through the deprecated read at a version, with Accept
      text/plain. The read answers 404.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_template_id_or_version.yaml
      section: description
      quote: "`404 Not Found` is returned when a template with the specified `template_id` at given `version` does not exist."
    inputs: *run_input
    steps:
      - stepId: read
        description: Read an ADL 2 template_id that was never uploaded, at version 1.0.0.
        operationId: $sourceDescriptions.definition.definition_template_adl2_version_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1" }
          - { name: version, in: path, value: "1.0.0" }
          - { name: Accept, in: header, value: text/plain }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_template_adl2_example-unknown
    summary: An example of an ADL 2 template_id that names no template answers 404
    description: >-
      Reads an example data instance of a fresh ADL 2 template_id that was
      never uploaded, with Accept application/json. The read answers 404.
    x-veredictum-cite: *unknown
    inputs: *run_input
    steps:
      - stepId: example
        description: Read an example of an ADL 2 template_id that was never uploaded.
        operationId: $sourceDescriptions.definition.definition_template_adl2_example_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: upload_template_adl2-minimal
    summary: A valid ADL 2 operational template is accepted and listed under its template_id
    description: >-
      Uploads a raw ADL 2 operational template under a fresh template_id: a
      COMPOSITION of category event whose content is an inlined OBSERVATION
      archetype down to one ELEMENT with a DV_TEXT value, with the
      component_terminologies section an operational template carries. It
      then lists the ADL 2 templates matching that template_id. The upload
      answers 201 and the listing holds the template.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/definition_template_adl2_upload.yaml
      section: description
      quote: "Upload a new ADL2 operational template."
      report: 939
    inputs: *run_input
    steps:
      - &upload_minimal
        stepId: upload
        description: Upload the operational template under a fresh template_id.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          # NOTE: AM OPT2 master03-opt_raw.adoc §Artefact Structure gives the
          # outer structure; ADL2 master07.08 §Description Section the minimal description.
          payload: &minimal_opt |-
            operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)
                openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0

            language
                original_language = <[ISO_639-1::en]>

            description
                original_author = <
                    ["name"] = <"Veredictum contributors">
                >
                lifecycle_state = <"unmanaged">
                details = <
                    ["en"] = <
                        language = <[ISO_639-1::en]>
                        purpose = <"A minimal operational template for conformance testing">
                    >
                >

            definition
                COMPOSITION[id1] matches {
                    category matches {
                        DV_CODED_TEXT[id2] matches {
                            defining_code matches {[at1]}
                        }
                    }
                    content cardinality matches {0..*; unordered} matches {
                        OBSERVATION[id3, openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0] occurrences matches {0..*} matches {
                            data matches {
                                HISTORY[id2] matches {
                                    events cardinality matches {1..*; unordered} matches {
                                        EVENT[id3] occurrences matches {0..*} matches {
                                            data matches {
                                                ITEM_TREE[id4] matches {
                                                    items cardinality matches {0..*; unordered} matches {
                                                        ELEMENT[id5] occurrences matches {0..*} matches {
                                                            value matches {
                                                                DV_TEXT[id6]
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

            terminology
                term_definitions = <
                    ["en"] = <
                        ["id1"] = <
                            text = <"Minimal">
                            description = <"A minimal event composition">
                        >
                        ["id3"] = <
                            text = <"Minimal observation">
                            description = <"The observation the composition holds">
                        >
                        ["at1"] = <
                            text = <"event">
                            description = <"The openEHR composition category event">
                        >
                    >
                >
                term_bindings = <
                    ["openehr"] = <
                        ["at1"] = <http://openehr.org/id/433>
                    >
                >

            component_terminologies
                ["openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"] = <
                    term_definitions = <
                        ["en"] = <
                            ["id1"] = <
                                text = <"Minimal observation">
                                description = <"An observation with one text element">
                            >
                            ["id3"] = <
                                text = <"Any event">
                                description = <"Any event">
                            >
                            ["id5"] = <
                                text = <"Value">
                                description = <"A text value">
                            >
                        >
                    >
                >
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &uploaded
              source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl2_upload.yaml
              section: description
              quote: "`201 Created` is returned when the template has been successfully uploaded."
      - stepId: list
        description: List the ADL 2 templates whose template_id matches the uploaded one.
        operationId: $sourceDescriptions.definition.definition_template_adl2_list
        parameters:
          - { name: template_id, in: query, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_TemplateList_adl2.yaml
              section: description
              quote: "`200 OK` is returned when the template list is successfully retrieved."
          - context: $response.body
            type: jsonpath
            condition: "$[?@.template_id == 'openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0']"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/parameters/query/filter_template_id.yaml
              section: description
              quote: "Pattern for matching `template_id` (supports wildcards `*`)"

  - workflowId: upload_template_adl2-empty_body
    x-veredictum-control: upload_template_adl2-minimal
    summary: An ADL 2 upload with an empty body is refused with 400
    description: >-
      Uploads an empty body as text/plain. An empty body holds no
      operational template, so the upload is refused with 400.
    x-veredictum-cite: &bad_request
      source: specs/openehr/ITS-REST/specifications/responses/400.yaml
      section: description
      quote: "`400 Bad Request` is returned when the request could not be parsed or is invalid (e.g. malformed request URL syntax, missing required header or parameter, or syntactically invalid header, parameter or content)."
    steps:
      - stepId: upload
        description: Upload an empty body.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: ""
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: upload_template_adl2-unparseable
    x-veredictum-control: upload_template_adl2-minimal
    summary: An ADL 2 upload whose body does not parse is refused with 400
    description: >-
      Uploads a text/plain body that opens an operational template and
      breaks off inside its header, so it does not parse as ADL. The upload
      is refused with 400.
    x-veredictum-cite: *bad_request
    steps:
      - stepId: upload
        description: Upload a body that does not parse as ADL.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: "operational_template (adl_version=2.0.6; rm_release=1.0.2; generated"
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: upload_template_adl2-xml_content_type
    summary: An ADL 2 upload declared as XML is refused with 415
    description: >-
      Uploads ADL text with Content-Type application/xml. The operation takes
      a template as text/plain only and the body is not XML, so the service
      cannot process it as XML and refuses the upload with 415.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "If the service cannot process the request payload as XML format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
    steps:
      - stepId: upload
        description: Upload ADL text declared as application/xml.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: "operational_template (adl_version=2.0.6; rm_release=1.0.2; generated)"
        successCriteria:
          - condition: $statusCode == 415

  - workflowId: upload_template_adl2-return_minimal
    summary: An ADL 2 upload with Prefer return=minimal answers 201 with no body
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=minimal. The answer is 201 with an
      empty body.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl2_upload.yaml
      section: description
      quote: "If the `Prefer` header is missing or set to `return=minimal`, the body is empty."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=minimal.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - condition: $response.body == null

  - workflowId: upload_template_adl2-return_identifier
    summary: An ADL 2 upload with Prefer return=identifier answers the template_id
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=identifier and Accept application/json.
      The answer is 201 and its body carries the template_id.
    x-veredictum-cite: &identifier_or_representation
      source: specs/openehr/ITS-REST/specifications/responses/201_Template_adl2_upload.yaml
      section: description
      quote: "If `Prefer` header is `return=representation`, the full resource is included in the response body; if is `return=identifier`, only its unique identifier is included."
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=identifier.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - context: $response.body#/template_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.vdef-{$inputs.run}\.v1\.0\.0$'

  - workflowId: upload_template_adl2-return_representation
    summary: An ADL 2 upload with Prefer return=representation answers the template in its body
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id with Prefer return=representation and Accept text/plain.
      The answer is 201 and carries the template in its body.
    x-veredictum-cite: *identifier_or_representation
    inputs: *run_input
    steps:
      - stepId: upload
        description: Upload the template with Prefer return=representation.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *uploaded
          - condition: $response.body != null

  - workflowId: upload_template_adl2-same_template_id_twice
    summary: A second ADL 2 upload under a stored template_id is refused with 409
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id, then uploads it again. The second upload is refused with
      409.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
      section: description
      quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
    inputs: *run_input
    steps:
      - *upload_minimal
      - stepId: upload-again
        description: Upload the same template a second time.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: text/plain
          payload: *minimal_opt
        successCriteria:
          - condition: $statusCode == 409

  - workflowId: get_template_adl2-text
    summary: An uploaded ADL 2 template is read back as ADL text
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id, then reads it by that template_id with Accept
      text/plain. The read answers 200.
    x-veredictum-cite: &template_read
      source: specs/openehr/ITS-REST/specifications/responses/200_Template_adl2_retrieved.yaml
      section: description
      quote: "`200 OK` is returned when the template is successfully retrieved."
    inputs: *run_input
    steps:
      - *upload_minimal
      - stepId: read
        description: Read the template with Accept text/plain.
        operationId: $sourceDescriptions.definition.definition_template_adl2_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0" }
          - { name: Accept, in: header, value: text/plain }
        successCriteria:
          - condition: $statusCode == 200

  - workflowId: get_template_adl2-json
    summary: An uploaded ADL 2 template is read back in JSON
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id, then reads it by that template_id with Accept
      application/json. The read answers 200 with Content-Type
      application/json.
    x-veredictum-cite: *template_read
    inputs: *run_input
    steps:
      - *upload_minimal
      - stepId: read
        description: Read the template with Accept application/json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1.0.0" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'
            x-veredictum-cite: &json_content_type
              source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
              section: JSON Format
              quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."

  - workflowId: get_template_adl2_version
    summary: An uploaded ADL 2 template is read back at its version in JSON
    description: >-
      Uploads the minimal ADL 2 operational template under a fresh
      template_id, then reads it through the deprecated read at a version,
      naming the template by its major version and the version 1.0.0 its
      identifier carries, with Accept application/json. The read answers 200
      with Content-Type application/json.
    x-veredictum-cite: *template_read
    inputs: *run_input
    steps:
      - *upload_minimal
      - stepId: read
        description: Read the template at version 1.0.0 with Accept application/json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_version_get
        parameters:
          - { name: template_id, in: path, value: "openEHR-EHR-COMPOSITION.vdef-{$inputs.run}.v1" }
          - { name: version, in: path, value: "1.0.0" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'
            x-veredictum-cite: *json_content_type

  - workflowId: get_template_adl2_example
    summary: An example of a stored ADL 2 template is a COMPOSITION rooted at its archetype
    description: >-
      Reads an example data instance of the ADL 2 template
      openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 with Accept
      application/json. The answer is 200 in JSON, and its root carries the
      template's root archetype id as archetype_node_id.
    dependsOn: [$sourceDescriptions.setup.upload_template-adl2_dv_count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/200_Template_example_retrieved.yaml
      section: description
      quote: "`200 OK` is returned when the template is successfully retrieved."
    steps:
      - stepId: example
        description: Read an example of the template with Accept application/json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_example_get
        parameters:
          - { name: template_id, in: path, value: openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'
            x-veredictum-cite: *json_content_type
          - context: $response.body#/archetype_node_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.cnf_adl2_dv_count_range\.v1\.0\.0$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/UML/classes/locatable.adoc
              section: LOCATABLE Class
              quote: "At an archetype root point, the value of this attribute is always the stringified form of the `_archetype_id_` found in the `_archetype_details_` object."

  - workflowId: get_template_adl2_example-web_template_not_acceptable
    summary: An ADL 2 example asked for in the Web Template format is refused with 406
    description: >-
      Reads an example data instance of the ADL 2 template
      openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 with Accept
      application/openehr.wt+json. The release names that type for the
      Operational Template definition, and a data instance has no
      representation in it, so the read is refused with 406.
    dependsOn: [$sourceDescriptions.setup.upload_template-adl2_dv_count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/406.yaml
      section: description
      quote: "`406 Not Acceptable` is returned when the service cannot produce a response matching `Accept` request header, i.e. content type or format is not supported."
    steps:
      - stepId: example
        description: Read an example with Accept application/openehr.wt+json.
        operationId: $sourceDescriptions.definition.definition_template_adl2_example_get
        parameters:
          - { name: template_id, in: path, value: openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0 }
          - { name: Accept, in: header, value: application/openehr.wt+json }
        successCriteria:
          - condition: $statusCode == 406
