              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

  - workflowId: dv_interval_dv_ordinal-validate_open-symbol_missing
    summary: "DV_INTERVAL<DV_ORDINAL> open ({*}): symbol/value mandatory, comparable limits: no symbol is refused"
    description: >-
      Commits the rows' content against the template (DV_INTERVAL<DV_ORDINAL>
      open ({*}): symbol/value mandatory, comparable limits). Each body lacks
      a member the RM makes mandatory (no symbol), so the commit is refused.
      The published ITS-JSON schema (openehr_rm_1.1.0_all.json) does not
      require the member, so the body is not syntactically invalid by that
      schema, and no released text decides between 400 and 422 for it; either
      refusal holds.
    dependsOn: [$sourceDescriptions.templates.upload_template-interval_ordinal_open]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_ordinal.adoc
      section: "DV_ORDINAL Class"
      quote: "h|*1..1* |*symbol*: `<<_dv_coded_text_class,DV_CODED_TEXT>>`"
    inputs:
      type: object
      required: [composition]
      properties:
        "lower_symbol": { type: "null" }
        "lower_value": { type: "integer" }
        "upper_symbol": { type: "null" }
        "upper_value": { type: "integer" }
        "lower_unbounded": { type: "boolean" }
        "upper_unbounded": { type: "boolean" }
        "lower_included": { type: "boolean" }
        "upper_included": { type: "boolean" }
        composition: { type: object }
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
