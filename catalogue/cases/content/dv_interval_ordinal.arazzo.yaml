    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_ordinal.adoc
      section: "DV_ORDINAL Class"
      quote: "h|*1..1* |*value*: `link:/releases/BASE/{base_release}/foundation_types.html#_integer_class[Integer^]`"
    inputs:
      type: object
      required: [composition]
      properties:
        "lower_symbol": { type: "string" }
        "lower_value": { type: "null" }
        "upper_symbol": { type: "string" }
        "upper_value": { type: "null" }
        "lower_unbounded": { type: "boolean" }
        "upper_unbounded": { type: "boolean" }
