# Content validation of DV_INTERVAL at a COMPOSITION commit, as
# Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS. Each
# workflow commits the compositions of its rows file, which the rows file's
# recipe builds from the decision-table literals, and every row of a workflow
# shares its outcome. Every criterion resolves to an `x-veredictum-cite`, and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content validation, DV INTERVAL ORDINAL
  version: 0.1.0
  description: >-
    Commits DV_INTERVAL content against templates that constrain it.
    Content the template and the RM admit is created (201). A body the
    published ITS-JSON schema (openehr_rm_1.1.0_all.json) refuses is
    syntactically invalid content and is answered 400; a schema-valid body
    the template does not validate, or that breaks an RM invariant, is
    answered 422.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: templates
    url: ../_setup/content_templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: dv_interval_dv_ordinal-validate_constraint-accepted
    summary: "DV_INTERVAL<DV_ORDINAL> with per-limit C_DV_ORDINAL.list constraints: content the template admits is created"
    description: >-
      Commits the rows' content against the template (DV_INTERVAL<DV_ORDINAL>
      with per-limit C_DV_ORDINAL.list constraints). Each row is content the
      template and the RM admit, so the commit is answered 201 Created.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: "Overview"
      quote: "cADL is used both at \"design time\", by authors and/or tools, and at runtime, by computational systems which validate data by comparing it to the appropriate sections of cADL in an archetype."
    inputs:
      type: object
      required: [composition, template]
      properties:
        "lower_symbol": { type: "string" }
        "lower_value": { type: "integer" }
        "upper_symbol": { type: "string" }
        "upper_value": { type: "integer" }
        "lower_unbounded": { type: "boolean" }
        "upper_unbounded": { type: "boolean" }
        "lower_included": { type: "boolean" }
        "upper_included": { type: "boolean" }
        "lower_c_dv_ordinal_list": { type: "string" }
        "upper_c_dv_ordinal_list": { type: "string" }
        composition: { type: object }
        template: { type: string }
    steps:
      - stepId: upload-template
        description: Upload the row's operational template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: $inputs.template
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(201|409)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
              section: "description"
              quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

