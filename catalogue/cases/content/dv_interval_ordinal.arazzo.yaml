            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(400|422)$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/UML/classes/dv_ordinal.adoc
              section: "DV_ORDINAL Class"
              quote: "h|*1..1* |*symbol*: `<<_dv_coded_text_class,DV_CODED_TEXT>>`"

  - workflowId: dv_interval_dv_ordinal-validate_open-value_missing
    summary: "DV_INTERVAL<DV_ORDINAL> open ({*}): symbol/value mandatory, comparable limits: no value is refused"
    description: >-
      Commits the rows' content against the template (DV_INTERVAL<DV_ORDINAL>
      open ({*}): symbol/value mandatory, comparable limits). Each body lacks
      a member the RM makes mandatory (no value), so the commit is refused.
      The published ITS-JSON schema (openehr_rm_1.1.0_all.json) does not
