          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(400|422)$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/UML/classes/dv_ordinal.adoc
              section: "DV_ORDINAL Class"
              quote: "h|*1..1* |*value*: `link:/releases/BASE/{base_release}/foundation_types.html#_integer_class[Integer^]`"

  - workflowId: dv_interval_dv_ordinal-validate_open-limits_consistent
    summary: "DV_INTERVAL<DV_ORDINAL> open ({*}): symbol/value mandatory, comparable limits: a breach of the Limits_consistent invariant is refused with 422"
    description: >-
      Commits the rows' content against the template (DV_INTERVAL<DV_ORDINAL>
      open ({*}): symbol/value mandatory, comparable limits). Each body passes
      the published ITS-JSON schema and breaks the rule this workflow cites (a
      breach of the Limits_consistent invariant), so the commit is refused
      with 422 Unprocessable Entity.
    dependsOn: [$sourceDescriptions.templates.upload_template-interval_ordinal_open]
    x-veredictum-cite:
      source: specs/openehr/BASE/docs/UML/classes/interval.adoc
      section: "Interval Class"
      quote: "__Limits_consistent__: `(not upper_unbounded and not lower_unbounded) implies lower \\<= upper`"
    inputs:
      type: object
      required: [composition]
      properties:
        "lower_symbol": { type: "string" }
        "lower_value": { type: "integer" }
