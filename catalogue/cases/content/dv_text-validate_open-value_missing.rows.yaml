# The rows of CONT-DV_TEXT-validate_open this workflow carries; the recipe builds each
# row's composition and operational template from its literals.
workflow: dv_text/dv_text-validate_open-value_missing
iteration: reset_per_row
literals: ["value", "C_STRING.pattern", "C_STRING.list"]
recipe:
  name: content_synthesized
  rm_class: DV_TEXT
  template_id: cnf.tpl.dv_text_c_string
  input: composition
  template_input: template
rows:
  - {"value": null, "C_STRING.pattern": null, "C_STRING.list": null}
  - {"value": null, "C_STRING.pattern": "XYZ", "C_STRING.list": null}
