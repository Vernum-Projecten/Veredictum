# The rows of CONT-DV_INTERVAL_DV_TIME-validate_open this workflow carries; the recipe builds each
# row's composition from its literals.
workflow: dv_interval_time/dv_interval_dv_time-validate_open-accepted
iteration: reset_per_row
literals: ["lower", "upper", "lower_unbounded", "upper_unbounded", "lower_included", "upper_included"]
recipe:
  name: content_instance
  rm_class: DV_INTERVAL
  template_id: cnf.tpl.interval_time_open
  input: composition
rows:
  - {"lower": "10", "upper": "11", "lower_unbounded": false, "upper_unbounded": false, "lower_included": true, "upper_included": true}
  - {"lower": "10:00", "upper": "11:00", "lower_unbounded": false, "upper_unbounded": false, "lower_included": true, "upper_included": true}
  - {"lower": "10:00:00", "upper": "11:00:00", "lower_unbounded": false, "upper_unbounded": false, "lower_included": true, "upper_included": true}
  - {"lower": null, "upper": null, "lower_unbounded": true, "upper_unbounded": true, "lower_included": false, "upper_included": false}
