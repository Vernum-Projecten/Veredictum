# The rows of CONT-DV_DURATION-validate_range this workflow carries; the recipe builds each
# row's composition and operational template from its literals.
workflow: dv_duration/dv_duration-validate_range-c_duration_range_lower
iteration: reset_per_row
literals: ["value", "range.lower", "range.upper"]
recipe:
  name: content_synthesized
  rm_class: DV_DURATION
  template_id: cnf.tpl.dv_duration_c_duration
  input: composition
  template_input: template
rows:
  - {"value": "P1Y", "range.lower": "P2Y", "range.upper": "P50Y"}
  - {"value": "P1M", "range.lower": "P2M", "range.upper": "P50M"}
  - {"value": "P1D", "range.lower": "P2D", "range.upper": "P50D"}
  - {"value": "P1Y2M", "range.lower": "P2Y", "range.upper": "P50Y"}
  - {"value": "P2W", "range.lower": "P3W", "range.upper": "P3W"}
  - {"value": "P2W3D", "range.lower": "P3W", "range.upper": "P4W"}
