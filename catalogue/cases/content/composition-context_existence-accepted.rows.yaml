# The rows of CONT-COMPOSITION-context_existence this workflow carries; the recipe builds each
# row's composition and operational template from its literals.
workflow: content_composition/composition-context_existence-accepted
iteration: reset_per_row
literals: ["context_existence", "context_committed"]
recipe:
  name: content_synthesized
  rm_class: COMPOSITION
  template_id: cnf.tpl.ecc_composition_context_existence
  input: composition
  template_input: template
rows:
  - {"context_existence": "optional", "context_committed": "absent"}
