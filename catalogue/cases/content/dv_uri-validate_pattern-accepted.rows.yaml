# The rows of CONT-DV_URI-validate_pattern this workflow carries; the recipe builds each
# row's composition and operational template from its literals.
workflow: dv_uri/dv_uri-validate_pattern-accepted
iteration: reset_per_row
literals: ["value", "C_STRING.pattern"]
recipe:
  name: content_synthesized
  rm_class: DV_URI
  template_id: cnf.tpl.dv_uri_c_string
  input: composition
  template_input: template
rows:
  - {"value": "https://cabolabs.com", "C_STRING.pattern": "https://.*"}
