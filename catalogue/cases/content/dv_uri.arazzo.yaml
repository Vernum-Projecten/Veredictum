              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

  - workflowId: dv_uri-validate_open-value_missing
    x-veredictum-control: dv_uri-validate_open-accepted
    summary: "DV_URI open: only missing or empty values are rejected: no value is refused with 422"
    description: >-
      Commits the rows' content against the template (DV_URI open: only
      missing or empty values are rejected). Each body lacks a member the RM
      makes mandatory (no value). The published ITS-JSON schema
      (openehr_rm_1.1.0_all.json) does not require the member, so the body is
      schema-valid and breaks the RM, and the commit is refused with 422
      Unprocessable Entity.
    dependsOn: [$sourceDescriptions.templates.upload_template-dv_uri_open]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_uri.adoc
      section: "DV_URI Class"
      quote: "h|*1..1* |*value*: `link:/releases/BASE/{base_release}/foundation_types.html#_string_class[String^]`"
      report: 724
    inputs:
      type: object
      required: [composition]
      properties:
        "value": { type: "null" }
        composition: { type: object }
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
