          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

  - workflowId: dv_uri-validate_pattern-c_string_pattern
    x-veredictum-control: dv_uri-validate_pattern-accepted
    summary: "DV_URI against a C_STRING.pattern (https://.*): a string the C_STRING pattern does not match is refused with 422"
    description: >-
      Commits the rows' content against the template (DV_URI against a
      C_STRING.pattern (https://.*)). Each body passes the published ITS-JSON
      schema and breaks the rule this workflow cites (a string the C_STRING
      pattern does not match), so the commit is refused with 422 Unprocessable
      Entity.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: "Constraints on String > Regular Expression"
      quote: "The first two are identical, indicating that the attribute value must match the supplied regular expression."
    inputs:
