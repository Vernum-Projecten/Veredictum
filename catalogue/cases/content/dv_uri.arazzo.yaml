          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/422.yaml
              section: "description"
              quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."

  - workflowId: dv_uri-validate_open-value_valid
    x-veredictum-control: dv_uri-validate_open-accepted
    summary: "DV_URI open: only missing or empty values are rejected: a breach of the Value_valid invariant is refused with 422"
    description: >-
      Commits the rows' content against the template (DV_URI open: only
      missing or empty values are rejected). Each body passes the published
      ITS-JSON schema and breaks the rule this workflow cites (a breach of the
      Value_valid invariant), so the commit is refused with 422 Unprocessable
      Entity.
    dependsOn: [$sourceDescriptions.templates.upload_template-dv_uri_open]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_uri.adoc
      section: "DV_URI Class"
      quote: "__Value_valid__: `not value.is_empty`"
    inputs:
      type: object
      required: [composition]
      properties:
        "value": { type: "string" }
        composition: { type: object }
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
