# The rows of CONT-DV_PROPORTION-validate_percent this workflow carries; the recipe builds each
# row's composition from its literals.
workflow: dv_proportion/dv_proportion-validate_percent-accepted
iteration: reset_per_row
literals: ["type", "numerator", "denominator", "precision"]
recipe:
  name: content_instance
  rm_class: DV_PROPORTION
  template_id: cnf.tpl.proportion_type_percent
  input: composition
rows:
  - {"type": 2, "numerator": 10, "denominator": 100, "precision": 0}
