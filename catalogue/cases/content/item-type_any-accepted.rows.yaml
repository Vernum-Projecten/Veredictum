# The rows of CONT-ITEM-type_any this workflow carries; the recipe builds each
# row's composition and operational template from its literals.
workflow: content_item/item-type_any-accepted
iteration: reset_per_row
literals: ["slot_type", "committed_type"]
recipe:
  name: content_synthesized
  rm_class: ITEM
  template_id: cnf.tpl.ecc_item_type_narrowing
  input: composition
  template_input: template
rows:
  - {"slot_type": "ITEM", "committed_type": "CLUSTER"}
  - {"slot_type": "ITEM", "committed_type": "ELEMENT"}
