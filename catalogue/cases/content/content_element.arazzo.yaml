# Content validation of ELEMENT at a COMPOSITION commit, as
# Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS. Each
# workflow commits the compositions of its rows file, which the rows file's
# recipe builds from the decision-table literals, and every row of a workflow
# shares its outcome. Every criterion resolves to an `x-veredictum-cite`, and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content validation, ELEMENT
  version: 0.1.0
  description: >-
    Commits ELEMENT content against templates that constrain it.
    Content the template and the RM admit is created (201). A body the
    published ITS-JSON schema (openehr_rm_1.1.0_all.json) refuses is
    syntactically invalid content and is answered 400; a schema-valid body
    the template does not validate, or that breaks an RM invariant, is
    answered 422.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: element-value_null_flavour_existence-accepted
    summary: "ELEMENT.value / ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM null-flavour invariant: content the template admits is created"
    description: >-
      Commits the rows' content against the template (ELEMENT.value /
      ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM
      null-flavour invariant). Each row is content the template and the RM
      admit, so the commit is answered 201 Created.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: "Overview"
      quote: "cADL is used both at \"design time\", by authors and/or tools, and at runtime, by computational systems which validate data by comparing it to the appropriate sections of cADL in an archetype."
    inputs:
      type: object
      required: [composition, template]
      properties:
        "value_existence": { type: "string" }
        "null_flavour_existence": { type: "string" }
        "value_committed": { type: "string" }
        "null_flavour_committed": { type: "string" }
        composition: { type: object }
        template: { type: string }
    steps:
      - stepId: upload-template
        description: Upload the row's operational template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: $inputs.template
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(201|409)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
              section: "description"
              quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

  - workflowId: element-value_null_flavour_existence-inv_null_flavour_indicated
    summary: "ELEMENT.value / ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM null-flavour invariant: a breach of the Inv_null_flavour_indicated invariant is refused with 422"
    description: >-
      Commits the rows' content against the template (ELEMENT.value /
      ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM
      null-flavour invariant). Each body passes the published ITS-JSON schema
      and breaks the rule this workflow cites (a breach of the
      Inv_null_flavour_indicated invariant), so the commit is refused with 422
      Unprocessable Entity.
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/element.adoc
      section: "ELEMENT Class"
      quote: "__Inv_null_flavour_indicated__: `is_null() xor null_flavour = Void`"
    inputs:
      type: object
      required: [composition, template]
      properties:
        "value_existence": { type: "string" }
        "null_flavour_existence": { type: "string" }
        "value_committed": { type: "string" }
        "null_flavour_committed": { type: "string" }
        composition: { type: object }
        template: { type: string }
    steps:
      - stepId: upload-template
        description: Upload the row's operational template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: $inputs.template
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(201|409)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
              section: "description"
              quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/422.yaml
              section: "description"
              quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."

  - workflowId: element-value_null_flavour_existence-c_attribute_existence
    summary: "ELEMENT.value / ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM null-flavour invariant: an attribute present or absent against its existence is refused with 422"
    description: >-
      Commits the rows' content against the template (ELEMENT.value /
      ELEMENT.null_flavour against C_ATTRIBUTE.existence and the RM
      null-flavour invariant). Each body passes the published ITS-JSON schema
      and breaks the rule this workflow cites (an attribute present or absent
      against its existence), so the commit is refused with 422 Unprocessable
      Entity.
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: "Existence"
      quote: "indicates whether the object to which the attribute refers is mandatory or optional in the data."
    inputs:
      type: object
      required: [composition, template]
      properties:
        "value_existence": { type: "string" }
        "null_flavour_existence": { type: "string" }
        "value_committed": { type: "string" }
        "null_flavour_committed": { type: "string" }
        composition: { type: object }
        template: { type: string }
    steps:
      - stepId: upload-template
        description: Upload the row's operational template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl1.4_upload
        parameters:
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: $inputs.template
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(201|409)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/409_template_already_exists.yaml
              section: "description"
              quote: "`409 Conflict` is returned when a template with same `template_id` already exists."
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/422.yaml
              section: "description"
              quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."
