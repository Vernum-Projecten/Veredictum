  - workflowId: dv_boolean-only_false_allowed-c_boolean_true_valid
    x-veredictum-control: dv_boolean-only_false_allowed-accepted
    summary: "DV_BOOLEAN against a C_BOOLEAN that permits only false: a true value the C_BOOLEAN does not allow is refused with 422"
    description: >-
      Commits the rows' content against the template (DV_BOOLEAN against a
      C_BOOLEAN that permits only false). Each body passes the published
      ITS-JSON schema and breaks the rule this workflow cites (a true value
      the C_BOOLEAN does not allow), so the commit is refused with 422
      Unprocessable Entity.
    dependsOn: [$sourceDescriptions.templates.upload_template-dv_boolean_only_false]
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL1.4/master05-cadl.adoc
      section: "Constraints on Boolean"
      quote: "Boolean runtime values can be constrained to be True, False, or either, as follows:"
      level: may
    inputs:
      type: object
      required: [composition]
      properties:
        "value": { type: "boolean" }
        "C_BOOLEAN.true_valid": { type: "boolean" }
        "C_BOOLEAN.false_valid": { type: "boolean" }
