              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."

  - workflowId: dv_ordinal-validate_open-value_symbol_missing
    summary: "DV_ORDINAL against an open C_DV_ORDINAL ({*}): symbol/value mandatory: a body with no value and no symbol is refused with 400"
    description: >-
      Commits the rows' content against the template (DV_ORDINAL against an
      open C_DV_ORDINAL ({*}): symbol/value mandatory). Each body lacks a
      member the RM makes mandatory (no value and no symbol), which the
      published ITS-JSON schema (openehr_rm_1.1.0_all.json) refuses, so it is
      syntactically invalid content and the commit is refused with 400 Bad
      Request.
    dependsOn: [$sourceDescriptions.templates.upload_template-ordinal_open]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_ordinal.adoc
      section: "DV_ORDINAL Class"
      quote: "h|*1..1* |*symbol*: `<<_dv_coded_text_class,DV_CODED_TEXT>>`"
    inputs:
      type: object
      required: [composition]
      properties:
        "symbol": { type: "null" }
        "value": { type: "null" }
        composition: { type: object }
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
