# The rows of CONT-DV_QUANTITY-validate_property_units this workflow carries; the recipe builds each
# row's composition from its literals.
workflow: dv_quantity/dv_quantity-validate_property_units-accepted
iteration: reset_per_row
literals: ["magnitude", "units"]
recipe:
  name: content_instance
  rm_class: DV_QUANTITY
  template_id: cnf.tpl.quantity_property_units
  input: composition
rows:
  - {"magnitude": 0.0, "units": "cm"}
  - {"magnitude": 1.0, "units": "cm"}
  - {"magnitude": 5.7, "units": "cm"}
  - {"magnitude": 10.0, "units": "cm"}
