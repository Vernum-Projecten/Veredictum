# Content validation of DV_CODED_TEXT at a COMPOSITION commit, as
# Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS. Each
# workflow commits the compositions of its rows file, which the rows file's
# recipe builds from the decision-table literals, and every row of a workflow
# shares its outcome. Every criterion resolves to an `x-veredictum-cite`, and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content validation, DV CODED TEXT
  version: 0.1.0
  description: >-
    Commits DV_CODED_TEXT content against templates that constrain it.
    Content the template and the RM admit is created (201). A body the
    published ITS-JSON schema (openehr_rm_1.1.0_all.json) refuses is
    syntactically invalid content and is answered 400; a schema-valid body
    the template does not validate, or that breaks an RM invariant, is
    answered 422.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
  - name: templates
    url: ../_setup/content_templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: dv_coded_text-validate_ext_term-code_string_terminology_id_missing
    x-veredictum-control: { pending: 836 }
    summary: "DV_CODED_TEXT against a CONSTRAINT_REF with a constraint_binding: a body with no defining_code is refused with 400"
    description: >-
      Commits the rows' content against the template (DV_CODED_TEXT against a
      CONSTRAINT_REF with a constraint_binding). Each body lacks a member the
      RM makes mandatory (no defining_code), which the published ITS-JSON
      schema (openehr_rm_1.1.0_all.json) refuses, so it is syntactically
      invalid content and the commit is refused with 400 Bad Request.
    dependsOn: [$sourceDescriptions.templates.upload_template-dv_coded_text_constraint_ref]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_coded_text.adoc
      section: "DV_CODED_TEXT Class"
      quote: "h|*1..1* |*defining_code*: `<<_code_phrase_class,CODE_PHRASE>>`"
    inputs:
      type: object
      required: [composition]
      properties:
        "code_string": { type: "null" }
        "terminology_id": { type: "null" }
        "value": { type: "null" }
        "CONSTRAINT_REF.reference": { type: "string" }
        "constraint_bindings": { type: "string" }
        composition: { type: object }
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - stepId: commit
        description: Commit the row's composition.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400.yaml
              section: "description"
              quote: "`400 Bad Request` is returned when the request could not be parsed or is invalid (e.g. malformed request URL syntax, missing required header or parameter, or syntactically invalid header, parameter or content)."

