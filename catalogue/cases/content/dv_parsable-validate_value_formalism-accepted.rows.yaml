workflow: dv_parsable/dv_parsable-validate_value_formalism-accepted
iteration: reset_per_row
literals: ["value", "formalism", "C_STRING.pattern (value)", "C_STRING.list (value)", "C_STRING.pattern (formalism)", "C_STRING.list (formalism)"]
recipe:
