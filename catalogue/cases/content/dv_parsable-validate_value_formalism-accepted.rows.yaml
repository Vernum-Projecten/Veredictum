  - {"value": "xxx", "formalism": "abc", "C_STRING.pattern (value)": null, "C_STRING.list (value)": "[xxx, yyy, zzz]", "C_STRING.pattern (formalism)": null, "C_STRING.list (formalism)": "[abc, bbb, aaa]"}
