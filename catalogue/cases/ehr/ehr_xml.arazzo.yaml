# The EHR reads in canonical XML, for a service that serves the EHR resource
# in XML. Which of the two conformant answers a service gives to
# `Accept: application/xml` is the service's choice, so this document is the
# served arm and `ehr_xml_not_acceptable.arazzo.yaml` the refused one; a
# statement selects one of them. Every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: EHR reads in canonical XML
  version: 0.1.0
  description: >-
    Reading an EHR by id and by subject with Accept application/xml from a
    service that serves the EHR resource in canonical XML.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: get_ehr-xml
    summary: An EHR read with Accept application/xml is answered in XML
    description: >-
      Creates an EHR, then retrieves it by its ehr_id asking for canonical
      XML. The answer is 200 with Content-Type application/xml and no
      Location header.
    x-veredictum-cite: &xml_served
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "Proper header `Content-Type: application/xml` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: setup
        description: Create the EHR the read addresses.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &ehr_created
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - &etag_weak
            context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: Deprecated headers
              quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
      - stepId: get
        description: Retrieve the EHR by its ehr_id in canonical XML.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/xml }
        successCriteria: &xml_read_criteria
          - condition: $statusCode == 200
            x-veredictum-cite: &ehr_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/xml'
          - condition: $response.header.Location == null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: Location
              quote: "It MUST NOT be used to indicate an alternate representation of an existing resource (e.g. via `GET` method)."
          - *etag_weak

  - workflowId: get_ehr-by_subject-xml
    summary: An EHR read by subject with Accept application/xml is answered in XML
    description: >-
      Creates an EHR whose EHR_STATUS names a subject, then retrieves the EHR
      by that subject asking for canonical XML. The answer is 200 with
      Content-Type application/xml and no Location header.
    x-veredictum-cite: *xml_served
    inputs:
      type: object
      properties:
        subject_id: { type: string, format: uuid }
    steps:
      - stepId: setup
        description: Create an EHR whose EHR_STATUS names the subject.
        operationId: $sourceDescriptions.ehr.ehr_create
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject:
              _type: PARTY_SELF
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: replaced-by-subject_id }
                namespace: veredictum
                type: PERSON
            is_queryable: true
            is_modifiable: true
          replacements:
            - target: /subject/external_ref/id/value
              value: $inputs.subject_id
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *ehr_created
          - *etag_weak
      - stepId: get
        description: Retrieve the EHR by the subject's id and namespace in canonical XML.
        operationId: $sourceDescriptions.ehr.ehr_get_by_subject
        parameters:
          - { name: subject_id, in: query, value: $inputs.subject_id }
          - { name: subject_namespace, in: query, value: veredictum }
          - { name: Accept, in: header, value: application/xml }
        successCriteria: *xml_read_criteria
