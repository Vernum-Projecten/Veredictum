# Deleting a subset of EHRs through the Admin API when the bulk delete is
# enabled and the service deletes synchronously: the 204, the named EHRs and
# what they owned gone, and the unnamed EHR kept, as Arazzo 1.1.0 workflows
# over the released ITS-REST `-validation` OAS. The Admin API is in the
# `DEVELOPMENT` state in Release-1.1.0; the operation text it states is what
# these workflows assert. Every administrative step is sent as the
# administrative principal the party supplies, and a party that supplies none
# has these workflows skipped as not declared. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Admin bulk EHR delete, synchronous
  version: 0.1.0
  description: >-
    Deleting the EHRs the ehr_id query parameter names with DELETE
    /admin/ehr/all on a service that has the bulk delete enabled and
    processes it synchronously.
sourceDescriptions:
  - name: admin
    url: ../../../specs/rest-oas/admin-validation.openapi.yaml
    type: openapi
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: delete_all-subset
    summary: A bulk delete of a subset of EHRs is answered 204
    description: >-
      Creates an EHR, then deletes it through the bulk delete, naming it in
      the ehr_id query parameter. The service processes the deletion
      synchronously, so the delete is answered 204 No Content.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete_all.yaml
      section: description
      quote: "If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - &ehr_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &delete
        stepId: delete
        description: Delete the EHR the ehr_id query parameter names, as the administrative principal.
        operationId: $sourceDescriptions.admin.admin_ehr_delete_all
        x-veredictum-principal: administrative
        parameters:
          - { name: ehr_id, in: query, value: [$inputs.ehr_id] }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_deleted_hard.yaml
              section: description
              quote: "`204 No Content` is returned when the requested operation succeeded and the resource(s) identified by the request parameters has been physically deleted (i.e. hard-delete)."

  - workflowId: delete_all-subset-read_back
    summary: A bulk delete of a subset deletes the named EHR and keeps the others
    description: >-
      Creates two EHRs, deletes the first through the bulk delete, naming it
      in the ehr_id query parameter, then retrieves both. The named EHR is
      answered 404 Not Found, and the EHR the parameter did not name is still
      retrieved.
    x-veredictum-cite: &subset
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete_all.yaml
      section: description
      quote: "Deletes all or multiple EHRs, or a specified subset of EHRs identified using the `ehr_id` query parameter."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        kept_ehr_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - stepId: create-kept
        description: Create the EHR the delete does not name.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.kept_ehr_id }
        successCriteria:
          - *ehr_created
      - *delete
      - stepId: get
        description: Retrieve the deleted EHR.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
      - &get_kept
        stepId: get-kept
        description: Retrieve the EHR the delete did not name.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.kept_ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."

  - workflowId: delete_all-subset_repeated
    summary: A bulk delete naming two EHRs deletes both and keeps the others
    description: >-
      Creates three EHRs, deletes the first two through the bulk delete,
      naming each in its own ehr_id query parameter (the exploded form style
      the parameter declares), then retrieves all three. Both named EHRs are
      answered 404 Not Found, and the third is still retrieved. The
      parameter's schema types a single identifier while its example lists
      two, upstream report #735.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete_all.yaml
      section: description
      quote: "Deletes all or multiple EHRs, or a specified subset of EHRs identified using the `ehr_id` query parameter."
      report: 735
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        second_ehr_id: { type: string, format: uuid }
        kept_ehr_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - stepId: create-second
        description: Create the second EHR the delete names.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.second_ehr_id }
        successCriteria:
          - *ehr_created
      - stepId: create-kept
        description: Create the EHR the delete does not name.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.kept_ehr_id }
        successCriteria:
          - *ehr_created
      - stepId: delete
        description: Delete the two EHRs the repeated ehr_id query parameter names, as the administrative principal.
        operationId: $sourceDescriptions.admin.admin_ehr_delete_all
        x-veredictum-principal: administrative
        parameters:
          - { name: ehr_id, in: query, value: [$inputs.ehr_id, $inputs.second_ehr_id] }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_deleted_hard.yaml
              section: description
              quote: "`204 No Content` is returned when the requested operation succeeded and the resource(s) identified by the request parameters has been physically deleted (i.e. hard-delete)."
      - stepId: get
        description: Retrieve the first deleted EHR.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
      - stepId: get-second
        description: Retrieve the second deleted EHR.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.second_ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
      - *get_kept

  - workflowId: delete_all-composition_gone
    summary: A COMPOSITION of an EHR a bulk delete names is no longer retrieved
    description: >-
      Creates an EHR, commits a CONTRIBUTION that creates a COMPOSITION in it,
      deletes the EHR through the bulk delete, then retrieves the COMPOSITION
      by its version_uid. The COMPOSITION was deleted with the EHR that owned
      it, so the read is answered 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &cascade
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete_all.yaml
      section: description
      quote: "All resources associated with or owned by the targeted EHRs (such as COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also be **permanently** and physically deleted, in compliance with applicable data protection regulations (e.g., the GDPR in the European Union)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit
        stepId: commit
        description: >-
          Commit a CONTRIBUTION whose one member creates an event COMPOSITION,
          and keep the contribution uid and the version_uid the representation
          reports.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &contribution
            versions:
              - &creation_member
                lifecycle_state: &complete
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: &composition
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs:
          contribution_uid: $response.body#/uid/value
          version_uid: $response.body#/versions/0/id/value
      - *delete
      - stepId: get-composition
        description: Retrieve the COMPOSITION by the version_uid the CONTRIBUTION reported.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_no_version_at_time.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist,"

  - workflowId: delete_all-contribution_gone
    summary: A CONTRIBUTION of an EHR a bulk delete names is no longer retrieved
    description: >-
      Creates an EHR, commits a CONTRIBUTION in it, deletes the EHR through
      the bulk delete, then retrieves the CONTRIBUTION by its uid. The
      CONTRIBUTION was deleted with the EHR that owned it, so the read is
      answered 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *cascade
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - *delete
      - stepId: get-contribution
        description: Retrieve the CONTRIBUTION by the uid the commit reported.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_CONTRIBUTION.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a CONTRIBUTION with `contribution_uid` does not exist."
