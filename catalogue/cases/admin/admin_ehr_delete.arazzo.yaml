# Deleting one EHR through the Admin API when the service deletes
# synchronously: the 204, the EHR and what it owned gone afterwards, and the
# ehr_id free again, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. The Admin API is in the `DEVELOPMENT` state in
# Release-1.1.0; the operation text it states is what these workflows assert.
# Every administrative step is sent as the administrative principal the party
# supplies, and a party that supplies none has these workflows skipped as not
# declared. Every criterion resolves to an `x-veredictum-cite` (its own, else
# its step's, else its workflow's), and every quote is copied verbatim from
# the named vendored file.
arazzo: 1.1.0
info:
  title: Admin EHR delete, synchronous
  version: 0.1.0
  description: >-
    Deleting one EHR with DELETE /admin/ehr/{ehr_id} on a service that
    processes the deletion synchronously.
sourceDescriptions:
  - name: admin
    url: ../../../specs/rest-oas/admin-validation.openapi.yaml
    type: openapi
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: delete_ehr
    summary: An EHR deleted through the Admin API is answered 204
    description: >-
      Creates an EHR, then deletes it through the Admin API. The service
      processes the deletion synchronously, so the delete is answered 204 No
      Content.
    x-veredictum-cite: &synchronous
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete.yaml
      section: description
      quote: "If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - &ehr_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &delete
        stepId: delete
        description: Delete the EHR through the Admin API as the administrative principal.
        operationId: $sourceDescriptions.admin.admin_ehr_delete
        x-veredictum-principal: administrative
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_deleted_hard.yaml
              section: description
              quote: "`204 No Content` is returned when the requested operation succeeded and the resource(s) identified by the request parameters has been physically deleted (i.e. hard-delete)."

  - workflowId: delete_ehr-read_back
    summary: An EHR deleted through the Admin API is no longer retrieved
    description: >-
      Creates an EHR, deletes it through the Admin API, then retrieves it. The
      EHR was physically deleted, so the read is answered 404 Not Found.
    x-veredictum-cite: &cascade
      source: specs/openehr/ITS-REST/specifications/operations/admin_ehr_delete.yaml
      section: description
      quote: "All resources associated with or owned by the specified EHR (such as COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also be **permanently** and physically deleted, in compliance with applicable data protection regulations (e.g., the GDPR in the European Union)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *delete
      - stepId: get
        description: Retrieve the deleted EHR.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."

  - workflowId: delete_ehr-composition_gone
    summary: A COMPOSITION of an EHR deleted through the Admin API is no longer retrieved
    description: >-
      Creates an EHR, commits a CONTRIBUTION that creates a COMPOSITION in it,
      deletes the EHR through the Admin API, then retrieves the COMPOSITION by
      its version_uid. The COMPOSITION was deleted with the EHR that owned it,
      so the read is answered 404 Not Found. No released read can look inside
      a deleted EHR, so the 404 is the observable form of the deletion.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *cascade
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit
        stepId: commit
        description: >-
          Commit a CONTRIBUTION whose one member creates an event COMPOSITION,
          and keep the contribution uid and the version_uid the representation
          reports.
        operationId: $sourceDescriptions.ehr.contribution_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &contribution
            versions:
              - &creation_member
                lifecycle_state: &complete
                  _type: DV_CODED_TEXT
                  value: complete
                  defining_code: { terminology_id: { value: openehr }, code_string: "532" }
                commit_audit: &creation_audit
                  _type: UPDATE_AUDIT
                  change_type:
                    _type: DV_CODED_TEXT
                    value: creation
                    defining_code: { terminology_id: { value: openehr }, code_string: "249" }
                  committer: { _type: PARTY_IDENTIFIED, name: Veredictum }
                data: &composition
                  _type: COMPOSITION
                  name: { _type: DV_TEXT, value: content case carrier }
                  archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
                  archetype_details:
                    _type: ARCHETYPED
                    archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
                    template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
                    rm_version: 1.0.2
                  language:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                    code_string: en
                  territory:
                    _type: CODE_PHRASE
                    terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
                    code_string: NL
                  category:
                    _type: DV_CODED_TEXT
                    value: event
                    defining_code:
                      _type: CODE_PHRASE
                      terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                      code_string: "433"
                  composer: { _type: PARTY_SELF }
                  context:
                    _type: EVENT_CONTEXT
                    start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                    setting:
                      _type: DV_CODED_TEXT
                      value: other care
                      defining_code:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                        code_string: "238"
                  content:
                    - _type: OBSERVATION
                      name: { _type: DV_TEXT, value: content observation }
                      archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                      archetype_details:
                        _type: ARCHETYPED
                        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                        rm_version: 1.0.2
                      language:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                        code_string: en
                      encoding:
                        _type: CODE_PHRASE
                        terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                        code_string: UTF-8
                      subject: { _type: PARTY_SELF }
                      data:
                        _type: HISTORY
                        name: { _type: DV_TEXT, value: history }
                        archetype_node_id: at0001
                        origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                        events:
                          - _type: POINT_EVENT
                            name: { _type: DV_TEXT, value: any event }
                            archetype_node_id: at0002
                            time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                            data:
                              _type: ITEM_TREE
                              name: { _type: DV_TEXT, value: tree }
                              archetype_node_id: at0003
                              items:
                                - _type: ELEMENT
                                  name: { _type: DV_TEXT, value: value }
                                  archetype_node_id: at0004
                                  value: { _type: DV_COUNT, magnitude: 15 }
            audit: *creation_audit
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_CONTRIBUTION.yaml
              section: description
              quote: "`201 Created` is returned when the CONTRIBUTION is successfully created."
        outputs:
          contribution_uid: $response.body#/uid/value
          version_uid: $response.body#/versions/0/id/value
      - *delete
      - stepId: get-composition
        description: Retrieve the COMPOSITION by the version_uid the CONTRIBUTION reported.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_no_version_at_time.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist,"

  - workflowId: delete_ehr-contribution_gone
    summary: A CONTRIBUTION of an EHR deleted through the Admin API is no longer retrieved
    description: >-
      Creates an EHR, commits a CONTRIBUTION in it, deletes the EHR through the
      Admin API, then retrieves the CONTRIBUTION by its uid. The CONTRIBUTION
      was deleted with the EHR that owned it, so the read is answered 404 Not
      Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *cascade
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - *delete
      - stepId: get-contribution
        description: Retrieve the CONTRIBUTION by the uid the commit reported.
        operationId: $sourceDescriptions.ehr.contribution_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: contribution_uid, in: path, value: $steps.commit.outputs.contribution_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_CONTRIBUTION.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a CONTRIBUTION with `contribution_uid` does not exist."

  - workflowId: delete_ehr-recreate
    summary: The ehr_id of an EHR deleted through the Admin API carries a new EHR
    description: >-
      Creates an EHR with a client-supplied ehr_id, deletes it through the
      Admin API, then creates an EHR with the same ehr_id. The first EHR was
      physically deleted, so no EHR with that ehr_id exists: the create is
      answered 201 Created, and the EHR read under the ehr_id is the new one.
    x-veredictum-cite: *cascade
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *delete
      - stepId: create-again
        description: Create an EHR with the ehr_id of the deleted one.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - *ehr_created
      - stepId: get
        description: Retrieve the new EHR under the reused ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
          - context: $response.body#/ehr_id/value
            type: regex
            condition: '^{$inputs.ehr_id}$'
