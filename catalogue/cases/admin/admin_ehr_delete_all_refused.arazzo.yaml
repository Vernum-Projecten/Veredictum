# A bulk delete through the Admin API that names a malformed ehr_id, as Arazzo
# 1.1.0 workflows over the released ITS-REST `-validation` OAS. The Admin API
# is in the `DEVELOPMENT` state in Release-1.1.0; the operation text it states
# is what these workflows assert. Every administrative step is sent as the
# administrative principal the party supplies, and a party that supplies none
# has these workflows skipped as not declared. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Admin bulk EHR delete refused
  version: 0.1.0
  description: >-
    A bulk delete with DELETE /admin/ehr/all whose ehr_id query parameter
    carries a value that is not a UUID, on a service that has the bulk
    delete enabled.
sourceDescriptions:
  - name: admin
    url: ../../../specs/rest-oas/admin-validation.openapi.yaml
    type: openapi
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: admin_ehr_delete_all
    url: admin_ehr_delete_all.arazzo.yaml
    type: arazzo
  - name: admin_ehr_delete_all_async
    url: admin_ehr_delete_all_async.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: delete_all-malformed_id
    x-veredictum-control: [$sourceDescriptions.admin_ehr_delete_all.delete_all-subset, $sourceDescriptions.admin_ehr_delete_all_async.delete_all-accepted]
    summary: A bulk delete naming a malformed ehr_id is refused with 400 and deletes nothing
    description: >-
      Creates an EHR, then deletes through the bulk delete with the ehr_id
      query parameter naming that EHR and a value that is not a UUID. The
      parameter's schema is a string of format uuid
      (parameters/query/ehr_id_Admin.yaml), so the value is a syntactically
      invalid parameter and the request is answered 400 Bad Request. A
      request the service will not process is not applied, so the EHR it
      named is still retrieved.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - &ehr_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: delete
        description: Delete the EHR and a malformed ehr_id, as the administrative principal.
        operationId: $sourceDescriptions.admin.admin_ehr_delete_all
        x-veredictum-principal: administrative
        parameters:
          - { name: ehr_id, in: query, value: [$inputs.ehr_id, not-an-ehr-id] }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400.yaml
              section: description
              quote: "`400 Bad Request` is returned when the request could not be parsed or is invalid (e.g. malformed request URL syntax, missing required header or parameter, or syntactically invalid header, parameter or content)."
      - stepId: get
        description: Retrieve the EHR the refused delete named.
        operationId: $sourceDescriptions.ehr.ehr_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR resource is successfully retrieved."
