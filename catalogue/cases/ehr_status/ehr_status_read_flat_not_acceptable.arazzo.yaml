# The EHR_STATUS answered in the Simplified Flat JSON format, for a service
# that does not serve it: the refusing arm of the `ehr-status-flat-read`
# option. The release defines no EHR_STATUS form in the format (upstream
# report #785), so the serving arm has no document. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: EHR_STATUS answered in the Simplified Flat format, refused
  version: 0.1.0
  description: >-
    Reading an EHR_STATUS, latest and by version_uid, and updating one with
    Accept application/openehr.wt.flat+json from a service that does not
    serve the Simplified Flat JSON format.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: get_ehr_status-flat_not_acceptable
    summary: An EHR_STATUS read asking for Simplified Flat JSON is refused with 406
    description: >-
      Creates an EHR, then retrieves its latest EHR_STATUS with Accept
      application/openehr.wt.flat+json from a service that does not serve
      the format. The read is refused with 406 Not Acceptable.
    x-veredictum-cite: &refused
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id and the default EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: get
        description: Retrieve the latest EHR_STATUS in the Simplified Flat JSON format.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/openehr.wt.flat+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_ehr_status-by_version_id-flat_not_acceptable
    summary: An EHR_STATUS read by version_uid asking for Simplified Flat JSON is refused with 406
    description: >-
      Creates an EHR, notes the version_uid of its EHR_STATUS, then retrieves
      that version with Accept application/openehr.wt.flat+json from a
      service that does not serve the format. The read is refused with 406
      Not Acceptable.
    x-veredictum-cite: *refused
    inputs: *ehr_input
    steps:
      - *create
      - &current
        stepId: current
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the EHR_STATUS by its version_uid in the Simplified Flat JSON format.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/openehr.wt.flat+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: update-flat_not_acceptable
    summary: An EHR_STATUS update asking for the result in Simplified Flat JSON is refused with 406
    description: >-
      Creates an EHR, then updates its EHR_STATUS with a canonical JSON body
      under the current version in If-Match, with Prefer
      return=representation and Accept application/openehr.wt.flat+json,
      from a service that does not serve the format. The update is refused
      with 406 Not Acceptable.
    x-veredictum-cite: *refused
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: update
        description: Update the EHR_STATUS and ask for the result in the Simplified Flat JSON format.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/openehr.wt.flat+json }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: false
            is_modifiable: true
        successCriteria:
          - condition: $statusCode == 406
