# The 400 rows of the EHR_STATUS update: an EHR_STATUS with one member the
# released request-body schema requires deleted and nothing else changed.
workflow: ehr_status_update/update-invalid_status-missing_required
iteration: reset_per_row
rows:
  # is_queryable deleted
  - ehr_status:
      _type: EHR_STATUS
      archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
      name: { _type: DV_TEXT, value: EHR status }
      archetype_details:
        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
        rm_version: 1.1.0
      subject: { _type: PARTY_SELF }
      is_modifiable: true
  # is_modifiable deleted
  - ehr_status:
      _type: EHR_STATUS
      archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
      name: { _type: DV_TEXT, value: EHR status }
      archetype_details:
        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
        rm_version: 1.1.0
      subject: { _type: PARTY_SELF }
      is_queryable: true
  # subject deleted
  - ehr_status:
      _type: EHR_STATUS
      archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
      name: { _type: DV_TEXT, value: EHR status }
      archetype_details:
        archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
        rm_version: 1.1.0
      is_queryable: true
      is_modifiable: true
