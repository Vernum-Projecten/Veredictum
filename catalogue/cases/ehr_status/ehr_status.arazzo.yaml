# The EHR_STATUS reads, latest, at a time and at a version, as Arazzo 1.1.0
# workflows over the released ITS-REST `-validation` OAS. Every criterion
# resolves to an `x-veredictum-cite` (its own, else its step's, else its
# workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: EHR_STATUS read
  version: 0.1.0
  x-veredictum-section: read
  description: >-
    Reading an EHR's EHR_STATUS: the latest version, the version extant at a
    time, the version a version_uid addresses, the refusals of those reads,
    and the headers their answers carry.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_ehr_status
    summary: The EHR_STATUS of an existing EHR is retrieved
    description: >-
      Creates an EHR with the default EHR_STATUS, then retrieves the
      EHR_STATUS. The answer is 200 in JSON with the default flags and a
      PARTY_SELF subject.
    x-veredictum-cite: &default_status
      source: specs/openehr/ITS-REST/specifications/operations/ehr_create_with_id.yaml
      section: description
      quote: "If not supplied, a default EHR_STATUS will be used by the service with following attributes: - `is_queryable`: true - `is_modifiable`: true - `subject`: a PARTY_SELF object"
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id and the default EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &ehr_created
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: get
        description: Retrieve the EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &status_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR_STATUS_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested EHR_STATUS is successfully retrieved."
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
              section: JSON Format
              quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
          - condition: $response.body#/is_queryable == true
          - condition: $response.body#/is_modifiable == true
          - context: $response.body#/subject/_type
            type: regex
            condition: '^PARTY_SELF$'

  - workflowId: get_ehr_status-unknown_ehr
    summary: A read of the EHR_STATUS of an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves the EHR_STATUS of a freshly generated ehr_id that no EHR
      carries. The read is answered with 404 Not Found.
    x-veredictum-cite: &not_found_at_time
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_no_version_at_time.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a version of the resource identified by the request parameters (at specified `version_at_time`) does not exist."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: get
        description: Retrieve the EHR_STATUS of an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_ehr_status-latest
    summary: A read without version_at_time serves the latest EHR_STATUS version
    description: >-
      Creates an EHR, updates its EHR_STATUS with is_queryable false, then
      retrieves the EHR_STATUS without a version_at_time. The latest version
      is served, so the EHR_STATUS is not queryable.
    x-veredictum-cite: &latest_status
      source: specs/openehr/ITS-REST/specifications/operations/ehr_status_get_at_time.yaml
      section: description
      quote: "If `version_at_time` is supplied, retrieves the version extant _at specified time_, otherwise retrieves the _latest_ EHR_STATUS version."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - &current
        stepId: current
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &latest_version
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - &update
        stepId: update
        description: Update the EHR_STATUS with is_queryable false.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: false
            is_modifiable: true
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_EHR_STATUS_updated.yaml
              section: description
              quote: "`200 OK` is returned when the EHR_STATUS is successfully updated, with the full resource in the response body when `Prefer` header is `return=representation`,"
      - stepId: get
        description: Retrieve the EHR_STATUS without a version_at_time.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - condition: $response.body#/is_queryable == false

  - workflowId: get_ehr_status-at_time_future
    summary: A read at a time after the newest version serves the newest EHR_STATUS version
    description: >-
      Creates an EHR, updates its EHR_STATUS with is_queryable false, then
      retrieves the EHR_STATUS at 2999-01-01. Nothing has superseded the
      newest version at that time, so it is the version extant and is
      served: the EHR_STATUS is not queryable.
    x-veredictum-cite: *latest_status
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - *update
      - stepId: get
        description: Retrieve the EHR_STATUS at a time after the newest version.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_at_time, in: query, value: "2999-01-01T00:00:00.000Z" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - condition: $response.body#/is_queryable == false

  - workflowId: get_ehr_status-at_time_before_first_version
    summary: A read at a time before the first EHR_STATUS version is answered 404
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS at 2000-01-01, long
      before the EHR was created. No version is extant at that time, so the
      read is answered with 404 Not Found.
    x-veredictum-cite: *not_found_at_time
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve the EHR_STATUS at a time before the EHR existed.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_at_time, in: query, value: "2000-01-01T00:00:00Z" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_ehr_status-at_time_malformed
    x-veredictum-control: get_ehr_status-at_time_future
    summary: A read whose version_at_time is not an ISO 8601 datetime is refused as a client error
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS with a version_at_time
      that is no datetime at all. The query parameter breaks the extended ISO
      8601 format the release requires, so the read is answered 400 Bad
      Request.
    x-veredictum-cite: &datetime_format
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Datetime format
      quote: "HTTP query parameters and path segments that are dates, datetimes, or times, MUST always use the _extended_ ISO 8601 format."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve the EHR_STATUS with a malformed version_at_time.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_at_time, in: query, value: not-a-datetime }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: &client_error
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"

  - workflowId: get_ehr_status-by_version_id
    summary: A read by version_uid serves the addressed version, not the latest
    description: >-
      Creates an EHR, notes the version_uid of its first EHR_STATUS, updates
      the EHR_STATUS with is_queryable false, then retrieves the EHR_STATUS
      by the first version_uid. The addressed version is served, so the
      EHR_STATUS is still queryable.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/ehr_status_get_by_version_id.yaml
      section: description
      quote: "Retrieves a particular version of the EHR_STATUS identified by `version_uid` and associated with the EHR identified by `ehr_id`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - *update
      - stepId: get
        description: Retrieve the EHR_STATUS by the first version_uid.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - condition: $response.body#/is_queryable == true

  - workflowId: get_ehr_status-by_version_id-unknown_version
    summary: A read by a well-formed version_uid that names no version is answered 404
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS by a well-formed
      version_uid whose object_id is freshly generated, so no version
      carries it. The read is answered with 404 Not Found.
    x-veredictum-cite: &not_found_version
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_version_uid.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `version_uid` does not exist."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve the EHR_STATUS by a version_uid no version carries.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: "{$inputs.object_id}::veredictum.example.org::1" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_ehr_status-by_version_id-composition_uid
    summary: A read by the version_uid of a COMPOSITION is answered 404
    description: >-
      Creates an EHR and commits a COMPOSITION to it, then retrieves the
      EHR_STATUS by the COMPOSITION's version_uid. That uid names a version
      of another versioned object, not of the EHR_STATUS, so the read is
      answered with 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *not_found_version
    inputs:
      type: object
      required: [composition]
      properties:
        magnitude: { type: [integer, "null"] }
        composition: { type: object }
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: commit
        description: Commit a COMPOSITION to the EHR and keep its version_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: $inputs.composition
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the EHR_STATUS by the COMPOSITION's version_uid.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_ehr_status-no_location
    summary: An EHR_STATUS read sends no Location header
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS. A read names no newly
      created resource, so the answer carries no Location header.
    x-veredictum-cite: &no_location_on_read
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Location
      quote: "It MUST NOT be used to indicate an alternate representation of an existing resource (e.g. via `GET` method)."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve the EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - &no_location
            condition: $response.header.Location == null

  - workflowId: get_ehr_status-by_version_id-no_location
    summary: An EHR_STATUS read by version_uid sends no Location header
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS by the current
      version_uid. A read names no newly created resource, so the answer
      carries no Location header.
    x-veredictum-cite: *no_location_on_read
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - stepId: get
        description: Retrieve the EHR_STATUS by its version_uid.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - *no_location

  - workflowId: get_ehr_status-etag_weak
    summary: An ETag sent on an EHR_STATUS read carries the weakness indicator
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS. If the answer sends an
      ETag, it is a weak entity tag.
    x-veredictum-cite: &etag_weak_form
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Deprecated headers
      quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve the EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - &etag_weak
            context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'

  - workflowId: get_ehr_status-by_version_id-etag_weak
    summary: An ETag sent on an EHR_STATUS read by version_uid carries the weakness indicator
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS by the current
      version_uid. If the answer sends an ETag, it is a weak entity tag.
    x-veredictum-cite: *etag_weak_form
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - stepId: get
        description: Retrieve the EHR_STATUS by its version_uid.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - *etag_weak

  - workflowId: get_ehr_status-etag_last_modified
    summary: An EHR_STATUS read is answered with ETag and Last-Modified
    description: >-
      Creates an EHR, then retrieves its EHR_STATUS, latest and by
      version_uid. Both answers carry an ETag and a Last-Modified header. The
      headers are recommended, so a row that lacks them is a warning.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: ETag and Last-Modified
      quote: "Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers."
      level: should
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - *current
      - stepId: get
        description: Retrieve the latest EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_status_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - &etag_present
            condition: $response.header.ETag != null
          - &last_modified_present
            condition: $response.header.Last-Modified != null
      - stepId: get-by-version
        description: Retrieve the EHR_STATUS by its version_uid.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: $steps.current.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_retrieved
          - *etag_present
          - *last_modified_present
