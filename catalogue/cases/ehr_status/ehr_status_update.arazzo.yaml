          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *latest_status
          - context: $response.body#/other_details/items/0/value/value
            type: regex
            condition: '^EHR_STATUS other_details round trip$'

  - workflowId: update-client_supplied_uid
    summary: A uid the client puts in an updated EHR_STATUS does not become the version's identifier
    description: >-
      Creates an EHR, then updates its EHR_STATUS with a body that carries a
      uid naming another versioned object. The update is committed under a
      version whose object_id is the EHR_STATUS container's own uid, and the
      client's uid addresses no version.
    x-veredictum-cite: &object_id_copy
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Version Identification
      quote: "in which the `__object_id()__` part is a copy of the `__uid__` of the owning `VERSIONED_OBJECT` version container."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: container
        description: Read the VERSIONED_EHR_STATUS for its uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSIONED_EHR_STATUS.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSIONED_EHR_STATUS is successfully retrieved."
        outputs:
          uid: $response.body#/uid/value
      - *current
      - stepId: update
        description: Update the EHR_STATUS with is_queryable false and a uid of the client's choosing.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            uid: { _type: OBJECT_VERSION_ID, value: "3b6c9f18-0000-4000-8000-0000000004c3::client.example.org::1" }
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: false
            is_modifiable: true
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *status_updated
      - stepId: latest
        description: Read the latest version; its uid belongs to the EHR_STATUS container and it holds the update.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.container.outputs.uid}::'
          - condition: $response.body#/data/is_queryable == false
            x-veredictum-cite: *latest_version
      - stepId: client-uid
        description: Read the EHR_STATUS at the client's uid; no version carries it.
        operationId: $sourceDescriptions.ehr.ehr_status_get_by_version_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: version_uid, in: path, value: "3b6c9f18-0000-4000-8000-0000000004c3::client.example.org::1" }
        successCriteria:
          - condition: $statusCode == 404
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_version_uid.yaml
              section: description
              quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `version_uid` does not exist."

  - workflowId: update-invalid_status-missing_required
