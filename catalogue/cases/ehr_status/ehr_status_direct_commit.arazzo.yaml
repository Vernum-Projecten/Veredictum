# The committal defaults and refusals the development ITS-REST adds for a
# direct EHR_STATUS update: the lifecycle_state an update with no
# openehr-version header commits, and a change type that contradicts the
# method, as Arazzo 1.1.0 workflows over the released ITS-REST `-validation`
# OAS. Every workflow rests on text only the pinned development snapshot
# holds, so a released run skips it as development-only. Every criterion
# resolves to an `x-veredictum-cite` (its own, else its step's, else its
# workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: EHR_STATUS direct commit defaults
  version: 0.1.0
  x-veredictum-section: update
  description: >-
    The lifecycle_state 532 an EHR_STATUS update commits when the client
    sends no openehr-version header, the change type 249 refused with 400 on
    an update, and the change type 250 accepted.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: update-lifecycle_complete_default
    summary: An EHR_STATUS updated with no openehr-version header is committed in the lifecycle_state complete
    description: >-
      Creates an EHR, then updates its EHR_STATUS under an If-Match naming
      the current version with no committal header, and reads the latest
      version. The server sets the lifecycle_state the client did not send
      to 532|complete|.
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "When `lifecycle_state` is not provided by the client, the server MUST set it to `complete` (code `532`)."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id and the default EHR_STATUS.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &current
        stepId: current
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters: &latest_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &latest_version
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: update
        description: Update the EHR_STATUS with is_queryable false under the current version, with no committal header.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
        requestBody: &not_queryable_body
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: false
            is_modifiable: true
        successCriteria:
          - &updated
            context: $statusCode
            type: regex
            condition: '^(200|204)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
      - stepId: latest
        description: Read the latest version of the EHR_STATUS, the one the update committed, and its lifecycle_state.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.current.outputs.version_uid}$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Contributions
              quote: "a new `ORIGINAL_VERSION` whose data contains the updated form of the item content is added to an existing `VERSIONED_OBJECT`;"
          - context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^532$'

  - workflowId: update-change_type_amendment
    summary: An EHR_STATUS update whose openehr-audit-details names the change type amendment is accepted and records it
    description: >-
      Creates an EHR, then updates its EHR_STATUS with an
      openehr-audit-details header naming the change type 250 (amendment),
      which is consistent with a PUT. The update is accepted, and the version
      it commits records the change type 250.
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "A client MAY override the default `change_type` only with a value that is consistent with the operation, for instance `amendment` (code `250`) instead of `modification` on a `PUT`"
      level: may
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: update
        description: Update the EHR_STATUS with the change type 250 in openehr-audit-details.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="250"' }
        requestBody: *not_queryable_body
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(200|204)$'
      - stepId: latest
        description: Read the latest version of the EHR_STATUS and its commit audit.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^250$'
            x-veredictum-cite:
              source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: openehr-version and openehr-audit-details
              quote: "None of these headers are mandatory, but whatever is provided it MUST be merged with the default VERSION and VERSION.audit_details attributes on commit runtime."

  - workflowId: update-change_type_creation_refused
    x-veredictum-control: update-change_type_amendment
    summary: An EHR_STATUS update whose openehr-audit-details names the change type creation is refused with 400
    description: >-
      Creates an EHR, then updates its EHR_STATUS with an
      openehr-audit-details header naming the change type 249 (creation),
      which contradicts a PUT. The update is refused with 400 Bad Request,
      and the latest version is still the one the create committed.
    x-veredictum-cite:
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "a server SHOULD reject a `change_type` that contradicts the method (e.g. `creation` on a `PUT`, or `deleted` on a `POST`) with `400 Bad Request`."
      level: should
    inputs: *ehr_input
    steps:
      - *create
      - *current
      - stepId: update
        description: Update the EHR_STATUS with the change type 249 in openehr-audit-details.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current.outputs.version_uid}"' }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="249"' }
        requestBody: *not_queryable_body
        successCriteria:
          - condition: $statusCode == 400
      - stepId: latest
        description: Read the latest version of the EHR_STATUS; the refused update committed nothing.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.current.outputs.version_uid}$'
