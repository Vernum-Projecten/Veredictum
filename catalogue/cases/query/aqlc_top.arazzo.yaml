# The deprecated TOP modifier, judged for every claimant of the query
# capability. QUERY/docs/AQL/master03-syntax.adoc § TOP: "*Deprecated*:
# Starting with Release 1.1.0, the use of `TOP` modifier is deprecated in
# favour of the `LIMIT` clause combined with `ORDER BY`", yet § SELECT keeps
# it in the grammar ("optionally followed by `TOP` (deprecated - see <<TOP,
# below>>)") and nothing lets a service refuse it. Each workflow carries one
# case of the AQL conformance corpus
# (github.com/Cadasto/aql-conformance at 28749a482a23), named in its
# description; catalogue/id-map.yaml maps every case of the corpus. The case's
# own data is committed by the set-up it names in
# _setup/aql_conformance.arazzo.yaml, and its runtime identifiers reach the
# query as query parameters. Every quote is copied verbatim from the named
# vendored file.
arazzo: 1.1.0
info:
  title: 'AQL conformance: TOP'
  version: 0.1.0
  x-veredictum-section: aql-conformance-corpus
  description: The deprecated TOP modifier, which the released grammar still defines.
sourceDescriptions:
  - name: query
    url: ../../../specs/rest-oas/query-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/aql_conformance.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: paging-select_top_limits_the_rows
    summary: The deprecated SELECT TOP returns no more rows than it names
    description: 'Carries aql-conformance case SELECT.paging.select_top_limits_the_rows (level optional,
      corpus/cases/SELECT/select_top.yaml): over the set-up seed-vital_signs-vital_signs, the query returns
      the rows the case expects.'
    dependsOn:
      - $sourceDescriptions.setup.seed-vital_signs-vital_signs
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TOP
      quote: It starts with keyword `TOP`, followed by an integer number and/or the direction (i.e. `BACKWARD`,
        `FORWARD`), e.g.
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT TOP 1 c/uid/value FROM EHR e CONTAINS COMPOSITION c WHERE e/ehr_id/value = $ehr_id
            query_parameters:
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs-vital_signs.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: '`200 OK` is returned when the server is able to execute the query.'
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: count
              count: 1
