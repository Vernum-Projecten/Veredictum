              section: description
              quote: "`200 OK` is returned when the server is able to execute the query."
          - context: $response.header.Content-Type
            type: regex
            condition: "^application/json(;.*)?$"

  - workflowId: get-etag_weak
    summary: An ad-hoc GET that sends an ETag sends a weak one
    description: >-
      Executes a query over the dataset with GET. An ETag on the 200, which
