              quote: "`200 OK` is returned when the server is able to execute the query."
          - context: $response.header.ETag
            type: regex
            condition: "^(W/\".+\")?$"

  - workflowId: get-no_location
    summary: An ad-hoc GET answers without a Location header
    description: >-
      Executes a query over the dataset with GET. The 200 creates no resource
      and redirects nowhere, so it carries no Location header.
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Location
      quote: "The `Location` header MUST ONLY be used for resource creation (e.g., `201 Created`) or redirect responses."
    steps:
      - stepId: query
        description: >-
          Execute the query and read the Location header.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query
        parameters:
          - name: q
