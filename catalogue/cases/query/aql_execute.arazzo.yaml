            - { target: /query_parameters/ehr_id, value: $workflows.$sourceDescriptions.setup.seed_dataset-visits.outputs.ehr_id }
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: "`200 OK` is returned when the server is able to execute the query."
          - condition: "$statusCode == 200"
            x-veredictum-check:
              judge: schema
              against: oas
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: content
              quote: "../schemas/query/ResultSet.yaml"

