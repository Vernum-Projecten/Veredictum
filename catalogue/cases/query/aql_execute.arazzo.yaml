  - workflowId: get-content_type
    summary: An ad-hoc GET answers with Content-Type application/json
    description: >-
      Executes a query over the dataset with GET and Accept application/json.
      The 200 carries Content-Type application/json.
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    steps:
      - stepId: query
        description: >-
          Execute the query and read the Content-Type.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query
        parameters:
          - name: q
            in: query
            value: >-
              SELECT
              o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude
