    description: >-
      Queries the names LIKE '*visit'. The four visit names end in visit; the
      epsilon note does not.
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: LIKE
      quote: "The `?` wildcard in the pattern matches any single character, while the `\\*` wildcard matches any sequence of zero or more characters."
    steps:
      - stepId: query
        description: >-
