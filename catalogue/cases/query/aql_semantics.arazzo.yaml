# The AQL semantics QUERY Release-1.1.0 assigns, one rule per workflow, each
# judged over the dataset `_setup/templates.arazzo.yaml` seeds
# (`seed_dataset-visits`) with the `result_set` judge. Every query is scoped
# to the dataset EHR by the `$ehr_id` parameter, so other data on the server
# never reaches a result. Every quote is copied verbatim from the named
# vendored file.
arazzo: "1.1.0"
info:
  title: AQL semantics
  version: "0.1.0"
  description: >-
    The comparison and logical operators, LIKE, ORDER BY, LIMIT, DISTINCT, the
    aggregate and single-row functions, literals, containment, predicates,
    parameters and column names, each executed by the ad-hoc AQL POST over a
    known dataset.
sourceDescriptions:
  - name: query
    url: "../../../specs/rest-oas/query-validation.openapi.yaml"
    type: openapi
  - name: setup
    url: "../_setup/templates.arazzo.yaml"
    type: arazzo
workflows:
  - workflowId: where-greater_than
    summary: "A WHERE > comparison keeps the rows whose magnitude is greater than 13"
    description: >-
      Queries the magnitudes of the dataset EHR with WHERE magnitude > 13. The
      dataset holds 12, 15, 15 and 18, so the result is the bag [15, 15, 18].
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: Comparison operators
      quote: "|> |Greater than |`o/data[at0001]/.../data[at0003]/items[at0004]/value/value >140`"
    steps:
      - stepId: query
        description: >-
          Execute the query over the dataset EHR, its ehr_id passed as the
          query parameter ehr_id.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: >-
              SELECT
              o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude
              AS magnitude FROM EHR e[ehr_id/value=$ehr_id] CONTAINS
              COMPOSITION c CONTAINS OBSERVATION
              o[openEHR-EHR-OBSERVATION.minimal.v1] WHERE
              o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude
              > 13
            query_parameters:
              ehr_id: replaced with the dataset ehr_id
          replacements:
            - { target: /query_parameters/ehr_id, value: $workflows.$sourceDescriptions.setup.seed_dataset-visits.outputs.ehr_id }
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: "`200 OK` is returned when the server is able to execute the query."
          - condition: "$statusCode == 200"
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: set
              rows: [[15], [15], [18]]

