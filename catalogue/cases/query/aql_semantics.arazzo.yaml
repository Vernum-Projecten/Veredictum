  - workflowId: where-exists
    summary: WHERE EXISTS keeps the COMPOSITIONs where the path has data
    description: >-
      Queries the names of the dataset COMPOSITIONs whose content holds an
      openEHR-EHR-OBSERVATION.minimal.v1. The four visits do, the epsilon note
      does not.
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: EXISTS
      quote: "It returns a Boolean result: `true` means the data associated with the specified path exists, `false` otherwise."
    steps:
      - stepId: query
        description: >-
          Execute the query over the dataset EHR, its ehr_id passed as the
          query parameter ehr_id.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: >-
              SELECT c/name/value AS name FROM EHR e[ehr_id/value=$ehr_id]
              CONTAINS COMPOSITION c WHERE EXISTS
              c/content[openEHR-EHR-OBSERVATION.minimal.v1]
            query_parameters:
              ehr_id: replaced with the dataset ehr_id
          replacements:
            - { target: /query_parameters/ehr_id, value: $workflows.$sourceDescriptions.setup.seed_dataset-visits.outputs.ehr_id }
