  - workflowId: where-matches
    summary: WHERE matches with a value list keeps the rows equal to one of its items
    description: >-
      Queries the names matching the value list {'alpha visit', 'gamma
      visit'}. The items are OR'ed, so the result is those two names.
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: matches
      quote: "A value list is only used in AQL `WHERE` clause when the criteria is to match one item of the list. The relationships among these value list items are \"OR\"."
    steps:
      - stepId: query
        description: >-
          Execute the query over the dataset EHR, its ehr_id passed as the
          query parameter ehr_id.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: >-
              SELECT c/name/value AS name FROM EHR e[ehr_id/value=$ehr_id]
              CONTAINS COMPOSITION c WHERE c/name/value matches {'alpha
              visit', 'gamma visit'}
            query_parameters:
              ehr_id: replaced with the dataset ehr_id
          replacements:
            - { target: /query_parameters/ehr_id, value: $workflows.$sourceDescriptions.setup.seed_dataset-visits.outputs.ehr_id }
