# The aggregate-function cases of the aql-conformance corpus whose answer the released AQL text assigns. Each workflow carries one case of the AQL conformance corpus
# (github.com/Cadasto/aql-conformance at d5b8c554fece), named in its
# description; catalogue/id-map.yaml maps every case of the corpus. The case's
# own data is committed by the set-up it names in
# _setup/aql_conformance.arazzo.yaml, and its runtime identifiers reach the
# query as query parameters. Every quote is copied verbatim from the named
# vendored file.
arazzo: 1.1.0
info:
  title: 'AQL conformance: aggregation'
  version: 0.1.0
  description: The aggregate-function cases of the aql-conformance corpus whose answer the released AQL
    text assigns.
sourceDescriptions:
  - name: query
    url: ../../../specs/rest-oas/query-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/aql_conformance.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: count-count_over_a_path_counts_the_values_present
    summary: COUNT over a path counts the rows whose path holds a value, not every row
    description: 'Carries aql-conformance case aggregation.count.count_over_a_path_counts_the_values_present
      (level core, corpus/cases/aggregation/count_over_a_path.yaml): over the set-up seed-vital_signs-repeated_types_single,
      the query returns the rows the case expects.'
    dependsOn:
      - $sourceDescriptions.setup.seed-vital_signs-repeated_types_single
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: Aggregate functions
      quote: Unless specified otherwise, these functions ignore `NULL` input values.
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT COUNT(c/context/end_time/value) FROM EHR e CONTAINS COMPOSITION c WHERE e/ehr_id/value
              = $ehr_id
            query_parameters:
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs-repeated_types_single.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: '`200 OK` is returned when the server is able to execute the query.'
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: set
              rows:
                - - 1
