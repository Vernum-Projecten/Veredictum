# The FROM-clause cases of the aql-conformance corpus whose answer the released AQL text assigns. Each workflow carries one case of the AQL conformance corpus
# (github.com/Cadasto/aql-conformance at 28749a482a23), named in its
# description; catalogue/id-map.yaml maps every case of the corpus. The case's
# own data is committed by the set-up it names in
# _setup/aql_conformance.arazzo.yaml, and its runtime identifiers reach the
# query as query parameters. Every quote is copied verbatim from the named
# vendored file.
arazzo: 1.1.0
info:
  title: 'AQL conformance: FROM'
  version: 0.1.0
  x-veredictum-section: aql-conformance-corpus
  description: The FROM-clause cases of the aql-conformance corpus whose answer the released AQL text
    assigns.
sourceDescriptions:
  - name: query
    url: ../../../specs/rest-oas/query-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/aql_conformance.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: archetype_predicate-parameterised_archetype_predicate_binds_like_the_archetype_id
    summary: A parameterised archetype predicate binds like the archetype id it is given
    description: 'Carries aql-conformance case FROM.archetype_predicate.parameterised_archetype_predicate_binds_like_the_archetype_id
      (level core, corpus/cases/FROM/parameterised_archetype.yaml): over the set-up seed-vital_signs,
      the query returns the rows the case expects.'
    dependsOn:
      - $sourceDescriptions.setup.seed-vital_signs
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: Parameters > Syntax
      quote: 'within a predicate: `[$archetypeId]`, `[at0003, $nameValue]`, `[ehr_id/value=$ehrUid]`'
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT c/uid/value FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[$arch] WHERE
              e/ehr_id/value = $ehr_id
            query_parameters:
              arch: openEHR-EHR-OBSERVATION.blood_pressure.v1
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: '`200 OK` is returned when the server is able to execute the query.'
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: set
              rows:
                - - $workflows.$sourceDescriptions.setup.seed-vital_signs.outputs.c1
  - workflowId: archetype_predicate-predicated_section_anchor_above_the_entry
    summary: A predicated SECTION binds as an anchor above the ENTRY
    description: 'Carries aql-conformance case FROM.archetype_predicate.predicated_section_anchor_above_the_entry
      (level core, corpus/cases/FROM/section_anchor_above_entry.yaml): over the set-up seed-vital_signs_sectioned,
      the query returns the rows the case expects.'
