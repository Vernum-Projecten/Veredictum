# The stored-query execution operations: the latest version, an exact version
# and the version prefixes, the misses answered 404 and the reserved name, a
# POST body the released schema refuses, and a fetch that is not an integer.
# Each workflow that executes a stored query stores it under
# a fresh qualified_query_name through the DEFINITION API and executes it over
# the dataset `_setup/templates.arazzo.yaml` seeds. Every quote is copied
# verbatim from the named vendored file.
arazzo: "1.1.0"
info:
  title: Stored AQL execution
  version: "0.1.0"
  description: >-
    Executing a stored AQL query by name and by version, with GET and POST.
sourceDescriptions:
  - name: query
    url: "../../../specs/rest-oas/query-validation.openapi.yaml"
    type: openapi
  - name: definition
    url: "../../../specs/rest-oas/definition-validation.openapi.yaml"
    type: openapi
  - name: setup
    url: "../_setup/templates.arazzo.yaml"
    type: arazzo
workflows:
  - workflowId: post-latest
    summary: A stored query executed by name runs its latest version
    description: >-
      Stores three versions of one query under a fresh name: 1.0.0 selects the
      magnitude 12, 1.1.0 the magnitude 18 and 2.0.0 the magnitude 15 of the
      dataset EHR, named by the $ehr_id parameter. Executing it by name with
      POST runs 2.0.0, so the result is [15, 15].
    dependsOn: [$sourceDescriptions.setup.seed_dataset-visits]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/query_execute_stored_query_body.yaml
      section: description
      quote: "Execute a stored query, identified by the supplied `qualified_query_name` (at latest version)."
    inputs:
      type: object
      properties:
        run: { type: string, format: uuid }
    steps:
      - stepId: store-1_0_0
        description: >-
          Store the query at version 1.0.0.
        operationId: $sourceDescriptions.definition.definition_query_version_store.yaml
        parameters:
          - { name: qualified_query_name, in: path, value: "org.veredictum::aql-{$inputs.run}" }
          - { name: version, in: path, value: "1.0.0" }
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: |-
            SELECT o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude AS magnitude FROM EHR e[ehr_id/value=$ehr_id] CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.minimal.v1] WHERE o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude = 12
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_StoredQuery_stored.yaml
              section: description
              quote: "`200 OK` is returned when the query was successfully stored."
      - stepId: store-1_1_0
        description: >-
          Store the query at version 1.1.0.
        operationId: $sourceDescriptions.definition.definition_query_version_store.yaml
        parameters:
          - { name: qualified_query_name, in: path, value: "org.veredictum::aql-{$inputs.run}" }
          - { name: version, in: path, value: "1.1.0" }
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: |-
            SELECT o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude AS magnitude FROM EHR e[ehr_id/value=$ehr_id] CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.minimal.v1] WHERE o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude = 18
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_StoredQuery_stored.yaml
              section: description
              quote: "`200 OK` is returned when the query was successfully stored."
      - stepId: store-2_0_0
        description: >-
          Store the query at version 2.0.0.
        operationId: $sourceDescriptions.definition.definition_query_version_store.yaml
        parameters:
          - { name: qualified_query_name, in: path, value: "org.veredictum::aql-{$inputs.run}" }
          - { name: version, in: path, value: "2.0.0" }
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: |-
            SELECT o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude AS magnitude FROM EHR e[ehr_id/value=$ehr_id] CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.minimal.v1] WHERE o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude = 15
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_StoredQuery_stored.yaml
              section: description
              quote: "`200 OK` is returned when the query was successfully stored."
      - stepId: execute
        description: >-
          Execute the stored query by name.
        operationId: $sourceDescriptions.query.query_execute_stored_query_body
        parameters:
          - { name: qualified_query_name, in: path, value: "org.veredictum::aql-{$inputs.run}" }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            offset: 0
            fetch: 10
            query_parameters:
              ehr_id: replaced with the dataset ehr_id
          replacements:
            - { target: /query_parameters/ehr_id, value: $workflows.$sourceDescriptions.setup.seed_dataset-visits.outputs.ehr_id }
        successCriteria:
          - condition: "$statusCode == 200"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: "`200 OK` is returned when the server is able to execute the query."
          - condition: "$statusCode == 200"
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: set
              rows: [[15], [15]]

