# The ad-hoc AQL requests a service refuses: a query the released grammar
# refuses, fetch with TOP, TOP with LIMIT, a missing parameter, an invalid
# fetch, a body without q and a body of the wrong media type. Every quote is
# copied verbatim from the named vendored file.
arazzo: "1.1.0"
info:
  title: AQL execution refused
  version: "0.1.0"
  description: >-
    Ad-hoc AQL requests that are refused with 400, or 415 for the wrong media
    type.
sourceDescriptions:
  - name: query
    url: "../../../specs/rest-oas/query-validation.openapi.yaml"
    type: openapi
workflows:
  - workflowId: get-malformed
    summary: An ad-hoc GET of a query the AQL grammar refuses is refused with 400
    description: >-
      Executes, with GET, a query that does not parse under the released AQL
      grammar (AqlParser.g4). One row per malformed query; each is refused
      with 400.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
      section: description
      quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."
    inputs:
      type: object
      required:
        - q
      properties:
        q: { type: string }
    steps:
      - stepId: query
        description: >-
          Execute the malformed query.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query
        parameters:
          - { name: q, in: query, value: $inputs.q }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: "$statusCode == 400"

  - workflowId: post-malformed
    summary: An ad-hoc POST of a query the AQL grammar refuses is refused with 400
    description: >-
      Executes, with POST, a query whose FROM clause is missing, which does
      not parse under the released AQL grammar (AqlParser.g4 selectQuery). It
      is refused with 400.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
      section: description
      quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."
    steps:
      - stepId: query
        description: >-
          Execute the malformed query.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: SELECT e/ehr_id/value EHR e
        successCriteria:
          - condition: "$statusCode == 400"

  - workflowId: get-fetch_with_top
    summary: fetch combined with a TOP query is refused with 400
    description: >-
      Executes, with GET, a query that parses and selects TOP 2, together with
      the fetch parameter. fetch cannot be combined with TOP, so the request
      is invalid input.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/query/Request.md
      section: Common Headers and Query Parameters
      quote: "`fetch` - used for paging: the number of rows to fetch (i.e. limit); default depends on the implementation, but cannot be combined with [AQL-top](https://specifications.openehr.org/releases/QUERY/latest/AQL.html#_top)"
    steps:
      - stepId: query
        description: >-
          Execute a TOP 2 query, which parses, with fetch 1: the fetch
          parameter cannot be combined with TOP, which makes the request
          invalid.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query
        parameters:
          - name: q
            in: query
            value: >-
              SELECT TOP 2 e/ehr_id/value FROM EHR e
          - { name: fetch, in: query, value: 1 }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: "$statusCode == 400"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
              section: description
              quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."

  - workflowId: post-top_with_limit
    summary: A query using both TOP and LIMIT is refused with 400
    description: >-
      Executes, with POST, a query that parses but uses TOP and a LIMIT clause
      together, which AQL does not allow.
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: TOP
      quote: "It is not allowed to use `TOP` while also using `LIMIT` clause in the same query."
    steps:
      - stepId: query
        description: >-
          Execute a query, which parses, that uses TOP and LIMIT together: AQL
          does not allow both in the same query, which makes the request
          invalid.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: >-
              SELECT TOP 2 e/ehr_id/value FROM EHR e LIMIT 2
        successCriteria:
          - condition: "$statusCode == 400"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
              section: description
              quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."

  - workflowId: post-parameter_missing
    summary: A query whose parameter has no value is refused with 400
    description: >-
      Executes, with POST, a query that parses and uses the parameter
      $magnitude, with no query_parameters supplying it. A required parameter
      is missing.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
      section: description
      quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."
    steps:
      - stepId: query
        description: >-
          Execute a query, which parses, whose parameter $magnitude no query
          parameter supplies: a required parameter is missing.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            q: >-
              SELECT
              o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude
              AS magnitude FROM EHR e CONTAINS COMPOSITION c CONTAINS
              OBSERVATION o[openEHR-EHR-OBSERVATION.minimal.v1] WHERE
              o/data[at0001]/events[at0002]/data[at0003]/items[at0004]/value/magnitude
              = $magnitude
        successCriteria:
          - condition: "$statusCode == 400"

  - workflowId: get-fetch_not_integer
    summary: A fetch that is not an integer is refused with 400
    description: >-
      Executes, with GET, a query that parses, with the fetch parameter abc.
      fetch is an integer, so the parameter has an invalid syntax.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
      section: description
      quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."
    steps:
      - stepId: query
        description: >-
          Execute a query, which parses, with fetch abc: the fetch parameter
          is not an integer, an invalid syntax.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query
        parameters:
          - name: q
            in: query
            value: SELECT e/ehr_id/value FROM EHR e
          - { name: fetch, in: query, value: abc }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: "$statusCode == 400"

  - workflowId: post-q_missing
    summary: An ad-hoc POST body without q is refused with 400
    description: >-
      Executes, with POST, a body that carries no q member. AdhocQueryExecute
      requires q, so a required parameter is missing.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_Query.yaml
      section: description
      quote: "`400 Bad Request` is returned when the server was unable to execute the query due to invalid input, e.g. a required parameter is missing, or at least one of the parameters has an invalid syntax."
    steps:
      - stepId: query
        description: >-
          Execute a body with no q: a required parameter is missing.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            offset: 0
        successCriteria:
          - condition: "$statusCode == 400"

  - workflowId: post-wrong_media
    summary: An ad-hoc POST with a text/plain body is refused with 415
    description: >-
      Executes, with POST, the query as a text/plain body. The operation takes
      an application/json body only, so the payload is in a format the method
      does not support.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "| 415  | Unsupported Media Type | The service is refusing the request because the payload is in a format not supported by this method on the target resource                                                 |"
    steps:
      - stepId: query
        description: >-
          Execute the query as a text/plain body.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: text/plain
          payload: |-
            SELECT e/ehr_id/value FROM EHR e
        successCriteria:
          - condition: "$statusCode == 415"
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
          - condition: "$statusCode == 415"
