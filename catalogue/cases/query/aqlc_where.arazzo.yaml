    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: Class expressions
      quote: For instance, `EHR e[ehr_id/value='123456']` indicates that the required data must be from
        a specific `EHR` with `ehr_id` value `'123456'`
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT e/ehr_id/value, c/uid/value FROM EHR e CONTAINS COMPOSITION c WHERE c/archetype_details/template_id/value
              = 'aql_conformance.vital_signs.v1' AND e/ehr_id/value = $ehr_id
            query_parameters:
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs-repeated_types_single.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
