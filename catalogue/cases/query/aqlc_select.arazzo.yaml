# The SELECT-clause cases of the aql-conformance corpus whose answer the released AQL text assigns. Each workflow carries one case of the AQL conformance corpus
# (github.com/Cadasto/aql-conformance at d5b8c554fece), named in its
# description; catalogue/id-map.yaml maps every case of the corpus. The case's
# own data is committed by the set-up it names in
# _setup/aql_conformance.arazzo.yaml, and its runtime identifiers reach the
# query as query parameters. Every quote is copied verbatim from the named
# vendored file.
arazzo: 1.1.0
info:
  title: 'AQL conformance: SELECT'
  version: 0.1.0
  description: The SELECT-clause cases of the aql-conformance corpus whose answer the released AQL text
    assigns.
sourceDescriptions:
  - name: query
    url: ../../../specs/rest-oas/query-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/aql_conformance.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: identified_path-a_content_path_matching_no_node_is_a_null_cell
    summary: A content path naming a node the data does not hold yields a NULL cell in the row
    description: 'Carries aql-conformance case SELECT.identified_path.a_content_path_matching_no_node_is_a_null_cell
      (level core, corpus/cases/SELECT/content_path_matching_no_node.yaml): over the set-up seed-vital_signs,
      the query returns the rows the case expects.'
    dependsOn:
      - $sourceDescriptions.setup.seed-vital_signs
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master04-result_structure.adoc
      section: Result structure
      quote: or the `NULL` value in the case where the data item is missing or unknown.
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at9998]/value/magnitude FROM EHR
              e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v1]
              WHERE e/ehr_id/value = $ehr_id
            query_parameters:
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: '`200 OK` is returned when the server is able to execute the query.'
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: set
              rows:
                - - null
  - workflowId: identified_path-composition_metadata_paths
    summary: Four COMPOSITION paths project together on one row
    description: 'Carries aql-conformance case SELECT.identified_path.composition_metadata_paths (level
      core, corpus/cases/SELECT/metadata_composition_paths.yaml): over the set-up seed-vital_signs, the
      query returns the rows the case expects.'
    dependsOn:
      - $sourceDescriptions.setup.seed-vital_signs
    x-veredictum-cite:
      source: specs/openehr/QUERY/docs/AQL/master03-syntax.adoc
      section: openEHR path syntax
      quote: and openEHR class instances and attributes, when referencing something that is not defined
        in an archetype but is part of the openEHR Reference Model.
    steps:
      - stepId: query
        description: Execute the query with POST, the identifiers of the set-up passed as query parameters.
        operationId: $sourceDescriptions.query.query_execute_adhoc_query_body
        parameters:
          - name: Accept
            in: header
            value: application/json
        requestBody:
          contentType: application/json
          payload:
            q: SELECT c/uid/value, c/name/value, c/archetype_details/template_id/value, c/context/start_time/value
              FROM EHR e CONTAINS COMPOSITION c WHERE e/ehr_id/value = $ehr_id
            query_parameters:
              ehr_id: replaced with the ehr_id of the set-up
          replacements:
            - target: /query_parameters/ehr_id
              value: $workflows.$sourceDescriptions.setup.seed-vital_signs.outputs.ehr_id
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_Query.yaml
              section: description
              quote: '`200 OK` is returned when the server is able to execute the query.'
          - condition: $statusCode == 200
            x-veredictum-check:
              judge: result_set
              context: $response.body
              match: count
              count: 1
