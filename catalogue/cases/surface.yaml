# The released ITS-REST surface the Arazzo catalogue answers for. `scope`
# names each converted family as an API document under
# specs/openehr/ITS-REST/specifications/ and an OAS tag. Inside it, every
# operation, every declared response and every declared value of Accept,
# Content-Type and Prefer is covered by a step, or is listed under `gaps` with
# the issue that tracks it. A gap whose branch gains a covering step is refused
# until it is removed, so the list only shrinks.
scope:
  - { api: ehr, tag: EHR }
# Each gap is a branch no case of the converted EHR family reaches: the
# case-core catalogue had no case for it either, so the conversion (#603)
# could not carry one across: the simplified-format request bodies, the XML
# response of a create, and the minimal and the client-id identifier
# preferences.
gaps:
  - { api: ehr, operation: ehr_create, header: Accept, value: application/xml, issue: 603 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.flat+json, issue: 603 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.structured+json, issue: 603 }
  - { api: ehr, operation: ehr_create, header: Prefer, value: return=minimal, issue: 603 }
  - { api: ehr, operation: ehr_create_with_id, header: Accept, value: application/xml, issue: 603 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.flat+json, issue: 603 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.structured+json, issue: 603 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=minimal, issue: 603 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=identifier, issue: 603 }
