# The released ITS-REST surface the Arazzo catalogue answers for. `scope`
# names each converted family as an API document under
# specs/openehr/ITS-REST/specifications/ and an OAS tag. Inside it, every
# operation, every declared response and every declared value of Accept,
# Content-Type and Prefer is covered by a step, or is listed under `gaps` with
# the issue that tracks it. A gap whose branch gains a covering step is refused
# until it is removed, so the list only shrinks.
scope:
  - { api: ehr, tag: EHR }
  - { api: ehr, tag: EHR_STATUS }
  - { api: ehr, tag: ITEM_TAG }
  - { api: ehr, tag: COMPOSITION }
  - { api: definition, tag: ADL1.4 }
  - { api: definition, tag: ADL2 }
  - { api: query, tag: Query }
  - { api: definition, tag: Query }
  - { api: ehr, tag: DIRECTORY }
  - { api: ehr, tag: CONTRIBUTION }
  - { api: admin, tag: EHR }
  - { api: system, tag: Options }
  - { api: demographic, tag: PERSON }
  - { api: demographic, tag: AGENT }
  - { api: demographic, tag: GROUP }
  - { api: demographic, tag: ORGANISATION }
  - { api: demographic, tag: ROLE }
  - { api: demographic, tag: VERSIONED_PARTY }
  - { api: demographic, tag: CONTRIBUTION }
  - { api: demographic, tag: ITEM_TAG }
# Each gap is a branch of the scoped surface no workflow reaches yet, and
# names the issue that tracks it. An element counts as covered when every
# arm of its option covers it.
gaps:
# The Simplified Formats on the EHR and EHR_STATUS routes: the release
# defines no EHR_STATUS form in either format, so only the refusing arms of
# the `ehr-status-*-write` and `ehr-status-*-read` options have documents
# (upstream report #352).
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.structured+json, issue: 352 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.structured+json, issue: 352 }
  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.structured+json, issue: 352 }
  - { api: ehr, operation: ehr_status_get_by_version_id, header: Accept, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_status_get_by_version_id, header: Accept, value: application/openehr.wt.structured+json, issue: 352 }
  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.structured+json, issue: 352 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.flat+json, issue: 352 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.structured+json, issue: 352 }
