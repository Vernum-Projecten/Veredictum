  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.structured+json, issue: 659 }
