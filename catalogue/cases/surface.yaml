  - { api: ehr, operation: contribution_create, header: Accept, value: application/openehr.wt.structured+json, issue: 698 }
  - { api: ehr, operation: contribution_create, header: Accept, value: application/xml, issue: 698 }
  - { api: ehr, operation: contribution_create, header: Content-Type, value: application/xml, issue: 698 }
  - { api: ehr, operation: directory_create, header: Accept, value: application/openehr.wt.flat+json, issue: 698 }
  - { api: ehr, operation: directory_create, header: Accept, value: application/openehr.wt.structured+json, issue: 698 }
  - { api: ehr, operation: directory_create, header: Accept, value: application/xml, issue: 698 }
