  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/xml, issue: 659 }
  - { api: ehr, operation: versioned_ehr_status_get, header: Content-Type, value: application/json, issue: 659 }
  - { api: ehr, operation: versioned_ehr_status_get, header: Content-Type, value: application/xml, issue: 659 }
  - { api: ehr, operation: versioned_ehr_status_revision_history, header: Content-Type, value: application/json, issue: 659 }
