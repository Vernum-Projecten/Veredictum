# The released ITS-REST surface the Arazzo catalogue answers for. `scope`
# names each converted family as an API document under
# specs/openehr/ITS-REST/specifications/ and an OAS tag. Inside it, every
# operation, every declared response and every declared value of Accept,
# Content-Type and Prefer is covered by a step, or is listed under `gaps` with
# the issue that tracks it. A gap whose branch gains a covering step is refused
# until it is removed, so the list only shrinks.
scope:
  - { api: ehr, tag: EHR }
  - { api: ehr, tag: EHR_STATUS }
  - { api: ehr, tag: ITEM_TAG }
  - { api: ehr, tag: COMPOSITION }
# Each gap is a branch of the scoped surface no workflow reaches yet, and
# names the issue that tracks it. An element counts as covered when every
# arm of its option covers it.
gaps:
# The EHR gaps, covered by #653: the simplified-format request bodies, the
# XML response of a create, and the minimal and the client-id identifier
# preferences. An XML request body on a create is covered by the refusing
# arm of the `ehr-xml-write` option only.
  - { api: ehr, operation: ehr_create, header: Accept, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.flat+json, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.structured+json, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Prefer, value: return=minimal, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Accept, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.flat+json, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.structured+json, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=minimal, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=identifier, issue: 653 }
