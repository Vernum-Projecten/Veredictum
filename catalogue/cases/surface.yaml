# The released ITS-REST surface the Arazzo catalogue answers for. `scope`
# names each converted family as an API document under
# specs/openehr/ITS-REST/specifications/ and an OAS tag. Inside it, every
# operation, every declared response and every declared value of Accept,
# Content-Type and Prefer is covered by a step, or is listed under `gaps` with
# the issue that tracks it. A gap whose branch gains a covering step is refused
# until it is removed, so the list only shrinks.
scope:
  - { api: ehr, tag: EHR }
  - { api: ehr, tag: EHR_STATUS }
  - { api: ehr, tag: ITEM_TAG }
  - { api: ehr, tag: COMPOSITION }
  - { api: ehr, tag: DIRECTORY }
  - { api: ehr, tag: CONTRIBUTION }
# Each gap is a branch of the scoped surface no workflow reaches yet, and
# names the issue that tracks it. An element counts as covered when every
# arm of its option covers it.
gaps:
# The EHR gaps, covered by #653: the simplified-format request bodies, the
# XML response of a create, and the minimal and the client-id identifier
# preferences. An XML request body on a create is covered by the refusing
# arm of the `ehr-xml-write` option only.
  - { api: ehr, operation: ehr_create, header: Accept, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.flat+json, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Content-Type, value: application/openehr.wt.structured+json, issue: 653 }
  - { api: ehr, operation: ehr_create, header: Prefer, value: return=minimal, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Accept, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/xml, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.flat+json, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Content-Type, value: application/openehr.wt.structured+json, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=minimal, issue: 653 }
  - { api: ehr, operation: ehr_create_with_id, header: Prefer, value: return=identifier, issue: 653 }
# The EHR_STATUS gaps, covered by #659: the simplified formats and an XML request
# body on the update (whose accepting arm of `ehr-status-xml-write` has no
# document).
  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_get_at_time, header: Accept, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_get_by_version_id, header: Accept, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_get_by_version_id, header: Accept, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Accept, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.flat+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/openehr.wt.structured+json, issue: 659 }
  - { api: ehr, operation: ehr_status_update, header: Content-Type, value: application/xml, issue: 659 }
# The 400 of a COMPOSITION delete, covered by #681: a second delete of a
# deleted COMPOSITION matches both the 400 already deleted and the 409 of a
# version that is not the latest, and the surface gate counts the workflow
# that accepts either answer for neither branch.
  - { api: ehr, operation: composition_delete, status: "400", issue: 681 }
# The Content-Type the release declares on the body-less VERSIONED_EHR_STATUS
# and VERSIONED_COMPOSITION GETs: each operation lists
# `parameters/header/ContentType_canonical.yaml` as a request header on a
# request with no payload, so there is no request format to negotiate. A
# defect in the released OAS, upstream report #687.
  - { api: ehr, operation: versioned_composition_get, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_composition_get, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_composition_revision_history, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_composition_revision_history, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_composition_version_get_at_time, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_composition_version_get_at_time, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_composition_version_get_by_id, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_composition_version_get_by_id, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_get, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_get, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_revision_history, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_revision_history, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_version_get_at_time, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_version_get_at_time, header: Content-Type, value: application/xml, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_version_get_by_id, header: Content-Type, value: application/json, issue: 687 }
  - { api: ehr, operation: versioned_ehr_status_version_get_by_id, header: Content-Type, value: application/xml, issue: 687 }
