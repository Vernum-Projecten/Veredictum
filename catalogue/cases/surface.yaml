# Recorded boundaries of the template operations: the release assigns no
# answer a workflow could assert, so each names no issue and its note quotes
# the released text that leaves it open.
  - api: definition
    operation: definition_template_adl1.4_example_get
    status: "400"
    note: >-
      definition_template_adl1.4_example_get.yaml: "When the server does not
      support the requested `type` or `detail_level`, it will fall back to the
      closest supported level, or it may return an error (typically `400 Bad
      Request`)." No request is assigned 400.
  - api: definition
    operation: definition_template_adl1.4_get
    status: "400"
    note: >-
      Its parameters are template_id, a free string ("Template identifier or
      partial reference") whose unknown value answers 404 ("a template with
      the specified `template_id` does not exist"), and Accept, whose unserved
      value answers 406 (Resources.md: "it MUST respond with HTTP status code
      `406 Not Acceptable`"). No request is assigned 400.
  - api: definition
    operation: definition_template_adl1.4_get
    header: Accept
    value: application/json
    note: >-
      No released schema defines a JSON form of an ADL 1.4 operational
      template, so no sentence assigns the answer to Accept application/json
      on a template read.
  - api: definition
    operation: definition_template_adl2_get
    status: "400"
    note: >-
      Its parameters are template_id, a free string ("Template identifier or
      partial reference") whose unknown value answers 404 ("a template with
      the specified `template_id` does not exist"), and Accept, whose unserved
      value answers 406 (Resources.md: "it MUST respond with HTTP status code
      `406 Not Acceptable`"). No request is assigned 400.
  - api: definition
    operation: definition_template_adl2_get
    header: Accept
    value: application/xml
    note: &adl2_opt_xml >-
      No released XSD declares an element of an OPERATIONAL_TEMPLATE type: AM
      2 Archetype.xsd defines no such type, and archie.xsd, which does, marks
      itself "Status: Draft" and declares only `archetype` as xs:anyType. An
      ADL 2 operational template has no released XML form.
  - api: definition
    operation: definition_template_adl2_upload
    header: Accept
    value: application/xml
    note: *adl2_opt_xml
  - api: definition
    operation: definition_template_adl2_version_get
    header: Accept
    value: application/xml
    note: *adl2_opt_xml
