# Deleting a COMPOSITION: the logical delete of its latest version and the
# VERSION it commits, the misses a delete answers with 404, a delete repeated
# on a deleted COMPOSITION or addressed to a superseded version, an If-Match
# precondition a client volunteers, the committal headers, the headers of
# the answer, and an EHR that is not modifiable, as Arazzo 1.1.0 workflows
# over the released ITS-REST `-validation` OAS. Every criterion resolves to
# an `x-veredictum-cite` (its own, else its step's, else its workflow's),
# and every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION delete
  version: 0.1.0
  x-veredictum-section: delete
  description: >-
    Deleting a COMPOSITION by the version_uid of its latest version: the
    204 of a successful delete and the VERSION it commits, a second delete
    of the same COMPOSITION, a delete of a superseded version, an unknown
    version or EHR, a volunteered If-Match that does or does not match, the
    committal headers, the ETag and Location headers of the answer, and a
    delete in an EHR that is not modifiable.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: delete_composition-event
    summary: The latest version of an event COMPOSITION is deleted with 204
    description: >-
      Creates an EHR and an event COMPOSITION, keeping the version_uid of the
      full representation the create answers with, then deletes the
      COMPOSITION by that version_uid. The delete is answered 204 No
      Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &deleted
      source: specs/openehr/ITS-REST/specifications/responses/204_version_deleted.yaml
      section: description
      quote: "`204 No Content` is returned for a successful delete operation."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Create the event COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - &delete
        stepId: delete
        description: Delete the COMPOSITION by the version_uid of its latest version.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - &no_content
            condition: $statusCode == 204
            x-veredictum-cite: *deleted

  - workflowId: delete_composition-persistent
    summary: The latest version of a persistent COMPOSITION is deleted with 204
    description: >-
      Creates an EHR and a persistent COMPOSITION, keeping the version_uid
      of the full representation the create answers with, then deletes the
      COMPOSITION by that version_uid. The delete is answered 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *deleted
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the persistent COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Persistent minimal }
            archetype_details:
              _type: ARCHETYPED
              archetype_id:
                _type: ARCHETYPE_ID
                value: openEHR-EHR-COMPOSITION.persistent_minimal.v1
              template_id: { _type: TEMPLATE_ID, value: persistent_minimal.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.persistent_minimal.v1
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: UY
            category:
              _type: DV_CODED_TEXT
              value: persistent
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "431"
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                _type: PARTY_REF
                id: { _type: HIER_OBJECT_ID, value: a3dce0d4-fa51-4ff2-9cce-93dd60437842 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. Yamamoto
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: Event Series }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,380+00:00" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: Cualquier evento }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,384+00:00" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: Arbol }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: text }
                            archetype_node_id: at0004
                            value: { _type: DV_TEXT, value: original value }
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: "1.0.2"
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - *delete

  - workflowId: delete_composition-unknown_version
    summary: A delete of a version_uid no COMPOSITION carries is answered 404
    description: >-
      Creates an EHR, then deletes a COMPOSITION by a version_uid built from
      a freshly generated object_id, which no COMPOSITION in the EHR carries.
      The delete is answered 404 Not Found.
    x-veredictum-cite: &not_found
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_uid_based_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `uid_based_id` does not exist."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - stepId: delete
        description: Delete by a version_uid no COMPOSITION carries.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: '{$inputs.object_id}::veredictum.example.org::1' }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: delete_composition-unknown_ehr
    summary: A COMPOSITION delete under an ehr_id no EHR carries is answered 404
    description: >-
      Deletes a COMPOSITION under a freshly generated ehr_id that no EHR
      carries. The delete is answered 404 Not Found.
    x-veredictum-cite: *not_found
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
    steps:
      - stepId: delete
        description: Delete a COMPOSITION under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: '{$inputs.object_id}::veredictum.example.org::1' }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: delete_composition-already_deleted
    summary: A second delete of a deleted COMPOSITION is refused
    description: >-
      Creates an EHR and an event COMPOSITION, deletes it, then sends the
      same delete again. The COMPOSITION is already deleted, so the second
      delete is refused with 400 Bad Request. The version_uid it names is no
      longer the latest version, for which the operation declares 409
      Conflict, so either answer holds.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/400_already_deleted.yaml
      section: description
      quote: "or when the resource identified by the request parameters is already deleted."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - *delete
      - stepId: delete-again
        description: Delete the COMPOSITION by the same version_uid again.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(400|409)$'

  - workflowId: delete_composition-etag_weak
    summary: An ETag sent on a COMPOSITION delete carries the weakness indicator
    description: >-
      Creates an EHR and an event COMPOSITION, then deletes it. If the 204
      answer sends an ETag, it is a weak entity tag.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Deprecated headers
      quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: delete
        description: Delete the COMPOSITION by the version_uid of its latest version.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - *no_content
          - context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'

  - workflowId: delete_composition-no_location
    summary: A COMPOSITION delete answers without a Location header
    description: >-
      Creates an EHR and an event COMPOSITION, then deletes it. A delete
      creates no resource and redirects nowhere, so the 204 answer carries no
      Location header.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Location
      quote: "The `Location` header MUST ONLY be used for resource creation (e.g., `201 Created`) or redirect responses."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: delete
        description: Delete the COMPOSITION by the version_uid of its latest version.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - *no_content
          - context: $response.header.Location
            type: regex
            condition: '^$'

  - workflowId: delete_composition-if_match_mismatch
    summary: A delete whose volunteered If-Match names another version is refused with 412 and not performed
    description: >-
      Creates an EHR and an event COMPOSITION, then deletes it with an
      If-Match header naming a version_uid the COMPOSITION does not have. The
      condition is false, so the delete is refused with 412 Precondition
      Failed and not performed: the same delete without the header then
      succeeds with 204.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: If-Match and accidental overwrites
      quote: "If a service receives this header, and the condition evaluates to `false`, it MUST NOT perform the requested method."
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - *commit
      - stepId: delete-mismatch
        description: Delete the COMPOSITION with an If-Match naming a version it does not have.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: If-Match, in: header, value: '"{$inputs.object_id}::veredictum.example.org::1"' }
        successCriteria:
          - condition: $statusCode == 412
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: If-Match and accidental overwrites
              quote: "Instead, it MUST respond with HTTP status code `412 Precondition Failed`,"
      - stepId: delete
        description: Delete the COMPOSITION without If-Match; the refused delete left it in place.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - *no_content

  - workflowId: delete_composition-if_match_current
    summary: A delete whose volunteered If-Match names the latest version is performed
    description: >-
      Creates an EHR and an event COMPOSITION, then deletes it with an
      If-Match header naming its latest version_uid. The condition holds, so
      the delete is performed and answered 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/parameters/header/If-Match.yaml
      section: description
      quote: "The operation will be performed only if the existing latest `version_uid` of the resource (i.e. the `preceding_version_uid`) matches this header's value."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: delete
        description: Delete the COMPOSITION with an If-Match naming its latest version.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        successCriteria:
          - *no_content

  - workflowId: delete_composition-ehr_not_modifiable
    summary: A COMPOSITION delete in an EHR whose EHR_STATUS is not modifiable is refused
    description: >-
      Creates an EHR and an event COMPOSITION, updates the EHR_STATUS to
      is_modifiable false, then deletes the COMPOSITION. The contents of an
      EHR that is not modifiable may not be written to, so the delete is
      refused with a client error; no released sentence names the status
      code, so any 4xx answer holds. The EHR is then made modifiable again,
      and the same delete succeeds with 204, which shows the refused delete
      left the COMPOSITION in place.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/ehr_status.adoc
      section: EHR_STATUS Class
      quote: "True if the EHR, other than the `EHR_STATUS` object, is allowed to be written to."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - &current_status
        stepId: current-status
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &latest_status_version
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: deactivate
        description: Update the EHR_STATUS with is_modifiable false under the current version.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current-status.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: true
            is_modifiable: false
        successCriteria:
          - &status_updated
            context: $statusCode
            type: regex
            condition: '^(200|204)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
      - stepId: delete-refused
        description: Delete the COMPOSITION in the EHR that is not modifiable.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^4[0-9][0-9]$'
      - stepId: deactivated-status
        description: Read the latest version of the EHR_STATUS again, for the version the update created.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *latest_status_version
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: reactivate
        description: Update the EHR_STATUS with is_modifiable true again.
        x-veredictum-cite:
          source: specs/openehr/RM/docs/UML/classes/ehr_status.adoc
          section: EHR_STATUS Class
          quote: "The `EHR_STATUS` object itself can always be written to."
          level: must
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.deactivated-status.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: true
            is_modifiable: true
        successCriteria:
          - *status_updated
      - stepId: delete
        description: Delete the COMPOSITION again; the refused delete left it in place.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - *no_content

  - workflowId: delete_composition-version_deleted
    summary: A delete adds a version with no data that follows the deleted one
    description: >-
      Creates an EHR and an event COMPOSITION, deletes it, then reads the
      latest VERSION from the container its versioned_object_uid names. A
      deletion adds a new ORIGINAL_VERSION whose data is Void, so the latest
      version follows the created one and carries no data.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &deletion
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "a new `ORIGINAL_VERSION` whose data attribute is set to Void is added to an existing `VERSIONED_OBJECT`; the `ORIGINAL_VERSION._commit_audit_._change_type_` is set to the code `523|deleted|`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_container
        stepId: commit
        description: Create the event COMPOSITION, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
