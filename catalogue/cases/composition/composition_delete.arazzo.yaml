  - workflowId: delete_composition-not_latest_version
    summary: A delete that names a superseded version is refused with 409 and not performed
    description: >-
      Creates an EHR and an event COMPOSITION, updates it, then deletes the
      COMPOSITION by the version_uid the create committed, which is no longer
      the latest version. The delete is refused with 409 Conflict, and the
      latest VERSION is still the one the update committed.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_COMPOSITION_with_uid_based_id.yaml
      section: description
      quote: "`409 Conflict` is returned when supplied `uid_based_id` doesn't match the latest version."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit_container
      - &update
        stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy under the created version.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload: *event
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(200|204)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
      - &updated_version
        stepId: updated
        description: Read the latest VERSION for the version the update committed.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: delete
        description: Delete the COMPOSITION by the version_uid the update superseded.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 409
      - stepId: latest
        description: Read the latest VERSION again; the refused delete committed nothing.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.updated.outputs.version_uid}$'

  - workflowId: delete_composition-not_latest_version-etag_latest
    summary: A 409 to a delete of a superseded version names the latest version in its ETag
    description: >-
      Creates an EHR and an event COMPOSITION, updates it, reads the latest
      VERSION for the version the update committed, then deletes the
      COMPOSITION by the version_uid the update superseded. The 409 answer
      carries the latest version_uid in its ETag.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/409_COMPOSITION_with_uid_based_id.yaml
      section: description
      quote: "Returns also latest `version_uid` in the `ETag` header."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit_container
      - *update
      - *updated_version
      - stepId: delete
        description: Delete the COMPOSITION by the version_uid the update superseded.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 409
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/409_COMPOSITION_with_uid_based_id.yaml
              section: description
              quote: "`409 Conflict` is returned when supplied `uid_based_id` doesn't match the latest version."
          - context: $response.header.ETag
            type: regex
            condition: '^(W/)?"{$steps.updated.outputs.version_uid}"$'

  - workflowId: delete_composition-if_match_superseded
    summary: A delete whose volunteered If-Match names a superseded version is refused with 412 and not performed
    description: >-
      Creates an EHR and an event COMPOSITION and updates it, then deletes
      the latest version with an If-Match header naming the version the
      update superseded. The condition is false, so the delete is refused
      with 412 Precondition Failed and not performed: the same delete
      without the header then succeeds with 204.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: If-Match and accidental overwrites
      quote: "If a service receives this header, and the condition evaluates to `false`, it MUST NOT perform the requested method."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit_container
      - *update
      - *updated_version
      - stepId: delete-superseded
        description: Delete the latest version with an If-Match naming the superseded version.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.updated.outputs.version_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        successCriteria:
          - condition: $statusCode == 412
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: If-Match and accidental overwrites
              quote: "Instead, it MUST respond with HTTP status code `412 Precondition Failed`,"
      - stepId: delete
        description: Delete the latest version without If-Match; the refused delete left it in place.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.updated.outputs.version_uid }
        successCriteria:
          - *no_content
