# The COMPOSITION read by the versioned_object_uid of a real container: the
# implicit latest version, the version extant at a time, a superseded
# version by its own version_uid, and the reads of a logically deleted
# COMPOSITION, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. A step derives the versioned_object_uid from the
# version_uid a create answers with. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION read by versioned_object_uid
  version: 0.1.0
  description: >-
    Reading a COMPOSITION in canonical JSON by the versioned_object_uid of
    its container, with and without a version_at_time, the agreement of that
    implicit form with the explicit version_uid, a superseded version read by
    its version_uid, and the 204 a read of a deleted version is answered
    with.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_composition-latest
    summary: A COMPOSITION read by versioned_object_uid without version_at_time serves the latest version
    description: >-
      Creates an EHR, commits a COMPOSITION whose count is 15 and updates it
      to a second version whose count is 16, then retrieves the COMPOSITION
      by its versioned_object_uid without a version_at_time. The answer is
      200, and its content is the second COMPOSITION, apart from the uid the
      server assigns.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &implicit_form
      source: specs/openehr/ITS-REST/specifications/operations/composition_get.yaml
      section: description
      quote: "When the `uid_based_id` has the form of a HIER_OBJECT_ID, if the `version_at_time` is supplied, retrieves the version extant _at specified time_, otherwise retrieves the _latest_ COMPOSITION version."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: >-
          Commit a COMPOSITION whose count is 15, keep the version_uid of the
          full representation the create answers with, and derive the
          versioned_object_uid from it.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &composition
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: content observation }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: 1.0.2
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: history }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: any event }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: tree }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: value }
                            archetype_node_id: at0004
                            value: { _type: DV_COUNT, magnitude: 15 }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - &update
        stepId: update
        description: >-
          Update the COMPOSITION, addressed by the derived versioned_object_uid
          and preconditioned on the version_uid of the commit, to a second
          version whose count is 16.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &composition_v2
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: content observation }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: 1.0.2
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: history }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: any event }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: tree }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: value }
                            archetype_node_id: at0004
                            value: { _type: DV_COUNT, magnitude: 16 }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_updated.yaml
              section: description
              quote: "`200 OK` is returned when the COMPOSITION is successfully updated, with the full resource in the response body when `Prefer` header is `return=representation`,"
      - stepId: get
        description: Retrieve the COMPOSITION by its versioned_object_uid without a version_at_time.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &composition_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - &is_v2
            condition: $statusCode == 200
            x-veredictum-check:
              judge: equivalent
              context: $response.body
              to: *composition_v2
              ignoring: [uid]

  - workflowId: get_composition-identifier_forms_agree
    summary: The implicit and the explicit identifier of the latest version serve the same COMPOSITION
    description: >-
      Creates an EHR, commits a COMPOSITION and updates it, reads the latest
      VERSION for its version_uid, then retrieves the COMPOSITION once by its
      versioned_object_uid and once by that version_uid. No version was
      created between the reads, so both serve the second COMPOSITION.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Multiple identifiers for the same resource
      quote: "However, the implicit URI will only resolve to the same resource as the explicit versioned URI as long as no new versions are created (i.e. the latest version remains `5`)."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *update
      - &latest
        stepId: latest
        description: Read the latest VERSION for its version_uid and its commit time.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
          time_committed: $response.body#/commit_audit/time_committed/value
      - stepId: get-implicit
        description: Retrieve the COMPOSITION by its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - *is_v2
      - stepId: get-explicit
        description: Retrieve the COMPOSITION by the version_uid of the latest version.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.latest.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - *is_v2

  - workflowId: get_composition-at_time_future
    summary: A COMPOSITION read at a time after the newest version serves the newest version
    description: >-
      Creates an EHR, commits a COMPOSITION and updates it, then retrieves the
      COMPOSITION by its versioned_object_uid at 2999-01-01. Nothing has
      superseded the second version at that time, so it is the version
      extant and is served.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *implicit_form
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *update
      - stepId: get
        description: Retrieve the COMPOSITION at a time after the newest version.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: "2999-01-01T00:00:00.000Z" }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *composition_retrieved
          - *is_v2

  - workflowId: get_composition-at_time_of_first_version
    summary: A COMPOSITION read at the commit time of a superseded version serves that version
    description: >-
      Creates an EHR, commits a COMPOSITION, reads the latest VERSION for the
      time the commit was recorded, updates the COMPOSITION, then retrieves it
      by its versioned_object_uid at that time. The first version is the one
      extant then, so its content, the count 15, is served.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *implicit_form
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *latest
      - *update
      - stepId: get
        description: Retrieve the COMPOSITION at the commit time of the first version.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: $steps.latest.outputs.time_committed }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *composition_retrieved
          - &is_v1
            condition: $statusCode == 200
            x-veredictum-check:
              judge: equivalent
              context: $response.body
              to: *composition
              ignoring: [uid]

  - workflowId: get_composition-at_time_before_first_version
    summary: A COMPOSITION read at a time before the first version is answered 404
    description: >-
      Creates an EHR and commits a COMPOSITION, then retrieves it by its
      versioned_object_uid at 2000-01-01, long before the commit. No version
      is extant at that time, so the read is answered with 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_no_version_at_time.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when a version of the resource identified by the request parameters (at specified `version_at_time`) does not exist."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the COMPOSITION at a time before it existed.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: "2000-01-01T00:00:00Z" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_composition-at_time_malformed
    summary: A COMPOSITION read whose version_at_time is not an ISO 8601 datetime is refused as a client error
    description: >-
      Creates an EHR and commits a COMPOSITION, then retrieves it by its
      versioned_object_uid with a version_at_time that is no datetime at all.
      The query parameter breaks the extended ISO 8601 format the release
      requires, so the read is answered 400 Bad Request.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Datetime format
      quote: "HTTP query parameters and path segments that are dates, datetimes, or times, MUST always use the _extended_ ISO 8601 format."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the COMPOSITION with a malformed version_at_time.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: not-a-datetime }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"

  - workflowId: get_composition-superseded_version_uid
    summary: A COMPOSITION read by the version_uid of a superseded version serves that version
    description: >-
      Creates an EHR, commits a COMPOSITION and updates it, then retrieves the
      COMPOSITION by the version_uid of the commit. That uid names the first
      version, so its content, the count 15, is served although a newer
      version exists.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/composition_get.yaml
      section: description
      quote: "The former is used to retrieve a specific known version of the COMPOSITION (e.g. one identified by `8849182c-82ad-4088-a07f-48ead4180515::openEHRSys.example.com::1`),"
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *update
      - stepId: get
        description: Retrieve the COMPOSITION by the version_uid of the first version.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: *composition_retrieved
          - *is_v1

  - workflowId: get_composition-deleted-latest
    summary: A COMPOSITION read by versioned_object_uid after a delete is answered 204
    description: >-
      Creates an EHR, commits a COMPOSITION and deletes it, then retrieves it
      by its versioned_object_uid without a version_at_time. The latest
      version is the deleted one, so the read is answered 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &deleted_read
      source: specs/openehr/ITS-REST/specifications/responses/204_deleted_at_time.yaml
      section: description
      quote: "`204 No Content` is returned when the resource identified by the request parameters (at specified `version_at_time`) time has been deleted."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - &delete
        stepId: delete
        description: Delete the COMPOSITION by the version_uid of the commit.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_version_deleted.yaml
              section: description
              quote: "`204 No Content` is returned for a successful delete operation."
      - stepId: get
        description: Retrieve the COMPOSITION by its versioned_object_uid without a version_at_time.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 204

  - workflowId: get_composition-deleted-at_time
    summary: A COMPOSITION read at the time of its delete is answered 204
    description: >-
      Creates an EHR, commits a COMPOSITION and deletes it, reads the latest
      VERSION for the time the delete was recorded, then retrieves the
      COMPOSITION by its versioned_object_uid at that time. The version
      extant then is the deleted one, so the read is answered 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *deleted_read
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *delete
      - *latest
      - stepId: get
        description: Retrieve the COMPOSITION at the time of the delete.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: $steps.latest.outputs.time_committed }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 204

  - workflowId: get_composition-deleted-version_uid
    summary: A COMPOSITION read by the version_uid a delete created is answered 204
    description: >-
      Creates an EHR, commits a COMPOSITION and deletes it, reads the latest
      VERSION for the version_uid the delete created, then retrieves the
      COMPOSITION by that version_uid. The version it names is the deleted
      one, so the read is answered 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *deleted_read
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *delete
      - *latest
      - stepId: get
        description: Retrieve the COMPOSITION by the version_uid the delete created.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.latest.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 204
