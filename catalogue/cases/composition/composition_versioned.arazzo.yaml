  - workflowId: get_versioned_composition_version-by_id-unknown_version
    summary: A VERSION read by a version_uid that names no version of a real container is answered 404
    description: >-
      Creates an EHR and commits a COMPOSITION, then retrieves under its
      versioned_object_uid a VERSION by a well-formed version_uid of that
