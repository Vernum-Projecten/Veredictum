  - workflowId: get_versioned_composition_version-by_id-of_other_container
    summary: A VERSION read under one container by the version_uid of another container is answered 404
    description: >-
      Creates an EHR and commits two COMPOSITIONs, then retrieves under the
      versioned_object_uid of the first the VERSION the second commit
      created. That version belongs to the other VERSIONED_COMPOSITION, so
      in the addressed container no VERSION carries its version_uid and the
      read is answered with 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *version_by_id_not_found
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: commit-other
        description: Commit a second COMPOSITION and keep its version_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *composition
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: get
        description: Retrieve the second COMPOSITION's VERSION under the first one's versioned_object_uid.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit-other.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition_version-by_id-deleted
    summary: The VERSION a delete created is served with lifecycle_state deleted and no data
    description: >-
      Creates an EHR, commits a COMPOSITION and deletes it, reads the latest
      VERSION for the version_uid the delete created, then retrieves that
      VERSION by its version_uid. A logical delete commits a new version
      whose data is removed and whose lifecycle_state is the code for
      deleted, 523 in the openEHR version lifecycle state vocabulary.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *version_by_id_retrieved
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - &delete
        stepId: delete
        description: Delete the COMPOSITION by the version_uid of the commit.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_version_deleted.yaml
              section: description
              quote: "`204 No Content` is returned for a successful delete operation."
      - *latest
      - stepId: get
        description: Retrieve the VERSION the delete created by its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.latest.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^523$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Logical Deletion
              quote: "set the `_lifecycle_state_` value to the code for \"deleted\""
          - condition: $response.body#/data == null
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Logical Deletion
              quote: "delete its `_data_` (which will by default be a copy of the data of the previous Version);"
          - condition: $response.body#/commit_audit/time_committed/value != null
            x-veredictum-cite:
              source: specs/openehr/RM/docs/UML/classes/version.adoc
              section: VERSION Class
              quote: "Audit trail corresponding to the committal of this version to the `VERSIONED_OBJECT`."

  - workflowId: get_versioned_composition-revision_history
    summary: The revision history of the VERSIONED_COMPOSITION lists every version
    description: >-
      Creates an EHR, commits a COMPOSITION and updates it once, then
      retrieves the revision history. The history holds an item for the
      version the commit created and one for the version the update created.
      Their order is not judged: the released class contradicts itself on it
      (upstream report #661).
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/revision_history.adoc
      section: REVISION_HISTORY Class
      quote: "Defines the notion of a revision history of audit items, each associated with the version for which that audit was committed."
      report: 240
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *update
      - *latest
      - stepId: get
        description: Retrieve the revision history.
        operationId: $sourceDescriptions.ehr.versioned_composition_revision_history
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &history_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_REVISION_HISTORY.yaml
              section: description
              quote: "`200 OK` is returned when the requested REVISION_HISTORY is successfully retrieved."
          - context: $response.body
            type: jsonpath
            condition: "$.items[?@.version_id.value == '{$steps.commit.outputs.version_uid}']"
          - context: $response.body
            type: jsonpath
            condition: "$.items[?@.version_id.value == '{$steps.latest.outputs.version_uid}']"
          - context: $response.body
            type: jsonpath
            condition: "$.items[?@.version_id.value == '{$steps.commit.outputs.version_uid}' && @.audits[0].time_committed]"
            x-veredictum-cite: &item_audits
              source: specs/openehr/RM/docs/UML/classes/revision_history_item.adoc
              section: REVISION_HISTORY_ITEM Class
              quote: "The audits for this revision; there will always be at least one commit audit (which may itself be an `ATTESTATION`), there may also be further attestations."
              level: must
          - context: $response.body
            type: jsonpath
            condition: "$.items[?@.version_id.value == '{$steps.latest.outputs.version_uid}' && @.audits[0].time_committed]"
            x-veredictum-cite: *item_audits

