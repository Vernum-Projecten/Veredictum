  - workflowId: get_versioned_composition_version-by_id
    summary: A VERSION read by version_uid serves the version that uid identifies
    description: >-
      Creates an EHR, commits a COMPOSITION whose count is 15 and updates it
      to a second version, then retrieves the VERSION by the version_uid of
      the commit. The served VERSION's uid is the one addressed, and its data
      carries the count 15 of the first version.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_by_id.yaml
      section: description
      quote: "Retrieves a VERSION identified by `version_uid` of a VERSIONED_COMPOSITION identified by `versioned_object_uid` and associated with the EHR identified by `ehr_id`."
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - *update
      - stepId: get
        description: Retrieve the VERSION by the version_uid of the commit.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite: &version_by_id_retrieved
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSION_of_COMPOSITION_by_id.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSION is successfully retrieved."
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
            x-veredictum-cite: &version_uid_is_uid
              source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
              section: Identifier types
              quote: "a `version_uid` for identifying a VERSION from the version container, stored under VERSION.uid.value, in a form of an OBJECT_VERSION_ID,"
          - condition: $response.body#/data/content/0/data/events/0/data/items/0/value/magnitude == 15

