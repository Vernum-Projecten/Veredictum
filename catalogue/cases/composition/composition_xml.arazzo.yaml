# A COMPOSITION created from canonical XML, on the arm of the
# `composition-xml-write` option where the service processes XML request
# payloads, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. Every criterion resolves to an `x-veredictum-cite` (its
# own, else its step's, else its workflow's), and every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION create from canonical XML
  version: 0.1.0
  description: >-
    Creating a COMPOSITION sent as canonical XML, an instance of the
    composition element the published ITS-XML schema Composition.xsd
    declares: the valid COMPOSITION is created and reads back as the
    COMPOSITION sent, and its twin with an invalid setting code is refused
    with 422 like the JSON one.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-xml
    summary: A COMPOSITION sent as canonical XML is created and reads back as sent
    description: >-
      Creates an EHR, then creates an event COMPOSITION sent as canonical XML
      under the identifier preference, and retrieves the version the
      identifier names as JSON. The version holds the COMPOSITION sent: its
      archetype_node_id, template_id, setting code and EVALUATION quantity.
      A server that declines the identifier preference leaves the instrument
      without a version_uid, and the row is errored rather than failed.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/composition_create.yaml
      section: description
      quote: "Creates the first version of a new COMPOSITION in the EHR identified by `ehr_id`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: commit
        description: Create the COMPOSITION from canonical XML and keep the version_uid the identifier preference answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Content-Type, in: header, value: application/xml }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/xml
          payload: |-
            <composition archetype_node_id="openEHR-EHR-COMPOSITION.minimal.v1" xmlns="http://schemas.openehr.org/v1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><name><value>Minimal</value></name><archetype_details><archetype_id><value>openEHR-EHR-COMPOSITION.minimal.v1</value></archetype_id><template_id><value>minimal_evaluation.en.v1</value></template_id><rm_version>1.0.2</rm_version></archetype_details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><territory><terminology_id><value>ISO_3166-1</value></terminology_id><code_string>UY</code_string></territory><category><value>event</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>433</code_string></defining_code></category><composer xsi:type="PARTY_IDENTIFIED"><external_ref><id xsi:type="HIER_OBJECT_ID"><value>fc376c46-29c1-4090-bc01-5cc046af7f26</value></id><namespace>DEMOGRAPHIC</namespace><type>PERSON</type></external_ref><name>Dr. House</name></composer><context><start_time><value>2021-09-21T21:52:31.927-03:00</value></start_time><setting><value>primary medical care</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>228</code_string></defining_code></setting><participations><function><value>legal guardian consent author</value></function><performer xsi:type="PARTY_RELATED"><name>Alexandra Alamo</name><relationship><value>mother</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>10</code_string></defining_code></relationship></performer><mode><value>not specified</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>193</code_string></defining_code></mode></participations></context><content xsi:type="EVALUATION" archetype_node_id="openEHR-EHR-EVALUATION.minimal.v1"><name><value>Minimal</value></name><archetype_details><archetype_id><value>openEHR-EHR-EVALUATION.minimal.v1</value></archetype_id><template_id><value>minimal_evaluation.en.v1</value></template_id><rm_version>1.0.2</rm_version></archetype_details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><encoding><terminology_id><value>IANA_character-sets</value></terminology_id><code_string>UTF-8</code_string></encoding><subject xsi:type="PARTY_SELF"></subject><data xsi:type="ITEM_TREE" archetype_node_id="at0001"><name><value>Arbol</value></name><items xsi:type="ELEMENT" archetype_node_id="at0002"><name><value>quantity</value></name><value xsi:type="DV_QUANTITY"><magnitude>78.5</magnitude><units>kg</units></value></items></data></content></composition>
        successCriteria:
          - condition: $response.body#/uid != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: Prefer only identifier
              quote: "The response body SHOULD contain only the identifier of the affected resource formatted according to the `Accept` request header."
              level: should
              report: 673
        outputs:
          version_uid: $response.body#/uid
      - stepId: read
        description: Retrieve the committed version as JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - context: $response.body#/archetype_node_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.minimal\.v1$'
          - context: $response.body#/archetype_details/template_id/value
            type: regex
            condition: '^minimal_evaluation\.en\.v1$'
          - context: $response.body#/context/setting/defining_code/code_string
            type: regex
            condition: '^228$'
          - context: $response.body#/content/0/data/items/0/value/units
            type: regex
            condition: '^kg$'

  - workflowId: create_composition-xml-setting_invalid
    summary: A COMPOSITION sent as canonical XML whose setting is no setting code is refused with 422
    description: >-
      Creates an EHR, then creates an event COMPOSITION sent as canonical XML
      whose EVENT_CONTEXT setting defining_code is 999, which the openEHR
      setting group does not hold. The document is valid against the
      published XSD and breaks the EVENT_CONTEXT invariant, so the create is
      refused with 422 Unprocessable Entity, as its JSON twin is.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/event_context.adoc
      section: EVENT_CONTEXT Class
      quote: "__Setting_valid__: `Terminology (Terminology_id_openehr).has_code_for_group_id (Group_id_setting, setting.defining_code)`"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the COMPOSITION from canonical XML with setting code 999.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Content-Type, in: header, value: application/xml }
        requestBody:
          contentType: application/xml
          payload: |-
            <composition archetype_node_id="openEHR-EHR-COMPOSITION.minimal.v1" xmlns="http://schemas.openehr.org/v1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><name><value>Minimal</value></name><archetype_details><archetype_id><value>openEHR-EHR-COMPOSITION.minimal.v1</value></archetype_id><template_id><value>minimal_evaluation.en.v1</value></template_id><rm_version>1.0.2</rm_version></archetype_details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><territory><terminology_id><value>ISO_3166-1</value></terminology_id><code_string>UY</code_string></territory><category><value>event</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>433</code_string></defining_code></category><composer xsi:type="PARTY_IDENTIFIED"><external_ref><id xsi:type="HIER_OBJECT_ID"><value>fc376c46-29c1-4090-bc01-5cc046af7f26</value></id><namespace>DEMOGRAPHIC</namespace><type>PERSON</type></external_ref><name>Dr. House</name></composer><context><start_time><value>2021-09-21T21:52:31.927-03:00</value></start_time><setting><value>primary medical care</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>999</code_string></defining_code></setting><participations><function><value>legal guardian consent author</value></function><performer xsi:type="PARTY_RELATED"><name>Alexandra Alamo</name><relationship><value>mother</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>10</code_string></defining_code></relationship></performer><mode><value>not specified</value><defining_code><terminology_id><value>openehr</value></terminology_id><code_string>193</code_string></defining_code></mode></participations></context><content xsi:type="EVALUATION" archetype_node_id="openEHR-EHR-EVALUATION.minimal.v1"><name><value>Minimal</value></name><archetype_details><archetype_id><value>openEHR-EHR-EVALUATION.minimal.v1</value></archetype_id><template_id><value>minimal_evaluation.en.v1</value></template_id><rm_version>1.0.2</rm_version></archetype_details><language><terminology_id><value>ISO_639-1</value></terminology_id><code_string>en</code_string></language><encoding><terminology_id><value>IANA_character-sets</value></terminology_id><code_string>UTF-8</code_string></encoding><subject xsi:type="PARTY_SELF"></subject><data xsi:type="ITEM_TREE" archetype_node_id="at0001"><name><value>Arbol</value></name><items xsi:type="ELEMENT" archetype_node_id="at0002"><name><value>quantity</value></name><value xsi:type="DV_QUANTITY"><magnitude>78.5</magnitude><units>kg</units></value></items></data></content></composition>
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The request was well-formed but was unable to be followed due to semantic errors"
