# A COMPOSITION create carrying a DV_TEXT whose value is empty, which the
# DV_TEXT invariant of the development RM refuses, as an Arazzo 1.1.0
# workflow over the released ITS-REST `-validation` OAS. The workflow rests on
# the pinned development snapshot of the RM, so the released profile skips it
# as development-only. Every criterion resolves to an `x-veredictum-cite` (its
# own, else its step's, else its workflow's), and every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION empty text refusal
  version: 0.1.0
  x-veredictum-section: refusals
  description: >-
    The development RM gives DV_TEXT the invariant Valid_value, so a text
    whose value is the empty string is invalid. The published ITS-JSON schema
    types DV_TEXT.value as a string with no length floor, so the body is
    syntactically valid and breaks an RM invariant, and the create is refused
    with 422. The body is the valid event COMPOSITION of the create document
    with one defect.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
  - name: composition_create
    url: composition_create.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-text_value_empty
    x-veredictum-control: $sourceDescriptions.composition_create.create_composition-event
    summary: A COMPOSITION carrying a DV_TEXT with an empty value is refused with 422
    description: >-
      Creates an EHR, then creates an event COMPOSITION whose participation
      function, a DV_TEXT the template does not constrain, has the empty
      string as its value. The body is valid against the published ITS-JSON
      schema and breaks the DV_TEXT invariant of the development RM, so the
      create is refused with 422 Unprocessable Entity.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr-development/specifications-RM/docs/UML/classes/org.openehr.rm.data_types.dv_text.adoc
      section: DV_TEXT Class
      quote: "__Valid_value__: `not value.is_empty`"
    inputs:
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create
        description: Create the COMPOSITION whose participation function is a DV_TEXT with an empty value.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
          replacements:
            - { target: /context/participations/0/function/value, value: "" }
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The request was well-formed but was unable to be followed due to semantic errors"
