# The COMPOSITION read in the Simplified Structured JSON format, for a service
# that does not serve it: the refused arm of the `composition-structured-read`
# option, whose served arm is `composition_read_structured.arazzo.yaml`. Every
# quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION read in the Simplified Structured format, refused
  version: 0.1.0
  description: >-
    Reading a COMPOSITION by its version_uid, and by its versioned_object_uid
    with and without a version_at_time, in the Simplified Structured JSON
    format from a service that does not serve it.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_composition-structured_not_acceptable
    summary: A COMPOSITION read with Accept for the Simplified Structured format is refused with 406
    description: >-
      Creates an EHR, commits a COMPOSITION in canonical JSON, then retrieves
      it by its version_uid asking for the Simplified Structured JSON format from
      a service that does not serve it. The read is refused with 406 Not
      Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: &refused
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Simplified Formats
      quote: "If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &ehr_created
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: >-
          Commit a COMPOSITION, keep the version_uid of the full representation
          the create answers with, and derive the versioned_object_uid from it.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &composition
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: content case carrier }
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { _type: TEMPLATE_ID, value: cnf.tpl.count_range }
              rm_version: 1.0.2
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: NL
            category:
              _type: DV_CODED_TEXT
              value: event
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "433"
            composer: { _type: PARTY_SELF }
            context:
              _type: EVENT_CONTEXT
              start_time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
              setting:
                _type: DV_CODED_TEXT
                value: other care
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "238"
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: content observation }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: 1.0.2
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: history }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: any event }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2026-01-01T00:00:00Z" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: tree }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: value }
                            archetype_node_id: at0004
                            value: { _type: DV_COUNT, magnitude: 15 }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite: &composition_created
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: get
        description: Retrieve the COMPOSITION by its version_uid in the Simplified Structured JSON format.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_composition-latest-structured_not_acceptable
    summary: A COMPOSITION read by versioned_object_uid without version_at_time with Accept for the Simplified Structured JSON format is refused with 406
    description: >-
      Creates an EHR, commits a COMPOSITION in canonical JSON, then retrieves
      its latest version by the versioned_object_uid derived from the commit's
      version_uid, asking a service that does not serve it for the Simplified
      Structured JSON format. The read is refused with 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *refused
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the latest COMPOSITION by its versioned_object_uid in the Simplified Structured JSON format.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_composition-at_time-structured_not_acceptable
    summary: A COMPOSITION read by versioned_object_uid at a time with Accept for the Simplified Structured JSON format is refused with 406
    description: >-
      Creates an EHR, commits a COMPOSITION in canonical JSON, then retrieves
      the version extant at 2999-01-01, after the commit, by the
      versioned_object_uid derived from the commit's version_uid, asking a
      service that does not serve it for the Simplified Structured JSON
      format. The read is refused with 406 Not Acceptable.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite: *refused
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the COMPOSITION by its versioned_object_uid at a time after the commit in the Simplified Structured JSON format.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_at_time, in: query, value: "2999-01-01T00:00:00.000Z" }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 406

  - workflowId: get_composition-structured_warning
    summary: A COMPOSITION read with Accept for the Simplified Structured format, recorded against the SHOULD to support it
    description: >-
      Creates an EHR, commits a COMPOSITION in canonical JSON, then retrieves
      it by its version_uid asking for the Simplified Structured JSON format, the
      request the refusal rows send, and expects it served. The release recommends supporting the
      Simplified Formats, so on the arm where the service declares it does
      not, this row records the SHOULD it declines: it is a warning and never
      counts against the capability.
    dependsOn: [$sourceDescriptions.setup.upload_template-count_range]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Data representation
      quote: "Additionally, the **Simplified Formats** format SHOULD be supported"
      level: should
    inputs: *ehr_input
    steps:
      - *create
      - *commit
      - stepId: get
        description: Retrieve the COMPOSITION by its version_uid in the Simplified Structured JSON format.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/openehr.wt.structured+json }
        successCriteria:
          - condition: $statusCode == 200
