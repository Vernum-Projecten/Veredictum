      whose ITEM_TREE holds a CLUSTER with no items member. CLUSTER.items is
      mandatory, and the published ITS-JSON schema (openehr_rm_1.1.0_all.json,
      CLUSTER, required items) refuses the body, so it is syntactically
      invalid content: the update is refused with 400 Bad Request, and the
      latest VERSION is still the created one.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *invalid_content
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with a body carrying a CLUSTER with no items.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: &update_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
