# The COMPOSITION updates a service refuses: a malformed versioned_object_uid,
# bodies the published schema refuses, content that breaks an RM invariant of
# the container or of the commit audit, and an EHR that is not modifiable, as
# Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS. Each
# refusal reads the latest VERSION back to show nothing was committed. Every
# criterion resolves to an `x-veredictum-cite` (its own, else its step's, else
# its workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: COMPOSITION update refusals
  version: 0.1.0
  x-veredictum-section: refusals
  description: >-
    The COMPOSITION updates a service refuses with 400, 422 or another client
    error, each followed by a read of the latest VERSION, which is still the
    one the create committed.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
  - name: composition_update
    url: composition_update.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: update_composition-malformed_versioned_object_uid
    x-veredictum-control: $sourceDescriptions.composition_update.update_composition-event
    summary: A COMPOSITION update whose uid_based_id is no UUID is refused as a client error
    description: >-
      Creates an EHR and an event COMPOSITION, then updates a COMPOSITION by a
      uid_based_id path segment that is no UUID. The released parameter of
      the update is a versioned_object_uid in UUID form, so the request is a
      client error and is answered 400 Bad Request, and the COMPOSITION keeps
      its created version.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/parameters/path/uid_based_id_as_versioned_object_uid.yaml
      section: /schema/format
      quote: "uuid"
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Create the event COMPOSITION, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update a COMPOSITION whose uid_based_id segment is malformed.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: "not!a-uuid" }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - &client_error
            condition: $statusCode == 400
            x-veredictum-cite: &invalid_content
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
      - &unchanged
        stepId: latest
        description: Read the latest VERSION of the COMPOSITION; the refused update committed nothing.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'

