# The COMPOSITION create and update answered in canonical XML, for a service
# that serves it: the served arm of the `composition-xml-read` option, whose
# other arm is `composition_write_xml_not_acceptable.arazzo.yaml`, as Arazzo
# 1.1.0 workflows over the released ITS-REST `-validation` OAS. Every
# criterion resolves to an `x-veredictum-cite` (its own, else its step's, else
# its workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: COMPOSITION writes answered in canonical XML
  version: 0.1.0
  description: >-
    A COMPOSITION create and a COMPOSITION update that ask with Accept
    application/xml for the full representation, from a service that serves
    canonical XML.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-accept_xml
    summary: A COMPOSITION create that asks for canonical XML is answered in it
    description: >-
      Creates an EHR, then creates an event COMPOSITION sent as canonical JSON
      with Prefer return=representation and Accept application/xml. The create
      is answered 201 with Content-Type application/xml, and its document
      element is a composition carrying the members the ITS-XML schema requires.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &negotiation
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: XML Format
      quote: "Proper header `Content-Type: application/xml` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create
        description: Create the event COMPOSITION and ask for its full representation in canonical XML.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/xml }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
          - &negotiated
            context: $response.header.Content-Type
            type: regex
            condition: '^application/xml'
          # NOTE: ITS-REST overview Resources.md §XML Format names no namespace, so either published
          # ITS-XML lineage's (v1 Release-1.0.2, v2 Release-2.0.0) holds.
          - &composition_root
            context: $response.body
            type: xpath
            condition: exists(/oe:composition) or exists(/oe2:composition)
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Composition.xsd
              section: element composition
              quote: '<xs:element name="composition" type="COMPOSITION"/>'
          - &composition_archetype_node_id
            context: $response.body
            type: xpath
            condition: exists(/oe:composition/@archetype_node_id) or exists(/oe2:composition/@archetype_node_id)
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Structure.xsd
              section: complexType LOCATABLE
              quote: '<xs:attribute name="archetype_node_id" type="archetypeNodeId" use="required"/>'
          - &composition_name
            context: $response.body
            type: xpath
            condition: count(/oe:composition/oe:name) eq 1 or count(/oe2:composition/oe2:name) eq 1
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Structure.xsd
              section: complexType LOCATABLE
              quote: '<xs:element name="name" type="DV_TEXT"/>'
          - &composition_language
            context: $response.body
            type: xpath
            condition: count(/oe:composition/oe:language) eq 1 or count(/oe2:composition/oe2:language) eq 1
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Composition.xsd
              section: complexType COMPOSITION
              quote: '<xs:element name="language" type="CODE_PHRASE"/>'
          - &composition_territory
            context: $response.body
            type: xpath
            condition: count(/oe:composition/oe:territory) eq 1 or count(/oe2:composition/oe2:territory) eq 1
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Composition.xsd
              section: complexType COMPOSITION
              quote: '<xs:element name="territory" type="CODE_PHRASE"/>'
          - &composition_category
            context: $response.body
            type: xpath
            condition: count(/oe:composition/oe:category) eq 1 or count(/oe2:composition/oe2:category) eq 1
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Composition.xsd
              section: complexType COMPOSITION
              quote: '<xs:element name="category" type="DV_CODED_TEXT"/>'
          - &composition_composer
            context: $response.body
            type: xpath
            condition: count(/oe:composition/oe:composer) eq 1 or count(/oe2:composition/oe2:composer) eq 1
            x-veredictum-cite:
              source: specs/its-xml-schemas/its-xml-1.0.2-nsv1/ALL/Composition.xsd
              section: complexType COMPOSITION
              quote: '<xs:element name="composer" type="PARTY_PROXY"/>'

  - workflowId: update_composition-accept_xml
    summary: A COMPOSITION update that asks for canonical XML is answered in it
    description: >-
      Creates an EHR and an event COMPOSITION in canonical JSON, then updates
      it with Prefer return=representation and Accept application/xml. The
      update is answered 200 with Content-Type application/xml, and its
      document element is a composition carrying the members the ITS-XML
      schema requires.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *negotiation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit
        stepId: commit
        description: Create the event COMPOSITION in canonical JSON, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update the COMPOSITION and ask for its full representation in canonical XML.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/xml }
        requestBody:
          contentType: application/json
          payload: *event
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_updated.yaml
              section: description
              quote: "`200 OK` is returned when the COMPOSITION is successfully updated, with the full resource in the response body when `Prefer` header is `return=representation`,"
          - *negotiated
          - *composition_root
          - *composition_archetype_node_id
          - *composition_name
          - *composition_language
          - *composition_territory
          - *composition_category
          - *composition_composer
