# The COMPOSITION creates a service refuses: an unknown EHR or template, a
# body the published ITS-JSON schema refuses, a body that breaks an RM
# invariant, an unsupported media type, and an EHR that is not modifiable,
# as Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS.
# Every criterion resolves to an `x-veredictum-cite` (its own, else its
# step's, else its workflow's), and every quote is copied verbatim from the
# named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION create refusals
  version: 0.1.0
  description: >-
    The COMPOSITION creates that are refused. A body the published ITS-JSON
    schema (openehr_rm_1.1.0_all.json) refuses is syntactically invalid
    content and is answered 400; a schema-valid body that breaks an RM
    invariant or names a template the server does not hold is answered 422.
    Each defective body is the valid event COMPOSITION of the create
    document with one defect.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-unknown_ehr
    summary: A COMPOSITION create in an EHR that does not exist is answered 404
    description: >-
      Creates a valid event COMPOSITION under a freshly generated ehr_id that
      no EHR carries. The create is answered with 404 Not Found.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - stepId: create
        description: Create the event COMPOSITION under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: create_composition-unknown_template
    summary: A COMPOSITION that names a template the server does not hold is refused with 422
    description: >-
      Creates an EHR, then creates a COMPOSITION whose archetype_details names
      the template_id cnf.absent_template.v99, which no workflow uploads. The
      body is syntactically valid, and the template it names is not known, so
      the create is refused with 422 Unprocessable Entity.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/responses/422.yaml
      section: description
      quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."
    inputs: *ehr_input
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create
        description: Create a COMPOSITION that names a template the server does not hold.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *event
          replacements:
            - { target: /archetype_details/template_id/value, value: cnf.absent_template.v99 }
            - { target: /content/0/archetype_details/template_id/value, value: cnf.absent_template.v99 }
        successCriteria:
          - condition: $statusCode == 422

  - workflowId: create_composition-wrong_media
    summary: A COMPOSITION create labelled text/plain is answered 415
    description: >-
      Creates an EHR, then sends a valid event COMPOSITION labelled
      Content-Type text/plain. The operation takes a COMPOSITION in the
      formats its Content-Type parameter lists, and text/plain is none of
      them, so the create is answered 415 Unsupported Media Type.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service is refusing the request because the payload is in a format not supported by this method on the target resource"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION with the body labelled text/plain.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: text/plain
          payload: '{"_type":"COMPOSITION"}'
        successCriteria:
          - condition: $statusCode == 415

  - workflowId: create_composition-ehr_not_modifiable
    summary: A COMPOSITION create in an EHR whose EHR_STATUS is not modifiable is refused
    description: >-
      Creates an EHR, updates its EHR_STATUS to is_modifiable false, then
      creates a valid event COMPOSITION in it. The contents of an EHR that is
      not modifiable may not be written to, so the create is refused with a
      client error. No released sentence names the status code, so any 4xx
      answer holds.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &not_modifiable
      source: specs/openehr/RM/docs/UML/classes/ehr_status.adoc
      section: EHR_STATUS Class
      quote: "True if the EHR, other than the `EHR_STATUS` object, is allowed to be written to."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &current_status
        stepId: current-status
        description: Read the latest version of the EHR_STATUS for its version_uid.
        operationId: $sourceDescriptions.ehr.versioned_ehr_status_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_ehr_status_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
        outputs:
          version_uid: $response.body#/uid/value
      - &deactivate
        stepId: deactivate
        description: Update the EHR_STATUS with is_modifiable false under the current version.
        operationId: $sourceDescriptions.ehr.ehr_status_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: If-Match, in: header, value: '"{$steps.current-status.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload:
            _type: EHR_STATUS
            archetype_node_id: openEHR-EHR-EHR_STATUS.generic.v1
            name: { _type: DV_TEXT, value: EHR status }
            archetype_details:
              archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-EHR_STATUS.generic.v1 }
              rm_version: 1.1.0
            subject: { _type: PARTY_SELF }
            is_queryable: true
            is_modifiable: false
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(200|204)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
      - stepId: create
        description: Create the event COMPOSITION in the EHR that is not modifiable.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^4[0-9][0-9]$'

  - workflowId: create_composition-invalid_event
    summary: An event COMPOSITION whose EVALUATION has no data is refused with 400
    description: >-
      Creates an EHR, then creates an event COMPOSITION whose EVALUATION
      carries no data. EVALUATION.data is mandatory, and the published
      ITS-JSON schema (openehr_rm_1.1.0_all.json, EVALUATION, required data)
      refuses the body, so it is syntactically invalid content and the create
      is refused with 400 Bad Request.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &invalid_content
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: HTTP status codes
      quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION whose EVALUATION has no data.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
        successCriteria:
          - &bad_request
            condition: $statusCode == 400

  - workflowId: create_composition-invalid_persistent
    summary: A persistent COMPOSITION whose OBSERVATION has no data is refused with 400
    description: >-
      Creates an EHR, then creates a persistent COMPOSITION whose OBSERVATION
      carries no data. OBSERVATION.data is mandatory, and the published
