    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/UML/classes/dv_paragraph.adoc
      section: DV_PARAGRAPH Class
      quote: "__Items_valid__: `not items.is_empty`"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the COMPOSITION carrying a DV_PARAGRAPH with no items.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload:
