# The VERSIONED_COMPOSITION reads refused before any container is found: an
# unknown EHR, an unknown versioned_object_uid and a malformed one, on the
# version container, its versions at a time and by version_uid, and its
# revision history, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. Every criterion resolves to an `x-veredictum-cite` (its
# own, else its step's, else its workflow's), and every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: VERSIONED_COMPOSITION read refusals
  version: 0.1.0
  description: >-
    The four VERSIONED_COMPOSITION reads addressed to an ehr_id no EHR
    carries or to a versioned_object_uid no container carries, answered
    404, and addressed with a versioned_object_uid that is no UUID, answered
    400.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: composition_versioned
    url: composition_versioned.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: get_versioned_composition-unknown_ehr
    summary: A VERSIONED_COMPOSITION read under an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves the VERSIONED_COMPOSITION of a well-formed versioned_object_uid
      under a freshly generated ehr_id that no EHR carries. The read is
      answered with 404 Not Found.
    x-veredictum-cite: &container_not_found
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_versioned_object_uid.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when the `versioned_object_uid` does not exist."
    inputs: &ehr_object_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
    steps:
      - stepId: get
        description: Retrieve a VERSIONED_COMPOSITION under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition-unknown_versioned_object_uid
    summary: A VERSIONED_COMPOSITION read of a versioned_object_uid no container carries is answered 404
    description: >-
      Creates an EHR, then retrieves under it the VERSIONED_COMPOSITION of a
      well-formed versioned_object_uid that names no container. The read is
      answered with 404 Not Found.
    x-veredictum-cite: *container_not_found
    inputs: *ehr_object_input
    steps:
      - &create
        stepId: create
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: get
        description: Retrieve a VERSIONED_COMPOSITION no container carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition-malformed_versioned_object_uid
    x-veredictum-control: $sourceDescriptions.composition_versioned.get_versioned_composition
    summary: A VERSIONED_COMPOSITION read whose versioned_object_uid is no UUID is refused as a client error
    description: >-
      Creates an EHR, then retrieves under it a VERSIONED_COMPOSITION by a
      versioned_object_uid path segment that is no UUID. The released
      parameter is a UUID, so the request is a client error and is answered
      400 Bad Request, never as a miss.
    x-veredictum-cite: &voi_is_uuid
      source: specs/openehr/ITS-REST/specifications/parameters/path/versioned_object_uid_COMPOSITION.yaml
      section: /schema/format
      quote: "uuid"
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - *create
      - stepId: get
        description: Retrieve a VERSIONED_COMPOSITION whose versioned_object_uid segment is malformed.
        operationId: $sourceDescriptions.ehr.versioned_composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: "not!a-uuid" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: &client_error
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)"

  - workflowId: get_versioned_composition_version-unknown_ehr
    summary: A VERSION read at a time under an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves the latest VERSION of a well-formed versioned_object_uid
      under a freshly generated ehr_id that no EHR carries. The read is
      answered with 404 Not Found.
    x-veredictum-cite: &version_at_time_not_found
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_versioned_object_uid_or_no_version_at_time.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when `versioned_object_uid` does not exist, or when a version of the resource does not exist at the specified `version_at_time`."
    inputs: *ehr_object_input
    steps:
      - stepId: get
        description: Retrieve the latest VERSION under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition_version-unknown_versioned_object_uid
    summary: A VERSION read at a time of a versioned_object_uid no container carries is answered 404
    description: >-
      Creates an EHR, then retrieves under it the VERSION extant at a time of
      a well-formed versioned_object_uid that names no container. The read
      is answered with 404 Not Found.
    x-veredictum-cite: *version_at_time_not_found
    inputs: *ehr_object_input
    steps:
      - *create
      - stepId: get
        description: Retrieve a VERSION at a time of a container no versioned_object_uid carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
          - { name: version_at_time, in: query, value: "2026-01-01T00:00:00.000Z" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition_version-malformed_versioned_object_uid
    x-veredictum-control: $sourceDescriptions.composition_versioned.get_versioned_composition_version-latest
    summary: A VERSION read at a time whose versioned_object_uid is no UUID is refused as a client error
    description: >-
      Creates an EHR, then retrieves under it the latest VERSION by a
      versioned_object_uid path segment that is no UUID. The released
      parameter is a UUID, so the request is a client error and is answered
      400 Bad Request, never as a miss.
    x-veredictum-cite: *voi_is_uuid
    inputs: *ehr_input
    steps:
      - *create
      - stepId: get
        description: Retrieve the latest VERSION whose versioned_object_uid segment is malformed.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: "not!a-uuid" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *client_error

  - workflowId: get_versioned_composition_version-by_id-unknown_ehr
    summary: A VERSION read by version_uid under an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves a VERSION by a well-formed version_uid of a well-formed
      versioned_object_uid under a freshly generated ehr_id that no EHR
      carries. The read is answered with 404 Not Found.
    x-veredictum-cite: &version_by_id_not_found
      source: specs/openehr/ITS-REST/specifications/responses/404_unknown_ehr_id_or_versioned_object_uid_or_version_uid.yaml
      section: description
      quote: "`404 Not Found` is returned when an EHR with `ehr_id` does not exist, or when `versioned_object_uid` does not exist, or when a VERSION with `version_uid` does not exist."
    inputs: *ehr_object_input
    steps:
      - stepId: get
        description: Retrieve a VERSION by version_uid under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
          - { name: version_uid, in: path, value: "{$inputs.object_id}::veredictum.example.org::1" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition_version-by_id-unknown_versioned_object_uid
    summary: A VERSION read by version_uid of a versioned_object_uid no container carries is answered 404
    description: >-
      Creates an EHR, then retrieves under it a VERSION by a well-formed
      version_uid of a well-formed versioned_object_uid that names no
      container. The read is answered with 404 Not Found.
    x-veredictum-cite: *version_by_id_not_found
    inputs: *ehr_object_input
    steps:
      - *create
      - stepId: get
        description: Retrieve a VERSION by version_uid of a container no versioned_object_uid carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
          - { name: version_uid, in: path, value: "{$inputs.object_id}::veredictum.example.org::1" }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition_version-by_id-malformed_versioned_object_uid
    x-veredictum-control: $sourceDescriptions.composition_versioned.get_versioned_composition_version-by_id
    summary: A VERSION read by version_uid whose versioned_object_uid is no UUID is refused as a client error
    description: >-
      Creates an EHR, then retrieves under it a VERSION by a version_uid,
      with a versioned_object_uid path segment that is no UUID. The released
      parameter is a UUID, so the request is a client error and is answered
      400 Bad Request, never as a miss.
    x-veredictum-cite: *voi_is_uuid
    inputs: *ehr_object_input
    steps:
      - *create
      - stepId: get
        description: Retrieve a VERSION whose versioned_object_uid segment is malformed.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: "not!a-uuid" }
          - { name: version_uid, in: path, value: "{$inputs.object_id}::veredictum.example.org::1" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *client_error

  - workflowId: get_versioned_composition-revision_history-unknown_ehr
    summary: A revision history read under an ehr_id no EHR carries is answered 404
    description: >-
      Retrieves the revision history of a well-formed versioned_object_uid
      under a freshly generated ehr_id that no EHR carries. The read is
      answered with 404 Not Found.
    x-veredictum-cite: *container_not_found
    inputs: *ehr_object_input
    steps:
      - stepId: get
        description: Retrieve a revision history under an ehr_id no EHR carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_revision_history
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition-revision_history-unknown_versioned_object_uid
    summary: A revision history read of a versioned_object_uid no container carries is answered 404
    description: >-
      Creates an EHR, then retrieves under it the revision history of a
      well-formed versioned_object_uid that names no container. The read is
      answered with 404 Not Found.
    x-veredictum-cite: *container_not_found
    inputs: *ehr_object_input
    steps:
      - *create
      - stepId: get
        description: Retrieve the revision history of a container no versioned_object_uid carries.
        operationId: $sourceDescriptions.ehr.versioned_composition_revision_history
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $inputs.object_id }
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: get_versioned_composition-revision_history-malformed_versioned_object_uid
    x-veredictum-control: $sourceDescriptions.composition_versioned.get_versioned_composition-revision_history
    summary: A revision history read whose versioned_object_uid is no UUID is refused as a client error
    description: >-
      Creates an EHR, then retrieves under it a revision history by a
      versioned_object_uid path segment that is no UUID. The released
      parameter is a UUID, so the request is a client error and is answered
      400 Bad Request, never as a miss.
    x-veredictum-cite: *voi_is_uuid
    inputs: *ehr_input
    steps:
      - *create
      - stepId: get
        description: Retrieve a revision history whose versioned_object_uid segment is malformed.
        operationId: $sourceDescriptions.ehr.versioned_composition_revision_history
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: "not!a-uuid" }
        successCriteria:
          - condition: $statusCode == 400
            x-veredictum-cite: *client_error
