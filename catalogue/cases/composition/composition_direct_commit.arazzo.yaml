# The committal defaults and refusals the development ITS-REST adds for a
# direct COMPOSITION commit: the lifecycle_state a create or an update with no
# openehr-version header commits, and a change type that contradicts the
# method of the request, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. Every workflow rests on text only the pinned development
# snapshot holds, so a released run skips it as development-only. Every
# criterion resolves to an `x-veredictum-cite` (its own, else its step's, else
# its workflow's), and every quote is copied verbatim from the named vendored
# file.
arazzo: 1.1.0
info:
  title: COMPOSITION direct commit defaults
  version: 0.1.0
  x-veredictum-section: committal-headers
  description: >-
    The lifecycle_state 532 a COMPOSITION create or update commits when the
    client sends no openehr-version header, a change type that contradicts
    the method refused with 400 on a create, an update and a delete, and a
    change type consistent with the method accepted on a create.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
  - name: composition_update
    url: composition_update.arazzo.yaml
    type: arazzo
  - name: composition_delete
    url: composition_delete.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-lifecycle_complete_default
    summary: A COMPOSITION created with no openehr-version header is committed in the lifecycle_state complete
    description: >-
      Creates an EHR and an event COMPOSITION with no committal header, then
      reads the latest VERSION. The server sets the lifecycle_state the
      client did not send to 532|complete|.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &lifecycle_default
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "When `lifecycle_state` is not provided by the client, the server MUST set it to `complete` (code `532`)."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Create the event COMPOSITION with no committal header, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody: &event_body
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and its lifecycle_state.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: &latest_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &latest_version
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - &lifecycle_complete
            context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^532$'

  - workflowId: update_composition-lifecycle_complete_default
    summary: A COMPOSITION updated with no openehr-version header is committed in the lifecycle_state complete
    description: >-
      Creates an EHR and an event COMPOSITION, updates it under an If-Match
      naming the created version with no committal header, then reads the
      latest VERSION. The server sets the lifecycle_state the client did not
      send to 532|complete|.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *lifecycle_default
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy under the created version, with no committal header.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        requestBody: &cuddy_body
          contentType: application/json
          payload: *event
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - &updated
            context: $statusCode
            type: regex
            condition: '^(200|204)$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION, the one the update committed, and its lifecycle_state.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Contributions
              quote: "a new `ORIGINAL_VERSION` whose data contains the updated form of the item content is added to an existing `VERSIONED_OBJECT`;"
          - *lifecycle_complete

  - workflowId: update_composition-change_type_creation_refused
    x-veredictum-control: $sourceDescriptions.composition_update.update_composition-audit_change_type
    summary: A COMPOSITION update whose openehr-audit-details names the change type creation is refused with 400
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with an
      openehr-audit-details header naming the change type 249 (creation),
      which contradicts a PUT. The update is refused with 400 Bad Request,
      and the latest VERSION is still the created one. The control sends
      the change type 250 (amendment), which is consistent with a PUT.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &contradicting
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "a server SHOULD reject a `change_type` that contradicts the method (e.g. `creation` on a `PUT`, or `deleted` on a `POST`) with `400 Bad Request`."
      level: should
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with the change type 249 in openehr-audit-details.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="249"' }
        requestBody: *cuddy_body
        successCriteria:
          - &bad_request
            condition: $statusCode == 400
      - &unchanged
        stepId: latest
        description: Read the latest VERSION of the COMPOSITION; the refused request committed nothing.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'

  - workflowId: create_composition-change_type_creation_supplied
    summary: A COMPOSITION create whose openehr-audit-details names the change type creation is accepted and records it
    description: >-
      Creates an EHR, then an event COMPOSITION with an openehr-audit-details
      header naming the change type 249 (creation), which is consistent with
      a POST. The create is answered 201, and the VERSION it commits records
      the change type 249.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &consistent
      source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "A client MAY override the default `change_type` only with a value that is consistent with the operation, for instance `amendment` (code `250`) instead of `modification` on a `PUT`"
      level: may
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the event COMPOSITION with the change type 249 in openehr-audit-details, keep its version_uid and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="249"' }
        requestBody: *event_body
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and its commit audit.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^249$'
            x-veredictum-cite: &merged
              source: specs/openehr-development/specifications-ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: openehr-version and openehr-audit-details
              quote: "None of these headers are mandatory, but whatever is provided it MUST be merged with the default VERSION and VERSION.audit_details attributes on commit runtime."

  - workflowId: create_composition-change_type_deleted_refused
    x-veredictum-control: create_composition-change_type_creation_supplied
    summary: A COMPOSITION create whose openehr-audit-details names the change type deleted is refused with 400
    description: >-
      Creates an EHR, then an event COMPOSITION with an openehr-audit-details
      header naming the change type 523 (deleted), which contradicts a POST.
      The create is refused with 400 Bad Request. The control sends the
      change type 249 (creation), which is consistent with a POST.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *contradicting
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the event COMPOSITION with the change type 523 in openehr-audit-details.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="523"' }
        requestBody: *event_body
        successCriteria:
          - *bad_request

  - workflowId: delete_composition-change_type_creation_refused
    x-veredictum-control: $sourceDescriptions.composition_delete.delete_composition-change_type_deleted
    summary: A COMPOSITION delete whose openehr-audit-details names the change type creation is refused with 400
    description: >-
      Creates an EHR and an event COMPOSITION, then deletes it with an
      openehr-audit-details header naming the change type 249 (creation),
      which contradicts a DELETE. The delete is refused with 400 Bad Request,
      and the latest VERSION is still the created one. The control deletes
      with no committal header.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *contradicting
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: delete
        description: Delete the COMPOSITION with the change type 249 in openehr-audit-details.
        operationId: $sourceDescriptions.ehr.composition_delete
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: openehr-audit-details, in: header, value: 'change_type.code_string="249"' }
        successCriteria:
          - *bad_request
      - *unchanged
