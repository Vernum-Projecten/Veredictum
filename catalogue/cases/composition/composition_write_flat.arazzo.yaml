# A COMPOSITION created and updated from the Simplified Flat JSON format, for
# a service that processes it: the accepting arm of the `composition-flat-
# write` option, whose other arm is
# `composition_write_flat_unsupported.arazzo.yaml`, as Arazzo 1.1.0 workflows
# over the released ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION writes from the Simplified Flat JSON format
  version: 0.1.0
  description: >-
    A COMPOSITION create and a COMPOSITION update whose request body is the
    Simplified Flat JSON format, with the openehr-template-id header, sent to
    a service that processes the format.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-flat
    summary: A COMPOSITION sent in the Simplified Flat JSON format is created with the composer it names
    description: >-
      Creates an EHR, then creates a COMPOSITION of the template
      minimal_evaluation.en.v1 sent in the Simplified Flat JSON format, whose
      context names the composer Dr. Flat, and reads the committed VERSION
      from the container its versioned_object_uid names. The create is
      answered 201, and the VERSION holds a COMPOSITION whose composer is Dr.
      Flat.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &composer
      source: specs/openehr/ITS-REST/docs/simplified_formats/master06-context_information.adoc
      section: Composer
      quote: "`composer_name`: sets composer to party identified and sets the name"
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: commit
        description: Create the COMPOSITION from the Simplified Flat JSON format, keep the version_uid of the full representation, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: openehr-template-id, in: header, value: minimal_evaluation.en.v1 }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload: &simplified
            ctx/language: en
            ctx/territory: UY
            ctx/composer_name: Dr. Flat
            minimal/minimal:0/quantity|magnitude: 78.5
            minimal/minimal:0/quantity|unit: kg
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: version
        description: Read the committed VERSION and its composer.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSION_of_COMPOSITION_by_id.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSION is successfully retrieved."
          - &composer_named
            context: $response.body#/data/composer/name
            type: regex
            condition: '^Dr\. Flat$'

  - workflowId: update_composition-flat
    summary: A COMPOSITION update sent in the Simplified Flat JSON format commits the composer it names
    description: >-
      Creates an EHR and an event COMPOSITION in canonical JSON, then updates
      it with a COMPOSITION sent in the Simplified Flat JSON format whose
      context names the composer Dr. Flat, with Prefer return=minimal. The
      update is answered 204, and the latest VERSION holds a COMPOSITION whose
      composer is Dr. Flat.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *composer
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit
        stepId: commit
        description: Create the event COMPOSITION in canonical JSON, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update the COMPOSITION from the Simplified Flat JSON format and ask for the minimal response.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: openehr-template-id, in: header, value: minimal_evaluation.en.v1 }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/openehr.wt.flat+json
          payload: *simplified
        successCriteria:
          - condition: $statusCode == 204
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/204_version_updated.yaml
              section: description
              quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and its composer.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - *composer_named
