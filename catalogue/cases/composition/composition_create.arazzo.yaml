# Creating a COMPOSITION: the first version it commits, the representation
# preferences of the create, its committal headers, and the content a read of
# the new version returns, as Arazzo 1.1.0 workflows over the released
# ITS-REST `-validation` OAS. Every criterion resolves to an
# `x-veredictum-cite` (its own, else its step's, else its workflow's), and
# every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION create
  version: 0.1.0
  x-veredictum-section: create
  description: >-
    Creating the first version of an event and a persistent COMPOSITION, the
    minimal, identifier and representation preferences of the create, the
    ETag and Last-Modified headers it answers with, the content a read of
    the created version returns, and the change type, lifecycle_state and
    system_id of the VERSION it commits.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: create_composition-event
    summary: An event COMPOSITION valid against its template is created
    description: >-
      Creates an EHR, then creates an event COMPOSITION that is valid against
      the uploaded template minimal_evaluation.en.v1, with no Prefer header.
      The create succeeds: the answer is 201 Created, or 204 No Content,
      which the minimal preference recommends when no body is returned.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &create_operation
      source: specs/openehr/ITS-REST/specifications/operations/composition_create.yaml
      section: description
      quote: "Creates the first version of a new COMPOSITION in the EHR identified by `ehr_id`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - stepId: create
        description: Create the event COMPOSITION with no Prefer header.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - &created
            context: $statusCode
            type: regex
            condition: '^(201|204)$'
            x-veredictum-cite: &status_must
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."

  - workflowId: create_composition-persistent
    summary: A persistent COMPOSITION valid against its template is created
    description: >-
      Creates an EHR, then creates a persistent COMPOSITION that is valid
      against the uploaded template persistent_minimal.en.v1, with no Prefer
      header. The create succeeds with 201 Created or 204 No Content.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *create_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the persistent COMPOSITION with no Prefer header.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: &persistent
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Persistent minimal }
            archetype_details:
              _type: ARCHETYPED
              archetype_id:
                _type: ARCHETYPE_ID
                value: openEHR-EHR-COMPOSITION.persistent_minimal.v1
              template_id: { _type: TEMPLATE_ID, value: persistent_minimal.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.persistent_minimal.v1
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: UY
            category:
              _type: DV_CODED_TEXT
              value: persistent
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "431"
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                _type: PARTY_REF
                id: { _type: HIER_OBJECT_ID, value: a3dce0d4-fa51-4ff2-9cce-93dd60437842 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. Yamamoto
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: Event Series }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,380+00:00" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: Cualquier evento }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,384+00:00" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: Arbol }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: text }
                            archetype_node_id: at0004
                            value: { _type: DV_TEXT, value: original value }
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: "1.0.2"
        successCriteria:
          - *created

  - workflowId: create_composition-read_back
    summary: The version an event COMPOSITION create commits is retrievable by its version_uid
    description: >-
      Creates an EHR, creates an event COMPOSITION and keeps the version_uid
      of the full representation the create answers with, then retrieves
      that version. The answer is 200 with the committed COMPOSITION: its
      archetype_node_id, template_id and category are the ones sent.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *create_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit
        stepId: commit
        description: Create the event COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the committed version by its version_uid.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &retrieved
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - context: $response.body#/archetype_node_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.minimal\.v1$'
          - context: $response.body#/archetype_details/template_id/value
            type: regex
            condition: '^minimal_evaluation\.en\.v1$'
          - context: $response.body#/category/defining_code/code_string
            type: regex
            condition: '^433$'

  - workflowId: create_composition-persistent-read_back
    summary: The version a persistent COMPOSITION create commits is retrievable by its version_uid
    description: >-
      Creates an EHR, creates a persistent COMPOSITION and keeps the
      version_uid of the full representation the create answers with, then
      retrieves that version. The answer is 200 with the committed
      COMPOSITION, whose category is 431|persistent|.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *create_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the persistent COMPOSITION and keep the version_uid of the full representation it answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *persistent
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the committed version by its version_uid.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved
          - context: $response.body#/archetype_details/template_id/value
            type: regex
            condition: '^persistent_minimal\.en\.v1$'
          - context: $response.body#/category/defining_code/code_string
            type: regex
            condition: '^431$'

  - workflowId: create_composition-version_uid_form
    summary: The identifier a COMPOSITION create answers with is a version_uid in its three-part form
    description: >-
      Creates an EHR and an event COMPOSITION under the identifier
      preference, then retrieves the version by the identifier answered. The
      identifier has the lexical form object_id::creating_system_id::version_tree_id,
      and it addresses the committed version.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: Identifier types
      quote: "The `version_uid` uniquely identifies a VERSION, in the lexical form of `object_id :: creating_system_id :: version_tree_id`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the event COMPOSITION and keep the version_uid the identifier preference answers with.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - &identifier_answered
            condition: $response.body#/uid != null
            x-veredictum-cite: &identifier_only
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: Prefer only identifier
              quote: "The response body SHOULD contain only the identifier of the affected resource formatted according to the `Accept` request header."
              level: should
              report: 673
        outputs:
          version_uid: $response.body#/uid
      - stepId: read
        description: Retrieve the committed version by the identifier, and judge the identifier's form.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved
          - context: $steps.commit.outputs.version_uid
            type: regex
            condition: '^[^:]+::[^:]+::[^:]+$'

  - workflowId: create_composition-prefer_minimal
    summary: A COMPOSITION create with Prefer return=minimal answers with an empty body
    description: >-
      Creates an EHR, then creates an event COMPOSITION with Prefer
      return=minimal. The create succeeds, and the answer carries no body.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &minimal_body
      source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
      section: description
      quote: "If the `Prefer` header is missing or set to `return=minimal`, the body is empty."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION and ask for the minimal response.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *created
          - condition: $response.body == null

  - workflowId: create_composition-prefer_absent
    summary: A COMPOSITION create with no Prefer header is answered as minimal, with an empty body
    description: >-
      Creates an EHR, then creates an event COMPOSITION with no Prefer
      header. Without the header the minimal preference is assumed, so the
      create succeeds and the answer carries no body.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Representation details negotiation
      quote: "If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION with no Prefer header.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *created
          - condition: $response.body == null
            x-veredictum-cite: *minimal_body

  - workflowId: create_composition-location
    summary: A minimal COMPOSITION create answers with a Location header
    description: >-
      Creates an EHR, then creates an event COMPOSITION with Prefer
      return=minimal. The answer carries a Location header pointing at the
      new resource. The rule is recommended, so a row that answers otherwise
      is a warning.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer minimal, identifier or full representation response
      quote: "The response SHOULD include a `Location` header pointing to the newly created or updated resource."
      level: should
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION and ask for the minimal response.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *created
          - context: $response.header.Location
            type: regex
            condition: '^.+$'

  - workflowId: create_composition-return_representation
    summary: A COMPOSITION create with Prefer return=representation answers with the created COMPOSITION
    description: >-
      Creates an EHR, then creates an event COMPOSITION with Prefer
      return=representation and Accept application/json. The create succeeds
      with 201 or 200, and the body is the COMPOSITION, carrying the
      archetype_node_id and the category sent. The body rule is recommended,
      so a row that answers without it is a warning.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &full_representation
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer minimal, identifier or full representation response
      quote: "the response body SHOULD contain the full representation of the resource."
      level: should
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION and ask for the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - context: $statusCode
            type: regex
            condition: '^(200|201)$'
            x-veredictum-cite: *status_must
          - context: $response.body#/archetype_node_id
            type: regex
            condition: '^openEHR-EHR-COMPOSITION\.minimal\.v1$'
          - context: $response.body#/category/defining_code/code_string
            type: regex
            condition: '^433$'

  - workflowId: create_composition-return_identifier
    summary: A COMPOSITION create with Prefer return=identifier answers with the new version's uid only
    description: >-
      Creates an EHR, then creates an event COMPOSITION with Prefer
      return=identifier and Accept application/json. The body carries the
      identifier under uid and none of the COMPOSITION attributes, and that
      identifier addresses the created version. The identifier rule is
      recommended, so a row that answers otherwise is a warning; a server
      that sends no identifier leaves the read without a version_uid, and
      the row is errored rather than failed.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *identifier_only
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the event COMPOSITION and ask for its identifier only.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *identifier_answered
          - condition: $response.body#/archetype_node_id == null
          - condition: $response.body#/content == null
        outputs:
          version_uid: $response.body#/uid
      - stepId: read
        description: Retrieve the version the identifier names.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved

  - workflowId: create_composition-etag_weak
    summary: An ETag sent on a COMPOSITION create carries the weakness indicator
    description: >-
      Creates an EHR, then creates an event COMPOSITION. If the answer sends
      an ETag, it is a weak entity tag.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Deprecated headers
      quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION with Prefer return=minimal.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *created
          - context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'

  - workflowId: create_composition-etag_last_modified
    summary: A COMPOSITION create answers with ETag and Last-Modified
    description: >-
      Creates an EHR, then creates an event COMPOSITION. The answer carries
      both an ETag and a Last-Modified header. The rule is recommended, so a
      row that answers without them is a warning.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: ETag and Last-Modified
      quote: "Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers."
      level: should
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: create
        description: Create the event COMPOSITION with Prefer return=minimal.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *created
          - context: $response.header.ETag
            type: regex
            condition: '^.+$'
          - context: $response.header.Last-Modified
            type: regex
            condition: '^.+$'

  - workflowId: create_composition-datetime_lexical
    summary: A DV_DATE_TIME a COMPOSITION is created with is read back in the form sent
    description: >-
      Creates an EHR and an event COMPOSITION whose context start_time is
      2021-09-21T21:52:31.927-03:00, then retrieves the created version. The
