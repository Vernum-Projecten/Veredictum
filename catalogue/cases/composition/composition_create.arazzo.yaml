  - workflowId: create_composition-lifecycle_state
    summary: A lifecycle_state sent in openehr-version on a create is merged into the version it commits
    description: >-
      Creates an EHR, then creates an event COMPOSITION with an
      openehr-version header naming the lifecycle_state 553 (incomplete), and
      reads the committed VERSION from the container its versioned_object_uid
      names. The VERSION carries the lifecycle_state 553.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "None of these headers are mandatory, but whatever is provided it MUST be merged with the default VERSION and VERSION.audit_details attributes on commit runtime."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the event COMPOSITION with the lifecycle_state 553 in openehr-version.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: openehr-version, in: header, value: 'lifecycle_state.code_string="553"' }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: version
        description: Read the committed VERSION and its lifecycle_state.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters: *version_parameters
        successCriteria:
          - *version_retrieved
          - context: $response.body#/lifecycle_state/defining_code/code_string
            type: regex
            condition: '^553$'

  - workflowId: create_composition-audit_system_id_declared
    summary: A create that sends no system_id is committed under the server's declared system_id
    description: >-
      Creates an EHR and an event COMPOSITION with no committal header, and
      reads the committed VERSION from the container its versioned_object_uid
      names. Its commit_audit carries the server's own configured system
      identifier, which the party declares in its IXIT.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: openehr-version and openehr-audit-details
      quote: "In particular, when `system_id` is not provided by the client, the server MUST set it to its own configured system identifier."
    inputs:
      type: object
      required: [system_id]
      properties:
        system_id: { type: string }
        ehr_id: { type: string, format: uuid }
    steps:
      - *create_ehr
      - *commit_representation
      - stepId: version
        description: Read the committed VERSION and its commit audit system_id.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters: *version_parameters
        successCriteria:
          - *version_retrieved
          - context: $response.body#/commit_audit/system_id
            type: regex
            condition: '^{$inputs.system_id}$'
