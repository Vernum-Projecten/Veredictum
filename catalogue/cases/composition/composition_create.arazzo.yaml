                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the committed version and read both participation times.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved
          - condition: $response.body#/context/participations/0/time/lower != null
          - condition: $response.body#/context/participations/0/time/upper != null
          - condition: $response.body#/context/participations/0/time/upper_unbounded == false
          - condition: $response.body#/context/participations/0/time/upper_included == true
          - condition: $response.body#/content/0/other_participations/0/time/lower != null
          - condition: $response.body#/content/0/other_participations/0/time/upper_unbounded == true
          - condition: $response.body#/content/0/other_participations/0/time/lower_included == true
          - condition: $response.body#/content/0/other_participations/0/time/upper_included == false

