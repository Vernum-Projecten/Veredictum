  - workflowId: create_composition-two_in_one_ehr
    summary: Two COMPOSITIONs created in one EHR are each retrievable
    description: >-
      Creates an EHR and two event COMPOSITIONs in it, keeping the version_uid
      of the full representation the create answers with for each, then
      retrieves both versions. Each create makes a new COMPOSITION, so each
      version_uid addresses a committed COMPOSITION and both reads answer
      200.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *create_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: commit-second
        description: Create a second event COMPOSITION and keep its version_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
      - stepId: read
        description: Retrieve the first COMPOSITION by its version_uid.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved
      - stepId: read-second
        description: Retrieve the second COMPOSITION by its version_uid.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit-second.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - *retrieved

  - workflowId: create_composition-change_type_creation
    summary: The version an event COMPOSITION create commits records the change type creation
    description: >-
      Creates an EHR and an event COMPOSITION with no committal header, keeps
      the version_uid of the full representation the create answers with,
      and reads that VERSION from the container its versioned_object_uid
      names. A new item is committed with the change type 249|creation|.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &creation
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "a new `VERSIONED_OBJECT` is created with a first `ORIGINAL_VERSION` whose data is the new item; the `ORIGINAL_VERSION._commit_audit_._change_type_` is set to the code `249|creation|`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - &commit_representation
        stepId: commit
        description: Create the event COMPOSITION, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - &read_version
        stepId: version
        description: Read the committed VERSION by its version_uid from the container its versioned_object_uid names.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_by_id
        parameters: &version_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: version_uid, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &version_retrieved
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_VERSION_of_COMPOSITION_by_id.yaml
              section: description
              quote: "`200 OK` is returned when the requested VERSION is successfully retrieved."
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^249$'
            x-veredictum-cite: *creation

  - workflowId: create_composition-persistent-change_type_creation
    summary: The version a persistent COMPOSITION create commits records the change type creation
    description: >-
