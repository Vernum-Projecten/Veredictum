        requestBody:
          contentType: application/json
          payload: *feeder
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - *updated_minimal
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and both FEEDER_AUDITs.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - *holds_cuddy
          - context: $response.body#/data/feeder_audit/originating_system_audit/system_id
            type: regex
            condition: '^lab\.example\.org$'
          - context: $response.body#/data/feeder_audit/original_content/formalism
            type: regex
            condition: '^HL7v2\.5$'
          - context: $response.body#/data/content/0/data/items/0/feeder_audit/originating_system_item_ids/0/id
            type: regex
            condition: '^OBX-1$'

  - workflowId: update_composition-feeder_audit_removed
    summary: An update that sends no FEEDER_AUDIT commits a version without the earlier ones
    description: >-
      Creates an EHR and an event COMPOSITION carrying a FEEDER_AUDIT at its
      root and one on an ELEMENT, then updates it with a COMPOSITION that
      carries none. The latest VERSION holds the COMPOSITION sent, with no
      FEEDER_AUDIT at the root or on the ELEMENT.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *new_composition
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit_feeder
      - stepId: update
        description: Update the COMPOSITION with a body that carries no FEEDER_AUDIT.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: *update_no_prefer
        requestBody: *cuddy_body
        successCriteria:
          - *updated_minimal
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and look for FEEDER_AUDITs.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - *holds_cuddy
          - condition: $response.body#/data/feeder_audit == null
          - condition: $response.body#/data/content/0/data/items/0/feeder_audit == null
