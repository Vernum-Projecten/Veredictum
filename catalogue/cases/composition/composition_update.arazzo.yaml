# Updating a COMPOSITION: the version an update commits, its If-Match
# precondition, its representation preferences, its committal headers and the
# headers of its answer, as Arazzo 1.1.0 workflows over the released ITS-REST
# `-validation` OAS. The update addresses the COMPOSITION by its
# versioned_object_uid, which the create step derives from the version_uid it
# answers with. Every criterion resolves to an `x-veredictum-cite` (its own,
# else its step's, else its workflow's), and every quote is copied verbatim
# from the named vendored file.
arazzo: 1.1.0
info:
  title: COMPOSITION update
  version: 0.1.0
  x-veredictum-section: update
  description: >-
    Updating a COMPOSITION by its versioned_object_uid under the If-Match
    precondition: the new version it commits and that version's commit
    audit, a stale, unknown or missing precondition, an unknown EHR or
    container, the minimal, identifier and representation preferences, the
    ETag, Last-Modified, Location and Content-Type headers of the answer,
    the committal headers, and FEEDER_AUDITs kept or dropped by the update.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: setup
    url: ../_setup/templates.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: update_composition-event
    summary: An event COMPOSITION is updated and answered 200 with the full representation
    description: >-
      Creates an EHR and an event COMPOSITION, then updates the COMPOSITION
      by its versioned_object_uid under an If-Match naming the created
      version, with a body whose composer is Dr. Cuddy, Prefer
      return=representation and Accept application/json. The update is
      answered 200, and the latest VERSION read back holds the composer sent.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &update_operation
      source: specs/openehr/ITS-REST/specifications/operations/composition_update.yaml
      section: description
      quote: "Updates COMPOSITION identified by `uid_based_id` and associated with the EHR identified by `ehr_id`."
    inputs: &ehr_input
      type: object
      properties:
        ehr_id: { type: string, format: uuid }
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR with the client-supplied ehr_id.
        operationId: $sourceDescriptions.ehr.ehr_create_with_id
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
      - &commit
        stepId: commit
        description: Create the event COMPOSITION, keep the version_uid of the full representation the create answers with, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &event
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Minimal }
            archetype_details:
              archetype_id: { value: openEHR-EHR-COMPOSITION.minimal.v1 }
              template_id: { value: minimal_evaluation.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.minimal.v1
            language: { terminology_id: { value: ISO_639-1 }, code_string: en }
            territory: { terminology_id: { value: ISO_3166-1 }, code_string: UY }
            category:
              value: event
              defining_code: { terminology_id: { value: openehr }, code_string: "433" }
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                id: { _type: HIER_OBJECT_ID, value: fc376c46-29c1-4090-bc01-5cc046af7f26 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. House
            context:
              start_time: { value: "2021-09-21T21:52:31.927-03:00" }
              setting:
                value: primary medical care
                defining_code: { terminology_id: { value: openehr }, code_string: "228" }
              participations:
                - function: { value: legal guardian consent author }
                  performer:
                    _type: PARTY_RELATED
                    name: Alexandra Alamo
                    relationship:
                      value: mother
                      defining_code: { terminology_id: { value: openehr }, code_string: "10" }
                  mode:
                    value: not specified
                    defining_code: { terminology_id: { value: openehr }, code_string: "193" }
            content:
              - _type: EVALUATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_details:
                  archetype_id: { value: openEHR-EHR-EVALUATION.minimal.v1 }
                  template_id: { value: minimal_evaluation.en.v1 }
                  rm_version: "1.0.2"
                archetype_node_id: openEHR-EHR-EVALUATION.minimal.v1
                language: { terminology_id: { value: ISO_639-1 }, code_string: en }
                encoding: { terminology_id: { value: IANA_character-sets }, code_string: UTF-8 }
                subject: { _type: PARTY_SELF }
                data:
                  _type: ITEM_TREE
                  name: { _type: DV_TEXT, value: Arbol }
                  archetype_node_id: at0001
                  items:
                    - _type: ELEMENT
                      name: { _type: DV_TEXT, value: quantity }
                      archetype_node_id: at0002
                      value: { _type: DV_QUANTITY, magnitude: 78.5, units: kg }
        successCriteria:
          - &composition_created
            condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: description
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - &update
        stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy under the created version, asking for the full representation.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: &update_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody: &cuddy_body
          contentType: application/json
          payload: *event
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - &updated
            condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_updated.yaml
              section: description
              quote: "`200 OK` is returned when the COMPOSITION is successfully updated, with the full resource in the response body when `Prefer` header is `return=representation`,"
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION; it holds the composer the update sent.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: &latest_parameters
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: versioned_object_uid, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - &latest_version
            condition: $statusCode == 200
            x-veredictum-cite: &latest_cite
              source: specs/openehr/ITS-REST/specifications/operations/versioned_composition_version_get_at_time.yaml
              section: description
              quote: "If `version_at_time` is supplied, retrieves the VERSION extant _at specified time_, otherwise retrieves the _latest_ VERSION."
          - &holds_cuddy
            context: $response.body#/data/composer/name
            type: regex
            condition: '^Dr\. Cuddy$'
            x-veredictum-cite: &new_composition
              source: specs/openehr/ITS-REST/specifications/operations/composition_update.yaml
              section: /requestBody/description
              quote: "The new COMPOSITION."

  - workflowId: update_composition-new_version
    summary: An update adds a version to the COMPOSITION's container that follows the created one
    description: >-
      Creates an EHR and an event COMPOSITION, updates it, then reads the
      latest VERSION. A modification adds a new ORIGINAL_VERSION to the
      existing container, so the latest version's uid has the container's
      versioned_object_uid as its object_id, and its preceding_version_uid is
      the version the create committed.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "a new `ORIGINAL_VERSION` whose data contains the updated form of the item content is added to an existing `VERSIONED_OBJECT`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - *update
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and its identifiers.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.commit.outputs.versioned_object_uid}::'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Version Identification
              quote: "in which the `__object_id()__` part is a copy of the `__uid__` of the owning `VERSIONED_OBJECT` version container."
          - context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'

  - workflowId: update_composition-change_type_modification
    summary: The version an update commits records the change type modification
    description: >-
      Creates an EHR and an event COMPOSITION, updates its composer with no
      committal header, then reads the latest VERSION. A change to the
      content is committed with the change type 251|modification|.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
      section: Contributions
      quote: "if the change is logically a change, addition etc to the content, the `ORIGINAL_VERSION._commit_audit_._change_type_` is set to the code `251|modification|`;"
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - *update
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION and its commit audit.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/commit_audit/change_type/defining_code/code_string
            type: regex
            condition: '^251$'

  - workflowId: update_composition-persistent
    summary: A persistent COMPOSITION is updated
    description: >-
      Creates an EHR and a persistent COMPOSITION, then updates it with a body
      whose composer is Dr. Cuddy. The update is answered 200, and the latest
      VERSION read back holds the composer sent and follows the created one.
    dependsOn: [$sourceDescriptions.setup.upload_template-persistent_minimal]
    x-veredictum-cite: *update_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - stepId: commit
        description: Create the persistent COMPOSITION, keep the version_uid of the full representation, and derive its versioned_object_uid.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: &persistent
            _type: COMPOSITION
            name: { _type: DV_TEXT, value: Persistent minimal }
            archetype_details:
              _type: ARCHETYPED
              archetype_id:
                _type: ARCHETYPE_ID
                value: openEHR-EHR-COMPOSITION.persistent_minimal.v1
              template_id: { _type: TEMPLATE_ID, value: persistent_minimal.en.v1 }
              rm_version: "1.0.2"
            archetype_node_id: openEHR-EHR-COMPOSITION.persistent_minimal.v1
            language:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
              code_string: en
            territory:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: ISO_3166-1 }
              code_string: UY
            category:
              _type: DV_CODED_TEXT
              value: persistent
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "431"
            composer:
              _type: PARTY_IDENTIFIED
              external_ref:
                _type: PARTY_REF
                id: { _type: HIER_OBJECT_ID, value: a3dce0d4-fa51-4ff2-9cce-93dd60437842 }
                namespace: DEMOGRAPHIC
                type: PERSON
              name: Dr. Yamamoto
            content:
              - _type: OBSERVATION
                name: { _type: DV_TEXT, value: Minimal }
                archetype_node_id: openEHR-EHR-OBSERVATION.minimal.v1
                language:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: ISO_639-1 }
                  code_string: en
                encoding:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: IANA_character-sets }
                  code_string: UTF-8
                subject: { _type: PARTY_SELF }
                data:
                  _type: HISTORY
                  name: { _type: DV_TEXT, value: Event Series }
                  archetype_node_id: at0001
                  origin: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,380+00:00" }
                  events:
                    - _type: POINT_EVENT
                      name: { _type: DV_TEXT, value: Cualquier evento }
                      archetype_node_id: at0002
                      time: { _type: DV_DATE_TIME, value: "2019-04-16T21:08:11,384+00:00" }
                      data:
                        _type: ITEM_TREE
                        name: { _type: DV_TEXT, value: Arbol }
                        archetype_node_id: at0003
                        items:
                          - _type: ELEMENT
                            name: { _type: DV_TEXT, value: text }
                            archetype_node_id: at0004
                            value: { _type: DV_TEXT, value: original value }
                archetype_details:
                  _type: ARCHETYPED
                  archetype_id: { _type: ARCHETYPE_ID, value: openEHR-EHR-OBSERVATION.minimal.v1 }
                  rm_version: "1.0.2"
        successCriteria:
          - *composition_created
        outputs:
          version_uid: $response.body#/uid/value
        x-veredictum-derive:
          versioned_object_uid: { function: object_id, of: version_uid }
      - stepId: update
        description: Update the persistent COMPOSITION with composer Dr. Cuddy under the created version.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: *update_parameters
        requestBody:
          contentType: application/json
          payload: *persistent
          replacements:
            - { target: /composer/name, value: Dr. Cuddy }
        successCriteria:
          - *updated
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION; it holds the composer sent and follows the created version.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - *holds_cuddy
          - &follows_created
            context: $response.body#/preceding_version_uid/value
            type: regex
            condition: '^{$steps.commit.outputs.version_uid}$'
            x-veredictum-cite:
              source: specs/openehr/RM/docs/common/master06-change_control_package.adoc
              section: Contributions
              quote: "a new `ORIGINAL_VERSION` whose data contains the updated form of the item content is added to an existing `VERSIONED_OBJECT`;"

  - workflowId: update_composition-same_content
    summary: An update whose content equals the preceding version's commits a new version
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with the same
      COMPOSITION it was created with. The update is answered 200, and the
      latest VERSION follows the created one, so the update was committed as
      a new version.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *update_operation
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with the body it was created with.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: *update_parameters
        requestBody:
          contentType: application/json
          payload: *event
        successCriteria:
          - *updated
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION; it follows the created version.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - *follows_created

  - workflowId: update_composition-prefer_minimal
    summary: An update with Prefer return=minimal is answered 204 and committed
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with Prefer
      return=minimal. The update is answered 204 No Content with no body, and
      the latest VERSION read back holds the composer sent.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &no_content
      source: specs/openehr/ITS-REST/specifications/responses/204_version_updated.yaml
      section: description
      quote: "`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - &update_minimal
        stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy and ask for the minimal response.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=minimal }
        requestBody: *cuddy_body
        successCriteria:
          - &updated_minimal
            condition: $statusCode == 204
            x-veredictum-cite: *no_content
          - condition: $response.body == null
      - &latest_cuddy
        stepId: latest
        description: Read the latest VERSION of the COMPOSITION; the minimal answer still committed the update.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - *holds_cuddy

  - workflowId: update_composition-prefer_absent
    summary: An update with no Prefer header is answered 204 and committed
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with no Prefer
      header. The update is answered 204 No Content, and the latest VERSION
      read back holds the composer sent.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: *no_content
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy and no Prefer header.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: &update_no_prefer
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
        requestBody: *cuddy_body
        successCriteria:
          - *updated_minimal
      - *latest_cuddy

  - workflowId: update_composition-return_identifier
    summary: An update with Prefer return=identifier answers with the new version's uid only
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with Prefer
      return=identifier and Accept application/json. The answer is 200 with a
      body that carries the identifier under uid and none of the COMPOSITION
      attributes, and that identifier is the latest version's uid. The
      released text recommends the identifier body, so the status and body
      criteria are advisory; a service that declines the preference leaves no
      identifier to compare, and that row is errored.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &identifier_only
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Prefer only identifier
      quote: "The response body SHOULD contain only the identifier of the affected resource formatted according to the `Accept` request header."
      level: should
      report: 673
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION with composer Dr. Cuddy and ask for its identifier only.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters:
          - { name: ehr_id, in: path, value: $inputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.versioned_object_uid }
          - { name: If-Match, in: header, value: '"{$steps.commit.outputs.version_uid}"' }
          - { name: Prefer, in: header, value: return=identifier }
          - { name: Accept, in: header, value: application/json }
        requestBody: *cuddy_body
        successCriteria:
          - &success_status
            context: $statusCode
            type: regex
            condition: '^2[0-9][0-9]$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
              section: HTTP status codes
              quote: "To indicate the status of a request or operation, an appropriate HTTP status code MUST be used as described above."
          - condition: $statusCode == 200
          - condition: $response.body#/uid != null
          - condition: $response.body#/archetype_node_id == null
          - condition: $response.body#/content == null
        outputs:
          uid: $response.body#/uid
      - stepId: latest
        description: Read the latest VERSION of the COMPOSITION; its uid is the identifier the update answered.
        operationId: $sourceDescriptions.ehr.versioned_composition_version_get_at_time
        parameters: *latest_parameters
        successCriteria:
          - *latest_version
          - context: $response.body#/uid/value
            type: regex
            condition: '^{$steps.update.outputs.uid}$'
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/schemas/others/Identifier.yaml
              section: /properties/uid/description
              quote: "The (version) resource identifier."

  - workflowId: update_composition-content_type
    summary: An update answered with the full COMPOSITION names it as JSON
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it with Prefer
      return=representation and Accept application/json. The answer is 200
      with the COMPOSITION in its body, so it carries Content-Type
      application/json.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/docs/overview/Resources.md
      section: JSON Format
      quote: "Proper header `Content-Type: application/json` MUST be present in the response of the service unless the response has no content body (HTTP status code `204`)."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION and ask for the full representation as JSON.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: *update_parameters
        requestBody: *cuddy_body
        successCriteria:
          - *updated
          - context: $response.header.Content-Type
            type: regex
            condition: '^application/json'

  - workflowId: update_composition-etag_weak
    summary: An ETag sent on a COMPOSITION update carries the weakness indicator
    description: >-
      Creates an EHR and an event COMPOSITION, then updates it. If the answer
      sends an ETag, it is a weak entity tag.
    dependsOn: [$sourceDescriptions.setup.upload_template-minimal_evaluation]
    x-veredictum-cite: &etag_weak_form
      source: specs/openehr/ITS-REST/specifications/docs/overview/Requests_and_responses.md
      section: Deprecated headers
      quote: "This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`."
    inputs: *ehr_input
    steps:
      - *create_ehr
      - *commit
      - stepId: update
        description: Update the COMPOSITION and ask for the minimal response.
        operationId: $sourceDescriptions.ehr.composition_update
        parameters: *update_no_prefer
        requestBody: *cuddy_body
        successCriteria:
          - *updated_minimal
          - &etag_weak
            context: $response.header.ETag
            type: regex
            condition: '^(W/".+")?$'

  - workflowId: update_composition-etag_last_modified
