    new: []
    open: >-
      Not carried yet: master04-service_discovery.adoc serves the document
      "relative to the _Platform_ base URL", which differs from the
      openEHR REST base the evaluator addresses, and no released OAS
      declares the route; #745.
  SMART-RESOURCE_SCOPES-granted_scope_permits:
    new: []
    open: &smart_scopes >-
      Not carried yet: each row presents a Bearer token whose scope claim
      is the row's value (master08-scopes.adoc §Resource Scopes), and the
      evaluator sends one fixed credential per run; #745.
  SMART-RESOURCE_SCOPES-scope_deny_403:
    new: []
    open: *smart_scopes
