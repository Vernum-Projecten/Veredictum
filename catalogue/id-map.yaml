  SIG-VERSION-distinct_per_version:
    new: []
    open: *signature_serialisation
  SIG-VERSION-distinct_per_version-pgp:
    new: []
    open: *signature_serialisation
  SIG-VERSION-ehr_status_signature:
    new:
      - version_signature/ehr_status-signature_present
    open: &signature_presence_only >-
      The presence of the signature is carried; its verification is not,
      because RM common master06 §Digital Signature says "The exact
      serialisation is not yet defined by openEHR".
  SIG-VERSION-ehr_status_signature-pgp:
    new:
      - version_signature/ehr_status-signature_present
    open: *signature_presence_only
