# The 236 cases of the AQL conformance corpus (#695), by their own ids: each
# names the Arazzo case ids that carry it, or says in `open` why it is not
# carried. A case a workflow already covered maps onto that workflow.
  SF-CONTRIB-flat_commit:
    new:
      - contribution_write_flat/commit_contribution-flat
      - contribution_write_flat_unsupported/commit_contribution-flat_unsupported_media
    open: &sf_contribution_template >-
      Carried on the template minimal_evaluation.en.v1, whose COMPOSITION is
      judged by the composer the member's context names; the ACTION
      current_state of the old carrier is judged on the COMPOSITION create
      (flat_context/create_composition-flat-ism_transition).
  SF-CONTRIB-flat_read:
    new:
      - contribution_read_flat/get_contribution-flat
      - contribution_read_flat_not_acceptable/get_contribution-flat_not_acceptable
    open: &sf_contribution_audit >-
      The audit's time_committed is not judged here; the canonical read of a
      CONTRIBUTION judges it (contribution_read/get_contribution-audit).
  SF-CONTRIB-structured_commit:
    new:
      - contribution_write_structured/commit_contribution-structured
      - contribution_write_structured_unsupported/commit_contribution-structured_unsupported_media
    open: *sf_contribution_template
  SF-CONTRIB-structured_read:
    new:
      - contribution_read_structured/get_contribution-structured
      - contribution_read_structured_not_acceptable/get_contribution-structured_not_acceptable
    open: *sf_contribution_audit
  SF-CTX-composer_name:
    new: [flat_context/create_composition-flat-composer_name]
