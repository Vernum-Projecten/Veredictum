    new:
      - ehr/create_ehr-default_status
    open: >-
      The absent subject external_ref is not carried: ehr_create.yaml says
      only that the default subject is "a PARTY_SELF object", and RM
      PARTY_PROXY.external_ref is optional, so no released text says the
      default subject carries none.
