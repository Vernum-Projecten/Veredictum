    new: [composition_create_refused/create_composition-category_invalid]
  I_EHR_COMPOSITION.create_composition-client_supplied_uid:
    new: []
    open: >-
      No released sentence assigns what a create does with a client-supplied
      COMPOSITION.uid: RM composition.adoc only "strongly recommended" copying
      the VERSION uid, and the "must match" of composition_update.yaml is
      lower case and about the update. The version read it compared against is
      addressed by the versioned_object_uid; derivable once #680 lands.
