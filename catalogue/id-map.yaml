    new: []
    open: &signature_serialisation >-
      Not carried: RM common master06 §Digital Signature says "The exact
      serialisation is not yet defined by openEHR", so no released text
      fixes the bytes a signature is computed over, and neither its
      verification nor its difference between versions can be judged.
  SIG-VERSION-client_supplied_verbatim:
    new: []
    open: &client_signature >-
      UPDATE_VERSION declares a signature member, and neither the operation
      files nor RM common say what a service does with a client-supplied
      one, so storing it verbatim is not assigned (upstream report #744).
