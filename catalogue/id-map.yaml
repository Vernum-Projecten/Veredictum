      FROM.abstract_type.abstract_entry_class_as_root:
        new: []
        open: >-
          Not carried (level core). The query pins no EHR, COMPOSITION or
          EHR_STATUS of the case's own, so its answer depends on what else the
          server holds; ITS-REST docs/query/Request.md lets a backend use the
          ehr_id scope only "to perform routing, optimizations or similar".
          Whether a class expression naming an abstract RM class matches its
          descendants is not assigned, upstream report #702.
      FROM.abstract_type.abstract_entry_class_in_contains:
        new: []
        open: >-
          Not carried (level core). Whether a class expression naming an
          abstract RM class matches its descendants is not assigned, upstream
          report #702.
