    new: [composition_create/create_composition-datetime_comma_fraction]
    open: >-
      Carried as advisory: Resources.md §Datetime format says retrieval
      "SHOULD return" the values in their original format.
  I_EHR_COMPOSITION.create_composition-datetime_lexical:
    new: [composition_create/create_composition-datetime_lexical]
    open: >-
      Carried as advisory: Resources.md §Datetime format says retrieval
      "SHOULD return" the values in their original format.
  I_EHR_COMPOSITION.create_composition-deprecated_template_id:
    new: []
    open: &deprecated_header >-
      A deprecated header name: Requests_and_responses.md §Deprecated headers
      says only that the deprecated headers "remain available for backward
      compatibility", with no key word that obliges a server to accept them,
      and the profile admits the Release-1.1.0 names alone.
  I_EHR_COMPOSITION.create_composition-duplicate_member:
    new: []
    open: >-
      The refusal rests on RFC 8259 §4 alone ("SHOULD be unique"); no released
      openEHR sentence assigns it. Its accepted twin, the body with the member
      written once, is create_composition-event.
  I_EHR_COMPOSITION.create_composition-ehr_not_modifiable:
    new: [composition_create_refused/create_composition-ehr_not_modifiable]
    open: >-
      The status code: RM ehr_status.adoc assigns that the contents may not be
      written to and no released sentence names the code, so any 4xx holds.
  I_EHR_COMPOSITION.create_composition-event:
    new:
      - composition_create/create_composition-event
      - composition_create/create_composition-read_back
      - composition_create/create_composition-version_uid_form
      - composition_create/create_composition-change_type_creation
    open: &version_count >-
      The version count is not judged: the revision history workflow
      (composition_versioned/get_versioned_composition-revision_history)
      judges the versions it lists by id, not their number. The
      version_tree_id 1 is not asserted: RM master06 §Local
      Versioning describes it as "a suitable scheme", with no key word.
