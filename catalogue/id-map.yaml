    new: []
    open: >-
      The release defines no authorization model: Requests_and_responses.md
      assigns 403 to a request the service "understood" and "refuses to
      authorize", and names no principal, role or permission a client could
      present, so no write is one every service that requires authorization
      must refuse. The SMART scopes that would name one are #745.
